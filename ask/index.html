<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Чек-лист</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f4f2;color:#111;padding:16px 16px 96px}
h1{font-size:19px;line-height:1.3;margin:4px 0 4px}
.about{font-size:14px;line-height:1.4;color:#6b6b6b;margin:0 0 14px}
label{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:14px;padding:14px;margin:0 0 8px;font-size:16px;border:2px solid transparent}
label.on{border-color:#2f6bff}input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:1px}
.t{display:block}.d{display:block;font-size:13px;line-height:1.35;color:#8a8a8a;margin-top:3px}
textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:10px;font:inherit;font-size:15px;min-height:70px;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e5e5;padding:10px 16px}
button{width:100%;border:0;border-radius:12px;padding:14px;font:600 16px system-ui;background:#2f6bff;color:#fff}
</style></head><body>
<h1 id="q"></h1><p class="about" id="about"></p><div id="opts"></div><textarea id="note" placeholder="Своё / комментарий (необязательно)"></textarea>
<div class="bar"><button id="send">Отправить боту</button></div>
<script>
// Адрес: /ask/#q=<вопрос>&o=<вариант1>|<вариант2>|...&id=<метка>  (вариант «название::пояснение»)
// или /ask/#z=<base64url(deflate-raw(JSON {q, o:[[название, пояснение]], id}))> — короче в 4 раза (Юлай 2026-10-11: пояснения серым)
const h=new URLSearchParams(location.hash.slice(1));
let q=h.get('q')||'Отметь всё, что правда', id=h.get('id')||'', about=h.get('a')||'Отметь всё, что подходит, — можно несколько.';
let ops=(h.get('o')||'').split('|').filter(Boolean).map(o=>o.split('::'));
const box=document.getElementById('opts');
function render(){
 document.getElementById('q').textContent=q;document.getElementById('about').textContent=about;
 ops.forEach(([t,d])=>{const l=document.createElement('label');l.innerHTML='<input type="checkbox"><span><span class="t"></span><span class="d"></span></span>';
  l.querySelector('.t').textContent=t;const dd=l.querySelector('.d');if(d)dd.textContent=d;else dd.remove();
  l.querySelector('input').onchange=e=>l.classList.toggle('on',e.target.checked);box.appendChild(l)});
}
async function unz(z){const b=Uint8Array.from(atob(z.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 const st=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(st).text())}
if(h.get('z')){unz(h.get('z')).then(j=>{q=j.q||q;id=j.id||'';if(j.a)about=j.a;ops=(j.o||[]).map(x=>Array.isArray(x)?x:[x]);render()}).catch(()=>{document.getElementById('q').textContent='Не удалось открыть чек-лист'})}else render();
document.getElementById('send').onclick=()=>{
 const sel=[...box.querySelectorAll('label')].filter(l=>l.querySelector('input').checked).map(l=>'✅ '+l.querySelector('.t').textContent.trim());
 const note=document.getElementById('note').value.trim();
 const t=(id?'['+id+'] ':'')+q+'\n'+(sel.join('\n')||'— ничего не отмечено')+(note?'\n💬 '+note:'');
 const tg=window.Telegram&&Telegram.WebApp;
 if(tg&&tg.initData&&tg.sendData&&tg.initDataUnsafe&&!tg.initDataUnsafe.query_id){try{tg.sendData(t.slice(0,4000));return}catch(e){}}
 const u='https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+encodeURIComponent(t);
 if(tg&&tg.openTelegramLink){tg.openTelegramLink(u)}else location.href=u};
if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
</script></body></html>
