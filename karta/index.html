<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>Карта системы</title>
<script>
  // Тема до отрисовки: ?theme= → выбор в Штабе (shtab.theme) → системная → тёмная
  (function () {
    var t = null, m = location.search.match(/[?&]theme=(light|dark)/);
    if (m) t = m[1];
    if (!t) { try { t = localStorage.getItem('shtab.theme'); } catch (e) {} }
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Карта системы — язык Штаба: серый, один синий акцент, цвет — сигнал (красный — не задано, оранжевый — не записано). */
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F1012; --card: #1A1B1E; --card-2: #24252A; --raise: #2C2D33;
    --ink: #F2F2F4; --ink-2: #B9BAC0; --ink-3: #9A9BA2;
    --line: #2C2D32; --edge: #5E5F66; --frame: rgba(61, 139, 255, .045); --frame-line: #2E3442;
    --acc: #3D8BFF; --acc-ink: #79AEFF; --acc-soft: rgba(61, 139, 255, .16); --on-acc: #FFFFFF;
    --warn: #FF9F0A; --warn-ink: #FFB84D; --warn-soft: rgba(255, 159, 10, .14);
    --ok: #30D158; --ok-ink: #5CDD7E; --ok-soft: rgba(48, 209, 88, .13);
    --bad: #FF453A; --bad-ink: #FF7A71; --bad-soft: rgba(255, 69, 58, .15);
    --w-bot: #8E8F96; --w-yulai: #3D8BFF; --w-critic: #9580FF; --w-agents: #45C4B2; --w-watch: #DDBB55; --w-person: #F27E9F;
    --bar-bg: rgba(15, 16, 18, .82);
    --shadow: 0 0 0 1px rgba(255, 255, 255, .04);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F2F2F4; --card: #FFFFFF; --card-2: #F0F0F3; --raise: #FFFFFF;
    --ink: #1C1C1E; --ink-2: #4A4B51; --ink-3: #626369;
    --line: #E2E2E6; --edge: #A3A4AB; --frame: rgba(10, 108, 255, .035); --frame-line: #D5DCEA;
    --acc: #0A6CFF; --acc-ink: #0057D1; --acc-soft: rgba(10, 108, 255, .10); --on-acc: #FFFFFF;
    --warn: #E88600; --warn-ink: #8F4B00; --warn-soft: rgba(240, 138, 0, .13);
    --ok: #26A145; --ok-ink: #166B2D; --ok-soft: rgba(38, 161, 69, .11);
    --bad: #E5372C; --bad-ink: #B8261C; --bad-soft: rgba(229, 55, 44, .09);
    --w-bot: #8A8B91; --w-yulai: #0A6CFF; --w-critic: #6B4FE0; --w-agents: #18978A; --w-watch: #A9851A; --w-person: #D24F77;
    --bar-bg: rgba(242, 242, 244, .86);
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 18px rgba(0, 0, 0, .05);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  b, strong { font-weight: 600; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; touch-action: manipulation; }
  a { color: var(--acc-ink); text-decoration: none; font-weight: 600; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }

  /* шапка и вкладки */
  .bar { position: sticky; top: 0; z-index: 20; background: var(--bar-bg); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 1180px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--acc); color: var(--on-acc); flex: none; }
  .logo svg.i { width: 22px; height: 22px; }
  .brand-t { min-width: 0; flex: 1; }
  .brand-name { font-weight: 600; font-size: 17px; line-height: 1.2; }
  .brand-sub { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); color: var(--ink-2); flex: none; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 10px; padding: 4px; border-radius: 14px; background: var(--card-2); }
  .tab { min-height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0 6px; }
  .tab svg.i { width: 18px; height: 18px; }
  .tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .tab .n { display: none; }
  .tab .wide { display: none; }
  @media (min-width: 440px) { .tab .wide { display: inline; } }

  /* типографика уровней */
  .head { padding: 24px 0 8px; }
  .dateline { font-size: 13px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .dateline svg.i { width: 18px; height: 18px; }
  h1 { font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  .sub { color: var(--ink-2); font-size: 15px; margin-top: 8px; max-width: 68ch; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 32px 0 12px; }
  .sec h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.3; display: flex; align-items: center; gap: 10px; }
  .sec h2 .ib { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--card); box-shadow: var(--shadow); color: var(--ink-2); }
  .sec span.c { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow-wrap: anywhere; }
  .fine { font-size: 13px; color: var(--ink-3); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }

  /* главное за 10 секунд */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
  .kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-height: 96px; text-align: left; }
  .kpi .ki { color: var(--ink-3); }
  .kpi .ki svg.i { width: 24px; height: 24px; }
  .kpi b { font-size: 30px; line-height: 1.1; letter-spacing: -.02em; margin-top: 6px; }
  .kpi span { font-size: 13px; color: var(--ink-3); }
  .gapcard { margin-top: 8px; padding: 16px; }
  .gaphead { display: flex; align-items: center; gap: 12px; }
  .gaphead .big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1; }
  .gaphead .t { font-weight: 600; }
  .gaphead .s { font-size: 13px; color: var(--ink-3); }
  .stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--card-2); margin: 14px 0 6px; gap: 2px; }
  .stack i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); }
  .legend .d { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .heads { list-style: none; margin: 12px 0 0; padding: 0; }
  .heads li + li { border-top: 1px solid var(--line); }
  .hrow { display: grid; grid-template-columns: 12px 1fr auto; gap: 12px; align-items: start; width: 100%; padding: 12px 0; min-height: 48px; }
  .hrow .d { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
  .hrow .w { font-size: 13px; color: var(--ink-3); display: block; }
  .hrow .n { font-weight: 600; color: var(--ink-2); }
  .sev-red { background: var(--bad); } .sev-orange { background: var(--warn); }
  details.more { margin-top: 4px; border-top: 1px solid var(--line); }
  details.more > summary { list-style: none; cursor: pointer; padding: 12px 0 0; font-size: 13px; font-weight: 600; color: var(--acc-ink); min-height: 40px; }
  details.more > summary::-webkit-details-marker { display: none; }

  /* схема */
  .mapgrid { display: grid; gap: 16px; margin-top: 8px; }
  .diagram { padding: 10px 2px 6px; }
  .diagram svg.g { width: 100%; height: auto; display: block; max-width: 560px; margin: 0 auto; overflow: visible; }
  .node { cursor: pointer; }
  .node rect.b { fill: var(--card); stroke: var(--line); stroke-width: 1.2; transition: opacity .2s; }
  .node.ext rect.b { fill: var(--bg); stroke: var(--edge); stroke-dasharray: 4 3; }
  .node .ti { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .node .su { fill: var(--ink-3); font-size: 10.5px; }
  .node use { color: var(--ink-2); }
  .node:hover rect.b { stroke: var(--acc); }
  .node.on rect.b { stroke: var(--acc); stroke-width: 2; fill: var(--acc-soft); }
  .node.on use { color: var(--acc-ink); }
  .node:focus { outline: none; }
  .node:focus-visible rect.b { stroke: var(--acc); stroke-width: 2.5; }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; transition: opacity .2s; }
  .edge.on { stroke: var(--acc); stroke-width: 2; }
  svg.g.sel .node:not(.on):not(.near) { opacity: .38; }
  svg.g.sel .edge:not(.on) { opacity: .16; }
  .frame { fill: var(--frame); stroke: var(--frame-line); stroke-width: 1.2; }
  .framel { fill: var(--ink-3); font-size: 10px; font-weight: 600; letter-spacing: .12em; }
  .gapdot.red { fill: var(--bad); } .gapdot.orange { fill: var(--warn); }
  .maplegend { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; padding: 8px 8px 4px; font-size: 13px; color: var(--ink-3); }
  .maplegend i { display: inline-block; width: 22px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -2px; }

  /* панель блока */
  .panel { padding: 18px 16px; scroll-margin-top: 140px; }
  .ph { display: flex; align-items: center; gap: 12px; }
  .tile { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc-ink); flex: none; }
  .tile svg.i { width: 26px; height: 26px; }
  .tile.ext { background: var(--card-2); color: var(--ink-2); }
  .ph h3 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; letter-spacing: -.01em; }
  .ph .k { font-size: 13px; color: var(--ink-3); }
  .lead { font-size: 17px; line-height: 1.4; margin: 14px 0 0; font-weight: 600; }
  .lbl { font-size: 13px; font-weight: 600; color: var(--ink-3); margin: 16px 0 4px; display: flex; gap: 6px; align-items: center; }
  .lbl svg.i { width: 16px; height: 16px; }
  .ptext { font-size: 15px; color: var(--ink-2); margin: 0; }
  .callout { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 12px; display: flex; gap: 10px; align-items: flex-start; }
  .callout svg.i { width: 18px; height: 18px; margin-top: 1px; }
  .callout.red { background: var(--bad-soft); color: var(--bad-ink); }
  .callout.orange { background: var(--warn-soft); color: var(--warn-ink); }
  .callout.note { background: var(--acc-soft); color: var(--ink); }
  .callout b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
  .links { list-style: none; margin: 0; padding: 0; }
  .lrow { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; width: 100%; padding: 10px 0; min-height: 48px; }
  .links li + li .lrow { border-top: 1px solid var(--line); }
  .lrow .ar { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--card-2); color: var(--ink-2); }
  .lrow .ar svg.i { width: 16px; height: 16px; }
  .lrow .t { font-weight: 600; display: block; }
  .lrow .s { font-size: 13px; color: var(--ink-3); display: block; }
  .hint { color: var(--ink-3); font-size: 14px; margin: 6px 0 0; }
  .src { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; margin-top: 16px; font-weight: 400; color: var(--ink-3); }
  .src a { font-weight: 600; }

  /* процессы */
  .whobar { padding: 16px; margin-top: 16px; }
  .whobar .t { font-weight: 600; }
  .whobar .stack { height: 14px; }
  .pgrid { display: grid; gap: 8px; }
  .proc { scroll-margin-top: 140px; }
  .proc > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px 1fr 20px; gap: 12px; align-items: center; padding: 14px 16px; min-height: 72px; }
  .proc > summary::-webkit-details-marker { display: none; }
  .proc .tile { width: 44px; height: 44px; }
  .proc .pt { font-weight: 600; font-size: 17px; line-height: 1.25; display: block; }
  .proc .pa { font-size: 13px; color: var(--ink-3); display: block; margin-top: 2px; }
  .proc .mini { display: flex; height: 6px; border-radius: 99px; overflow: hidden; gap: 1px; margin-top: 8px; max-width: 200px; }
  .proc .mini i { display: block; }
  .chev { color: var(--ink-3); transition: transform .2s; }
  .proc[open] .chev { transform: rotate(180deg); }
  .proc.flash, .ccard.flash { box-shadow: 0 0 0 2px var(--acc); }
  .pbody { padding: 0 16px 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 99px; font-size: 13px; font-weight: 600; background: var(--card-2); color: var(--ink-2); }
  .chip svg.i { width: 16px; height: 16px; }
  button.chip:hover { color: var(--acc-ink); }
  .steps { list-style: none; margin: 14px 0 0; padding: 0; counter-reset: s; }
  .step { display: grid; grid-template-columns: 28px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
  .step::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--card-2); color: var(--ink-2); position: relative; z-index: 1; }
  .step:not(:last-child)::after { content: ""; position: absolute; left: 13.5px; top: 30px; bottom: 2px; width: 1px; background: var(--line); }
  .step.who-yulai::before { background: var(--w-yulai); color: #fff; }
  .step .st { font-size: 15px; padding-top: 3px; }
  .step .sm { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--ink-3); }
  .who { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink-2); }
  .who i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .step .sm a { font-weight: 400; color: var(--ink-3); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .step .sm a.miss { color: var(--bad-ink); }
  .flow { margin-top: 6px; }
  .flow .lbl { margin-top: 12px; }

  /* чаты и агенты */
  .modes { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  .mode { padding: 14px 16px; }
  .mode .mt { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .mode p { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
  .cgrid { display: grid; gap: 8px; }
  .ccard { padding: 16px; scroll-margin-top: 140px; }
  .ch .act { font-size: 12px; color: var(--ink-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .ch .act.live { color: var(--ok-ink); }
  details.quiet { margin-top: 8px; padding: 12px 16px; }
  details.quiet > summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: center; min-height: 40px; font-size: 13px; color: var(--ink-2); }
  details.quiet > summary::-webkit-details-marker { display: none; }
  details.quiet > summary .qt { flex: 1; min-width: 0; }
  details.quiet .ccard { box-shadow: none; border: 1px solid var(--line); }
  .ch { display: flex; gap: 12px; align-items: flex-start; }
  .ch .tt { flex: 1; min-width: 0; }
  .ch h3 { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 600; }
  .ch .k { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; flex: none; }
  .badge.client { background: var(--acc-soft); color: var(--acc-ink); }
  .badge.close { background: var(--ok-soft); color: var(--ok-ink); }
  .badge.none { background: var(--bad-soft); color: var(--bad-ink); }
  .badge.direct { background: var(--card-2); color: var(--ink-2); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .person { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); background: var(--card-2); border-radius: 99px; padding: 3px 10px 3px 3px; }
  .person .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; }
  .kv { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 14px 0 0; }
  .kv div { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; }
  .kv svg.i { color: var(--ink-3); width: 18px; height: 18px; margin-top: 2px; }
  .kv dt { font-size: 12px; color: var(--ink-3); font-weight: 600; }
  .kv dd { margin: 0; font-size: 14px; }
  .kv .miss { color: var(--bad-ink); font-weight: 600; }
  .srcs { margin-top: 12px; font-size: 13px; color: var(--ink-3); }
  .srcs a { font-weight: 400; color: var(--ink-3); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; margin-right: 10px; }
  .agrid { display: grid; gap: 8px; }
  .acard { padding: 16px; scroll-margin-top: 140px; }
  .acard h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .acard .id { color: var(--ink-3); }
  .acard p { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
  .acard .ln { font-size: 13px; color: var(--ink-3); margin-top: 8px; }
  .acard .chips { margin-top: 10px; }
  .chip.model { background: var(--acc-soft); color: var(--acc-ink); }
  .skills { list-style: none; margin: 0; padding: 4px 16px; }
  .skills li { padding: 10px 0; display: grid; grid-template-columns: minmax(96px, 120px) 1fr; gap: 12px; font-size: 14px; }
  .skills li + li { border-top: 1px solid var(--line); }
  .skills .mono { color: var(--ink); font-weight: 600; padding-top: 1px; }
  .skills span { color: var(--ink-2); }
  details.card > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 16px; min-height: 56px; font-weight: 600; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card[open] .chev { transform: rotate(180deg); }
  .foot { margin-top: 40px; padding: 16px; font-size: 13px; color: var(--ink-3); }
  .foot p { margin: 0 0 8px; }

  /* замок */
  #lock { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  #lock .tile { margin: 0 auto 16px; width: 56px; height: 56px; }
  #lock h1 { font-size: 22px; }
  #lock p { color: var(--ink-2); max-width: 36ch; margin: 8px auto 0; }
  [hidden] { display: none !important; }

  @media (min-width: 720px) {
    .kpis { grid-template-columns: repeat(4, 1fr); }
    .modes { grid-template-columns: 1fr 1fr; }
    .cgrid, .agrid { grid-template-columns: 1fr 1fr; }
    .tab .n { display: inline; color: var(--ink-3); font-weight: 400; }
  }
  @media (min-width: 1000px) {
    .mapgrid { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
    .panel { position: sticky; top: 132px; max-height: calc(100vh - 148px); overflow: auto; }
    .procwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
    .procwrap .diagram { position: sticky; top: 132px; }
    .agrid { grid-template-columns: 1fr 1fr 1fr; }
    h1 { font-size: 36px; }
  }

<script>
(function () {
  'use strict';
  var MODE = 'enc';
  var D = null, SEL = null;
  try { if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } } catch (e) {}

  // ---------- тема ----------
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('shtab.theme', t); } catch (e) {}
    var u = document.querySelector('#theme use'); if (u) u.setAttribute('href', t === 'light' ? '#i-moon' : '#i-sun');
  }
  setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
  document.getElementById('theme').addEventListener('click', function () {
    setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
  });

  // ---------- помощники ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ic(n, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
  function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
  function plural(n, a, b, c) { var m = n % 10, h = n % 100; return (m === 1 && h !== 11) ? a : (m >= 2 && m <= 4 && (h < 10 || h >= 20)) ? b : c; }
  function srcLink(p, miss) {
    if (!p) return '';
    var name = p.replace(/\/$/, '').split('/').pop();
    return '<a href="' + esc(D.repo + p) + '" target="_blank" rel="noopener"' + (miss ? ' class="miss"' : '') + ' title="' + esc(p) + '">' + esc(name) + '</a>';
  }
  function dmy(iso) { var m = /^(\d{4})-(\d\d)-(\d\d)T?(\d\d:\d\d)?/.exec(iso || ''); return m ? m[3] + '.' + m[2] + (m[4] ? ' ' + m[4] : '') : ''; }
  var WHO = { 'бот': 'bot', 'Юлай': 'yulai', 'критик': 'critic', 'агенты': 'agents', 'сторож': 'watch', 'человек': 'person' };
  var WHO_NAME = { bot: 'бот', yulai: 'Юлай', critic: 'критик', agents: 'агенты', watch: 'сторож', person: 'человек' };
  function whoKey(w) { return WHO[w] || 'bot'; }
  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function sevWord(s) { return s === 'red' ? 'не задано' : 'не записано'; }
  function callout(g) { return '<div class="callout ' + esc(g.sev) + '">' + ic('alert') + '<div><b>' + sevWord(g.sev) + '</b>' + esc(g.what) + '</div></div>'; }
  var AVC = ['#5B7CFA', '#9580FF', '#D58BEA', '#F27E9F', '#F4A26E', '#45C4B2', '#DDBB55', '#86C474'];
  function avatar(name) {
    var parts = String(name).split(/\s+/).filter(Boolean), ini = (parts[0] || '?').charAt(0) + (parts[1] ? parts[1].charAt(0) : '');
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return '<span class="person"><span class="av" style="background:' + AVC[h % AVC.length] + '">' + esc(ini.toUpperCase()) + '</span>' + esc(name) + '</span>';
  }

  // ---------- схема ----------
  function svgGraph(nodes, edges, h, opts) {
    var s = '<svg class="g" viewBox="0 0 360 ' + h + '" role="img" aria-label="' + esc(opts.label) + '">';
    if (opts.frame) {
      var f = opts.frame;
      s += '<rect class="frame" x="' + f.x + '" y="' + f.y + '" width="' + f.w + '" height="' + f.h + '" rx="18"/>';
      s += '<text class="framel" x="' + (f.x + 14) + '" y="' + (f.y + 22) + '">' + esc(f.label) + '</text>';
    }
    edges.forEach(function (e, i) {
      s += '<path class="edge" data-e="' + i + '" data-a="' + esc(e.a) + '" data-b="' + esc(e.b) + '" d="' + esc(e.d) + '" marker-end="url(#ar)"' + (e.both ? ' marker-start="url(#ar)"' : '') + '><title>' + esc(e.label) + '</title></path>';
    });
    nodes.forEach(function (n) {
      var cy = n.y + n.h / 2, gaps = n.gaps || [];
      var sub = opts.sub ? opts.sub(n) : n.sub;
      s += '<g class="node' + (n.kind === 'ext' ? ' ext' : '') + '" data-id="' + esc(n.id) + '" tabindex="0" role="button" aria-label="' + esc(n.title) + '">';
      s += '<rect class="b" x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="12"/>';
      s += '<use href="#i-' + esc(n.icon) + '" x="' + (n.x + 10) + '" y="' + (cy - 9) + '" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
      s += '<text class="ti" x="' + (n.x + 35) + '" y="' + (sub ? cy - 2 : cy + 4.5) + '">' + esc(opts.title ? opts.title(n) : (n.short || n.title)) + '</text>';
      if (sub) s += '<text class="su" x="' + (n.x + 35) + '" y="' + (cy + 13) + '">' + esc(sub) + '</text>';
      if (gaps.length) {
        var red = gaps.some(function (g) { return g.sev === 'red'; });
        s += '<circle class="gapdot ' + (red ? 'red' : 'orange') + '" cx="' + (n.x + n.w - 10) + '" cy="' + (n.y + 10) + '" r="4"><title>' + esc(gaps.map(function (g) { return g.what; }).join('; ')) + '</title></circle>';
      }
      s += '</g>';
    });
    return s + '</svg>';
  }
  function highlight(svg, id) {
    if (!svg) return;
    var near = {};
    svg.classList.toggle('sel', !!id);
    Array.prototype.forEach.call(svg.querySelectorAll('.edge'), function (p) {
      var on = !!id && (p.getAttribute('data-a') === id || p.getAttribute('data-b') === id);
      p.classList.toggle('on', on);
      p.setAttribute('marker-end', on ? 'url(#ar-on)' : 'url(#ar)');
      if (p.hasAttribute('marker-start')) p.setAttribute('marker-start', on ? 'url(#ar-on)' : 'url(#ar)');
      if (on) { near[p.getAttribute('data-a')] = 1; near[p.getAttribute('data-b')] = 1; }
    });
    Array.prototype.forEach.call(svg.querySelectorAll('.node'), function (g) {
      var nid = g.getAttribute('data-id');
      g.classList.toggle('on', nid === id);
      g.classList.toggle('near', !!near[nid] && nid !== id);
    });
  }

  // ---------- уровень 1: сверху ----------
  function kpiTile(icon, big, label, go) {
    return '<button type="button" class="card kpi" data-go="' + go + '"><span class="ki">' + ic(icon) + '</span><b>' + big + '</b><span>' + label + '</span></button>';
  }
  function renderMap() {
    var K = D.kpi, h = '';
    h += '<div class="head"><div class="dateline">' + ic('map') + 'Вид сверху · собрано ' + esc(dmy(D.built)) + '</div>';
    h += '<h1>Как устроен бот</h1><div class="sub">Частей ядра — ' + K.core + ', узлов снаружи — ' + K.ext + ', ' + K.edges + ' ' + plural(K.edges, 'связь', 'связи', 'связей') + ' между ними. Нажми на блок — покажу, что он делает, с чем связан и из каких процессов состоит.</div></div>';
    h += '<div class="kpis">' +
      kpiTile('layout', K.core + '<span style="font-size:17px;color:var(--ink-3);font-weight:400"> + ' + K.ext + '</span>', 'частей ядра + снаружи', 'map') +
      kpiTile('steps', K.procs, 'процессов · ' + K.steps + ' ' + plural(K.steps, 'шаг', 'шага', 'шагов'), 'procs') +
      kpiTile('chats', K.chats, 'чатов · ' + K.pchats + ' проектов', 'chats') +
      kpiTile('bot', K.agents, 'агентов · ' + K.skills + ' навыков', 'agents') + '</div>';
    // пробелы
    var tot = K.red + K.orange;
    h += '<div class="card gapcard"><div class="gaphead"><div class="tile" style="background:var(--' + (K.red ? 'bad' : 'warn') + '-soft);color:var(--' + (K.red ? 'bad' : 'warn') + '-ink)">' + ic('alert') + '</div>' +
      '<div style="flex:1;min-width:0"><div class="t">' + (tot ? 'Пробелы — где поправить' : 'Пробелов не нашёл') + '</div><div class="s">настройка не задана или правило не записано</div></div><div class="big">' + tot + '</div></div>';
    if (tot) {
      h += '<div class="stack" aria-hidden="true"><i class="sev-red" style="flex:' + K.red + '"></i><i class="sev-orange" style="flex:' + K.orange + '"></i></div>';
      h += '<div class="legend"><span><i class="d sev-red"></i>' + K.red + ' не задано</span><span><i class="d sev-orange"></i>' + K.orange + ' не записано</span></div>';
      h += '<ul class="heads">' + D.heads.slice(0, 3).map(headRow).join('') + '</ul>';
      if (D.heads.length > 3 || D.gaps.length > 3) {
        h += '<details class="more"><summary>Все пробелы — ' + D.gaps.length + '</summary><ul class="heads">' + D.gaps.map(function (g) {
          return '<li><button type="button" class="hrow" data-go="' + esc(g.tab) + '" data-ref="' + esc(g.ref) + '"><i class="d sev-' + esc(g.sev) + '"></i><span>' + esc(g.what) + '<span class="w">' + esc(g.where) + '</span></span><span></span></button></li>';
        }).join('') + '</ul></details>';
      }
    }
    h += '</div>';
    // схема + панель
    h += '<div class="sec"><h2><span class="ib">' + ic('map') + '</span>Схема</h2><span class="c">стрелка — куда течёт</span></div>';
    h += '<div class="mapgrid"><div class="card diagram">' + svgGraph(D.blocks, D.edges, D.view_h, { label: 'Схема блоков системы', frame: D.frame }) +
      '<div class="maplegend"><span><i style="background:var(--card);box-shadow:inset 0 0 0 1.2px var(--line)"></i>часть ядра</span><span><i style="border:1.2px dashed var(--edge)"></i>снаружи бота</span><span><svg width="10" height="10" style="margin-right:6px;vertical-align:-1px"><circle cx="5" cy="5" r="4" fill="var(--bad)"/></svg>пробел</span></div></div>';
    h += '<div class="card panel" id="panel"></div></div>';
    put('map', h);
    var svg = document.querySelector('#v-map svg.g');
    bindNodes(svg, function (id) { selectBlock(id, true); });
    selectBlock(SEL, false);
  }
  function headRow(k) {
    return '<li><button type="button" class="hrow" data-go="' + esc(k.tab) + '" data-ref="' + esc(k.ref) + '"><i class="d sev-' + esc(k.sev) + '"></i><span><b>' + esc(k.title) + '</b><span class="w">' + esc(k.where.slice(0, 3).join(' · ') + (k.where.length > 3 ? ' и ещё ' + (k.where.length - 3) : '')) + '</span></span><span class="n">' + k.n + '</span></button></li>';
  }
  function bindNodes(svg, fn) {
    if (!svg) return;
    Array.prototype.forEach.call(svg.querySelectorAll('.node'), function (g) {
      g.addEventListener('click', function () { fn(g.getAttribute('data-id')); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(g.getAttribute('data-id')); } });
    });
  }
  function selectBlock(id, scroll) {
    SEL = id;
    highlight(document.querySelector('#v-map svg.g'), id);
    var P = document.getElementById('panel'); if (!P) return;
    var b = id && byId(D.blocks, id);
    if (!b) {
      P.innerHTML = '<div class="ph"><div class="tile ext">' + ic('hand') + '</div><div><h3>Выбери блок</h3><div class="k">на схеме или здесь</div></div></div>' +
        '<p class="hint">Ядро — то, что бот делает сам по правилам. Пунктиром — то, что снаружи: Юлай, люди, машины.</p>' +
        '<ul class="links" style="margin-top:8px">' + D.blocks.filter(function (x) { return x.kind === 'core'; }).map(function (x) {
          return '<li><button type="button" class="lrow" data-sel="' + esc(x.id) + '"><span class="ar">' + ic(x.icon) + '</span><span><span class="t">' + esc(x.title) + (x.gaps.length ? ' <i class="d sev-' + esc(x.gaps[0].sev) + '" style="display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:2px;margin-left:4px"></i>' : '') + '</span><span class="s">' + esc(cap(x.does || x.sub)) + '</span></span></button></li>';
        }).join('') + '</ul>';
      return;
    }
    var core = b.kind === 'core', h = '';
    h += '<div class="ph"><div class="tile' + (core ? '' : ' ext') + '">' + ic(b.icon) + '</div><div style="min-width:0"><h3>' + esc(b.title) + '</h3><div class="k">' + (core ? 'часть ядра · ' + b.part + ' из 7' : 'снаружи бота') + '</div></div>' +
      '<button type="button" class="iconbtn" data-sel="" aria-label="Снять выбор" style="margin-left:auto">' + ic('chev') + '</button></div>';
    (b.gaps || []).forEach(function (g) { h += callout(g); });
    h += '<p class="lead">' + esc(cap(core ? b.does : b.about)) + '</p>';
    if (core && b.has) h += '<div class="lbl">' + ic('wrench') + 'Что уже есть</div><p class="ptext">' + esc(cap(b.has)) + '</p>';
    if (core && b.measure) h += '<div class="lbl">' + ic('target') + 'Чем меряем</div><p class="ptext">' + esc(cap(b.measure)) + '</p>';
    var links = D.edges.filter(function (e) { return e.a === id || e.b === id; });
    if (links.length) {
      h += '<div class="lbl">' + ic('both') + 'Связи</div><ul class="links">' + links.map(function (e) {
        var other = byId(D.blocks, e.a === id ? e.b : e.a), dir = e.both ? 'both' : (e.a === id ? 'out' : 'in');
        return '<li><button type="button" class="lrow" data-sel="' + esc(other.id) + '"><span class="ar">' + ic(dir) + '</span><span><span class="t">' + (dir === 'in' ? 'из: ' : dir === 'out' ? 'в: ' : '') + esc(other.title) + '</span><span class="s">' + esc(e.label) + '</span></span></button></li>';
      }).join('') + '</ul>';
    }
    if (b.procs && b.procs.length) {
      h += '<div class="lbl">' + ic('steps') + 'Процессы</div><ul class="links">' + b.procs.map(function (pid) {
        var p = byId(D.procs, pid);
        return '<li><button type="button" class="lrow" data-go="procs" data-ref="' + esc(pid) + '"><span class="ar">' + ic(p.icon) + '</span><span><span class="t">' + esc(p.title) + '</span><span class="s">' + p.steps.length + ' ' + plural(p.steps.length, 'шаг', 'шага', 'шагов') + ' · ' + esc(p.about) + '</span></span></button></li>';
      }).join('') + '</ul>';
    } else if (!core) {
      h += '<p class="hint">Своих процессов у внешнего узла нет — смотри связи.</p>';
    }
    if (b.src) h += '<div class="src">' + ic('file') + 'Источник: ' + srcLink(b.src) + '</div>';
    P.innerHTML = h;
    if (scroll && window.innerWidth < 1000) P.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- уровень 2: процессы ----------
  function whoStack(counts, cls) {
    var keys = ['yulai', 'bot', 'critic', 'agents', 'watch', 'person'];
    return '<div class="' + cls + '" aria-hidden="true">' + keys.filter(function (k) { return counts[k]; }).map(function (k) {
      return '<i style="flex:' + counts[k] + ';background:var(--w-' + k + ')" title="' + WHO_NAME[k] + ': ' + counts[k] + '"></i>';
    }).join('') + '</div>';
  }
  function renderProcs() {
    var h = '', tot = {}, all = 0;
    Object.keys(D.who).forEach(function (w) { var k = whoKey(w); tot[k] = (tot[k] || 0) + D.who[w]; all += D.who[w]; });
    h += '<div class="head"><div class="dateline">' + ic('steps') + 'Процессы шагами</div><h1>Из каких шагов всё делается</h1>' +
      '<div class="sub">' + D.procs.length + ' ' + plural(D.procs.length, 'процесс', 'процесса', 'процессов') + ', ' + D.kpi.steps + ' шагов. У каждого шага — кто делает и файл, где записано правило: поправить — значит поправить этот файл.</div></div>';
    h += '<div class="card whobar"><div class="t">Кто делает шаги</div><div class="fine">Юлай нужен в ' + (tot.yulai || 0) + ' из ' + all + ' — на краях: выбор, отправка, деньги</div>' + whoStack(tot, 'stack') +
      '<div class="legend">' + ['yulai', 'bot', 'critic', 'agents', 'watch', 'person'].filter(function (k) { return tot[k]; }).map(function (k) {
        return '<span><i class="d" style="background:var(--w-' + k + ')"></i>' + WHO_NAME[k] + ' ' + tot[k] + '</span>';
      }).join('') + '</div></div>';
    h += '<div class="sec"><h2><span class="ib">' + ic('branch') + '</span>Как процессы передают друг другу</h2></div>';
    h += '<div class="procwrap"><div class="card diagram">' + svgGraph(D.procs, D.pedges, D.proc_view_h, {
      label: 'Схема связей процессов', title: function (p) { return p.short; },
      sub: function (p) { return p.steps.length + ' ' + plural(p.steps.length, 'шаг', 'шага', 'шагов'); }
    }) + '</div><div class="pgrid">' + D.procs.map(procCard).join('') + '</div></div>';
    put('procs', h);
    var svg = document.querySelector('#v-procs svg.g');
    bindNodes(svg, function (id) { openProc(id); });
    Array.prototype.forEach.call(document.querySelectorAll('#v-procs details.proc'), function (d) {
      d.addEventListener('toggle', function () { if (d.open) highlight(svg, d.getAttribute('data-id')); });
    });
  }
  function procCard(p) {
    var cnt = {};
    p.steps.forEach(function (s) { var k = whoKey(s.who); cnt[k] = (cnt[k] || 0) + 1; });
    var h = '<details class="card proc" id="p-' + esc(p.id) + '" data-id="' + esc(p.id) + '"><summary><div class="tile">' + ic(p.icon) + '</div><div style="min-width:0"><span class="pt">' + esc(p.title) + '</span><span class="pa">' + esc(p.about) + '</span>' + whoStack(cnt, 'mini') + '</div>' + ic('chev', 'chev') + '</summary><div class="pbody">';
    h += '<div class="chips">' + p.blocks.map(function (bid) {
      var b = byId(D.blocks, bid); return b ? '<button type="button" class="chip" data-go="map" data-ref="' + esc(bid) + '">' + ic(b.icon) + esc(b.title) + '</button>' : '';
    }).join('') + '</div>';
    h += '<ol class="steps">' + p.steps.map(function (s) {
      var k = whoKey(s.who);
      return '<li class="step who-' + k + '"><div><div class="st">' + esc(s.t) + '</div><div class="sm"><span class="who"><i style="background:var(--w-' + k + ')"></i>' + esc(s.who) + '</span>' +
        (s.src ? '<span>' + srcLink(s.src, !s.ok) + (s.ok ? '' : ' — файла нет') + '</span>' : '<span style="color:var(--warn-ink)">источник не записан</span>') + '</div></div></li>';
    }).join('') + '</ol>';
    if ((p.to && p.to.length) || (p.from && p.from.length)) {
      h += '<div class="flow">';
      if (p.from && p.from.length) h += '<div class="lbl">' + ic('in') + 'Приходит из</div><div class="chips">' + p.from.map(flowChip).join('') + '</div>';
      if (p.to && p.to.length) h += '<div class="lbl">' + ic('out') + 'Ведёт дальше</div><div class="chips">' + p.to.map(flowChip).join('') + '</div>';
      h += '</div>';
    }
    return h + '</div></details>';
  }
  function flowChip(x) { var p = byId(D.procs, x.id); return p ? '<button type="button" class="chip" data-go="procs" data-ref="' + esc(x.id) + '" title="' + esc(x.label) + '">' + ic(p.icon) + esc(p.short) + ' · <span style="font-weight:400">' + esc(x.label) + '</span></button>' : ''; }
  function openProc(id) {
    var d = document.getElementById('p-' + id); if (!d) return;
    d.open = true; highlight(document.querySelector('#v-procs svg.g'), id);
    flash(d);
  }
  function flash(el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 1600);
  }

  // ---------- уровень 3: чаты и агенты ----------
  function kv(icon, label, val, miss) {
    return '<div>' + ic(icon) + '<dl style="margin:0"><dt>' + esc(label) + '</dt><dd' + (miss ? ' class="miss"' : '') + '>' + esc(val) + '</dd></dl></div>';
  }
  function actLine(a) {
    if (!a) return '';
    var t = 'за 7 дней: ' + a.n + (a.n ? ' (людей ' + a.people + ', бот ' + a.bot + ')' : '') + ' · последнее ' + (a.last ? dmy(a.last) : '—');
    return '<div class="act' + (a.live ? ' live' : '') + '">' + esc(t) + '</div>';
  }
  function chatCard(c, direct, i) {
    var h = '<article class="card ccard" id="' + (direct ? 'direct-' + i : 'chat-' + esc(c.key)) + '"><div class="ch">';
    h += '<div class="tile' + (direct ? ' ext' : '') + '">' + ic(c.icon || 'chats') + '</div><div class="tt"><h3>' + esc(c.title) + '</h3><div class="k">' + esc(direct ? c.bot : (c.created ? 'с ' + dmy(c.created) : '')) + '</div>' + (direct ? '' : actLine(c.act)) + '</div>';
    h += direct ? '<span class="badge direct">с Юлаем</span>' : '<span class="badge ' + (c.mode === 'client' ? 'client' : c.mode === 'close' ? 'close' : 'none') + '">' + esc(c.mode_label) + '</span>';
    h += '</div>';
    (c.gaps || []).forEach(function (g) { h += callout(g); });
    if (c.note) h += '<div class="callout note">' + ic('star') + '<div><b>Особый режим</b>' + esc(cap(c.note)) + '</div></div>';
    var mem = c.members || [];
    h += '<div class="people">' + (mem.length ? mem.map(avatar).join('') : '<span class="person" style="padding:3px 10px;color:var(--warn-ink)">людей проекта нет</span>') + '</div>';
    h += '<dl class="kv">';
    if (direct) h += kv('chats', 'Что здесь', c.mode);
    h += kv('tone', 'Тон', c.tone || 'не задан', !c.tone);
    h += kv('bot', 'Бот делает сам', c.self || 'не задано', !c.self);
    h += kv('hand', 'Через Юлая', c.via || 'не задано', !c.via);
    if (!direct) h += kv('bot', 'Боты', ['куратор ' + c.curator].concat(c.bots.map(function (b) { return 'бот проекта ' + b; })).join(' · '));
    h += '</dl>';
    h += '<div class="srcs">' + ic('file') + ' ' + (c.src || []).map(function (s) { return srcLink(s); }).join('') + '</div>';
    return h + '</article>';
  }
  function agentCard(a) {
    var h = '<article class="card acard" id="agent-' + esc(a.id) + '"><h3>' + esc(cap(a.human)) + '</h3><div class="mono id">' + esc(a.id) + '</div>';
    (a.gaps || []).forEach(function (g) { h += callout(g); });
    h += '<p>' + esc(cap(a.does)) + '</p>';
    h += '<div class="chips"><span class="chip model">' + esc(a.model || 'модель не задана') + (a.effort ? ' · ' + esc(a.effort) : '') + '</span>' + a.access.map(function (x) { return '<span class="chip">' + esc(x) + '</span>'; }).join('') + '</div>';
    if (a.model_note) h += '<div class="ln">' + esc(cap(a.model_note)) + '</div>';
    if (a.launch) h += '<div class="ln">' + esc(a.launch) + '</div>';
    h += '<div class="srcs">' + ic('file') + ' ' + srcLink(a.src) + '</div>';
    return h + '</article>';
  }
  function renderChats() {
    var h = '';
    h += '<div class="head"><div class="dateline">' + ic('chats') + 'Чаты и агенты</div><h1>Где кто говорит и как</h1>' +
      '<div class="sub">' + D.kpi.chats + ' ' + plural(D.kpi.chats, 'чат', 'чата', 'чатов') + ' и ' + D.kpi.agents + ' агентов. В каждом чате — кто там, режим, тон, что бот делает сам и что через Юлая. Красным и оранжевым — что не задано.</div></div>';
    h += '<div class="sec"><h2><span class="ib">' + ic('send') + '</span>Чаты с Юлаем</h2><span class="c">' + D.direct.length + '</span></div><div class="cgrid">' + D.direct.map(function (c, i) { return chatCard(c, true, i); }).join('') + '</div>';
    h += '<div class="sec"><h2><span class="ib">' + ic('chats') + '</span>Чаты проектов</h2><span class="c">' + D.chats.length + '</span></div>';
    h += '<div class="modes"><div class="card mode"><div class="mt"><span class="badge client">Клиент</span></div><p>Ответ людям — черновиком Юлаю, в чат после его ✅. Тон деловой, без нашей кухни.</p></div>' +
      '<div class="card mode"><div class="mt"><span class="badge close">Свой круг</span></div><p>Куратор пишет сам: «спасибо, записал», уточнения, карточка. Деньги и решения — Юлаю.</p></div></div>';
    var live = D.chats.filter(function (c) { return c.act && c.act.live; }), quiet = D.chats.filter(function (c) { return !(c.act && c.act.live); });
    h += '<div class="cgrid" style="margin-top:8px">' + live.map(function (c) { return chatCard(c, false); }).join('') + '</div>';
    if (quiet.length) {
      h += '<details class="card quiet" id="quiet"><summary><span class="qt"><b>Тихие · ' + quiet.length + '</b> — людей за 7 дней не было: ' + quiet.map(function (c) { return esc(c.title); }).join(' · ') + '</span>' + ic('chev', 'chev') + '</summary>' +
        '<div class="cgrid" style="margin-top:10px">' + quiet.map(function (c) { return chatCard(c, false); }).join('') + '</div></details>';
    }
    h += '<div class="sec" id="agents"><h2><span class="ib">' + ic('bot') + '</span>Агенты</h2><span class="c">' + D.kpi.agents + '</span></div>';
    D.agents.forEach(function (g) {
      h += '<div class="lbl" style="margin:20px 0 8px;font-size:15px;color:var(--ink-2)">' + ic(g.icon) + esc(g.title) + ' <span style="font-weight:400;color:var(--ink-3)">· ' + g.items.length + '</span></div>';
      h += '<div class="agrid">' + g.items.map(agentCard).join('') + '</div>';
    });
    h += '<div class="sec" id="skills"><h2><span class="ib">' + ic('book') + '</span>Навыки</h2><span class="c">процедуры по слову</span></div>';
    h += '<details class="card"><summary>Все навыки — ' + D.skills.length + ic('chev', 'chev') + '</summary><ul class="skills">' + D.skills.map(function (s) {
      return '<li><span class="mono">' + esc(s.id) + '</span><span>' + esc(cap(s.does)) + (s.gaps.length ? ' <b style="color:var(--bad-ink)">· нет описания</b>' : '') + '</span></li>';
    }).join('') + '</ul></details>';
    h += '<div class="card foot"><p><b style="color:var(--ink-2)">Откуда данные.</b> Страницу собирает bin/system-map из настоящих файлов: части ядра — свод 136, чаты — реестр чатов проектов, агенты и навыки — их файлы, тон — раздел «Как Юлай с ним говорит» в карточке человека. Раскладку схемы, связи и шаги процессов держит реестр projects/system-map.json.</p>' +
      '<p><b style="color:var(--ink-2)">Как поправить.</b> Нашёл пробел — правь файл, на который ведёт ссылка; карта пересоберётся сама в течение часа.</p>' +
      '<p>Только чтение. Суммы, телефоны и почта вычищаются; страница зашифрована ключом Штаба. Собрано ' + esc(dmy(D.built)) + '.</p></div>';
    put('chats', h);
  }

  // ---------- вкладки и переходы ----------
  var CUR = 'map';
  function put(id, h) { document.getElementById('v-' + id).innerHTML = h; }
  function show(tab) {
    CUR = tab;
    ['map', 'procs', 'chats'].forEach(function (t) { document.getElementById('v-' + t).hidden = t !== tab; });
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) { b.setAttribute('aria-selected', b.getAttribute('data-tab') === tab ? 'true' : 'false'); });
    try { history.replaceState(null, '', location.pathname + location.search + '#' + tab); } catch (e) {}
  }
  function go(tab, ref) {
    if (tab === 'agents') { show('chats'); var a = document.getElementById('agents'); if (a) a.scrollIntoView({ behavior: 'smooth' }); return; }
    show(tab);
    if (!ref) { window.scrollTo(0, 0); return; }
    if (tab === 'map') { selectBlock(ref, true); if (window.innerWidth >= 1000) window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (tab === 'procs') { openProc(ref); return; }
    var el = document.getElementById(ref) || document.getElementById(ref.replace(/^chat-/, 'chat-'));
    var qd = el && el.closest ? el.closest('details.quiet') : null;
    if (qd) qd.open = true;
    if (ref === 'skills') { el = document.getElementById('skills'); var d = el && el.nextElementSibling; if (d && d.tagName === 'DETAILS') d.open = true; }
    if (el) flash(el);
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-tab],[data-go],[data-sel]') : null;
    if (!t) return;
    if (t.hasAttribute('data-tab')) { show(t.getAttribute('data-tab')); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-sel')) { selectBlock(t.getAttribute('data-sel') || null, !!t.getAttribute('data-sel')); return; }
    if (t.hasAttribute('data-go')) { e.preventDefault(); go(t.getAttribute('data-go'), t.getAttribute('data-ref')); }
  });

  function render(data) {
    D = data;
    document.getElementById('lock').hidden = true;
    document.getElementById('tabs').hidden = false;
    document.getElementById('built').textContent = 'вид сверху · собрано ' + dmy(D.built);
    document.getElementById('n-procs').textContent = ' ' + D.kpi.procs;
    document.getElementById('n-chats').textContent = ' ' + (D.kpi.chats + D.kpi.agents);
    renderMap(); renderProcs(); renderChats();
    var start = (location.hash.match(/^#(map|procs|chats)$/) || [])[1] || 'map';
    show(start);
  }

  // ---------- данные: открытые (снимки в /tmp) или шифр ключом Штаба ----------
  function b64(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/').replace(/\s+/g, ''); while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function locked(msg) { if (msg) document.getElementById('lock-msg').textContent = msg; }
  var raw = document.getElementById('payload').textContent.trim();
  if (MODE === 'plain') { render(JSON.parse(new TextDecoder().decode(b64(raw)))); return; }
  var m = (location.hash || '').match(/(?:^#|[#&?])k=([A-Za-z0-9_-]{40,})/), k = m ? m[1] : null;
  try { if (k) sessionStorage.setItem('shtab.k', k); else k = sessionStorage.getItem('shtab.k'); } catch (e) {}
  if (m) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  if (!k) { locked(); return; }
  if (!window.crypto || !crypto.subtle) { locked('Браузер не умеет расшифровывать. Открой в Telegram или обычном браузере по https.'); return; }
  document.getElementById('lock-h').textContent = 'Открываю…';
  var blob = b64(raw);
  crypto.subtle.importKey('raw', b64(k), { name: 'AES-GCM' }, false, ['decrypt'])
    .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(0, 12) }, key, blob.slice(12)); })
    .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); },
          function () { try { sessionStorage.removeItem('shtab.k'); } catch (e) {} document.getElementById('lock-h').textContent = 'Ключ не подошёл'; locked('Открой карту заново из Штаба.'); return null; })
    .then(function (data) { if (data) render(data); })
    .catch(function (e) { locked('Не получилось показать карту: ' + (e && e.message || e)); });
})();
</script>
