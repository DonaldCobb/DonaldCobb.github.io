<style>
/* Карта «База знаний»: за 10 секунд → перекос «объём против веса» → фильтр по виду → что дальше / куда двигаемся → кого ищем → сферы (раскрываются) → темы (раскрываются) → как читать.

:root{
  --bg:#edf1ec; --surface:#f8faf7; --fg:#1b2620; --muted:#5d6b63; --line:#cfd8d1; --accent:#2c6a52; --warn:#9a5b12;
  --l0:#f6d5cf; --l0f:#7a2b1f; --l1:#f7e1a8; --l1f:#5e4204; --l2:#b5dd98; --l2f:#1d4510; --l3:#2f8a57; --l3f:#ffffff; --gap:#e0664f; --gapf:#b2402b;
  --vol:#4f6fae; --volf:#2f4b86; --wt:#1b2620;
  --kh:#cfe9d6; --khf:#1d5130; --ks:#e4ddf9; --ksf:#4a2f8c;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#18211c; --fg:#e2eae4; --muted:#9aa8a0; --line:#2b3831; --accent:#6cc39b; --warn:#e0a54a;
  --l0:#462622; --l0f:#f3b9ae; --l1:#4d3c12; --l1f:#f5d98e; --l2:#2f5a24; --l2f:#d9f2c9; --l3:#5ccb8d; --l3f:#0d1f15; --gap:#f07c64; --gapf:#f39a86;
  --vol:#7f9be0; --volf:#b5c6f2; --wt:#e2eae4; --kh:#24452f; --khf:#bfe8cc; --ks:#342a52; --ksf:#cfc0f7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#18211c; --fg:#e2eae4; --muted:#9aa8a0; --line:#2b3831; --accent:#6cc39b; --warn:#e0a54a;
  --l0:#462622; --l0f:#f3b9ae; --l1:#4d3c12; --l1f:#f5d98e; --l2:#2f5a24; --l2f:#d9f2c9; --l3:#5ccb8d; --l3f:#0d1f15; --gap:#f07c64; --gapf:#f39a86;
  --vol:#7f9be0; --volf:#b5c6f2; --wt:#e2eae4; --kh:#24452f; --khf:#bfe8cc; --ks:#342a52; --ksf:#cfc0f7; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:22px}
.embed .wrap{padding-top:8px}
.embed header{display:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow,.lbl,h3{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:700 clamp(30px,8vw,52px)/1.05 var(--f-display);margin:6px 0 0;letter-spacing:-.01em}
h2{font:700 19px/1.2 var(--f-display);margin:0}
.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.ic{width:24px;height:24px;flex:none;display:block}
.fi{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.fi.gp{color:var(--gapf);background:color-mix(in srgb,var(--gap) 15%,transparent)}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s;flex:none}
details[open]>summary>.chev,details[open]>summary .chev.r{transform:rotate(180deg)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
/* за 10 секунд */
.ten{display:grid;gap:12px}
.hero-l{display:grid;gap:10px}
.hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .lbl{font-size:12px}
.sub{font-size:15px;color:var(--muted)}
.sub b{color:var(--fg);font-weight:600}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font:500 12px/1.3 var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--l1);color:var(--l1f)}
.badge.gp{background:color-mix(in srgb,var(--gap) 16%,transparent);color:var(--gapf)}
.badge.kp{background:var(--ks);color:var(--ksf)}
.badge.vl{background:color-mix(in srgb,var(--vol) 18%,transparent);color:var(--volf)}
.badge .ic{width:15px;height:15px}
.five{margin:0;padding:4px 16px}
.f{border-bottom:1px solid var(--line)} .f:last-child{border-bottom:0}
.f>summary{display:grid;grid-template-columns:40px minmax(0,1fr) 18px;gap:12px;align-items:center;padding:9px 0;min-height:58px}
.fx{min-width:0;display:grid;gap:1px}
.fl{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ft{font-size:14.5px;line-height:1.35;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f.goal .ft{font-weight:600}
.fb{margin:0;padding:0 0 12px 52px;font-size:14.5px;line-height:1.45}
/* перекос */
.skew{display:grid;gap:12px}
.skh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;min-height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);line-height:1.3}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{width:12px;height:10px;border-radius:3px;display:inline-block}
.key .kv{background:var(--vol)} .key .kw{background:transparent;border:2px solid var(--wt);height:10px}
.rows{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.srow{display:grid;grid-template-columns:minmax(0,12em) 1fr;gap:4px 12px;align-items:center;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.srow .nm{display:flex;gap:8px;align-items:center;min-width:0;font:500 14px/1.2 var(--f-body)}
.srow .nm .ic{color:var(--accent);width:22px;height:22px}
.srow .nm .dot{width:10px;height:10px;border-radius:50%;flex:none}
.bars{display:grid;gap:3px;min-width:0}
.bar{display:grid;grid-template-columns:1fr 5.6em;gap:6px;align-items:center}
.bar .tr{height:12px;border-radius:4px;background:color-mix(in srgb,var(--line) 55%,transparent);position:relative;overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar.v .tr i{background:var(--vol)}
.bar.w .tr i{background:transparent;border:2px solid var(--wt);border-radius:4px}
.bar span{font:500 11.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.bar.v span{color:var(--volf)}
.ratio{font:600 11px/1.2 var(--f-mono);padding:2px 6px;border-radius:4px;white-space:nowrap;justify-self:start}
.ratio.over{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.ratio.under{background:color-mix(in srgb,var(--gap) 16%,transparent);color:var(--gapf)}
.ratio.ok{background:var(--kh);color:var(--khf)}
.skew .cap{font-size:13.5px;line-height:1.45}
@media (max-width:560px){.srow{grid-template-columns:1fr}.srow .nm{justify-content:space-between}}
/* фильтр */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.chip .ic{width:16px;height:16px}
.chip[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.fhint{font-size:12.5px;color:var(--muted)}
/* что дальше, куда двигаемся */
.dec{display:grid;gap:14px}
.xl{margin:8px 0 0;padding:0;list-style:none;display:grid}
.xl>li{border-bottom:1px solid var(--line)} .xl>li:last-child{border-bottom:0}
.xd>summary{display:grid;grid-template-columns:40px minmax(0,1fr) 18px;gap:12px;align-items:center;padding:10px 0;min-height:60px}
.xh{min-width:0;display:grid;gap:5px;justify-items:start}
.xt{font-weight:600;line-height:1.3}
.xb{display:grid;gap:6px;padding:0 0 12px 52px;font-size:14px}
.xb p{margin:0}
.k{font:500 11px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:5px}
.why{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.eff,.stat{font:500 11px/1.2 var(--f-mono);padding:4px 7px;border-radius:5px;white-space:nowrap}
.eff{border:1px solid var(--line);color:var(--muted)}
.stat{background:var(--l1);color:var(--l1f)}
/* кого ищем */
.seek{display:grid;gap:10px}
.sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin:0;padding:0;list-style:none}
.sl .chip{width:100%;height:100%;background:var(--ks);color:var(--ksf);border-color:transparent;border-radius:9px;font-size:13px;line-height:1.25;min-height:40px;padding:6px 9px;text-align:left}
.kst{font:500 11px/1.2 var(--f-mono);padding:3px 7px;border-radius:5px;white-space:nowrap}
.kst.k-есть{background:var(--kh);color:var(--khf)} .kst.k-ищем{background:var(--ks);color:var(--ksf)}
/* сферы */
.cards{display:grid;gap:10px}
.sph{background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:12px}
.sph.flash{box-shadow:0 0 0 2px var(--accent)}
.st{all:unset;box-sizing:border-box;width:100%;display:grid;gap:8px;padding:14px 16px;cursor:pointer}
.st:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.sh{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.sh h2{font:600 18px/1.25 var(--f-body)}
.lvl{font:500 12px/1 var(--f-mono);padding:5px 8px;border-radius:5px;white-space:nowrap}
.sm{display:flex;flex-wrap:wrap;gap:3px 12px;font:500 12px/1.35 var(--f-mono);color:var(--muted)}
.sm b{color:var(--gapf);font-weight:600}
.segs{display:flex;gap:2px;height:9px}
.segs i{border-radius:2px;min-width:4px}
.more{display:flex;align-items:center;gap:4px;font:500 12px/1 var(--f-mono);color:var(--accent)}
.more .chev{width:14px;height:14px;color:var(--accent)}
.sph.open .more{display:none}
.sb{display:none;padding:0 16px 14px;gap:12px}
.sph.open .sb{display:grid}
.L0{background:var(--l0);color:var(--l0f)} .L1{background:var(--l1);color:var(--l1f)} .L2{background:var(--l2);color:var(--l2f)} .L3{background:var(--l3);color:var(--l3f)}
.tl{margin:0;padding:0;list-style:none;display:grid;border-top:1px solid var(--line)}
.tl>li{border-bottom:1px solid var(--line)}
.tp>summary{display:grid;grid-template-columns:12px minmax(0,1fr) auto 16px;gap:10px;align-items:center;padding:10px 0;min-height:52px}
.tp>summary .dot{width:12px;height:12px;border-radius:50%}
.tn{min-width:0;display:grid;gap:2px}
.tn b{font-weight:600;font-size:15px;line-height:1.3}
.tn small{font:500 11.5px/1.3 var(--f-mono);color:var(--muted)}
.tn small em{font-style:normal;color:var(--gapf)}
.tw{font:500 12px/1.2 var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.tw b{display:block;color:var(--fg);font-size:13px}
.tb{display:grid;gap:12px;padding:0 0 14px 22px;font-size:14.5px}
.tb p{margin:0}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font:500 11.5px/1.2 var(--f-mono);padding:4px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.fact.lv{border:0}
.rn{display:flex;flex-wrap:wrap;gap:4px}
.rn span{font:500 11.5px/1 var(--f-mono);padding:4px 6px;border-radius:5px;background:color-mix(in srgb,var(--vol) 15%,transparent);color:var(--volf)}
.hl{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.hl li{display:grid;grid-template-columns:20px 1fr;gap:8px;line-height:1.35}
.hl .ic{width:18px;height:18px;color:var(--accent);margin-top:1px}
.hl code{display:block;font:500 11.5px/1.35 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
.gap{border-left:3px solid var(--warn);padding:2px 0 2px 10px;display:grid;gap:3px}
.gap .eff{margin-left:6px;padding:2px 5px}
.gap .nx{font-size:14px}
.gap .wh{font-size:12.5px;color:var(--muted)}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:1px;margin-top:4px}
.mix i{display:block;height:100%}
.mixk{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--muted);margin-top:5px}
.mixk span{display:inline-flex;align-items:center;gap:4px}
.mixk i{width:9px;height:9px;border-radius:2px;display:inline-block}
.ser{display:grid;gap:5px;margin-top:4px}
.ser div{display:grid;grid-template-columns:minmax(0,1fr) 7.5em;gap:8px;align-items:center;font-size:13.5px}
.ser .tr{height:8px;border-radius:3px;background:color-mix(in srgb,var(--line) 55%,transparent);position:relative;grid-column:1/-1}
.ser .tr i{position:absolute;inset:0 auto 0 0;background:var(--vol);border-radius:3px}
.ser span.n{font-size:12px;color:var(--muted);text-align:right}
.kpl{display:flex;flex-wrap:wrap;gap:6px}
.kpl span{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 9px;border-radius:7px}
.kpl .ic{width:15px;height:15px}
.kpl .k-есть{background:var(--kh);color:var(--khf)} .kpl .k-ищем{background:var(--ks);color:var(--ksf)}
footer{font-size:13px;color:var(--muted);max-width:72ch}
footer summary{display:inline-flex;align-items:center;gap:8px;min-height:40px;font-size:14px}
footer summary .ic{width:20px;height:20px}
footer p{margin:6px 0 0}
@media (min-width:760px){
  .wrap{padding-top:32px;gap:30px}
  .ten{grid-template-columns:minmax(280px,1fr) 2fr;align-items:start}
  .dec{grid-template-columns:1fr 1fr;align-items:start}
  .cards{grid-template-columns:1fr 1fr;align-items:start}
}
@media (max-width:380px){.big{font-size:38px}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
@media (forced-colors:active){.segs i,.bar .tr i{border:1px solid CanvasText}}
</style>

  "folder":'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  "clock":'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};
const ico = (n, cls = "ic") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || IC.circle}</svg>`;
const CHEV = ico("chevron-down", "chev");
const W = ["пусто","начато","в работе","освоено"];
const LVT = ["0 · знания почти нет","1 · начато — из чужих источников","2 · в работе — пробовали сами","3 · освоено — пользуемся"];
const EFF = {S:"S · часы", M:"M · дни", L:"L · недели"};
const TCOL = {research:"var(--vol)", media:"#b07ad6", lessons:"#d9a03a", people:"#3fa8a0", decisions:"#8a8f99", work:"color-mix(in srgb,var(--muted) 55%,var(--line))"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const dt = s => (s||"").split("-").reverse().join(".");
const dm = s => dt(s).slice(0,5);
const lvOf = m => m < .5 ? 0 : m < 1.5 ? 1 : m < 2.5 ? 2 : 3;
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const fmt = n => n.toLocaleString("ru-RU").replace(/,/g, " ");
const kw = n => n >= 1e6 ? (n/1e6).toFixed(2).replace(".", ",") + " млн" : n >= 1e4 ? Math.round(n/1e3) + " тыс." : n >= 1e3 ? (n/1e3).toFixed(1).replace(".", ",") + " тыс." : String(n);
const dots = w => "●".repeat(w) + "○".repeat(3 - w);
const pct = v => v >= 10 ? Math.round(v) + " %" : v >= 1 ? v.toFixed(1).replace(".", ",") + " %" : v > 0 ? "<1 %" : "0 %";

let type = "", metric = "words";
try { const s = localStorage.getItem("kb-type"); if (TY.some(t => t.id === s)) type = s; } catch (e) {}
const val = (o, m = metric) => type ? (o.byType[type] || [0,0])[m === "files" ? 0 : 1] : o[m];

document.title = M.title;
$("eyebrow").textContent = `${M.eyebrow} · ${dt(M.built)}`;
$("title").textContent = M.title;

/* --- за 10 секунд --- */
const T = M.totals;
$("big").textContent = fmt(T.files);
$("biglbl").textContent = plural(T.files, "файл", "файла", "файлов");
$("sub").innerHTML = `<b>${kw(T.words)}</b> слов · <b>${T.research}</b> исследований · <b>${S.length}</b> сфер · <b>${T.topics}</b> тем`;
let delta = "";
if (M.prev) { const d = T.files - M.prev.files; delta += `<span class="badge vl" title="Файлов было ${M.prev.files} (${dt(M.prev.date)})">${d >= 0 ? "+" : "−"}${Math.abs(d)} с ${dm(M.prev.date)}</span>`; }
delta += `<span class="badge gp">${ico("puzzle")}${T.gaps} ${plural(T.gaps,"пробел","пробела","пробелов")}</span>`;
delta += `<span class="badge kp">${ico("user")}ищем ${T.seek} ${plural(T.seek,"хранителя","хранителей","хранителей")}</span>`;
delta += `<span class="badge">${ico("clock")}следующая сверка ${dm(M.next)}</span>`;
$("delta").innerHTML = delta;
const F = M.five, FS = M.fiveShort;
$("five").innerHTML = [["goal","Цель","target"],["where","Где мы","compass"],["have","Что имеем","circle-check"],["missing","Чего не хватает","puzzle"],["heading","Куда двигаемся","signpost"]]
  .map(([c,l,i]) => `<details class="f ${c}"><summary><span class="fi${c === "missing" ? " gp" : ""}">${ico(i)}</span><span class="fx"><span class="fl">${l}</span><span class="ft">${esc(FS[c] || F[c])}</span></span>${CHEV}</summary><p class="fb">${esc(F[c])}</p></details>`).join("");

/* --- перекос: доля базы против веса для цели --- */
function renderSkew() {
  const tot = S.reduce((a, s) => a + val(s), 0) || 1;
  const rows = [...S].sort((a, b) => b.share - a.share).map(s => ({s, v: 100 * val(s) / tot}));
  const max = Math.max(...rows.map(r => Math.max(r.v, r.s.share)), 1);
  $("skew").innerHTML = rows.map(({s, v}) => {
    const r = s.share ? v / s.share : 0;
    const tagc = r >= 2 ? "over" : r <= .5 ? "under" : "ok";
    const tagt = r >= 2 ? `×${r >= 10 ? Math.round(r) : r.toFixed(1).replace(".", ",")} сверх веса` : r <= .5 ? (v < .05 ? "почти пусто" : `в ${(1/r) >= 10 ? Math.round(1/r) : (1/r).toFixed(1).replace(".", ",")} раза меньше`) : "в меру";
    return `<li><button type="button" class="srow" data-sph="${esc(s.id)}" aria-label="${esc(s.name)}: доля базы ${pct(v)}, вес для цели ${s.share} %">
      <span class="nm">${ico(s.icon)}<span style="flex:1;min-width:0">${esc(s.name)}</span><span class="dot L${lvOf(s.level)}" title="уровень: ${W[lvOf(s.level)]}"></span></span>
      <span class="bars"><span class="bar v"><span class="tr"><i style="width:${(100 * v / max).toFixed(1)}%"></i></span><span>${pct(v)}</span></span>
      <span class="bar w"><span class="tr"><i style="width:${(100 * s.share / max).toFixed(1)}%"></i></span><span>вес ${s.share} %</span></span>
      <span class="ratio ${tagc}">${tagt}</span></span></button></li>`; }).join("");
  const core = S.filter(s => s.id === "sales" || s.id === "niche"), faith = S.find(s => s.id === "faith");
  const cv = 100 * core.reduce((a, s) => a + val(s), 0) / tot, fv = faith ? 100 * val(faith) / tot : 0;
  const what = metric === "files" ? "файлов" : "слов";
  $("skewcap").innerHTML = `<b>Перекос:</b> продажи и ниша — ${pct(cv)} ${what}${type ? " в этом виде" : ""} при весе ${core.reduce((a, s) => a + s.share, 0)} % для цели; вера и наставники — ${pct(fv)} при весе ${faith ? faith.share : 0} %.`;
}

/* --- фильтр по виду --- */
function renderTypes() {
  $("types").innerHTML = [{id:"", name:"Все виды", icon:"layers", files:T.files, words:T.words}, ...TY].map(t =>
    `<button type="button" class="chip" data-t="${esc(t.id)}" aria-pressed="${t.id === type}">${ico(t.icon)}${esc(t.name)} <span class="n muted">${fmt(t.files)}</span></button>`).join("");
  const t = TY.find(x => x.id === type);
  $("fhint").textContent = t ? `Показаны только «${t.name.toLowerCase()}»: ${fmt(t.files)} ${plural(t.files,"файл","файла","файлов")}, ${kw(t.words)} слов. Уровни и пробелы — общие.` : "Нажми вид — график и цифры сфер покажут только его.";
}

/* --- что дальше и куда двигаемся --- */
$("top").innerHTML = (M.top || []).map(t => `<li><details class="xd"><summary><span class="fi">${ico(t.icon)}</span><span class="xh"><span class="xt">${esc(t.text)}</span><span class="eff">${esc(EFF[t.effort] || t.effort)}</span></span>${CHEV}</summary>
  <div class="xb">${t.next ? `<p>→ ${esc(t.next)}</p>` : ""}${t.who ? `<p><span class="k">поможет</span>${esc(t.who)}</p>` : ""}<p class="why">${esc(t.sphere)} · ${esc(t.topic)} · ${esc(t.why)}</p></div></details></li>`).join("");
$("dirs").innerHTML = (M.directions || []).map(d => `<li><details class="xd"><summary><span class="fi">${ico(d.icon || "signpost")}</span><span class="xh"><span class="xt">${esc(d.name)}</span><span class="stat">${esc(d.status)}</span></span>${CHEV}</summary>
  <div class="xb">${d.gives ? `<p><span class="k">даёт</span>${esc(d.gives)}</p>` : ""}${d.costs ? `<p><span class="k">цена</span>${esc(d.costs)}</p>` : ""}${(d.needs||[]).length ? `<p><span class="k">закрывает</span>${d.needs.map(esc).join(" · ")}</p>` : ""}</div></details></li>`).join("");

/* --- кого ищем: хранители знания, которых нет --- */
(function seek(){
  const want = S.flatMap(s => s.keepers.filter(k => k.status === "ищем").map(k => [s, k]));
  const have = S.reduce((a, s) => a + s.keepers.filter(k => k.status === "есть").length, 0);
  $("seek").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><h2>Кого ищем</h2><span class="kst k-ищем">${want.length} ${plural(want.length,"роль","роли","ролей")}</span></div>
  <div class="muted" style="font-size:13px;margin-top:-4px">Хранитель — человек или источник, откуда приходит знание сферы. Есть ${have}; не хватает этих. Нажми — откроется сфера.</div>
  <ul class="sl">${want.map(([s, k]) => `<li><button type="button" class="chip" data-sph="${esc(s.id)}">${ico(s.icon)}${esc(k.name)}</button></li>`).join("")}</ul>`;
})();

/* --- сферы и темы --- */
$("legend").innerHTML = W.map((w, i) => `<span><i class="L${i}"></i>${w}</span>`).join("");
const desktop = matchMedia("(min-width:760px)");
const order = [...S].sort((a, b) => b.share - a.share);
function mix(o) {
  const tot = TY.reduce((a, t) => a + (o.byType[t.id] || [0,0])[1], 0) || 1;
  const parts = TY.map(t => [t, (o.byType[t.id] || [0,0])]).filter(([, v]) => v[0]);
  return `<div class="mix" aria-hidden="true">${parts.map(([t, v]) => `<i style="flex:${v[1] || .5};background:${TCOL[t.id]}" title="${esc(t.name)}: ${v[0]}"></i>`).join("")}</div>
    <div class="mixk">${parts.map(([t, v]) => `<span><i style="background:${TCOL[t.id]}"></i>${esc(t.name.toLowerCase())} ${v[0]}</span>`).join("")}</div>`;
}
function topicHTML(t) {
  const f = val(t, "files"), w = val(t, "words"), lv = t.level;
  const have = t.have.map(h => `<li>${ico("file-text")}<span>${esc(h.label)}<code>${esc(h.path)} · ${kw(h.words)} сл. · ${dm(h.date)}</code></span></li>`).join("");
  const ser = t.series ? (() => { const mx = Math.max(...t.series.map(x => x[1]), 1);
    return `<div><h3>Внутри — по сериям</h3><div class="ser">${t.series.map(([n, c, ww]) => `<div><span>${esc(n)}</span><span class="n">${c} · ${kw(ww)}</span><span class="tr"><i style="width:${(100 * c / mx).toFixed(1)}%"></i></span></div>`).join("")}</div></div>`; })() : "";
  return `<li><details class="tp"><summary><span class="dot L${lv}" title="${W[lv]}"></span>
    <span class="tn"><b>${esc(t.name)}</b><small>${W[lv]}${t.gaps.length ? ` · <em>−${t.gaps.length} ${plural(t.gaps.length,"пробел","пробела","пробелов")}</em>` : ""}${t.research.length ? ` · ${t.research.length} иссл.` : ""}</small></span>
    <span class="tw"><b>${fmt(f)}</b>${kw(w)} сл.</span>${CHEV}</summary>
    <div class="tb">
      <p>${esc(t.why)}</p>
      <div class="facts"><span class="fact lv L${lv}">уровень ${LVT[lv]}</span><span class="fact">${fmt(t.files)} ${plural(t.files,"файл","файла","файлов")}</span><span class="fact">${kw(t.words)} слов</span>${t.last ? `<span class="fact">свежее ${dm(t.last)}</span>` : ""}</div>
      ${t.research.length ? `<div><h3>Исследования</h3><div class="rn" style="margin-top:5px">${t.research.map(r => `<span>№ ${esc(r)}</span>`).join("")}</div></div>` : ""}
      ${t.files ? `<div><h3>Из чего состоит</h3>${mix(t)}</div>` : ""}
      ${ser}
      ${have ? `<div><h3>Что имеем — главное</h3><ul class="hl">${have}</ul></div>` : ""}
      ${t.gaps.length ? `<div><h3>Чего не хватает</h3><ul class="hl" style="grid-template-columns:1fr">${t.gaps.map(g => `<li class="gap" style="display:grid"><span>${esc(g.text)}<span class="eff">${esc(g.effort)}</span></span>${g.next ? `<span class="nx">→ ${esc(g.next)}</span>` : ""}${g.who ? `<span class="wh">Кто поможет: ${esc(g.who)}</span>` : ""}</li>`).join("")}</ul></div>` : ""}
    </div></details></li>`;
}
function renderCards() {
  const openIds = new Set([...document.querySelectorAll(".sph.open")].map(e => e.id.slice(2)));
  const openTopics = new Set([...document.querySelectorAll(".tp[open]")].map(e => e.dataset.k));
  $("cards").innerHTML = order.map(s => {
    const lv = lvOf(s.level), gaps = s.topics.reduce((a, t) => a + t.gaps.length, 0);
    const f = val(s, "files"), w = val(s, "words");
    const open = openIds.has(s.id) || (!openIds.size && desktop.matches && s.share >= 20);
    const pv = s.prev && !type && s.prev.files !== s.files ? `<span title="было ${s.prev.files} файлов">было ${s.prev.files}</span>` : "";
    return `<article class="sph${open ? " open" : ""}" id="c-${esc(s.id)}">
    <button type="button" class="st" aria-expanded="${open}">
      <span class="sh"><span class="fi">${ico(s.icon)}</span><h2>${esc(s.name)}</h2><span class="lvl L${lv}">${W[lv]}</span></span>
      <span class="segs" aria-hidden="true">${s.topics.map(t => `<i class="L${t.level}" style="flex:1" title="${esc(t.name)}: ${W[t.level]}"></i>`).join("")}</span>
      <span class="sm"><span>${fmt(f)} ${plural(f,"файл","файла","файлов")}</span><span>${kw(w)} слов</span>${s.research.length ? `<span>${s.research.length} иссл.</span>` : ""}<span>${s.topics.length} ${plural(s.topics.length,"тема","темы","тем")}</span>${gaps ? `<span><b>−${gaps}</b></span>` : ""}<span title="вес для цели">${dots(s.weight)} ${s.share} %</span>${s.last ? `<span>свежее ${dm(s.last)}</span>` : ""}${pv}</span>
      <span class="more">${s.topics.length} ${plural(s.topics.length,"тема","темы","тем")} ${CHEV}</span>
    </button>
    <div class="sb">
      <ul class="tl">${s.topics.map(t => topicHTML(t).replace('<details class="tp"', `<details class="tp" data-k="${esc(s.id + "/" + t.id)}"${openTopics.has(s.id + "/" + t.id) ? " open" : ""}`)).join("")}</ul>
      <div><h3>Хранители — откуда знание</h3><div class="kpl" style="margin-top:6px">${s.keepers.map(k => `<span class="k-${esc(k.status)}">${ico(k.status === "ищем" ? "user" : "circle-check")}${esc(k.name)}${k.status === "ищем" ? " · ищем" : ""}</span>`).join("")}</div></div>
    </div></article>`;
  }).join("");
}
function renderAll() { renderSkew(); renderTypes(); renderCards(); }
renderAll();

$("types").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; type = b.dataset.t;
  try { localStorage.setItem("kb-type", type); } catch (er) {} renderAll(); });
document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; metric = b.dataset.m;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); renderSkew(); });
const openSph = id => { const el = $("c-" + id); if (!el) return; el.classList.add("open"); el.querySelector(".st").setAttribute("aria-expanded", "true");
  el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200); };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-sph]"); if (b) { openSph(b.dataset.sph); return; }
  const st = e.target.closest(".st"); if (st) { const a = st.closest(".sph"); st.setAttribute("aria-expanded", a.classList.toggle("open")); }
});

$("foot").innerHTML = `<details><summary>${ico("info")}Как читать и откуда цифры ${CHEV}</summary>
<p><b>Уровень темы</b> (цвет) — насколько знание готово служить цели, а не сколько его: 0 почти нет · 1 начато, из чужих источников · 2 в работе, пробовали сами · 3 освоено, пользуемся. Уровень сферы — средний по темам. Много файлов при низком уровне — возможно.</p>
<p><b>Вес для цели</b> — доля сферы в цели «${esc(M.goalShort)}», сумма 100 %. Синяя полоса — доля базы (слов или файлов), обведённая — вес. Где синяя длиннее в разы — накоплено сверх нужного цели; где короче — недобор.</p>
<p><b>Что дальше</b> — по одному пробелу из сферы: вес сферы × (3 − уровень темы) ÷ усилие (S — 1, M — 1,5, L — 2,5).</p>
<p>${esc(M.footer)} Сверка вручную на обзоре недели раз в 2 недели, следующая — ${dt(M.next)}.</p></details>`;
</script>
</body></html>
