<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пространство проектов</title>
<style>
/* Штаб-страница v1 — набор компонентов (2026-11-05). Телефон 390 px первым; светлая и тёмная тема токенами.
   Подключение: <link rel="stylesheet" href="/kit/shtab-kit.css"> + <script src="/kit/shtab-kit.js" defer>. Описание — library/kit/README.md */
:root{--bg:#F5F3EF;--surf:#FFFFFF;--surf2:#EEEBE5;--ink:#1A1714;--ink2:#5F5A53;--line:rgba(0,0,0,.1);--acc:#1F5FD1;--accbg:#E4ECFB;--good:#1E7F4E;--goodbg:#E3F3EA;--warn:#B4561A;--warnbg:#FBEBDD;--bad:#B3261E;--badbg:#FBE4E2;--star:#B8860B;--shadow:0 6px 20px rgba(30,20,10,.08);--r:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121110;--surf:#1D1B19;--surf2:#2A2724;--ink:#F3F0EA;--ink2:#ABA59C;--line:rgba(255,255,255,.12);--acc:#7FA8FF;--accbg:#1B2740;--good:#5CCB8D;--goodbg:#173326;--warn:#F0A066;--warnbg:#3A2616;--bad:#FF8A80;--badbg:#3E1B19;--star:#F2C14E;--shadow:0 6px 20px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#121110;--surf:#1D1B19;--surf2:#2A2724;--ink:#F3F0EA;--ink2:#ABA59C;--line:rgba(255,255,255,.12);--acc:#7FA8FF;--accbg:#1B2740;--good:#5CCB8D;--goodbg:#173326;--warn:#F0A066;--warnbg:#3A2616;--bad:#FF8A80;--badbg:#3E1B19;--star:#F2C14E;--shadow:0 6px 20px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-wrap:anywhere}
.sk-wrap{max-width:1000px;margin:0 auto;padding:20px 16px 110px}
.sk-wrap h1{font-size:26px;line-height:1.15;margin:4px 0 6px}
.sk-sub{color:var(--ink2);font-size:14px;margin:0 0 16px}
.sk-lbl{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
a{color:var(--acc)}
/* шапка: главное за 10 секунд */
.sk-hero{display:grid;gap:10px;grid-template-columns:1fr;margin:8px 0 12px}
@media(min-width:760px){.sk-hero{grid-template-columns:repeat(3,1fr)}}
.sk-kpi{background:var(--surf);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);border-left:6px solid var(--warn)}
.sk-kpi.good{border-left-color:var(--good)}.sk-kpi.bad{border-left-color:var(--bad)}.sk-kpi.acc{border-left-color:var(--acc)}
.sk-kpi .big{font-size:20px;font-weight:800;line-height:1.2;margin:2px 0 6px}.sk-kpi p{margin:0;color:var(--ink2);font-size:14px}
.sk-tiles{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px}.sk-tiles span{background:var(--surf2);border-radius:999px;padding:6px 12px;font-size:13px}.sk-tiles b{font-size:15px}
/* раздел-карточка со сворачиванием */
.sk-sec{background:var(--surf);border-radius:var(--r);box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.sk-sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:56px}
.sk-sec>summary::-webkit-details-marker{display:none}
.sk-sec>summary h2,.sk-sec>summary h3{margin:0;font-size:19px;line-height:1.2;flex:1;display:flex;gap:10px;align-items:center}
.sk-ic{font-size:26px;line-height:1;flex:none}
.sk-sec>summary::after{content:"▾";color:var(--ink2);font-size:18px;transition:transform .15s}
.sk-sec[open]>summary::after{transform:rotate(180deg)}
.sk-body{padding:0 16px 16px}
.sk-body>p{max-width:70ch}
/* карточка решения */
.sk-decision{border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0;background:var(--bg)}
.sk-decision.done{border-color:var(--good)}
.sk-decision>h3,.sk-decision>.sk-q{margin:0 0 4px;font-size:17px;line-height:1.25;font-weight:700}
.sk-decision .sk-hint{color:var(--ink2);font-size:13px;margin:0 0 8px}
.sk-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:8px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--surf);cursor:pointer;min-height:48px;-webkit-tap-highlight-color:transparent}
.sk-opt[aria-checked="true"]{border-color:var(--acc);background:var(--accbg)}
.sk-mark{flex:none;width:22px;height:22px;border:2px solid var(--ink2);border-radius:50%;margin-top:1px;display:grid;place-items:center;font-size:14px;line-height:1;color:transparent}
.sk-multi .sk-mark{border-radius:6px}
.sk-opt[aria-checked="true"] .sk-mark{background:var(--acc);border-color:var(--acc);color:#fff}
.sk-opt .sk-t{flex:1;min-width:0}.sk-opt .sk-t b{display:block;font-size:16px}.sk-opt .sk-t span{display:block;color:var(--ink2);font-size:14px}
.sk-opt .sk-t .sk-star,.sk-star{display:inline-block;font-size:12px;font-weight:700;background:var(--warnbg);color:var(--warn);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.sk-own,.sk-cmt textarea{width:100%;min-height:44px;font:inherit;font-size:16px;color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.sk-own:focus,.sk-cmt textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.sk-ownl{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
/* галерея с выбором */
.sk-filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.sk-filters button,.sk-btn{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-size:15px;min-height:44px;cursor:pointer}
.sk-filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sk-count{font-size:13px;color:var(--ink2);margin:0 0 8px}
.sk-gallery{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.sk-gallery{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sk-item{background:var(--surf);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;border:2px solid transparent}
.sk-item.top{border-color:var(--good)}.sk-item.dn{opacity:.55}
.sk-media{border:0;padding:0;background:#000;display:block;width:100%;cursor:zoom-in;color:#fff;text-decoration:none}
.sk-media img{display:block;width:100%;height:auto}
.sk-item audio,.sk-item video{width:100%;display:block}
.sk-link{display:flex;align-items:center;justify-content:center;gap:8px;min-height:80px;background:var(--surf2);color:var(--ink);text-decoration:none;font-weight:600}
.sk-ib{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1;font-size:13px}
.sk-ib .sk-it{font-size:14px;line-height:1.25;font-weight:700;margin:0}.sk-ib .sk-d{color:var(--ink2)}
.sk-vote{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.sk-vote button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);font-size:19px;cursor:pointer;color:var(--ink)}
.sk-vote button[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
.sk-vote .up[aria-pressed="true"]{background:var(--goodbg);border-color:var(--good)}.sk-vote .dn[aria-pressed="true"]{background:var(--badbg);border-color:var(--bad)}
.sk-vote .st[aria-pressed="true"]{background:var(--warnbg);border-color:var(--star)}
.sk-cmt{margin-top:4px}.sk-cmt summary{cursor:pointer;color:var(--acc);font-size:13px;min-height:32px;display:flex;align-items:center}
.sk-cmt textarea{font-size:16px;min-height:60px;margin-top:4px}
/* чек-лист */
.sk-check{list-style:none;margin:8px 0;padding:0}
.sk-check li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;border:1.5px solid var(--line);border-radius:12px;background:var(--surf);cursor:pointer;min-height:48px}
.sk-check li[aria-checked="true"]{border-color:var(--good);background:var(--goodbg)}
.sk-check li[aria-checked="true"] .sk-mark{background:var(--good);border-color:var(--good);color:#fff}
.sk-check .sk-mark{border-radius:6px}
/* подсказки по тапу */
.sk-tip{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}
.sk-pop{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35;box-shadow:var(--shadow)}
/* таймлайн */
.sk-timeline{list-style:none;margin:8px 0;padding:0 0 0 18px;border-left:3px solid var(--line)}
.sk-timeline li{position:relative;padding:0 0 14px 14px}
.sk-timeline li::before{content:"";position:absolute;left:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.sk-timeline li.done::before{background:var(--good)}.sk-timeline li.late::before{background:var(--bad)}
.sk-timeline time{display:block;font-size:12px;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
/* схема SVG */
.sk-diagram{margin:10px 0;background:var(--surf2);border-radius:14px;padding:8px;overflow-x:auto}
.sk-diagram svg{display:block;width:100%;height:auto;min-width:320px}
.sk-diagram figcaption{font-size:13px;color:var(--ink2);padding:6px 4px 0}
.sk-diagram .f-bg{fill:var(--surf)}.sk-diagram .f-acc{fill:var(--accbg);stroke:var(--acc)}.sk-diagram .f-good{fill:var(--goodbg);stroke:var(--good)}.sk-diagram .f-warn{fill:var(--warnbg);stroke:var(--warn)}
.sk-diagram text{fill:var(--ink);font:13px system-ui,sans-serif}.sk-diagram .ln{stroke:var(--ink2);fill:none;stroke-width:2}
/* обычные блоки: сравнение, слои */
.sk-cmp{display:grid;gap:8px;grid-template-columns:1fr;margin:8px 0}
@media(min-width:600px){.sk-cmp{grid-template-columns:1fr 1fr}}
.sk-cmp>div{background:var(--surf2);border-radius:12px;padding:10px 12px;font-size:14px}
.sk-tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--warnbg);color:var(--warn)}.sk-tag.keep{background:var(--goodbg);color:var(--good)}
.sk-note{font-size:14px;color:var(--ink2);margin:8px 0}
.sk-risk{color:var(--warn)}.sk-why{color:var(--good)}
.sk-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.sk-strip figure{margin:0;flex:none;width:120px}.sk-strip img{width:100%;display:block;border-radius:10px}.sk-strip figcaption{font-size:12px;color:var(--ink2)}
.sk-swatches{display:flex;gap:6px;margin:6px 0}.sk-swatches span{width:26px;height:26px;border-radius:8px;border:1px solid var(--line)}
/* отправка */
.sk-send{margin:24px 0;background:var(--surf);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:center}
.sk-send p{margin:0 0 10px}
.sk-go{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:17px;min-height:52px;padding:0 24px;cursor:pointer;width:100%;max-width:420px}
html[data-theme="dark"] .sk-go{color:#0B1220}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sk-go{color:#0B1220}}
.sk-go[disabled]{opacity:.5}
.sk-status{margin-top:10px;font-size:15px}.sk-status.ok{color:var(--good);font-weight:700}.sk-status.err{color:var(--bad)}
.sk-float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;border:0;border-radius:999px;background:var(--acc);color:#fff;font:inherit;font-weight:700;font-size:16px;min-height:52px;padding:0 20px;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sk-float{color:#0B1220}}
.sk-float[hidden]{display:none}
dialog.sk-dlg{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100%;height:100%}
dialog.sk-dlg::backdrop{background:rgba(0,0,0,.85)}
dialog.sk-dlg img{display:block;max-width:100%;max-height:100%;margin:auto;position:absolute;inset:0;object-fit:contain}
dialog.sk-dlg button{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;border:0;font-size:22px;background:var(--surf);color:var(--ink)}
.sk-foot{color:var(--ink2);font-size:13px;margin-top:24px}
</style>
<style>
/* Пространство проектов: оболочка поверх токенов kit (цвета только var(--…)) */
html,body{height:100%}
body{overflow-x:hidden}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surf);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;gap:10px;overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px;font-weight:800;font-size:16px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surf2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;font-weight:600;border-radius:9px;min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h6{margin:12px 8px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:16px;min-height:44px}
.nav a:hover{background:var(--surf2)}
.nav a[aria-current="page"]{background:var(--accbg);color:var(--acc);font-weight:700}
.nav a .cnt{margin-left:auto;font-size:12px;color:var(--ink2);background:var(--surf2);border-radius:999px;padding:1px 8px}
.nav a.sub{padding-left:22px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ink2)}
.dot.g{background:var(--good)}.dot.w{background:var(--warn)}.dot.b{background:var(--bad)}.dot.a{background:var(--acc)}
.svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
.asst{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.asst b{display:flex;align-items:center;gap:8px;font-size:14px}
.asst span{display:block;color:var(--ink2);font-size:14px;margin-top:3px}
.asst .pulse{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--goodbg)}
.theme{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;min-height:44px}
.theme:hover{background:var(--surf2)}
.main{min-width:0;padding:22px 28px 60px;max-width:1180px;width:100%}
.top{display:none}
.tabbar{display:none}
.scrim{display:none}
h1.t{font-size:26px;margin:0 0 4px;line-height:1.15}
.lead{color:var(--ink2);margin:0 0 18px;font-size:16px}
h2.h{font-size:16px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.card{background:var(--surf);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;border:1px solid transparent}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--goodbg);color:var(--goodt)}.pill.w{background:var(--warnbg);color:var(--warnt)}.pill.b{background:var(--badbg);color:var(--bad)}.pill.a{background:var(--accbg);color:var(--acc)}
:root{--warnt:#9A4612;--goodt:#17663F}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--warnt:var(--warn);--goodt:var(--good)}}
html[data-theme="dark"]{--warnt:var(--warn);--goodt:var(--good)}
/* сегодня к деньгам */
.money{display:grid;gap:10px}
.money ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.money li{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--bg);border-radius:12px;cursor:pointer}
.money li:hover{outline:2px solid var(--acc)}
.money .n{width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
html[data-theme="dark"] .money .n{color:#0B1220}
.money li b{display:block;font-size:16px}.money li span{color:var(--ink2);font-size:14px}
/* карточка проекта */
.pc{cursor:pointer;display:flex;flex-direction:column;gap:10px}
.pc:hover{border-color:var(--acc)}
.pc header{display:flex;align-items:center;gap:8px}
.pc header h3{margin:0;font-size:20px;flex:1}
.pc .row{font-size:14px}.pc .row small{display:block;font-size:12px;color:var(--ink2)}
.pc .wait{color:var(--ink);padding:2px 0;font-size:14px;display:flex;gap:8px;align-items:baseline}.pc .wait::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.bar{height:8px;border-radius:99px;background:var(--surf2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
/* цепочка */
.chain{display:grid;grid-template-columns:1fr 22px 1fr 22px 1fr;align-items:stretch;gap:0}
.chain .seg3{border-radius:10px;padding:8px 9px;font-size:12px;line-height:1.25;background:var(--surf2);border:1.5px solid var(--line);min-width:0}
.chain .seg3 b{display:block;font-size:12px;margin-bottom:2px}
.chain .seg3 .st{display:flex;gap:6px;align-items:center;margin-top:6px;color:var(--ink2)}
.chain .seg3.gap{background:var(--badbg);border-color:var(--bad);border-style:dashed}
.chain .lk{display:grid;place-items:center;color:var(--ink2);font-size:14px}
.chain .lk.cut{color:var(--bad);font-weight:800}
.cutm{color:var(--bad);font-weight:800;font-size:16px}
.mini{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}.mini span{display:inline-flex;gap:6px;align-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin:6px 0 0}
.legend span{display:inline-flex;gap:6px;align-items:center}
/* канбан */
.hdr{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hdr .goal{flex:1;min-width:260px}
.team{display:flex;gap:8px;flex-wrap:wrap}
.av{display:inline-flex;align-items:center;gap:8px;background:var(--surf2);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px}
.av i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;background:var(--accbg);color:var(--acc)}
.av em{font-style:normal;color:var(--ink2);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--surf2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h4{margin:2px 4px 4px;font-size:14px;display:flex;gap:8px;align-items:center}
.col h4 .cnt{margin-left:auto;color:var(--ink2);font-weight:500}
.tk{background:var(--surf);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:grid;gap:6px}

.lockrow td{background:var(--badbg)}
.lock{display:flex;gap:12px;align-items:center;background:var(--badbg);color:var(--bad);border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0}
.feed{display:grid;gap:8px}
.fi{display:flex;gap:10px;padding:10px 12px;background:var(--surf);border-radius:12px;font-size:14px;align-items:flex-start}
.fi time{font-size:12px;color:var(--ink2);flex:none;width:44px;padding-top:2px}
.fi.ask{background:var(--surf2)}
.btn{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;padding:5px 12px;font:inherit;font-size:14px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
html[data-theme="dark"] .btn.pri{color:#0B1220}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font:11px system-ui,sans-serif}
.chart .gl{stroke:var(--line)}
.sec{display:none}.sec.on{display:block}
.note{font-size:12px;color:var(--ink2);margin-top:22px;border-top:1px dashed var(--line);padding-top:10px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.cols2{grid-template-columns:1fr}}

 .top b{font-size:16px;flex:1}

 .main{padding:16px 16px 96px}
 .g2,.g3,.g4{grid-template-columns:1fr}
 .board{grid-template-columns:1fr}
 .li{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
 .li .c3,.li .c4{display:none}

 .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surf);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .tabbar a,.tabbar button{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12px;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;cursor:pointer}
 .tabbar [aria-current="page"]{color:var(--acc);font-weight:700}
 .chain{grid-template-columns:1fr}

}

function lineChart(vals,labels){
 var W=520,H=160,m=28,mx=Math.max.apply(null,vals)*1.15,st=(W-m*2)/(vals.length-1),pts=vals.map(function(v,i){return [m+i*st,H-24-(v/mx)*(H-44)]});
 var path=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
 var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="динамика">';
 for(var g=0;g<3;g++){var y=20+g*(H-44)/2;s+='<line class="gl" x1="'+m+'" x2="'+(W-m)+'" y1="'+y+'" y2="'+y+'"/>'}
 s+='<path d="'+path+'L'+pts[pts.length-1][0]+' '+(H-24)+'L'+m+' '+(H-24)+'Z" fill="var(--accbg)"/><path d="'+path+'" fill="none" stroke="var(--acc)" stroke-width="2.5"/>';
 pts.forEach(function(p,i){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="var(--acc)"/><text x="'+p[0]+'" y="'+(H-6)+'" text-anchor="middle">'+labels[i]+'</text>'});

function barChart(rows){
 var s='<svg class="chart" viewBox="0 0 520 '+(rows.length*34+8)+'" role="img" aria-label="столбцы">';
 rows.forEach(function(r,i){var y=6+i*34;s+='<text x="0" y="'+(y+17)+'">'+r[0]+'</text><rect x="130" y="'+y+'" width="360" height="22" rx="6" fill="var(--surf2)"/><rect x="130" y="'+y+'" width="'+(360*r[1]/100)+'" height="22" rx="6" fill="var(--'+r[2]+')"/><text x="'+(130+360*r[1]/100-8)+'" y="'+(y+16)+'" text-anchor="end" style="fill:#fff;font-weight:700">'+r[1]+'%</text>'});
 return s+'</svg>';
}

var mode='proj';
function buildNav(cur){
 var h='';
 if(mode==='proj'){
  NAV_P.forEach(function(n){
   h+='<a href="#'+n[0]+'" data-k="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'>'+ICO(n[1])+n[2]+(n[3]&&n[3]!==1?'<span class="cnt">'+n[3]+'</span>':'')+'</a>';
   if(n[0]==='projects'){PROJ.forEach(function(p){h+='<a class="sub" href="#'+p.id+'" data-k="'+p.id+'"'+(cur===p.id?' aria-current="page"':'')+'><i class="dot '+p.dot+'"></i>'+p.n+'</a>'})}
  });
 } else {
  h+='<h6>Только для меня</h6>';
  NAV_L.forEach(function(n,i){h+='<a href="#personal" data-k="p'+i+'"'+(i===0&&cur==='personal'?' aria-current="page"':'')+'>'+ICO(n[1])+n[2]+'</a>'});
 }

}
function route(){
 var k=(location.hash||'#overview').slice(1)||'overview';
 if(!SECT_TITLE[k])k='overview';
 mode=(k==='personal')?'pers':'proj';
 document.getElementById('mPers').setAttribute('aria-pressed',mode==='pers');
 document.getElementById('mProj').setAttribute('aria-pressed',mode==='proj');
 var m=document.getElementById('main');
 if(['kofe','sokol','ceh','ai'].indexOf(k)>=0)m.innerHTML=V.proj(k);
 else if(k==='assistant')m.innerHTML=V.assistant();
 else m.innerHTML=V[k]();
 document.getElementById('topT').textContent=SECT_TITLE[k];
 buildNav(k);
 var tabs=document.querySelectorAll('#tabbar [data-t]');
 tabs.forEach(function(a){a.removeAttribute('aria-current');if(a.getAttribute('data-t')===k)a.setAttribute('aria-current','page')});
 document.body.classList.remove('menu');window.scrollTo(0,0);
 if(k==='tasks')initTasks();
 if(['kofe','sokol','ceh','ai'].indexOf(k)>=0)initProj(k);
}
function initTasks(){
 var f='all',tl=document.getElementById('tl'),bs=document.querySelectorAll('#tf .chip');
 function draw(){var a=T.filter(function(t){return f==='all'||t.w===f});tl.innerHTML=listHTML(a)}
 bs.forEach(function(b){b.onclick=function(){f=b.getAttribute('data-f');bs.forEach(function(x){x.setAttribute('aria-pressed',x===b)});draw()}});draw();
}
function initProj(id){
 var bs=document.querySelectorAll('[data-view]'),pv=document.getElementById('pv');
 bs.forEach(function(b){b.onclick=function(){bs.forEach(function(x){x.setAttribute('aria-pressed',x===b)});pv.innerHTML=b.getAttribute('data-view')==='b'?board(id):listHTML(T.filter(function(t){return t.p===id}))}});
}
document.addEventListener('click',function(e){
 var g=e.target.closest('[data-go]');if(g){location.hash='#'+g.getAttribute('data-go');return}
});
document.getElementById('mPers').onclick=function(){location.hash='#personal'};
document.getElementById('mProj').onclick=function(){location.hash='#overview'};

document.getElementById('more').onclick=function(){document.body.classList.add('menu')};
document.getElementById('scrim').onclick=function(){document.body.classList.remove('menu')};
var th=0; // 0 авто, 1 светлая, 2 тёмная
function setTheme(){
 var el=document.documentElement,lab=['авто','светлая','тёмная'][th];
 if(th===0)el.removeAttribute('data-theme');else el.setAttribute('data-theme',th===1?'light':'dark');
 document.querySelector('#theme span').textContent='Тема: '+lab;
}
function cyc(){th=(th+1)%3;setTheme()}
document.getElementById('theme').onclick=cyc;document.getElementById('themeM').onclick=cyc;
(function(){var q=/[#&?]theme=(light|dark)/.exec(location.search+location.hash);})();
window.addEventListener('hashchange',route);
route();
