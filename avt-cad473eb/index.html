<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Автономия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Карта знаний v2 — универсальный шаблон. Порядок: за 10 секунд (пять строк + цифра + ход) → тепловая сетка зон → что дальше и куда двигаемся → карточки зон */
:root{
  --bg:#edf1ec; --surface:#f8faf7; --fg:#1b2620; --muted:#5d6b63; --line:#cfd8d1; --accent:#2c6a52; --warn:#9a5b12;
  --l0:#e2e7e3; --l0f:#4c5a52; --l1:#cfe6d6; --l1f:#1d4a33; --l2:#74b892; --l2f:#0f2a1c; --l3:#2c6a52; --l3f:#ffffff;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#18211c; --fg:#e2eae4; --muted:#9aa8a0; --line:#2b3831; --accent:#6cc39b; --warn:#e0a54a;
  --l0:#222c26; --l0f:#9aa8a0; --l1:#24432f; --l1f:#cfe8d8; --l2:#2f7350; --l2f:#f0faf4; --l3:#7fd1a5; --l3f:#0d1f15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#18211c; --fg:#e2eae4; --muted:#9aa8a0; --line:#2b3831; --accent:#6cc39b; --warn:#e0a54a;
  --l0:#222c26; --l0f:#9aa8a0; --l1:#24432f; --l1f:#cfe8d8; --l2:#2f7350; --l2f:#f0faf4; --l3:#7fd1a5; --l3f:#0d1f15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:26px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow,.lbl,h3{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:700 clamp(30px,8vw,52px)/1.05 var(--f-display);margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 19px/1.2 var(--f-display);margin:0}
.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
/* за 10 секунд */
.ten{display:grid;gap:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.big{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:.5em;color:var(--muted);font-weight:500}
.hero-l{display:grid;gap:6px}
.badge{display:inline-block;font:500 12px/1.3 var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--l1);color:var(--l1f)}
.five{display:grid;gap:10px;margin:0}
.five div{display:grid;grid-template-columns:7.2em 1fr;gap:10px;align-items:baseline}
.five dt{font:500 11px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.five dd{margin:0;font-size:15px;line-height:1.45}
.five .goal dd{font-weight:600}
.trend svg{display:block;width:100%;height:auto;overflow:visible}
.trend figcaption{font-size:12px;color:var(--muted)}
/* тепловая сетка */
.mapsec{display:grid;gap:12px}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:end}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.band{display:grid;gap:6px}
.tiles{display:grid;gap:6px;grid-template-columns:repeat(6,1fr)}
.tile{border:0;border-radius:8px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0}
.tile b{font:600 14px/1.2 var(--f-body);overflow-wrap:anywhere;hyphens:auto}
.tile .tm{display:flex;justify-content:space-between;gap:6px;font:500 12px/1 var(--f-mono);opacity:.9}
.w3 .tile{grid-column:span 3;min-height:96px}
.w3 .tile b{font-size:16px}
.w2 .tile{grid-column:span 2;min-height:80px}
.w1 .tile{grid-column:span 2;min-height:58px;padding:8px}
.w1 .tile b{font-size:13px}
.tile.dim{opacity:.35}
.L0{background:var(--l0);color:var(--l0f)} .L1{background:var(--l1);color:var(--l1f)} .L2{background:var(--l2);color:var(--l2f)} .L3{background:var(--l3);color:var(--l3f)}
/* что дальше и куда двигаемся */
.dec{display:grid;gap:14px}
.next ol{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:n}
.next li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:n}
.next li::before{content:counter(n);font:700 18px/1.2 var(--f-display);color:var(--accent)}
.next .t{font-weight:600}
.next .st{font-size:14px}
.why{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.dirs{display:grid;gap:8px;margin-top:10px}
.dir{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;background:var(--bg)}
.dir .dh{display:flex;justify-content:space-between;gap:8px;align-items:start}
.dir b{font-weight:600;line-height:1.3}
.dir p{margin:0;font-size:14px}
.dir .k{font:500 11px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.stat{font:500 11px/1.2 var(--f-mono);padding:4px 7px;border-radius:5px;white-space:nowrap;background:var(--l0);color:var(--l0f)}
.stat.s-выбрано{background:var(--l3);color:var(--l3f)} .stat.s-предлагаем{background:var(--l1);color:var(--l1f)} .stat.draft{background:transparent;border:1px dashed var(--warn);color:var(--warn);white-space:normal}
/* карточки зон */
.cards{display:grid;gap:10px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:12px}
.zone.flash{box-shadow:0 0 0 2px var(--accent)}
.zt{all:unset;box-sizing:border-box;width:100%;display:grid;gap:8px;padding:14px 16px;cursor:pointer}
.zt:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.zh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.zh h2{font:600 18px/1.25 var(--f-body)}
.lvl{font:500 12px/1 var(--f-mono);padding:5px 8px;border-radius:5px;white-space:nowrap}
.zm{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.up{color:var(--accent)} .down{color:var(--warn)}
.segs{display:flex;gap:2px;height:8px}
.segs i{flex:1;border-radius:2px;min-width:3px}
.more{font:500 12px/1 var(--f-mono);color:var(--accent)}
.zone.open .more{display:none}
.zb{display:none;padding:0 16px 16px;gap:14px}
.zone.open .zb{display:grid}
.zb ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.it{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px;line-height:1.4}
.it svg{width:18px;height:18px;margin-top:2px;color:var(--accent)}
.it small{display:block;color:var(--muted);font-size:12.5px}
.it .lv{font:500 11px/1 var(--f-mono);color:var(--muted)}
details summary{cursor:pointer;font-size:14px;color:var(--muted);min-height:32px;display:flex;align-items:center}
.gap{border-left:3px solid var(--warn);padding:2px 0 2px 10px;display:grid;gap:3px;font-size:15px}
.gap .nx{font-size:14px}
.gap .wh{font-size:12.5px;color:var(--muted)}
.eff{font:500 11px/1 var(--f-mono);padding:2px 5px;border:1px solid var(--line);border-radius:4px;margin-left:4px}
.src{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
footer{font-size:13px;color:var(--muted);display:grid;gap:6px;max-width:72ch}
footer p{margin:0}
@media (min-width:720px){
  .wrap{padding-top:32px;gap:32px}
  .ten{grid-template-columns:minmax(260px,1fr) 2fr;align-items:start}
  .tiles{grid-template-columns:repeat(12,1fr)}
  .w3 .tile{grid-column:span 4;min-height:110px} .w2 .tile{grid-column:span 3} .w1 .tile{grid-column:span 2}
  .dec{grid-template-columns:1fr 1fr;align-items:start}
  .cards{grid-template-columns:1fr 1fr;align-items:start}
}
@media (max-width:380px){.big{font-size:38px}}
@media (max-width:600px){.five div{grid-template-columns:1fr;gap:2px}}
@media (prefers-reduced-motion:no-preference){.zone{transition:box-shadow .3s}}
@media (forced-colors:active){.tile,.segs i{border:1px solid CanvasText}}
</style>

</div>

const M = D.meta, Z = D.zones;

/* --- график хода: освоено и всего пунктов, одна шкала --- */
(function chart(){
  const H = M.history || [], w = 320, h = 96, pl = 6, pr = 34, pt = 14, pb = 18;
  const max = Math.max(1, ...H.map(r => r.total));
  const x = i => H.length < 2 ? (pl + w - pr) / 2 : pl + i * (w - pl - pr) / (H.length - 1);
  const y = v => pt + (h - pt - pb) * (1 - v / max);
  const line = (k, st) => H.length > 1 ? `<polyline fill="none" ${st} points="${H.map((r,i)=>`${x(i)},${y(r[k])}`).join(" ")}"/>` : "";
  const last = H.length - 1, r = H[last] || {ok:0,total:0};
  let s = `<line x1="${pl}" x2="${w-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  s += line("total", `stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"`);
  s += line("ok", `stroke="var(--accent)" stroke-width="2"`);
  H.forEach((q,i) => { s += `<circle cx="${x(i)}" cy="${y(q.ok)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${dt(q.date)}: освоено ${q.ok} из ${q.total}, пробелов ${q.gaps}</title></circle>`; });
  if (H.length) {
    s += `<text x="${x(last)+8}" y="${y(r.ok)+4}" font-size="11" fill="var(--fg)" font-family="var(--f-mono)">${r.ok}</text>`;
    s += `<text x="${x(last)+8}" y="${y(r.total)+4}" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${r.total}</text>`;
    if (H.length > 1) s += `<text x="${x(0)}" y="${h-3}" font-size="10" fill="var(--muted)">${dt(H[0].date).slice(0,5)}</text>`;
    s += `<text x="${x(last)}" y="${h-3}" font-size="10" fill="var(--muted)" text-anchor="${H.length>1?"end":"middle"}">${dt(r.date).slice(0,5)}</text>`;
  }
  const c = $("chart"); c.setAttribute("viewBox", `0 0 ${w} ${h}`);
  c.setAttribute("aria-label", "Ход по снимкам: " + H.map(q => `${dt(q.date)} — ${q.ok} из ${q.total}`).join("; "));
  c.innerHTML = s;
  if (H.length < 2) c.hidden = true;  /* одна точка — пустой график, только подпись (Юлай: главное крупно) */
  $("chartcap").textContent = H.length > 1 ? "Ход по снимкам: сплошная — освоено, пунктир — всего пунктов на карте"
    : "Первый снимок — график хода появится со второго.";
})();

function stats(z) {

  return {it, ok: it.filter(i => i.level >= 2).length, n: it.length, lv: it.length ? lvOf(mean) : 0, mean};
}
function trend(z) {

}
