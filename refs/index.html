<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#111;--muted:#666;--acc:#2f6bff}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--ink);padding-bottom:90px}
h1{font-size:20px;margin:0;padding:16px 16px 4px}p{margin:0;padding:0 16px 8px;color:var(--muted);font-size:14px}
.g{columns:2 160px;gap:10px;padding:10px}
figure{break-inside:avoid;margin:0 0 10px;background:var(--card);border-radius:14px;overflow:hidden;position:relative;border:2px solid transparent}
figure.on{border-color:var(--acc)}
img{width:100%;display:block}
figcaption{position:absolute;top:8px;left:8px;background:#111;color:#fff;font-weight:700;border-radius:8px;padding:2px 9px}
.pick{display:flex;gap:6px;align-items:center;padding:8px 10px 0;font-size:14px}
textarea{width:calc(100% - 20px);margin:6px 10px 10px;border:1px solid #ddd;border-radius:8px;padding:6px;font:inherit;font-size:13px;min-height:34px;resize:vertical;box-sizing:border-box}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e5e5;padding:10px 16px;display:flex;gap:8px;align-items:center}
.bar button{flex:1;border:0;border-radius:12px;padding:12px;font:600 15px system-ui;background:var(--acc);color:#fff}
.bar .sec{background:#eee;color:#111;flex:0 0 auto}
#cnt{font-size:13px;color:var(--muted)}
</style></head><body>

<div class="bar"><span id="cnt">0</span><button class="sec" id="copy">Копировать</button><button id="send">Отправить боту</button></div>
<script>
const KEY='refs-shtab-v1';
const figs=[...document.querySelectorAll('figure')];
let st={}; try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function upd(){let n=0;figs.forEach(f=>{const s=st[f.dataset.n]||{};f.classList.toggle('on',!!s.on);if(s.on)n++});document.getElementById('cnt').textContent='выбрано: '+n}
figs.forEach(f=>{const n=f.dataset.n,cb=f.querySelector('input'),ta=f.querySelector('textarea');const s=st[n]||{};cb.checked=!!s.on;ta.value=s.c||'';
 cb.onchange=()=>{st[n]={...(st[n]||{}),on:cb.checked};save();upd()};ta.oninput=()=>{st[n]={...(st[n]||{}),c:ta.value};if(ta.value&&!cb.checked){cb.checked=true;st[n].on=true}save();upd()}});
upd();
function text(){const L=[];figs.forEach(f=>{const s=st[f.dataset.n];if(s&&(s.on||s.c))L.push(f.dataset.n+(s.on?' ✅':'')+(s.c?' — '+s.c.trim():''))});return 'Референсы Штаба:\n'+(L.join('\n')||'ничего не выбрано')}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text());alert('Скопировано — вставь в чат с ботом')}catch(e){prompt('Скопируй:',text())}};
document.getElementById('send').onclick=()=>{const u='https://t.me/airemeev_bot?text='+encodeURIComponent(text());const tg=window.Telegram&&Telegram.WebApp;if(tg&&tg.openTelegramLink){tg.openTelegramLink(u)}else{location.href=u}};
if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
</script></body></html>
