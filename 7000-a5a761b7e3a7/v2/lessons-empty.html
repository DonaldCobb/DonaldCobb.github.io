<style>
:root{
--bg:#F4F6FB;--surface:#FFFFFF;--surface-2:#E8ECF6;--text:#0B1230;--hint:#485372;--line:#D3DAEA;
--gold:#D6A530;--gold-ink:#1B1405;--gold-text:#7A5200;--sky:#1D5CA3;--sky-soft:#E1EBF8;
--sample-bg:#F6ECCF;--sample-ink:#5F4200;
/* шапка-небо: тёмная в обеих темах, как аватарка */
--hero-bg:#0A1022;--hero-glow:#1D4478;--hero-text:#F1F3FA;--hero-hint:#B4BED6;--hero-gold:#EBC05A;--hero-line:#33406A;
--hero-edge:transparent;--muted-bg:#E8ECF6;--muted-ink:#485372;
/* шрифты (Юлай msg 6562): всё без засечек — Onest; засечки только у слова-логотипа «7000+» в шапке */
--ui:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--serif:"PT Serif","Iowan Old Style",Georgia,serif;
/* четыре ступени кегля: подпись · текст · заголовок · время */
--fs-1:13px;--fs-2:16px;--fs-3:20px;--fs-4:48px;
--r-block:20px;--r-btn:14px;--gut:16px;--tap:48px;color-scheme:light;
--safe-t:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
--safe-b:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));}
@media (prefers-color-scheme:dark){:root:not([data-scheme="light"]){--bg:#070B18;--surface:#0F1730;--surface-2:#17224A;--text:#EEF1F9;--hint:#A5AFCB;--line:#2A3560;
--gold:#E6B94F;--gold-ink:#1B1405;--gold-text:#EBC05A;--sky:#7FB2EE;--sky-soft:#142447;
--sample-bg:#3A3015;--sample-ink:#F0D58A;--hero-edge:#34437A;--muted-bg:#17224A;--muted-ink:#A5AFCB;color-scheme:dark;}}
:root[data-scheme="dark"]{--bg:#070B18;--surface:#0F1730;--surface-2:#17224A;--text:#EEF1F9;--hint:#A5AFCB;--line:#2A3560;
--gold:#E6B94F;--gold-ink:#1B1405;--gold-text:#EBC05A;--sky:#7FB2EE;--sky-soft:#142447;
--sample-bg:#3A3015;--sample-ink:#F0D58A;--hero-edge:#34437A;--muted-bg:#17224A;--muted-ink:#A5AFCB;color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-2)/1.4 var(--ui);-webkit-font-smoothing:antialiased;
 -webkit-text-size-adjust:100%;overscroll-behavior:none}
a{color:inherit;text-decoration:none}
.app{height:100dvh;height:var(--tg-viewport-stable-height,100dvh);max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 var(--gut) 28px;-webkit-overflow-scrolling:touch}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
.top{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safe-t)) var(--gut) 10px;min-height:64px}
.mark{width:44px;height:44px;border-radius:13px;background:var(--hero-bg);display:grid;place-items:center;flex:none;
 box-shadow:inset 0 0 0 1px var(--hero-line)}
.mark svg{width:34px;height:34px}
.brand{flex:1;min-width:0}
.brand b{display:block;font:700 var(--fs-3)/1.15 var(--ui);letter-spacing:.01em}
.brand b.logo{font-family:var(--serif)}
.brand span{display:block;font-size:var(--fs-1);color:var(--hint);margin-top:2px}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:50%;border:1px solid var(--line);background:var(--surface);
 display:grid;place-items:center;position:relative;color:var(--text);flex:none}
.icon-btn .dot{position:absolute;top:11px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--sky);
 box-shadow:0 0 0 2px var(--surface)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 12px 0 6px;margin-left:-6px;border-radius:12px;
 font-weight:600;color:var(--sky)}
.sample{display:inline-block;margin:2px 0 14px;font-size:var(--fs-1);font-weight:600;padding:4px 10px;border-radius:8px;
 background:var(--muted-bg);color:var(--muted-ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:var(--r-btn);
 border:0;font-weight:700;font-size:var(--fs-2);width:100%}
.btn-gold{background:var(--gold);color:var(--gold-ink)}
.btn-line{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-wait{background:rgba(255,255,255,.06);color:var(--hero-hint);box-shadow:inset 0 0 0 1px var(--hero-line);justify-content:flex-start;
 padding:8px 18px;cursor:default}
.btn-wait .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.btn-wait small{font-size:var(--fs-1);font-weight:500}
h2.sec{font:700 var(--fs-3)/1.2 var(--ui);margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec small{font-size:var(--fs-1);font-weight:500;color:var(--hint)}
/* единственная тёмная карточка экрана; в тёмной теме — край 1 px */
.sky{position:relative;overflow:hidden;border-radius:24px;background-color:var(--hero-bg);color:var(--hero-text);
 box-shadow:inset 0 0 0 1px var(--hero-edge);
 background-image:
  radial-gradient(1.2px 1.2px at 18% 22%,#fff 60%,transparent 62%),
  radial-gradient(1px 1px at 72% 14%,#fff 60%,transparent 62%),
  radial-gradient(1.4px 1.4px at 88% 46%,#fff 60%,transparent 62%),
  radial-gradient(1px 1px at 38% 78%,#fff 60%,transparent 62%),
  radial-gradient(120% 90% at 100% 0%,var(--hero-glow) 0%,transparent 60%)}
.sky .hint{color:var(--hero-hint)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:var(--fs-1);font-weight:700;color:var(--hero-hint);letter-spacing:.02em}
.eyebrow svg{width:18px;height:18px}
.tag{display:inline-block;font-size:var(--fs-1);font-weight:700;line-height:1.2;padding:2px 8px;border-radius:999px;background:var(--sky-soft);color:var(--sky);white-space:nowrap}
.chips{display:flex;gap:8px;margin:12px calc(-1*var(--gut)) 0;padding:0 var(--gut);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:var(--surface-2);
 font-size:var(--fs-2);font-weight:600;color:var(--text);white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.bar{display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky)}
.list{border-radius:var(--r-block);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 14px}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--sky-soft);color:var(--sky);display:grid;place-items:center;flex:none}
.row .ic svg{width:22px;height:22px}
.row .tx{flex:1;min-width:0}
.row .tx b{font-weight:700}
.row .tx .m{display:block;font-size:var(--fs-1);color:var(--hint);margin-top:3px}
.row .go{color:var(--hint);display:flex;align-items:center;gap:2px;font-size:var(--fs-1);font-weight:700}
.row .go.lnk{color:var(--sky)}
.row .go svg{width:20px;height:20px}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);
 padding:6px 4px calc(6px + var(--safe-b))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border:0;background:none;
 font-size:var(--fs-1);font-weight:600;color:var(--hint);position:relative}
.tab svg.i{width:28px;height:28px}
.tab[aria-current="page"]{color:var(--text);font-weight:700}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--text)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.search{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-radius:16px;background:var(--surface);
 box-shadow:inset 0 0 0 1.5px var(--line)}
.search svg{width:24px;height:24px;color:var(--hint)}
.search span{font-size:var(--fs-2);color:var(--hint);flex:1}
.search.filled span{color:var(--text)}
.search .clr{width:44px;height:44px;margin-right:-12px;display:grid;place-items:center;color:var(--hint)}
.resume{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;margin-top:18px;padding:16px}
.resume .pl{width:56px;height:56px;border-radius:16px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.resume .pl svg{width:26px;height:26px;fill:currentColor;margin-left:3px}
.resume small{display:block;font-size:var(--fs-1);font-weight:700;color:var(--hero-hint)}
.resume b{display:block;line-height:1.25;margin-top:2px}
.resume .m{font-size:var(--fs-1);color:var(--hero-hint);margin-top:2px}
.resume .bar{background:var(--hero-line);margin-top:4px;grid-column:1/-1}
.resume .bar i{width:42%;background:var(--hero-text)}
.stat{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-1);color:var(--hint);margin-bottom:6px}
.stat b{font:700 var(--fs-3)/1 var(--ui);color:var(--text)}
.blocks .n{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font:700 var(--fs-3)/1 var(--ui);flex:none}
.blocks .n.done{background:var(--sky-soft);color:var(--sky)}
.blocks .n.done svg{width:22px;height:22px;stroke-width:3}
.blocks .lock .n{color:var(--hint)}

.empty{text-align:center;padding:36px 8px 8px}
.empty .big{width:72px;height:72px;border-radius:50%;background:var(--surface-2);color:var(--hint);display:grid;place-items:center;margin:0 auto}
.empty .big svg{width:34px;height:34px}
.empty h2{font:700 var(--fs-3)/1.25 var(--ui);margin-top:16px}
.empty p{color:var(--hint);margin:8px auto 0;max-width:30ch}
.empty .chips{justify-content:center;flex-wrap:wrap;margin:16px 0 0;padding:0}
.empty .btn{margin-top:22px}
</style>
</head>
