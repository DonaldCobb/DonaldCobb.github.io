<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Среда — путеводитель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===== Токены. Telegram задаёт --tg-theme-*; без него — свои значения ===== */
:root {
  --fb-bg: #ffffff;
  --fb-page: #f2f2ee;
  --fb-text: #1b1d17;
  --fb-hint: #64675c;
  --fb-sep: #e2e2db;
  --line: #85877d;         /* граница полей и чипов: ≥ 3:1 к фону */

  /* свой акцент: олива — «лоза» и «масло», не синий Telegram и не терракота */
  --olive: #4b5b22;
  --olive-ink: #ffffff;
  --olive-soft: #e7ebd8;   /* заливка — только у служений по записи */
  --olive-line: #c9d1ad;
  --sample-bg: #f4ecd6;
  --sample-ink: #6e5414;

  --bg: var(--tg-theme-bg-color, var(--fb-bg));
  --page: var(--tg-theme-secondary-bg-color, var(--fb-page));
  --section: var(--tg-theme-section-bg-color, var(--bg));
  --text: var(--tg-theme-text-color, var(--fb-text));
  --hint: var(--tg-theme-hint-color, var(--fb-hint));
  --sep: var(--tg-theme-section-separator-color, var(--fb-sep));

  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Manrope, Arial, sans-serif;
  --book: Georgia, "PT Serif", "Iowan Old Style", "DejaVu Serif", serif;

  /* шкала: четыре ступени */
  --fs-meta: 13px;
  --fs-body: 15px;
  --fs-title: 18px;
  --fs-display: 34px;

  --r-block: 16px;
  --r-btn: 12px;
  --gut: 16px;
  --tap: 44px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-scheme="light"]) {
    --fb-bg: #1c1d1a;
    --fb-page: #121310;
    --fb-text: #ecede6;
    --fb-hint: #9c9f94;
    --fb-sep: #2e302a;
    --line: #74776b;
    --olive: #b6c47a;
    --olive-ink: #192009;
    --olive-soft: #2a3119;
    --olive-line: #48532a;
    --sample-bg: #3a3218;
    --sample-ink: #e6cf8f;
    color-scheme: dark;
  }
}
:root[data-scheme="dark"] {
  --fb-bg: #1c1d1a;
  --fb-page: #121310;
  --fb-text: #ecede6;
  --fb-hint: #9c9f94;
  --fb-sep: #2e302a;
  --line: #74776b;
  --olive: #b6c47a;
  --olive-ink: #192009;
  --olive-soft: #2a3119;
  --olive-line: #48532a;
  --sample-bg: #3a3218;
  --sample-ink: #e6cf8f;
  color-scheme: dark;
}

/* ===== Основа ===== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font: 400 var(--fs-body)/1.45 var(--ui);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; padding: 0 0 24px; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--olive); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
[hidden] { display: none !important; }

.hint { color: var(--hint); }
.meta { font-size: var(--fs-meta); color: var(--hint); }
.display { font-size: var(--fs-display); line-height: 1.08; font-weight: 800; letter-spacing: -0.025em; }

/* Метка «пример» — чтобы скриншот не приняли за настоящие данные */
.sample {
  display: inline-block; vertical-align: 1px;
  font-size: var(--fs-meta); font-weight: 600; line-height: 1;
  padding: 3px 7px; border-radius: 6px; letter-spacing: 0;
  background: var(--sample-bg); color: var(--sample-ink);
}

/* Шапка внутренних экранов (в браузере; в Telegram назад — системной кнопкой) */
.topbar { display: flex; align-items: center; padding: 6px var(--gut) 0; min-height: 50px; }
.back {
  border: 0; background: none; padding: 0 8px 0 0; min-height: var(--tap);
  color: var(--olive); font-size: var(--fs-body); cursor: pointer;
}
.in-tg .topbar { display: none; }
.in-tg .inner-head { padding-top: 20px; }
.inner-head { padding: 8px var(--gut) 18px; }
.inner-head h1 { font-size: var(--fs-display); line-height: 1.08; font-weight: 800; letter-spacing: -0.025em; }
.inner-head p { margin-top: 8px; color: var(--hint); }

/* Группированный список — родной язык Telegram */
.group { background: var(--section); margin: 0 var(--gut) 16px; border-radius: var(--r-block); overflow: hidden; }
.group-title { margin: 8px calc(var(--gut) + 4px) 8px; font-size: var(--fs-meta); color: var(--hint); }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 16px; min-height: 56px; text-align: left;
  background: none; border: 0; text-decoration: none; cursor: pointer;
}
.row + .row { border-top: 1px solid var(--sep); }
.row-body { flex: 1; min-width: 0; }
.row-title { font-weight: 600; line-height: 1.3; }
.row-sub { color: var(--hint); line-height: 1.35; margin-top: 2px; }
.row .btn { min-height: var(--tap); padding: 0 14px; flex: none; }

/* Кнопки */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: var(--tap); padding: 0 18px; border-radius: var(--r-btn);
  font-size: var(--fs-body); font-weight: 600; text-decoration: none; cursor: pointer;
  border: 1.5px solid var(--olive); background: transparent; color: var(--olive);
}
.btn-main { background: var(--olive); color: var(--olive-ink); }
.btn-block { width: 100%; min-height: 52px; font-size: var(--fs-title); }

/* Главное действие: в Telegram — MainButton, в браузере — эта кнопка в потоке */
.main-fallback { padding: 20px var(--gut) 0; }

/* Карточка места */
.place { background: var(--section); margin: 0 var(--gut) 12px; border-radius: var(--r-block); padding: 16px; }
.place-kind { font-size: var(--fs-meta); color: var(--hint); }
.place h3 { font-size: var(--fs-title); line-height: 1.3; margin-top: 2px; }
.place p { margin-top: 6px; }
.place .entry { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.place .entry .meta { flex: 1; }
.place.first { box-shadow: inset 0 0 0 1.5px var(--olive-line); }
.place.first .lead { font-size: var(--fs-meta); font-weight: 600; color: var(--olive); margin-bottom: 4px; }

/* Поиск */
.search { position: relative; display: block; }
.search .icon { position: absolute; left: 12px; top: 13px; color: var(--hint); width: 22px; height: 22px; }
.search input { padding-left: 42px; }
.results .row-sub { font-size: var(--fs-meta); }
.empty { margin: 8px var(--gut) 16px; padding: 20px 16px; background: var(--section); border-radius: var(--r-block); }
.empty h2 { font-size: var(--fs-title); }
.empty p { margin: 6px 0 16px; color: var(--hint); }

/* Карта сфер (B — главная, A — второй уровень) */
.sphere { padding: 22px var(--gut) 0; scroll-margin-top: 140px; }
.sphere-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.sphere-head h2 { font-size: var(--fs-title); font-weight: 700; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { display: flex; flex-direction: column; gap: 4px; min-height: 92px; padding: 12px 14px; border-radius: 14px; background: var(--section); text-decoration: none; }
.tile b { line-height: 1.3; font-weight: 600; }
.tile .line { font-size: var(--fs-meta); color: var(--hint); line-height: 1.35; }
.tile.wide { grid-column: span 2; min-height: 64px; }
.tiles.ministry .tile.signup { background: var(--olive-soft); min-height: 112px; }
.tiles.ministry .tile .go { margin-top: auto; font-size: var(--fs-meta); font-weight: 700; color: var(--olive); }
.lands { display: flex; flex-wrap: wrap; gap: 2px 4px; background: var(--section); border-radius: 14px; padding: 10px 8px; }
.lands a { font-size: var(--fs-title); line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; text-decoration: none; padding: 0 8px; border-radius: 8px; min-height: var(--tap); display: inline-flex; align-items: center; }
.lands a:nth-child(3n+2) { color: var(--olive); }
.quiet-links { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 24px var(--gut) 0; }
.quiet-links a { min-height: var(--tap); display: inline-flex; align-items: center; color: var(--olive); font-weight: 600; text-decoration: none; }

/* Форма записи */
.form { padding: 0 var(--gut); display: flex; flex-direction: column; gap: 20px; }
.field label, .field .label { display: block; font-weight: 600; margin-bottom: 8px; }
.field .meta { margin-top: 6px; }
.input {
  width: 100%; min-height: 48px; padding: 12px 14px; border-radius: var(--r-btn);
  border: 1px solid var(--line); background: var(--section); color: var(--text); font: inherit;
}
textarea.input { min-height: 96px; resize: vertical; }
.input::placeholder { color: var(--hint); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: var(--tap); padding: 0 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--section);
}
/* «выбрано» — обводкой и галочкой, без оливковой заливки */
.chip[aria-pressed="true"] { border: 2px solid var(--olive); padding: 0 15px; font-weight: 600; }
.chip[aria-pressed="true"]::before { content: "✓"; color: var(--olive); margin-right: 6px; font-weight: 700; }

/* Экран «принято» */
.done { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; }
.done .mark { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--olive); display: grid; place-items: center; margin-bottom: 20px; }
.done .mark svg { stroke: var(--olive); }
.done h1 { font-size: var(--fs-display); line-height: 1.08; letter-spacing: -0.025em; }
.done .proto { margin-top: 10px; color: var(--sample-ink); background: var(--sample-bg); padding: 8px 12px; border-radius: 10px; align-self: flex-start; }
.done p.next { margin-top: 16px; color: var(--hint); max-width: 34ch; }
.done .actions { margin-top: 28px; }

/* Расписание */
.slot { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px 16px; align-items: baseline; }
.slot + .slot { border-top: 1px solid var(--sep); }
.slot time { font-size: var(--fs-title); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Свидетельство */
.story { background: var(--section); margin: 0 var(--gut) 12px; border-radius: var(--r-block); padding: 18px 16px; }
.story blockquote { margin: 0; font-family: var(--book); font-size: var(--fs-title); line-height: 1.5; }
.story .meta { margin-top: 10px; }

/* Подвал варианта */
.variant-foot { margin-top: auto; padding: 16px var(--gut) 0; text-align: center; font-size: var(--fs-meta); color: var(--hint); }
.variant-foot a { color: var(--hint); display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 4px; }

.icon { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }


/* ===== Вариант A — путеводитель: один вопрос крупно, ответы списком ===== */
.screen-home { background: var(--section); }
.brand { padding: 20px var(--gut) 0; display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: var(--fs-body); }
.question { padding: 32px var(--gut) 0; }
.question h1 { max-width: 9em; }
.question p { margin-top: 12px; color: var(--hint); }
.question .search { margin-top: 18px; }
.question .search input { background: var(--page); border-color: transparent; }
#a-found { padding-top: 16px; }
#a-found .group, #a-found .empty { background: var(--page); }

.needs { list-style: none; margin: 16px 0 0; padding: 0 var(--gut); }
.needs li + li { border-top: 1px solid var(--sep); }
.need { display: flex; align-items: center; gap: 14px; padding: 12px 0; min-height: 68px; text-decoration: none; }
.need .ic { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--olive-line); color: var(--olive); display: grid; place-items: center; flex: none; }
.need .t { display: block; font-size: var(--fs-title); font-weight: 650; line-height: 1.25; }
.need .s { display: block; color: var(--hint); line-height: 1.3; margin-top: 1px; }
.need:active .t { color: var(--olive); }
.need.all .ic { border-style: dashed; }

.newbie { margin: 20px var(--gut) 0; }
.newbie a { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-radius: var(--r-btn); background: var(--page); text-decoration: none; }
.newbie a span { flex: 1; }
.newbie a b { color: var(--olive); }

.more { margin: 24px 0 0; }
.more .group { background: var(--page); }

/* подборка: другая нужда — без возврата назад */
.switch { display: flex; gap: 8px; overflow-x: auto; padding: 0 var(--gut) 16px; scrollbar-width: none; }
.switch::-webkit-scrollbar { display: none; }
.switch a { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--section); text-decoration: none; }
.switch a .icon { width: 20px; height: 20px; color: var(--olive); }
.switch a[aria-current="true"] { border: 2px solid var(--olive); padding: 0 13px 0 9px; font-weight: 600; }
.pick-head { padding: 8px var(--gut) 14px; }
.pick-head h1 { font-size: var(--fs-display); line-height: 1.08; font-weight: 800; letter-spacing: -0.025em; }
.pick-head p { margin-top: 8px; color: var(--hint); }
.in-tg .switch { padding-top: 16px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const VARIANT = 'A';
/* ===== Данные — константа, придуманное помечено «пример» ===== */
const SPHERES = [
  { id: 'people', name: 'Группы по людям', short: 'Люди' },
  { id: 'land', name: 'Территории', short: 'Территории' },
  { id: 'ministry', name: 'Служения по записи', short: 'Служения' },
  { id: 'care', name: 'Общение и поддержка', short: 'Общение' },
  { id: 'records', name: 'Записи эфиров', short: 'Записи' },
  { id: 'info', name: 'Вход и новости', short: 'Вход' },
  { id: 'study', name: 'Учёба', short: 'Учёба' },
];
const SPHERE_BY_ID = Object.fromEntries(SPHERES.map(s => [s.id, s]));

/* entry: signup — запись к служению; join — группа, вход по заявке; open — канал */
const PLACES = [
  { id: 'school', sphere: 'study', name: 'Школа «Апостольско-пророческая культура»', short: 'Школа', kind: 'Школа', entry: 'join',
    line: 'Модули и эфиры школы', about: 'Учебные модули и эфиры школы. Для тех, кто хочет расти системно, а не урывками.' },
  { id: 'library', sphere: 'study', name: 'Небесная библиотека', short: 'Небесная библиотека', kind: 'Канал', entry: 'open',
    line: 'Материалы для чтения в своём темпе', about: 'Материалы для самостоятельного изучения в своём темпе.' },

  { id: 'new-heart', sphere: 'ministry', name: '«Новое сердце»', short: 'Душепопечение', kind: 'Душепопечение', entry: 'signup',
    line: 'Беседа и молитва с душепопечителем', about: 'Личная беседа и молитва с душепопечителем — о том, что болит и не отпускает.' },
  { id: 'prophetic-table', sphere: 'ministry', name: '«Пророческий стол»', short: 'Пророческий стол', kind: 'Служение по записи', entry: 'signup',
    line: 'Слово, ободрение, молитва', about: 'Слово, ободрение и молитва о вас.' },
  { id: 'deliverance', sphere: 'ministry', name: 'Служение освобождения', short: 'Освобождение', kind: 'Служение по записи', entry: 'signup',
    line: 'В назначенное время', about: 'Служение по предварительной записи, в назначенное время.' },
  { id: 'dreams', sphere: 'ministry', name: '«Библейское толкование снов»', short: 'Толкование снов', kind: 'Служение по записи', entry: 'signup',
    line: 'По Писанию, символическая плата', about: 'Разбор сна или видения по Писанию. За символическую плату.' },
  { id: 'dreams-abc', sphere: 'ministry', name: '«Азбука снов и видений»', short: 'Азбука снов', kind: 'Группа', entry: 'join',
    line: 'Учимся понимать сны и видения', about: 'Учимся понимать язык снов и видений вместе.' },

  { id: 'women', sphere: 'people', name: 'Женщина влияния', short: 'Женщина влияния', kind: 'Группа', entry: 'join',
    line: 'Общение, молитва и эфиры', about: 'Сообщество женщин: общение, молитва, эфиры.' },
  { id: 'men', sphere: 'people', name: 'Муж в Боге', short: 'Муж в Боге', kind: 'Группа', entry: 'join',
    line: 'Семья, ответственность, служение', about: 'Мужская группа: ответственность, семья, служение.' },
  { id: 'youth', sphere: 'people', name: 'Молодёжь', short: 'Молодёжь', kind: 'Группа', entry: 'join',
    line: 'Молодёжное сообщество', about: 'Молодёжное сообщество платформы.' },
  { id: 'kids', sphere: 'people', name: 'Детский канал', short: 'Детский канал', kind: 'Канал', entry: 'open',
    line: 'Для детей и их родителей', about: 'Материалы для детей и для родителей, которые занимаются с ними.' },

  { id: 'shield', sphere: 'care', name: '«Молитвенный щит»', short: 'Молитвенный щит', kind: 'Группа', entry: 'join',
    line: 'Сюда приносят молитвенные нужды', about: 'Сюда приносят молитвенные нужды — за вас будут молиться вместе.' },
  { id: 'besedka', sphere: 'care', name: 'Беседка', short: 'Беседка', kind: 'Группа', entry: 'join',
    line: 'Общение и свидетельства', about: 'Общение и свидетельства. Место, где можно просто быть с людьми.' },
  { id: 'stories', sphere: 'care', name: 'Свидетельства', short: 'Свидетельства', kind: 'Канал', entry: 'open',
    line: 'Истории участников', about: 'Истории участников о том, что Бог сделал в их жизни.' },

  { id: 'prophecies', sphere: 'records', name: 'Пророчества с эфиров', short: 'Пророчества с эфиров', kind: 'Канал', entry: 'open',
    line: 'Аудио личных пророчеств', about: 'Аудио личных пророчеств, сказанных на эфирах.' },
  { id: 'tech', sphere: 'records', name: 'Записи эфиров', short: 'Записи эфиров', kind: 'Канал', entry: 'open',
    line: 'Полные записи и нарезки', about: 'Полные записи эфиров и короткие нарезки.' },

  { id: 'contact', sphere: 'info', name: 'Контакт для новеньких', short: 'Для новеньких', kind: 'Группа', entry: 'join',
    line: 'Помогут найти своё место', about: 'Подключение новых участников: помогут, если не нашли своё место здесь.' },
  { id: 'portal', sphere: 'info', name: 'Конференции по странам', short: 'Конференции', kind: 'Канал', entry: 'open',
    line: 'Анонсы конференций', about: 'Анонсы конференций в разных странах.' },
  { id: 'youtube', sphere: 'info', name: 'Видео на YouTube', short: 'YouTube', kind: 'Видео', entry: 'open',
    line: 'Открытые эфиры и проповеди', about: 'Открытые эфиры и проповеди.' },
  { id: 'news', sphere: 'info', name: 'Канал платформы', short: 'Новости', kind: 'Канал', entry: 'open',
    line: 'Главные новости и анонсы', about: 'Главные новости и анонсы.' },
];

const LANDS = ['Россия', 'ПФО и Урал', 'Сибирь', 'ЮФО и Кавказ', 'Беларусь', 'Украина', 'Латвия', 'Литва', 'Германия', 'Англия', 'Европа', 'Америка'];

/* ===== Telegram ===== */
const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.initData);
function applyTgScheme() {
  if (!IN_TG) return;
  document.documentElement.dataset.scheme = TG.colorScheme === 'dark' ? 'dark' : 'light';
}
if (TG) {
  try { TG.ready(); TG.expand(); } catch (e) {}
  if (IN_TG) {
    document.documentElement.classList.add('in-tg');
    applyTgScheme();
    TG.onEvent('themeChanged', () => { applyTgScheme(); setMain(current.main); });
    TG.BackButton.onClick(() => goBack());
  }
}

/* Главное действие экрана: в Telegram — нативная MainButton, в браузере — кнопка в потоке */
let mainHandler = null;
function setMain(m) {
  if (!IN_TG) return;
  const mb = TG.MainButton;
  if (mainHandler) { mb.offClick(mainHandler); mainHandler = null; }
  if (!m) { mb.hide(); return; }
  const cs = getComputedStyle(document.documentElement);
  mb.setParams({ text: m.text, color: cs.getPropertyValue('--olive').trim(), text_color: cs.getPropertyValue('--olive-ink').trim(), is_visible: true });
  mainHandler = m.fn;
  mb.onClick(mainHandler);
}

/* ===== Навигация по hash ===== */
const ROUTES = {};
let current = { parent: null };
function go(path) { location.hash = path; }
function goBack() { go(current.parent || '#/'); }

function render() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const name = ROUTES[parts[0]] ? parts[0] : 'home';
  current = ROUTES[name](...parts.slice(1)) || {};
  const fallback = current.main && !IN_TG ? `<div class="main-fallback"><button type="button" class="btn btn-main btn-block" id="main-fallback">${esc(current.main.text)}</button></div>` : '';
  const app = document.getElementById('app');
  app.innerHTML = `<main class="screen screen-${name}">${current.html}${fallback}${foot()}</main>`;
  if (fallback) document.getElementById('main-fallback').addEventListener('click', current.main.fn);
  setMain(current.main);
  if (IN_TG) { current.parent ? TG.BackButton.show() : TG.BackButton.hide(); }
  window.scrollTo(0, 0);
  if (current.after) current.after(app);
}
window.addEventListener('hashchange', render);
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const group = chip.closest('.chips');
  const single = group && group.dataset.single !== undefined;
  if (single) group.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
  chip.setAttribute('aria-pressed', single ? 'true' : String(chip.getAttribute('aria-pressed') !== 'true'));
  if (TG && TG.HapticFeedback) try { TG.HapticFeedback.selectionChanged(); } catch (e) {}
});

function topbar(label = 'Назад') {

function foot() {
  return `<footer class="variant-foot">Вариант ${VARIANT} · <a href="index.html">← все варианты</a></footer>`;

function entryAction(p, main) {
  const cls = main ? 'btn btn-main' : 'btn';
  if (p.entry === 'signup') return `<a class="${cls}" href="#/form/${p.id}">Записаться</a>`;
  if (p.entry === 'join') return `<a class="${cls}" href="#/done/join/${p.id}">Войти</a>`;
  return `<a class="${cls}" href="#/done/open/${p.id}">Открыть</a>`;
}
function entryNote(p) {
  if (p.entry === 'signup') return 'Короткая форма, без лички';
  if (p.entry === 'join') return 'Вход по заявке в один шаг';
  return 'Открытый канал';
}
function placeCard(p, first) {
  return `<article class="place${first ? ' first' : ''}">
    ${first ? '<div class="lead">Начните с этого</div>' : `<div class="place-kind">${esc(p.kind)}</div>`}

    <p>${esc(p.about)}</p>
    <div class="entry"><span class="meta">${entryNote(p)}</span>${entryAction(p, first)}</div>
  </article>`;
}
const placeHref = p => p.entry === 'signup' ? '#/form/' + p.id : '#/place/' + p.id;
const kindLabel = p => p.entry === 'signup' ? 'по записи' : p.kind === 'Группа' ? 'группа' : p.kind.toLowerCase();

/* Поиск по названию: прячет блок allId и показывает найденное в foundId */
function searchField(allId, foundId) {
  return `<label class="search"><span class="visually-hidden">Поиск</span>${icon('search')}<input class="input" type="search" placeholder="Группа, служение или страна" oninput="filterPlaces(this.value, '${allId}', '${foundId}')"></label>`;
}
function filterPlaces(q, allId, foundId) {
  q = q.trim().toLowerCase();
  const all = document.getElementById(allId), found = document.getElementById(foundId);
  if (!q) { all.hidden = false; found.hidden = true; return; }
  const hits = PLACES.filter(p => (p.name + ' ' + p.short + ' ' + p.kind + ' ' + p.about + ' ' + SPHERE_BY_ID[p.sphere].name).toLowerCase().includes(q));
  all.hidden = true; found.hidden = false;
  found.innerHTML = hits.length
    ? `<div class="group-title">Нашлось: ${hits.length}</div><div class="group results">${hits.map(p => `<a class="row" href="${placeHref(p)}"><div class="row-body"><div class="row-title">${esc(p.name)}</div><div class="row-sub">${SPHERE_BY_ID[p.sphere].name}, ${kindLabel(p)}</div></div></a>`).join('')}</div>`
    : `<div class="empty"><h2>По «${esc(q)}» ничего нет</h2><p>Попробуйте «сны», «молитва» или название страны. Или спросите людей — они знают всё.</p><a class="btn btn-main btn-block" href="#/place/contact">Спросить в «Контакт для новеньких»</a></div>`;
}

/* Карта всех сфер */
function sphereBlock(s) {
  const list = PLACES.filter(p => p.sphere === s.id);
  const tile = (p, wide) => `<a class="tile${wide ? ' wide' : ''}" href="${placeHref(p)}"><b>${esc(p.name)}</b><span class="line">${esc(p.line)}</span></a>`;
  let body;
  if (s.id === 'land') body = `<div class="lands">${list.map(p => `<a href="#/place/${p.id}">${p.name}</a>`).join('')}</div>`;
  else if (s.id === 'ministry') body = `<div class="tiles ministry">${list.filter(p => p.entry === 'signup').map(p => `<a class="tile signup" href="#/form/${p.id}"><b>${esc(p.short)}</b><span class="line">${esc(p.line)}</span><span class="go">Записаться</span></a>`).join('')}
      ${list.filter(p => p.entry !== 'signup').map(p => tile(p, true)).join('')}</div>`;
  else body = `<div class="tiles">${list.map((p, i) => tile(p, list.length % 2 && i === list.length - 1)).join('')}</div>`;
  return `<section class="sphere" id="s-${s.id}"><div class="sphere-head"><h2>${s.name}</h2><span class="meta">${list.length}</span></div>${body}</section>`;
}
function mapHTML() { return SPHERES.map(sphereBlock).join(''); }

    : needPlaces(n).map((p, i) => placeCard(p, i === 0)).join('');
  return { parent: '#/', html: `${topbar()}
    <nav class="switch" aria-label="Что вам нужно">${NEEDS.map(x => `<a href="#/need/${x.id}" aria-current="${x === n}">${icon(x.icon)}${x.title}</a>`).join('')}</nav>
    <div class="pick-head"><h1>${n.title}</h1><p>${lead}</p></div>
    ${list}`,
    after: app => { const cur = app.querySelector('.switch [aria-current="true"]'); if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest' }); window.scrollTo(0, 0); } };
};

start();
</script>
</body>
</html>
