<!doctype html>
<html lang="ru" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1620">
<title>Среда</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* =====================================================================
   ЦВЕТ БРЕНДА — заменить по картинке Юлая (меняется только этот блок)
   Сейчас: логотип «Ускорение в Боге» — ночное море. Тёмная тема основная,
   светлая — запасная с тем же синим акцентом.
   ===================================================================== */
:root {
  /* тёмная «ночное море» — по умолчанию */
  --outside: #060e15;        /* фон вокруг колонки на десктопе */
  --page: #0a1620;           /* фон экрана, почти чёрный синий */
  --surface: #0f2a3d;        /* карточки, списки */
  --surface-2: #133650;      /* шапка-волна, нажатое */
  --sep: #1d4260;            /* разделители внутри списков */
  --line: #4f7591;           /* границы полей и чипов, ≥ 3:1 к фону */
  --text: #eef4f8;           /* основной текст и иконки — почти белый */
  --hint: #93a9ba;           /* второстепенный — серо-голубой */
  --brand: #5cb3ea;          /* акцент: текст, иконки, активная вкладка */
  --brand-fill: #2a7ab0;     /* заливка главной кнопки (белый текст 4.8:1) */
  --brand-ink: #ffffff;      /* текст на заливке */
  --brand-soft: #123d5a;     /* мягкая подложка: служения, плашка вкладки */
  --wave: #3a9bd8;           /* линии волн в шапке */
  --tabbar: #0b1b28;         /* нижнее меню */
  --sample-bg: #3a3218;      /* метка «пример» */
  --sample-ink: #e6cf8f;
  --toast-bg: #eef4f8;
  --toast-ink: #0a1620;
  --sea-text: #eef4f8;       /* текст на шапке-волне (в обеих темах) */
  --sea-hint: #b9cddb;
  color-scheme: dark;
}
:root[data-scheme="light"] {
  --outside: #dfe7ee;
  --page: #eef3f7;
  --surface: #ffffff;
  --surface-2: #0f2a3d;      /* шапка-волна остаётся морской и в светлой */
  --sep: #dbe4eb;
  --line: #7d93a5;
  --text: #0b1d2b;
  --hint: #4f6577;
  --brand: #1f6fa6;
  --brand-fill: #1f6fa6;
  --brand-ink: #ffffff;
  --brand-soft: #dceaf5;
  --wave: #3a9bd8;
  --tabbar: #ffffff;
  --sample-bg: #f4ecd6;
  --sample-ink: #6e5414;
  --toast-bg: #0b1d2b;
  --toast-ink: #eef4f8;
  color-scheme: light;
}
/* ===================== конец блока цвета бренда ===================== */

:root {
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --book: Georgia, "PT Serif", "Iowan Old Style", serif;
  --fs-meta: 13px;
  --fs-body: 15px;
  --fs-title: 17px;
  --fs-h1: 28px;
  --r: 16px;
  --r-sm: 12px;
  --gut: 16px;
  --tap: 44px;
  --tab-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--outside); color: var(--text);
  font: 400 var(--fs-body)/1.45 var(--ui); -webkit-font-smoothing: antialiased;
  overflow: hidden; overscroll-behavior: none;
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.hint { color: var(--hint); }

/* ===== Каркас приложения: экран прокручивается, меню стоит ===== */
#app {
  position: relative; max-width: 480px; margin: 0 auto;
  height: 100vh; height: 100dvh; height: var(--tg-viewport-stable-height, 100dvh);
  display: flex; flex-direction: column; background: var(--page); overflow: hidden;
}
.view { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
.view.enter { animation: enter .18s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

.icon { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 20px; height: 20px; }

/* ===== Нижнее меню ===== */
.tabbar {
  flex: none; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--tabbar); border-top: 1px solid var(--sep);
  padding: 4px 4px calc(4px + var(--safe-b));
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: var(--tab-h); color: var(--hint); font-size: 12px; font-weight: 500;
}
.tab .pill { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; transition: background .15s; }
.tab[aria-current="page"] { color: var(--brand); font-weight: 650; }
.tab[aria-current="page"] .pill { background: var(--brand-soft); }

/* ===== Шапки экранов ===== */
.head { padding: 18px var(--gut) 12px; }
.head h1 { font-size: var(--fs-h1); line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
.head p { margin-top: 6px; color: var(--hint); }

/* Шапка «Сфер» — единственное громкое место: волны ночного моря */
.sea { position: relative; background: var(--surface-2); color: var(--sea-text); padding: 22px var(--gut) 20px; overflow: hidden; }
.sea .waves { position: absolute; left: 0; right: 0; bottom: -2px; width: 100%; height: 70px; color: var(--wave); }
.sea .waves path { fill: none; stroke: currentColor; stroke-width: 1.5; }
.sea h1 { position: relative; font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
.sea p { position: relative; margin-top: 8px; color: var(--sea-hint); max-width: 30ch; }

/* Шапка вложенного экрана */
.bar {
  position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 4px;
  min-height: 52px; padding: 4px 8px; background: var(--page);
}
.bar .back { display: inline-flex; align-items: center; gap: 2px; min-height: var(--tap); min-width: var(--tap); padding: 0 10px 0 4px; color: var(--brand); font-weight: 600; border-radius: 10px; }
.bar .title { font-weight: 650; font-size: var(--fs-title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.in-tg .bar .back { display: none; }
.in-tg .bar { padding-left: var(--gut); }

/* ===== Поиск и разделы ===== */
.searchbar { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 12px var(--gut) 4px; }
.search { position: relative; display: block; }
.search .icon { position: absolute; left: 12px; top: 12px; color: var(--hint); width: 20px; height: 20px; }
.input {
  width: 100%; min-height: 46px; padding: 11px 14px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit;
}
.search .input { padding-left: 40px; }
.input::placeholder { color: var(--hint); }
textarea.input { min-height: 92px; resize: vertical; }
.jump { display: flex; gap: 6px; overflow-x: auto; padding: 10px var(--gut) 6px; margin: 0 calc(-1 * var(--gut)); scrollbar-width: none; }
.jump::-webkit-scrollbar { display: none; }
.jump a { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--surface); color: var(--text); font-size: var(--fs-meta); font-weight: 600; }
.jump a .icon { width: 18px; height: 18px; color: var(--brand); }

/* ===== Разделы сфер ===== */
.sphere { padding: 20px var(--gut) 0; scroll-margin-top: 112px; }
.sphere-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.badge { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--brand-soft); color: var(--brand); flex: none; }
.badge .icon { width: 20px; height: 20px; }
.sphere-head h2 { flex: 1; font-size: var(--fs-title); font-weight: 700; }
.count { font-size: var(--fs-meta); color: var(--hint); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; gap: 4px; min-height: 96px; padding: 12px 40px 12px 14px; border-radius: 14px; background: var(--surface); }
.tile.wide { grid-column: span 2; min-height: 64px; }
.tile.signup { background: var(--brand-soft); }
.tile b { line-height: 1.3; font-weight: 650; }
.tile .line { font-size: var(--fs-meta); color: var(--hint); line-height: 1.35; }
.tile .go { margin-top: auto; padding-top: 6px; font-size: var(--fs-meta); font-weight: 700; color: var(--brand); }
.tile > a.cover { position: absolute; inset: 0; border-radius: inherit; }
.star { position: absolute; top: 2px; right: 2px; z-index: 1; display: grid; place-items: center; width: var(--tap); height: var(--tap); color: var(--hint); border-radius: 12px; }
.star .icon { width: 20px; height: 20px; }
.star[aria-pressed="true"] { color: var(--brand); }
.star[aria-pressed="true"] .icon { fill: currentColor; }

.lands { display: flex; flex-wrap: wrap; gap: 6px; }
.lands a { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 14px; border-radius: 999px; background: var(--surface); font-weight: 600; }

/* ===== Списки (группированные, язык Telegram) ===== */
.group { background: var(--surface); margin: 0 var(--gut) 16px; border-radius: var(--r); overflow: hidden; }
.group-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 20px calc(var(--gut) + 4px) 8px; font-size: var(--fs-meta); font-weight: 600; color: var(--hint); }
.group-title a { color: var(--brand); min-height: var(--tap); display: inline-flex; align-items: center; margin: -12px 0; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 10px 14px; text-align: left; }
.row + .row { border-top: 1px solid var(--sep); }
.row > .icon { color: var(--brand); }
.row-body { flex: 1; min-width: 0; }
.row-title { font-weight: 600; line-height: 1.3; }
.row-sub { color: var(--hint); line-height: 1.35; margin-top: 2px; font-size: 14px; }
.row .chev { color: var(--hint); width: 18px; height: 18px; }
.status { flex: none; font-size: 12px; font-weight: 650; padding: 4px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
.status.wait { background: var(--sample-bg); color: var(--sample-ink); }

/* ===== Кнопки ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 0 18px; border-radius: var(--r-sm);
  font-weight: 650; border: 1.5px solid var(--brand); color: var(--brand); background: transparent;
}
.btn-main { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--brand-ink); }
.btn-block { width: 100%; min-height: 50px; font-size: var(--fs-title); }
.actions { display: flex; flex-direction: column; gap: 10px; padding: 8px var(--gut) 0; }

/* Метка «пример» */
.sample { display: inline-block; vertical-align: 1px; font-size: 12px; font-weight: 650; line-height: 1; padding: 3px 7px; border-radius: 6px; background: var(--sample-bg); color: var(--sample-ink); }

/* ===== Карточка сферы ===== */
.detail-head { padding: 6px var(--gut) 18px; }
.detail-head .badge { width: 52px; height: 52px; border-radius: 16px; margin-bottom: 14px; }
.detail-head .badge .icon { width: 26px; height: 26px; }
.detail-head .kind { font-size: var(--fs-meta); color: var(--hint); }
.detail-head h1 { margin-top: 2px; font-size: var(--fs-h1); line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; }
.detail-head p { margin-top: 10px; max-width: 60ch; }

/* ===== Сегодня ===== */
.live { display: flex; align-items: center; gap: 12px; margin: 0 var(--gut) 16px; padding: 14px; border-radius: var(--r); background: var(--brand-soft); }
.live .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 25%, transparent); flex: none; }
.slot { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; min-height: 58px; padding: 10px 14px; }
.slot + .slot { border-top: 1px solid var(--sep); }
.slot time { font-size: var(--fs-title); font-weight: 700; font-variant-numeric: tabular-nums; }
.slot .icon { color: var(--hint); width: 20px; height: 20px; }
.word { margin: 0 var(--gut) 16px; padding: 16px; background: var(--surface); border-radius: var(--r); }
.word blockquote { margin: 0; font-family: var(--book); font-size: var(--fs-title); line-height: 1.5; }
.word .who { margin-top: 10px; font-size: var(--fs-meta); color: var(--hint); }

/* ===== Служения ===== */
.serve { display: grid; gap: 10px; padding: 0 var(--gut); }
.serve-card { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px; border-radius: var(--r); background: var(--surface); }
.serve-card .badge { grid-row: span 2; }
.serve-card h3 { font-size: var(--fs-title); line-height: 1.3; }
.serve-card p { color: var(--hint); font-size: 14px; }
.serve-card .btn { grid-column: 2; justify-self: start; margin-top: 8px; }
.note { margin: 14px var(--gut) 0; font-size: var(--fs-meta); color: var(--hint); }

/* ===== Форма записи (визуально) ===== */
.form { padding: 0 var(--gut); display: flex; flex-direction: column; gap: 18px; }
.field label, .field .label { display: block; font-weight: 600; margin-bottom: 8px; }
.field .meta { margin-top: 6px; font-size: var(--fs-meta); color: var(--hint); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: var(--tap); padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.chip[aria-pressed="true"] { border: 2px solid var(--brand); padding: 0 15px; font-weight: 650; color: var(--brand); }

/* ===== Моё ===== */
.me-head { display: flex; align-items: center; gap: 14px; padding: 18px var(--gut) 6px; }
.avatar { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); flex: none; }
.me-head h1 { font-size: 22px; font-weight: 800; }
.me-head p { color: var(--hint); font-size: var(--fs-meta); margin-top: 2px; }
.switch { flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--brand-fill); position: relative; }
.switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--brand-ink); }

/* ===== Тост ===== */
.toast {
  position: absolute; left: 50%; bottom: calc(var(--tab-h) + 20px + var(--safe-b)); z-index: 20;
  transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  max-width: calc(100% - 32px); width: max-content; padding: 12px 16px; border-radius: 12px;
  background: var(--toast-bg); color: var(--toast-ink); font-weight: 600; font-size: 14px;
  transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.proto-foot { padding: 24px var(--gut) 0; text-align: center; font-size: 12px; color: var(--hint); }

</style>
</head>
<body>
<div id="app"></div>
<script>
/* «Среда» v3 — визуальный прототип с нижним меню. Без бэкенда и без сохранения:
   всё содержимое — пример, кнопки показывают тост «в прототипе не отправляется». */

/* ===== Иконки: линия 1.75, сетка 24, в духе Lucide ===== */
const ICONS = {
  compass: '<circle cx="12" cy="12" r="9.5"/><path d="m15.8 8.2-2.1 5.5-5.5 2.1 2.1-5.5z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4.1 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  user: '<circle cx="12" cy="8" r="4.5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  calendarCheck: '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><path d="m9 15.5 2 2 4-4"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  globe: '<circle cx="12" cy="12" r="9.5"/><path d="M12 2.5a14 14 0 0 0 0 19 14 14 0 0 0 0-19zM2.5 12h19"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2.5 21.5z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>',
  mic: '<rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M19 10.5v1a7 7 0 0 1-14 0v-1M12 18.5v3"/>',
  megaphone: '<path d="m3 11 17-5v12L3 14z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  book: '<path d="M2.5 4h6a3.5 3.5 0 0 1 3.5 3.5V21a3 3 0 0 0-3-3H2.5z"/><path d="M21.5 4h-6A3.5 3.5 0 0 0 12 7.5V21a3 3 0 0 1 3-3h6.5z"/>',
  heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  sparkles: '<path d="M10 15.5A2 2 0 0 0 8.5 14l-6.1-1.6a.5.5 0 0 1 0-1L8.5 10A2 2 0 0 0 10 8.5l1.5-6.1a.5.5 0 0 1 1 0L14 8.5a2 2 0 0 0 1.5 1.5l6.1 1.6a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.5 1.5l-1.5 6.1a.5.5 0 0 1-1 0z"/>',
  unlock: '<rect x="3.5" y="11" width="17" height="10.5" rx="2.5"/><path d="M7.5 11V7a4.5 4.5 0 0 1 8.9-1"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.5-4.5"/>',
  star: '<path d="M12 2.8l2.8 5.7 6.3.9-4.5 4.4 1 6.3L12 17.1l-5.6 3 1-6.3-4.5-4.4 6.3-.9z"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  send: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  radio: '<circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/>',
  play: '<circle cx="12" cy="12" r="9.5"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/>',
  cap: '<path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5M22 10v6"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  map: '<path d="M14.1 5.1 9.9 3 3 5.6v15.4l6.9-2.6 4.2 2.1 6.9-2.6V2.5z"/><path d="M9.9 3v15.4M14.1 5.1v15.4"/>',
};
const icon = (n, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ===== Данные (названия групп — из поста платформы, остальное — пример) ===== */
const SPHERES = [
  { id: 'ministry', name: 'Служения по записи', short: 'Служения', icon: 'calendarCheck' },
  { id: 'people', name: 'Группы по людям', short: 'Люди', icon: 'users' },
  { id: 'land', name: 'Территории', short: 'Территории', icon: 'globe' },
  { id: 'care', name: 'Общение и поддержка', short: 'Общение', icon: 'chat' },

/* ===== Навигация по hash ===== */
let current = {};
const scrollMemo = {};
function go(path) { location.hash = path; }
function goBack() { go(current.parent || '#/spheres'); }
function render() {
  const raw = location.hash.replace(/^#\/?/, '');
  if (raw.startsWith('s-')) return; /* якорь раздела — не маршрут */
  const parts = raw.split('/').filter(Boolean);
  const name = SCREENS[parts[0]] ? parts[0] : 'spheres';
  const view = document.getElementById('view');
  scrollMemo[current.key] = view.scrollTop;
  current = SCREENS[name](...parts.slice(1)) || {};
  current.key = raw || 'spheres';
  view.innerHTML = current.html;
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  view.scrollTop = scrollMemo[current.key] || 0;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab === current.tab ? 'page' : 'false'));
  if (IN_TG) current.parent ? TG.BackButton.show() : TG.BackButton.hide();
}

/* Тост «в прототипе не отправляется» */
let toastTimer;
function toast(text = 'В прототипе не отправляется') {
  const t = document.getElementById('toast');
  t.textContent = text; t.classList.add('show'); haptic();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* Нажатия: звёздочка и чипы — только вид */
document.addEventListener('click', e => {
  const star = e.target.closest('.star');
  if (star) { star.setAttribute('aria-pressed', String(star.getAttribute('aria-pressed') !== 'true')); haptic(); return; }
  const chip = e.target.closest('.chip');
  if (chip) {
    chip.closest('.chips').querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
    haptic();
  }
});

    <nav class="tabbar" aria-label="Меню">${TABS.map(t => `<a class="tab" href="#/${t.id}" data-tab="${t.id}" aria-current="false"><span class="pill">${icon(t.icon)}</span>${t.label}</a>`).join('')}</nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>`;
  window.addEventListener('hashchange', render);
  render();
}
start();

</script>
</body>
</html>
