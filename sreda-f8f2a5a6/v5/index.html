<style>
/* ===== Токены «Среды» v5: светлая тема — главная; ночное море + золото рассвета. Цвет — только здесь ===== */
:root {
  /* основа: светлая */
  --bg: #f1f5f8; --surface: #ffffff; --raised: #e4ecf2; --line: #dbe4eb; --stroke: #6b8195;
  --text: #0b1d2b; --mist: #4f6577;
  --signal: #1d6aa0; --signal-fill: #1d6aa0; --signal-ink: #ffffff; --signal-soft: #dcebf6;
  /* тёплый акцент — рассвет над морем */
  --dawn: #9a5408; --dawn-fill: #e8973a; --dawn-ink: #2a1600; --dawn-soft: #fcefd9; --dawn-glow: #ffc56b;
  /* море — одинаково в обеих темах */
  --sea-1: #0a2236; --sea-2: #12446a; --sea-text: #f2f6f9; --sea-mist: #c3d5e2; --wave: #5aa9dc;
  --sea-pill: #1a4d74; --sea-gold: #ffc56b;
  /* приглушённые тона разделов: fg — значок, bg — плашка */
  --h-ministry-fg: var(--signal); --h-ministry-bg: var(--raised);
  --h-land-fg: var(--signal);     --h-land-bg: var(--raised);
  --h-people-fg: var(--signal);   --h-people-bg: var(--raised);
  --h-care-fg: var(--signal);     --h-care-bg: var(--raised);
  --h-study-fg: var(--signal);    --h-study-bg: var(--raised);
  --h-records-fg: var(--signal);  --h-records-bg: var(--raised);
  --h-info-fg: var(--signal);     --h-info-bg: var(--raised);
  --live: #d4372c; --live-soft: #fde4e1;
  --inverse-bg: #0b1d2b; --inverse-text: #f2f6f9; --inverse-mist: #b9cddb;
  --tabbar: #ffffff; --toast-bg: #0b1d2b; --toast-ink: #f2f6f9;
  --flag-edge: rgba(11, 29, 43, .18);
  color-scheme: light;
}
/* тёмная — системная настройка или переключатель */
@media (prefers-color-scheme: dark) {
  :root:not([data-scheme="light"]) {
    --bg: #07131d; --surface: #0d2333; --raised: #143049; --line: #1f3d55; --stroke: #557a96;
    --text: #f2f6f9; --mist: #9fb4c4;
    --signal: #6cc0f5; --signal-fill: #1d6aa0; --signal-ink: #ffffff; --signal-soft: #11344f;
    --dawn: #f5b860; --dawn-fill: #e8973a; --dawn-ink: #2a1600; --dawn-soft: #3a2913; --dawn-glow: #ffc56b;
    --h-ministry-fg: var(--signal); --h-ministry-bg: var(--raised);
    --h-land-fg: var(--signal);     --h-land-bg: var(--raised);
    --h-people-fg: var(--signal);   --h-people-bg: var(--raised);
    --h-care-fg: var(--signal);     --h-care-bg: var(--raised);
    --h-study-fg: var(--signal);    --h-study-bg: var(--raised);
    --h-records-fg: var(--signal);  --h-records-bg: var(--raised);
    --h-info-fg: var(--signal);     --h-info-bg: var(--raised);
    --live: #ff7a6e; --live-soft: #3d1a17;
    --inverse-bg: #f2f6f9; --inverse-text: #07131d; --inverse-mist: #3d5568;
    --tabbar: #0a1a27; --toast-bg: #f2f6f9; --toast-ink: #07131d;
    --flag-edge: rgba(255, 255, 255, .22);
    color-scheme: dark;
  }
}
:root[data-scheme="dark"] {
  --bg: #07131d; --surface: #0d2333; --raised: #143049; --line: #1f3d55; --stroke: #557a96;
  --text: #f2f6f9; --mist: #9fb4c4;
  --signal: #6cc0f5; --signal-fill: #1d6aa0; --signal-ink: #ffffff; --signal-soft: #11344f;
  --dawn: #f5b860; --dawn-fill: #e8973a; --dawn-ink: #2a1600; --dawn-soft: #3a2913; --dawn-glow: #ffc56b;
  --h-ministry-fg: var(--signal); --h-ministry-bg: var(--raised);
  --h-land-fg: var(--signal);     --h-land-bg: var(--raised);
  --h-people-fg: var(--signal);   --h-people-bg: var(--raised);
  --h-care-fg: var(--signal);     --h-care-bg: var(--raised);
  --h-study-fg: var(--signal);    --h-study-bg: var(--raised);
  --h-records-fg: var(--signal);  --h-records-bg: var(--raised);
  --h-info-fg: var(--signal);     --h-info-bg: var(--raised);
  --live: #ff7a6e; --live-soft: #3d1a17;
  --inverse-bg: #f2f6f9; --inverse-text: #07131d; --inverse-mist: #3d5568;
  --tabbar: #0a1a27; --toast-bg: #f2f6f9; --toast-ink: #07131d;
  --flag-edge: rgba(255, 255, 255, .22);
  color-scheme: dark;
}
:root {
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-meta: 13px; --fs-body: 15px; --fs-row: 17px; --fs-sec: 20px; --fs-screen: 30px; --fs-hero: 44px;
  --gut: 16px; --r: 18px; --r-sm: 12px; --tap: 44px; --tab-h: 64px;
  --safe-t: max(env(safe-area-inset-top, 0px), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
  --safe-b: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 var(--fs-body)/1.45 var(--ui); -webkit-font-smoothing: antialiased;
  overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; border-radius: 10px; }
.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mist { color: var(--mist); }

#app {
  position: relative; max-width: 480px; margin: 0 auto; background: var(--bg);
  height: 100vh; height: 100dvh; height: var(--tg-viewport-stable-height, 100dvh);
  display: flex; flex-direction: column;
}
#view { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 24px; }

/* ===== Нижнее меню ===== */
.tabbar {
  flex: none; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--tabbar); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + var(--safe-b));
}
.tab {
  min-height: var(--tab-h) ; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--mist); font-size: 13px; font-weight: 600; text-align: center; border-radius: 14px;
}
.tab .icon { width: 28px; height: 28px; }
.tab[aria-current="page"] { color: var(--signal); }
.tab[aria-current="page"] .icon { stroke-width: 2.1; }

/* ===== Общие строки ===== */
.row {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 64px; padding: 10px var(--gut);
}
.row + .row { border-top: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; }
.row-main, .row-title, .row-sub, .row-entry { display: block; }
.row-entry { margin-top: 4px; }
.row-title { font-size: var(--fs-row); font-weight: 650; line-height: 1.25; }
.row-sub { font-size: 14px; color: var(--mist); line-height: 1.35; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--mist); width: 20px; height: 20px; }
.badge-ico {
  width: 48px; height: 48px; border-radius: 14px; flex: none; display: grid; place-items: center;
  background: var(--signal-soft); color: var(--signal);
}
.badge-ico .icon { width: 30px; height: 30px; }
.entry { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-meta); font-weight: 600; color: var(--mist); white-space: nowrap; }
.entry .icon { width: 16px; height: 16px; }
.entry.signup { color: var(--signal); }
.list { background: var(--surface); border-radius: var(--r); margin: 0 var(--gut); overflow: hidden; }

/* ===== Внутренние экраны ===== */
.topbar { display: flex; align-items: center; min-height: 52px; padding: calc(4px + var(--safe-t)) 6px 0; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: var(--tap); padding: 0 10px; color: var(--signal); font-size: var(--fs-row); font-weight: 600; }
.back .icon { width: 26px; height: 26px; }
.screen-head { padding: 8px var(--gut) 20px; }
.screen-head .badge-ico { width: 60px; height: 60px; border-radius: 16px; margin-bottom: 14px; }
.screen-head .badge-ico .icon { width: 32px; height: 32px; }
.screen-title { font-size: var(--fs-screen); font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
.screen-sub { font-size: var(--fs-body); color: var(--mist); margin-top: 6px; }
.about { font-size: var(--fs-row); line-height: 1.5; padding: 0 var(--gut); }
.howto { margin: 22px var(--gut) 0; padding: 16px; background: var(--surface); border-radius: var(--r); }
.howto h3 { font-size: var(--fs-sec); font-weight: 750; margin-bottom: 10px; }
.howto ol { margin: 0; padding-left: 22px; font-size: var(--fs-body); line-height: 1.55; }
.howto li + li { margin-top: 6px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; width: 100%;
  border-radius: 14px; font-size: var(--fs-row); font-weight: 700; text-align: center;
  background: var(--signal-fill); color: var(--signal-ink);
}
.btn .icon { width: 22px; height: 22px; }
.btn-wrap { padding: 20px var(--gut) 0; }
.btn-ghost { background: transparent; color: var(--signal); border: 1.5px solid var(--stroke); }

/* ===== Пустое состояние ===== */
.empty { min-height: 100%; display: flex; flex-direction: column; padding: calc(16px + var(--safe-t)) var(--gut) 24px; }
.empty-head { font-size: var(--fs-screen); font-weight: 800; padding-top: 8px; }
.empty-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 12px; }
.empty-ico { width: 88px; height: 88px; border-radius: 28px; display: grid; place-items: center; background: var(--signal-soft); color: var(--signal); margin-bottom: 22px; }
.empty-ico .icon { width: 44px; height: 44px; stroke-width: 1.5; }
.empty h2 { font-size: 22px; font-weight: 750; line-height: 1.25; }
.empty p { font-size: var(--fs-body); color: var(--mist); margin-top: 8px; max-width: 30ch; }
.empty .btn { margin-top: 24px; max-width: 280px; }

.sample { display: block; text-align: center; font-size: var(--fs-meta); color: var(--mist); padding: 22px var(--gut) 4px; }

/* ===== Тост ===== */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + 28px + var(--safe-b)); transform: translate(-50%, 12px);
  background: var(--toast-bg); color: var(--toast-ink); font-size: 14px; font-weight: 600;
  padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: calc(100% - 32px); text-align: center; z-index: 10;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } * { scroll-behavior: auto !important; } }

/* ===== Рябь моря (общая для шапки и морской плитки) ===== */
.waves { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 70px; color: var(--wave); opacity: .35; pointer-events: none; }
.waves path { fill: none; stroke: currentColor; stroke-width: 1.2; }

/* B «Сферы» v5: светлая главная; 1 основной (море) + 1 тёплый (рассвет) + приглушённые тона разделов */
#view { padding-bottom: calc(24px + var(--safe-b)); }

/* тона разделов — плашки иконок, бейджи строк */
.tone-ministry { --tone-fg: var(--h-ministry-fg); --tone-bg: var(--h-ministry-bg); }
.tone-land { --tone-fg: var(--h-land-fg); --tone-bg: var(--h-land-bg); }
.tone-people { --tone-fg: var(--h-people-fg); --tone-bg: var(--h-people-bg); }
.tone-care { --tone-fg: var(--h-care-fg); --tone-bg: var(--h-care-bg); }
.tone-study { --tone-fg: var(--h-study-fg); --tone-bg: var(--h-study-bg); }
.tone-records { --tone-fg: var(--h-records-fg); --tone-bg: var(--h-records-bg); }
.tone-info { --tone-fg: var(--h-info-fg); --tone-bg: var(--h-info-bg); }
.badge-ico { background: var(--tone-bg, var(--signal-soft)); color: var(--tone-fg, var(--signal)); }
.badge-flag { background: var(--raised); }
.plaque { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--tone-bg); color: var(--tone-fg); }
.plaque .icon { width: 24px; height: 24px; color: var(--tone-fg) !important; }
.plaque-lg { width: 46px; height: 46px; border-radius: 14px; }
.plaque-lg .icon { width: 26px; height: 26px; }

/* флаги */
.flag { width: 24px; height: 16px; flex: none; border-radius: 3.5px; display: block; }
.flag.lg { width: 33px; height: 22px; }
.flag.mini { width: 18px; height: 12px; border-radius: 2.5px; margin-right: -5px; box-shadow: 0 0 0 1.5px var(--surface); }

/* шапка: знак ДАП + название */
.brand { display: flex; align-items: center; gap: 11px; padding: calc(12px + var(--safe-t)) var(--gut) 12px; }
.logo { width: 42px; height: 42px; border-radius: 50%; flex: none; display: block; }
.logo.xs { width: 32px; height: 32px; }
.brand-name { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.brand-name b { font-size: 24px; font-weight: 850; letter-spacing: -0.01em; }
.brand-name span { font-size: var(--fs-meta); color: var(--mist); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: var(--tap); height: var(--tap); border-radius: 50%; display: grid; place-items: center; color: var(--mist); flex: none; }
.iconbtn .icon { width: 22px; height: 22px; }
.ava-btn { flex: none; border-radius: 50%; }
.ava { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; flex: none; }
.ava-ini { background: var(--signal-fill); color: var(--signal-ink); font-weight: 800; font-size: 15px; letter-spacing: .02em; }
.ava.sm { width: 38px; height: 38px; font-size: 14px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--line); }
.ava.lg { width: 96px; height: 96px; font-size: 32px; box-shadow: 0 0 0 4px var(--surface), 0 0 0 6px var(--line); }

.home-top { display: flex; flex-direction: column; gap: 12px; padding: 0 var(--gut); }
.search {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px;
  padding: 0 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--stroke);
  color: var(--mist); font-size: 16px;
}
.search .icon { color: var(--text); }

/* в эфире */
.live { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border-radius: 16px; background: var(--surface); }
.live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 5px var(--live-soft); flex: none; margin: 0 4px; display: inline-block; }
.live-main { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.live-main b { font-size: var(--fs-meta); font-weight: 750; color: var(--live); letter-spacing: .01em; }
.live-main span { font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-n { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-meta); font-weight: 650; color: var(--mist); }
.live-n .icon { width: 16px; height: 16px; }

/* смелое место — рассвет над ночным морем */
.conf {
  position: relative; overflow: hidden; border-radius: 20px; padding: 16px 16px 18px; cursor: pointer;
  color: var(--sea-text); background: linear-gradient(170deg, var(--sea-1) 0%, var(--sea-2) 100%);
}
.sunrise { position: absolute; right: -36px; top: -64px; width: 170px; height: 170px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 222, 150, 1) 0%, rgba(255, 196, 104, .9) 16%, rgba(240, 160, 70, .45) 34%, rgba(232, 151, 58, 0) 66%); pointer-events: none; }
.conf .waves { height: 56px; opacity: .3; }
.conf > *:not(.waves):not(.sunrise) { position: relative; z-index: 1; }
.conf-tag { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-meta); font-weight: 750; color: var(--sea-gold); }
.conf-tag .icon { width: 16px; height: 16px; fill: currentColor; stroke-width: 1.2; }
.conf h3 { font-size: 23px; font-weight: 850; line-height: 1.15; margin-top: 6px; letter-spacing: -0.01em; }
.conf-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 16px; font-weight: 650; }
.conf-you { font-size: 14px; color: var(--sea-mist); margin-top: 4px; }

/* заголовок раздела */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 24px var(--gut) 10px; }
.sec h2 { font-size: var(--fs-sec); font-weight: 800; }
.sec span { font-size: var(--fs-meta); color: var(--mist); }

/* мозаика */
.mosaic { display: flex; flex-direction: column; gap: 12px; padding: 0 var(--gut); }
.mrow { display: grid; gap: 12px; }
.mrow-11 { grid-template-columns: 1fr 1fr; }
.tile {
  position: relative; overflow: hidden; border-radius: 20px; background: var(--surface); padding: 14px;
  display: flex; flex-direction: column; cursor: pointer; min-width: 0;
}
.tile h2 { font-size: var(--fs-row); font-weight: 750; line-height: 1.2; }
.tile-sub { font-size: var(--fs-meta); color: var(--mist); margin-top: 2px; }
.tile-count { font-size: var(--fs-meta); font-weight: 650; color: var(--mist); flex: none; }
.tile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.tile-head { display: flex; align-items: center; gap: 10px; }
.tile-head h2 { flex: 1; min-width: 0; }

.t-start { flex-direction: row; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; }
.start-main { flex: 1; min-width: 0; }
.t-start p { font-size: 14px; color: var(--mist); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-start .tail { display: flex; align-items: center; gap: 2px; flex: none; }
.new { font-size: 12px; font-weight: 750; color: var(--signal); background: var(--signal-soft); border-radius: 8px; padding: 3px 7px; }
.chev { color: var(--mist); width: 20px; height: 20px; }

.t-ministry { color: var(--sea-text); background: linear-gradient(160deg, var(--sea-1) 0%, var(--sea-2) 100%); }
.t-ministry > *:not(.waves) { position: relative; z-index: 1; }
.t-ministry .tile-head .icon { width: 30px; height: 30px; color: var(--sea-text); }
.t-ministry h2 { font-size: var(--fs-sec); font-weight: 850; }
.t-ministry .tile-count { color: var(--sea-mist); }
.next-slot { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; font-weight: 650; color: var(--sea-text); }
.next-slot .icon { width: 16px; height: 16px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pill { min-height: 36px; padding: 0 13px; border-radius: 11px; background: var(--sea-pill); color: var(--sea-text); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; }
.t-ministry .waves { height: 64px; opacity: .28; }

.t-land h2 { font-size: var(--fs-sec); font-weight: 800; }
.lands { list-style: none; margin: 0; padding: 12px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.lands li { display: flex; align-items: center; gap: 9px; font-size: var(--fs-row); font-weight: 600; min-height: 34px; min-width: 0; }
.lands li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lands li.more { grid-column: 1 / -1; color: var(--mist); font-size: var(--fs-body); gap: 0; }
.lands li.more span { margin-left: 14px; }

.t-mid { min-height: 120px; }
.t-mid h2 { margin-top: auto; padding-top: 10px; }
.t-small { flex-direction: row; align-items: center; gap: 10px; min-height: 70px; padding: 12px; }
.small-main { flex: 1; min-width: 0; }

/* Сегодня — лента дня */
.day-head { padding: 4px var(--gut) 12px; }
.day-head h1 { font-size: 26px; font-weight: 850; line-height: 1.15; letter-spacing: -0.01em; }
.day-head span { font-size: var(--fs-meta); color: var(--mist); }
.timeline { list-style: none; margin: 0; padding: 0 var(--gut); }
.tl { display: grid; grid-template-columns: 46px 14px 1fr; gap: 0 8px; align-items: stretch; }
.tl-time { font-size: 14px; font-weight: 700; padding-top: 14px; font-variant-numeric: tabular-nums; }
.tl-dot { position: relative; }
.tl-dot::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl-dot::after { content: ''; position: absolute; left: 2px; top: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--stroke); box-sizing: border-box; }
.tl.tl-live .tl-dot::after { background: var(--live); border-color: var(--live); }
.tl.tl-conf .tl-dot::after { background: var(--dawn-fill); border-color: var(--dawn-fill); }
.tl-card { display: flex; flex-direction: column; margin: 4px 0; padding: 10px 14px; border-radius: 16px; background: var(--surface); min-width: 0; }
.tl-card b { font-size: 16px; font-weight: 700; line-height: 1.25; }
.tl-card > span { font-size: 14px; color: var(--mist); }
.tl-badge { align-self: flex-start; margin-top: 6px; font-style: normal; font-size: 12px; font-weight: 750; padding: 3px 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; background: var(--signal-soft); color: var(--signal); }
.tl.tl-live .tl-badge { background: var(--live-soft); color: var(--live); }
.tl.tl-live .tl-badge .live-dot { width: 7px; height: 7px; box-shadow: none; margin: 0; }
.tl.tl-conf .tl-card { background: linear-gradient(160deg, var(--sea-1), var(--sea-2)); color: var(--sea-text); }
.tl.tl-conf .tl-card > span { color: var(--sea-mist); }
.tl.tl-conf .tl-badge { background: rgba(255, 197, 107, .18); color: var(--sea-gold); }

/* Служения — заполненность записи */
.book .row { align-items: flex-start; padding-top: 14px; padding-bottom: 14px; }
.book .chev { margin-top: 14px; }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--raised); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--signal-fill); }
.book-meta { display: block; font-size: var(--fs-meta); color: var(--mist); margin-top: 5px; }
.book-meta b { color: var(--text); }

/* Моё — профиль организатора */
.me-bar { display: flex; align-items: center; gap: 10px; padding: calc(10px + var(--safe-t)) var(--gut) 0; }
.me-bar b { flex: 1; font-size: 17px; font-weight: 750; }
.me-card { margin: 8px var(--gut) 0; padding: 22px 16px 18px; border-radius: 22px; background: var(--surface); text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }
.me-card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 74px; background: linear-gradient(170deg, var(--sea-1), var(--sea-2)); }
.me-card > * { position: relative; z-index: 1; }
.me-ava { position: relative; }
.me-logo { position: absolute; right: -6px; bottom: -2px; }
.logo.badge { width: 34px; height: 34px; box-shadow: 0 0 0 3px var(--surface); }
.me-card h1 { font-size: 26px; font-weight: 850; margin-top: 14px; letter-spacing: -0.01em; }
.me-role { font-size: 16px; font-weight: 600; margin-top: 2px; }
.me-church { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--mist); margin-top: 6px; }
.me-church .flag { width: 21px; height: 14px; }
.me-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 5px 11px; border-radius: 10px; font-size: 13px; font-weight: 750; background: var(--signal-soft); color: var(--signal); }
.me-chip .icon { width: 16px; height: 16px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px var(--gut) 0; }
.stat { background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; }
.stat b { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
.stat span { font-size: var(--fs-meta); color: var(--mist); }
.me-near { padding: 0 var(--gut) 12px; }
.entry.warn { color: var(--text); font-weight: 650; }
.school { display: flex; gap: 12px; align-items: flex-start; margin: 0 var(--gut); padding: 14px; border-radius: var(--r); background: var(--surface); cursor: pointer; }
.school .row-sub { white-space: normal; }
.school-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: var(--fs-meta); color: var(--mist); }
.faces { display: inline-flex; flex: none; }
.ini { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; letter-spacing: -.02em; background: var(--tone-bg); color: var(--tone-fg); box-shadow: 0 0 0 2px var(--surface); }
.ini + .ini { margin-left: -5px; }
.inbox { display: flex; align-items: center; gap: 12px; margin: 12px var(--gut) 0; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.inbox .row-sub { color: var(--text); opacity: .8; }

/* активная вкладка — пилюля под иконкой */
.tab .icon { width: 60px; height: 32px; padding: 2px 16px; border-radius: 999px; box-sizing: border-box; }
.tab[aria-current="page"] .icon { background: var(--signal-soft); }
.tab[aria-current="page"] span { font-weight: 750; }
.topbar { padding-top: calc(8px + var(--safe-t)); }

</style>

<div id="app"><main id="view"></main></div>
<script>
/* «Среда» v5 — визуальный прототип. Логики нет: JS только переключает экраны и тему.
   Названия групп — из поста платформы; описания — пример. */

const ICONS = {

  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  user: '<circle cx="12" cy="8" r="4.5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  calendarCheck: '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><path d="m9 15.5 2 2 4-4"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  globe: '<circle cx="12" cy="12" r="9.5"/><path d="M12 2.5a14 14 0 0 0 0 19 14 14 0 0 0 0-19zM2.5 12h19"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2.5 21.5z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>',
  mic: '<rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M19 10.5v1a7 7 0 0 1-14 0v-1M12 18.5v3"/>',
  megaphone: '<path d="m3 11 17-5v12L3 14z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  book: '<path d="M2.5 4h6a3.5 3.5 0 0 1 3.5 3.5V21a3 3 0 0 0-3-3H2.5z"/><path d="M21.5 4h-6A3.5 3.5 0 0 0 12 7.5V21a3 3 0 0 1 3-3h6.5z"/>',
  heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  sparkles: '<path d="M10 15.5A2 2 0 0 0 8.5 14l-6.1-1.6a.5.5 0 0 1 0-1L8.5 10A2 2 0 0 0 10 8.5l1.5-6.1a.5.5 0 0 1 1 0L14 8.5a2 2 0 0 0 1.5 1.5l6.1 1.6a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.5 1.5l-1.5 6.1a.5.5 0 0 1-1 0z"/>',
  unlock: '<rect x="3.5" y="11" width="17" height="10.5" rx="2.5"/><path d="M7.5 11V7a4.5 4.5 0 0 1 8.9-1"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.5-4.5"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',

function setScheme(s) {
  document.documentElement.dataset.scheme = s;
  if (IN_TG && TG.isVersionAtLeast && TG.isVersionAtLeast('6.1')) try { const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); TG.setHeaderColor(bg); TG.setBackgroundColor(bg); } catch (e) {}

function render() {
  const view = document.getElementById('view');
  const top = state.stack[state.stack.length - 1];
  if (top) view.innerHTML = top[0] === 'sphere' ? SPHERE_SCREEN(top[1]) : PLACE_SCREEN(top[1]);
  else view.innerHTML = state.tab === 'spheres' ? HOME() : (window.TAB_SCREENS && TAB_SCREENS[state.tab] ? TAB_SCREENS[state.tab]() : STUB_SCREEN(state.tab));
  view.scrollTop = 0;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab === state.tab ? 'page' : 'false'));
  if (IN_TG && TG.BackButton) state.stack.length ? TG.BackButton.show() : TG.BackButton.hide();
  if (window.AFTER_HOME && !top && state.tab === 'spheres') AFTER_HOME();
  if (!state.stack.length) history.replaceState(null, '', state.tab === 'spheres' ? location.pathname + location.search : '#' + state.tab);
}
function go(target) {
  const [kind, id] = target.split(':');
  if (kind === 'tab') { state.tab = id; state.stack = []; }
  else { if (kind === 'sphere' && state.tab !== 'spheres') { state.tab = 'spheres'; state.stack = []; } state.stack.push([kind, id]); }
  render();
}
function back() { state.stack.pop(); render(); }
let toastT;
function toast(msg) {
  const t = document.querySelector('.toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
}

document.addEventListener('DOMContentLoaded', () => {
  const q = new URLSearchParams(location.search).get('theme');

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-go],[data-tab],[data-back],[data-toast],[data-jump],[data-scheme-toggle]');
    if (!el) return;
    if (el.hasAttribute('data-scheme-toggle')) { setScheme(curScheme() === 'dark' ? 'light' : 'dark'); render(); }
    else if (el.dataset.tab) go('tab:' + el.dataset.tab);
    else if (el.dataset.go) go(el.dataset.go);
    else if (el.hasAttribute('data-back')) back();
    else if (el.dataset.toast) toast(el.dataset.toast);
    else if (el.dataset.jump) { const s = document.getElementById(el.dataset.jump); if (s) s.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  });
  document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role=button]')) { ev.preventDefault(); ev.target.click(); } });

      if (TG.isVersionAtLeast('8.0') && /ios|android/.test(TG.platform)) TG.requestFullscreen();

  render();
  if (START_POS === 'end') { const v = document.getElementById('view'); v.scrollTop = v.scrollHeight; }
});

function HOME() {
  const n = id => inSphere(id).length;
  const S = SPHERE;
  const open = (id, cls) => `<div class="tile ${cls}" role="button" tabindex="0" data-go="sphere:${id}" aria-label="${S[id].name}, ${countWord(id)}">`;
  const plaque = id => `<span class="plaque tone-${id}">${icon(S[id].icon)}</span>`;
  const sub = { people: '860 участников', care: '540 участников', study: '65 уроков', records: '1000+ эфиров' };
  const mid = id => `${open(id, 't-mid')}<div class="tile-top">${plaque(id)}<span class="tile-count">${n(id)}</span></div><h2>${S[id].name}</h2><p class="tile-sub">${sub[id]}</p></div>`;
  const small = id => `${open(id, 't-small')}${plaque(id)}<span class="small-main"><h2>${S[id].name}</h2><p class="tile-sub">${sub[id]}</p></span></div>`;
  const ministry = inSphere('ministry');
  const lands = inSphere('land').slice(0, 4);
  return `${BRAND('ДАП')}
  <div class="home-top">
    <button class="search" data-toast="Прототип: поиск появится в рабочей версии">${icon('search')}Группа, служение или страна</button>
    ${LIVE()}
    ${CONF()}
  </div>
  ${sec('Сферы', `${PLACES.length} места · 1 135 человек`)}
  <div class="mosaic">
    ${open('info', 't-start')}<span class="plaque plaque-lg tone-info">${icon(S.info.icon)}</span>
      <div class="start-main"><h2>${S.info.name}</h2><p>${S.info.hint}</p></div>
      <span class="tail"><span class="new">+12 за неделю</span>${icon('chev', 'chev')}</span></div>
    ${open('ministry', 't-ministry')}${WAVES()}
      <div class="tile-head">${icon(S.ministry.icon)}<h2>${S.ministry.name}</h2><span class="tile-count">${n('ministry')}</span></div>
      <p class="next-slot">${icon('clock')}Ближайшая запись — пт 12:00, 3 места</p>
      <div class="pills">${ministry.slice(0, 2).map(p => `<button class="pill" data-go="place:${p.id}">${p.name}</button>`).join('')}</div></div>
    ${open('land', 't-land')}
      <div class="tile-head">${plaque('land')}<h2>${S.land.name}</h2><span class="tile-count">${n('land')} чатов</span></div>
      <ul class="lands">${lands.map(l => `<li>${flag(l.flag)}<span>${l.name}</span></li>`).join('')}<li class="more">${['by', 'ua', 'lv', 'gb', 'eu'].map(f => flag(f, 'mini')).join('')}<span>ещё ${n('land') - lands.length}</span></li></ul></div>

  </div>
  <p class="sample">Прототип · данные — пример</p>`;
}
