<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">

<title>Среда · C «Первая дверь»</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===== Токены «Среды» v4: ночное море и белый знак. Цвет — только здесь ===== */
:root {
  --bg: #07131d;
  --surface: #0d2333;
  --raised: #143049;
  --line: #1f3d55;
  --stroke: #557a96;
  --text: #f2f6f9;
  --mist: #9fb4c4;
  --signal: #6cc0f5;
  --signal-fill: #1d6aa0;
  --signal-ink: #ffffff;
  --signal-soft: #11344f;
  --sea-1: #0a2236;
  --sea-2: #12446a;
  --sea-text: #f2f6f9;
  --sea-mist: #c3d5e2;
  --wave: #5aa9dc;
  --sea-field: #0b2a42;
  --sea-stroke: #6b93b3;
  --sea-pill: #1a4d74;
  --inverse-bg: #f2f6f9;
  --inverse-text: #07131d;
  --inverse-mist: #3d5568;
  --tabbar: #0a1a27;
  --toast-bg: #f2f6f9;
  --toast-ink: #07131d;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-scheme="dark"]) {
    --bg: #eef3f7; --surface: #ffffff; --raised: #e1eaf1; --line: #d8e2ea; --stroke: #7b91a3;
    --text: #0b1d2b; --mist: #4f6577; --signal: #1d6aa0; --signal-fill: #1d6aa0; --signal-ink: #ffffff;
    --signal-soft: #dcebf6; --inverse-bg: #0b1d2b; --inverse-text: #f2f6f9; --inverse-mist: #b9cddb;
    --tabbar: #ffffff; --toast-bg: #0b1d2b; --toast-ink: #f2f6f9; color-scheme: light;
  }
}
:root[data-scheme="light"] {
  --bg: #eef3f7; --surface: #ffffff; --raised: #e1eaf1; --line: #d8e2ea; --stroke: #7b91a3;
  --text: #0b1d2b; --mist: #4f6577; --signal: #1d6aa0; --signal-fill: #1d6aa0; --signal-ink: #ffffff;
  --signal-soft: #dcebf6; --inverse-bg: #0b1d2b; --inverse-text: #f2f6f9; --inverse-mist: #b9cddb;
  --tabbar: #ffffff; --toast-bg: #0b1d2b; --toast-ink: #f2f6f9; color-scheme: light;
}
:root {
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-meta: 13px; --fs-body: 15px; --fs-row: 17px; --fs-sec: 20px; --fs-screen: 30px; --fs-hero: 44px;
  --gut: 16px; --r: 18px; --r-sm: 12px; --tap: 44px; --tab-h: 64px;
  --safe-t: max(env(safe-area-inset-top, 0px), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
  --safe-b: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 var(--fs-body)/1.45 var(--ui); -webkit-font-smoothing: antialiased;
  overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; border-radius: 10px; }
.icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mist { color: var(--mist); }

#app {
  position: relative; max-width: 480px; margin: 0 auto; background: var(--bg);
  height: 100vh; height: 100dvh; height: var(--tg-viewport-stable-height, 100dvh);
  display: flex; flex-direction: column;
}
#view { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 24px; }

/* ===== Нижнее меню ===== */
.tabbar {
  flex: none; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--tabbar); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + var(--safe-b));
}
.tab {
  min-height: var(--tab-h) ; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--mist); font-size: 13px; font-weight: 600; text-align: center; border-radius: 14px;
}
.tab .icon { width: 28px; height: 28px; }
.tab[aria-current="page"] { color: var(--signal); }
.tab[aria-current="page"] .icon { stroke-width: 2.1; }

/* ===== Общие строки ===== */
.row {
  display: flex; align-items: center; gap: 14px; width: 100%;
  min-height: 64px; padding: 10px var(--gut);
}
.row + .row { border-top: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; }
.row-main, .row-title, .row-sub { display: block; }
.row-title { font-size: var(--fs-row); font-weight: 650; line-height: 1.25; }
.row-sub { font-size: 14px; color: var(--mist); line-height: 1.35; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--mist); width: 20px; height: 20px; }
.badge-ico {
  width: 48px; height: 48px; border-radius: 14px; flex: none; display: grid; place-items: center;
  background: var(--signal-soft); color: var(--signal);
}
.badge-ico .icon { width: 30px; height: 30px; }
.entry { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-meta); font-weight: 600; color: var(--mist); white-space: nowrap; }
.entry .icon { width: 16px; height: 16px; }
.entry.signup { color: var(--signal); }
.list { background: var(--surface); border-radius: var(--r); margin: 0 var(--gut); overflow: hidden; }

/* ===== Внутренние экраны ===== */
.topbar { display: flex; align-items: center; min-height: 52px; padding: calc(4px + var(--safe-t)) 6px 0; }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: var(--tap); padding: 0 10px; color: var(--signal); font-size: var(--fs-row); font-weight: 600; }
.back .icon { width: 26px; height: 26px; }
.screen-head { padding: 8px var(--gut) 20px; }
.screen-head .badge-ico { width: 60px; height: 60px; border-radius: 16px; margin-bottom: 14px; }
.screen-head .badge-ico .icon { width: 32px; height: 32px; }
.screen-title { font-size: var(--fs-screen); font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
.screen-sub { font-size: var(--fs-body); color: var(--mist); margin-top: 6px; }
.about { font-size: var(--fs-row); line-height: 1.5; padding: 0 var(--gut); }
.howto { margin: 22px var(--gut) 0; padding: 16px; background: var(--surface); border-radius: var(--r); }
.howto h3 { font-size: var(--fs-sec); font-weight: 750; margin-bottom: 10px; }
.howto ol { margin: 0; padding-left: 22px; font-size: var(--fs-body); line-height: 1.55; }
.howto li + li { margin-top: 6px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; width: 100%;
  border-radius: 14px; font-size: var(--fs-row); font-weight: 700; text-align: center;
  background: var(--signal-fill); color: var(--signal-ink);
}
.btn .icon { width: 22px; height: 22px; }
.btn-wrap { padding: 20px var(--gut) 0; }
.btn-ghost { background: transparent; color: var(--signal); border: 1.5px solid var(--stroke); }

/* ===== Пустое состояние ===== */
.empty { min-height: 100%; display: flex; flex-direction: column; padding: calc(16px + var(--safe-t)) var(--gut) 24px; }
.empty-head { font-size: var(--fs-screen); font-weight: 800; padding-top: 8px; }
.empty-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 12px; }
.empty-ico { width: 88px; height: 88px; border-radius: 28px; display: grid; place-items: center; background: var(--signal-soft); color: var(--signal); margin-bottom: 22px; }
.empty-ico .icon { width: 44px; height: 44px; stroke-width: 1.5; }
.empty h2 { font-size: 22px; font-weight: 750; line-height: 1.25; }
.empty p { font-size: var(--fs-body); color: var(--mist); margin-top: 8px; max-width: 30ch; }
.empty .btn { margin-top: 24px; max-width: 280px; }

.sample { display: block; text-align: center; font-size: var(--fs-meta); color: var(--mist); padding: 22px var(--gut) 4px; }

/* ===== Тост ===== */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tab-h) + 28px + var(--safe-b)); transform: translate(-50%, 12px);
  background: var(--toast-bg); color: var(--toast-ink); font-size: 14px; font-weight: 600;
  padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: calc(100% - 32px); text-align: center; z-index: 10;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } * { scroll-behavior: auto !important; } }

/* ===== Рябь моря (общая для шапки и морской плитки) ===== */
.waves { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 70px; color: var(--wave); opacity: .35; pointer-events: none; }
.waves path { fill: none; stroke: currentColor; stroke-width: 1.2; }

/* C «Первая дверь»: белый блок для новичка, липкая лента сфер, весь список подряд */
.chead { display: flex; align-items: center; justify-content: space-between; padding: calc(12px + var(--safe-t)) var(--gut) 10px; }
.chead h1 { font-size: var(--fs-screen); font-weight: 800; letter-spacing: -0.01em; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--stroke); }
.icon-btn .icon { width: 24px; height: 24px; }
.door { margin: 4px var(--gut) 0; padding: 20px; border-radius: 24px; background: var(--inverse-bg); color: var(--inverse-text); }
.door > .icon { width: 34px; height: 34px; }
.door h2 { font-size: 26px; font-weight: 850; line-height: 1.1; margin-top: 12px; letter-spacing: -0.01em; }
.door p { font-size: var(--fs-body); color: var(--inverse-mist); margin-top: 6px; }
.door .btn { margin-top: 16px; }
.chips { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  padding: 12px var(--gut); background: var(--bg); margin-top: 8px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 11px;
  border-radius: 22px; border: 1.5px solid var(--stroke); font-size: var(--fs-body); font-weight: 600; }
.chip .icon { width: 22px; height: 22px; color: var(--signal); }
.sec { scroll-margin-top: 70px; padding-top: 14px; }
.sec-h { display: flex; align-items: center; gap: 10px; padding: 0 var(--gut) 10px; }
.sec-h .icon { width: 28px; height: 28px; color: var(--signal); }
.sec-h h2 { flex: 1; font-size: var(--fs-sec); font-weight: 750; }
.sec-h span { font-size: var(--fs-meta); color: var(--mist); font-weight: 600; }
.lands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 var(--gut); }
.land { min-height: 48px; border-radius: 12px; background: var(--surface); font-size: 14px; font-weight: 600; text-align: center; padding: 6px; display: grid; place-items: center; line-height: 1.2; }

</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<script>
/* «Среда» v4 — визуальный прототип. Логики нет: JS только переключает экраны и тему.
   Названия групп — из поста платформы; описания — пример. */

const ICONS = {
  compass: '<circle cx="12" cy="12" r="9.5"/><path d="m15.8 8.2-2.1 5.5-5.5 2.1 2.1-5.5z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  user: '<circle cx="12" cy="8" r="4.5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  calendarCheck: '<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/><path d="m9 15.5 2 2 4-4"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  globe: '<circle cx="12" cy="12" r="9.5"/><path d="M12 2.5a14 14 0 0 0 0 19 14 14 0 0 0 0-19zM2.5 12h19"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2.5 21.5z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>',
  mic: '<rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M19 10.5v1a7 7 0 0 1-14 0v-1M12 18.5v3"/>',
  megaphone: '<path d="m3 11 17-5v12L3 14z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  book: '<path d="M2.5 4h6a3.5 3.5 0 0 1 3.5 3.5V21a3 3 0 0 0-3-3H2.5z"/><path d="M21.5 4h-6A3.5 3.5 0 0 0 12 7.5V21a3 3 0 0 1 3-3h6.5z"/>',
  heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
  sparkles: '<path d="M10 15.5A2 2 0 0 0 8.5 14l-6.1-1.6a.5.5 0 0 1 0-1L8.5 10A2 2 0 0 0 10 8.5l1.5-6.1a.5.5 0 0 1 1 0L14 8.5a2 2 0 0 0 1.5 1.5l6.1 1.6a.5.5 0 0 1 0 1L15.5 14a2 2 0 0 0-1.5 1.5l-1.5 6.1a.5.5 0 0 1-1 0z"/>',
  unlock: '<rect x="3.5" y="11" width="17" height="10.5" rx="2.5"/><path d="M7.5 11V7a4.5 4.5 0 0 1 8.9-1"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.5-4.5"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  send: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
  door: '<path d="M13 4h3a2 2 0 0 1 2 2v14M2 20h3M13 20h9"/><path d="M10 12v.01"/><path d="M13 4.6v16.1a.3.3 0 0 1-.4.3L5 19V5.6a1 1 0 0 1 .8-1L11.8 3a1 1 0 0 1 1.2 1z"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>',
  cap: '<path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 2.5 9 2.5 12 0v-5M22 10v6"/>',
  play: '<circle cx="12" cy="12" r="9.5"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/>',
  mapPin: '<path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',

const WAVES = () => `<svg class="waves" viewBox="0 0 390 70" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 18c40-8 70 6 110 0s70-10 110-2 70 8 100 0 50-6 70-2"/><path d="M0 34c30 6 60-6 100 0s80 8 120 0 70-8 110 0 40 4 60 2"/>
  <path d="M0 50c50-6 80 6 120 2s60-8 100-2 80 6 110 0 40-4 60-2"/><path d="M0 64c40 4 70-4 110 0s70 4 110-2 80-4 110 2 40 2 60 0"/></svg>`;
const icon = (n, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

const SPHERES = [
  { id: 'ministry', name: 'Служения по записи', short: 'Служения', icon: 'calendarCheck', lead: 'Слово, молитва, душепопечение — в назначенное время' },
  { id: 'people', name: 'Группы по людям', short: 'Люди', icon: 'users', lead: 'Женщины, мужчины, молодёжь, дети' },
  { id: 'land', name: 'Территории', short: 'Страны', icon: 'globe', lead: 'Группы стран и регионов' },
  { id: 'care', name: 'Общение и поддержка', short: 'Общение', icon: 'chat', lead: 'Молитвенные нужды, свидетельства, просто общение' },
  { id: 'study', name: 'Учёба', short: 'Учёба', icon: 'book', lead: 'Школа и библиотека' },
  { id: 'records', name: 'Записи эфиров', short: 'Записи', icon: 'mic', lead: 'Пророчества и эфиры в записи' },
  { id: 'info', name: 'Вход и новости', short: 'Вход', icon: 'megaphone', lead: 'С чего начать, конференции, новости' },
];
const SPHERE = Object.fromEntries(SPHERES.map(s => [s.id, s]));

/* entry: signup — по записи; join — по заявке; open — открыто */
const P = (id, sphere, name, ico, entry, line, about) => ({ id, sphere, name, icon: ico, entry, line, about });
const PLACES = [
  P('prophetic-table', 'ministry', 'Пророческий стол', 'sparkles', 'signup', 'Слово, ободрение, молитва', 'Слово, ободрение и молитва о вас. Встреча онлайн в назначенное время.'),
  P('new-heart', 'ministry', 'Новое сердце', 'heart', 'signup', 'Беседа и молитва с душепопечителем', 'Личная беседа и молитва с душепопечителем — о том, что болит и не отпускает.'),
  P('deliverance', 'ministry', 'Служение освобождения', 'unlock', 'signup', 'По предварительной записи', 'Служение по предварительной записи, в назначенное время.'),
  P('dreams', 'ministry', 'Библейское толкование снов', 'moon', 'signup', 'По Писанию, символическая плата', 'Разбор сна или видения по Писанию. За символическую плату.'),
  P('dreams-abc', 'ministry', 'Азбука снов и видений', 'moon', 'join', 'Учимся понимать сны и видения', 'Учимся понимать язык снов и видений вместе.'),

  P('women', 'people', 'Женщина влияния', 'users', 'join', 'Общение, молитва и эфиры', 'Сообщество женщин: общение, молитва, эфиры.'),
  P('men', 'people', 'Муж в Боге', 'users', 'join', 'Семья, ответственность, служение', 'Мужская группа: ответственность, семья, служение.'),
  P('youth', 'people', 'Молодёжь', 'users', 'join', 'Молодёжное сообщество', 'Молодёжное сообщество платформы.'),
  P('kids', 'people', 'Детский канал', 'play', 'open', 'Для детей и их родителей', 'Материалы для детей и для родителей, которые занимаются с ними.'),

  ...['Россия', 'Сибирь', 'ПФО и Урал', 'Юг и Кавказ', 'Беларусь', 'Украина', 'Латвия', 'Литва', 'Германия', 'Англия', 'Европа', 'Америка']
    .map((n, i) => P('land-' + i, 'land', n, 'mapPin', 'join', 'Группа региона', `Участники платформы: ${n}. Местные встречи, молитва, новости региона.`)),

  P('shield', 'care', 'Молитвенный щит', 'shield', 'join', 'Сюда приносят молитвенные нужды', 'Сюда приносят молитвенные нужды — за вас будут молиться вместе.'),
  P('besedka', 'care', 'Беседка', 'chat', 'join', 'Общение и свидетельства', 'Общение и свидетельства. Место, где можно просто быть с людьми.'),
  P('stories', 'care', 'Свидетельства', 'sparkles', 'open', 'Истории участников', 'Истории участников о том, что Бог сделал в их жизни.'),

  P('school', 'study', 'Школа «Апостольско-пророческая культура»', 'cap', 'join', 'Модули и эфиры школы', 'Учебные модули и эфиры школы. Для тех, кто хочет расти системно, а не урывками.'),
  P('library', 'study', 'Небесная библиотека', 'book', 'open', 'Материалы в своём темпе', 'Материалы для самостоятельного изучения в своём темпе.'),

  P('prophecies', 'records', 'Пророчества с эфиров', 'mic', 'open', 'Аудио личных пророчеств', 'Аудио личных пророчеств, сказанных на эфирах.'),
  P('tech', 'records', 'Записи эфиров', 'play', 'open', 'Полные эфиры и нарезки', 'Полные записи эфиров и короткие нарезки.'),

  P('contact', 'info', 'Группа для новеньких', 'door', 'join', 'Помогут найти своё место', 'Подключение новых участников: расскажите, что ищете, — подскажут, куда идти дальше.'),
  P('portal', 'info', 'Конференции по странам', 'globe', 'open', 'Анонсы конференций', 'Анонсы конференций в разных странах.'),
  P('youtube', 'info', 'Видео платформы', 'play', 'open', 'Открытые эфиры и проповеди', 'Открытые эфиры и проповеди.'),
  P('news', 'info', 'Канал платформы', 'megaphone', 'open', 'Главные новости и анонсы', 'Главные новости и анонсы платформы.'),
];
const PLACE = Object.fromEntries(PLACES.map(p => [p.id, p]));
const inSphere = id => PLACES.filter(p => p.sphere === id);

const ENTRY = {
  signup: { word: 'по записи', icon: 'calendarCheck', btn: 'Записаться', steps: ['Выберите удобное время', 'Оставьте пару слов, о чём молиться', 'Служитель напишет вам в Telegram'] },
  join: { word: 'по заявке', icon: 'userPlus', btn: 'Подать заявку', steps: ['Нажмите «Подать заявку»', 'Координатор одобрит её', 'Ссылка на чат придёт сюда же'] },
  open: { word: 'открыто', icon: 'send', btn: 'Открыть канал', steps: ['Нажмите «Открыть канал»', 'Канал откроется в Telegram — подписка по желанию'] },
};
const entryTag = e => `<span class="entry ${e}">${icon(ENTRY[e].icon)}${ENTRY[e].word}</span>`;
const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; return n + ' ' + (m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many); };
const countWord = id => id === 'land' ? plural(inSphere(id).length, 'регион', 'региона', 'регионов') : id === 'ministry' ? plural(inSphere(id).length, 'служение', 'служения', 'служений') : plural(inSphere(id).length, 'место', 'места', 'мест');

const placeRow = p => `<button class="row" data-go="place:${p.id}">
  <span class="badge-ico">${icon(p.icon)}</span>
  <span class="row-main"><span class="row-title">${p.name}</span><span class="row-sub" style="display:block">${p.line}</span></span>
  ${entryTag(p.entry)}</button>`;

/* ===== Экраны за тапом ===== */
function SPHERE_SCREEN(id) {
  const s = SPHERE[id];
  return `<div class="topbar"><button class="back" data-back>${icon('back')}Сферы</button></div>
  <header class="screen-head"><span class="badge-ico">${icon(s.icon)}</span>
    <h1 class="screen-title">${s.name}</h1><p class="screen-sub">${s.lead}. ${countWord(id)}.</p></header>
  <div class="list">${inSphere(id).map(placeRow).join('')}</div>
  <p class="sample">Прототип · описания — пример</p>`;
}
function PLACE_SCREEN(id) {
  const p = PLACE[id], e = ENTRY[p.entry];
  return `<div class="topbar"><button class="back" data-back>${icon('back')}Назад</button></div>
  <header class="screen-head"><span class="badge-ico">${icon(p.icon)}</span>
    <h1 class="screen-title">${p.name}</h1><p class="screen-sub">${SPHERE[p.sphere].name} · ${entryTag(p.entry)}</p></header>
  <p class="about">${p.about}</p>
  <section class="howto"><h3>Как войти</h3><ol>${e.steps.map(s => `<li>${s}</li>`).join('')}</ol></section>
  <div class="btn-wrap"><button class="btn" data-toast="Прототип: ${e.btn.toLowerCase()} пока нельзя">${icon(e.icon)}${e.btn}</button></div>
  <p class="sample">Прототип · описания — пример</p>`;
}
const STUBS = {
  today: { title: 'Сегодня', icon: 'sun', h: 'Сегодня эфиров нет', p: 'Когда ваши группы объявят эфир или встречу, они появятся здесь.', btn: 'Выбрать группы', go: 'tab:spheres' },
  mine: { title: 'Служения', icon: 'calendarCheck', h: 'Вы пока никуда не записаны', p: 'Запись к служению — два шага: выбрать служение и удобное время.', btn: 'Смотреть служения', go: 'sphere:ministry' },
  me: { title: 'Моё', icon: 'user', h: 'Здесь будут ваши группы', p: 'Подайте заявку в группу — и она появится здесь, рядом с ближайшими эфирами.', btn: 'Найти свою группу', go: 'tab:spheres' },
};
const STUB_SCREEN = k => { const s = STUBS[k]; return `<section class="empty"><h1 class="empty-head">${s.title}</h1>
  <div class="empty-body"><span class="empty-ico">${icon(s.icon)}</span><h2>${s.h}</h2><p>${s.p}</p>
  <button class="btn" data-go="${s.go}">${s.btn}</button></div></section>`; };

/* ===== Каркас, меню, переходы ===== */
const TABS = [['spheres', 'Сферы', 'compass'], ['today', 'Сегодня', 'sun'], ['mine', 'Служения', 'calendarCheck'], ['me', 'Моё', 'user']];
const state = { tab: 'spheres', stack: [] };
const TG = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(TG && TG.platform && TG.platform !== 'unknown');

function render() {
  const view = document.getElementById('view');
  const top = state.stack[state.stack.length - 1];
  if (top) view.innerHTML = top[0] === 'sphere' ? SPHERE_SCREEN(top[1]) : PLACE_SCREEN(top[1]);
  else view.innerHTML = state.tab === 'spheres' ? HOME() : STUB_SCREEN(state.tab);
  view.scrollTop = 0;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab === state.tab ? 'page' : 'false'));
  if (IN_TG && TG.BackButton) state.stack.length ? TG.BackButton.show() : TG.BackButton.hide();
  if (window.AFTER_HOME && !top && state.tab === 'spheres') AFTER_HOME();
}
function go(target) {
  const [kind, id] = target.split(':');
  if (kind === 'tab') { state.tab = id; state.stack = []; }
  else { if (kind === 'sphere' && state.tab !== 'spheres') { state.tab = 'spheres'; state.stack = []; } state.stack.push([kind, id]); }
  render();
}
function back() { state.stack.pop(); render(); }
let toastT;
function toast(msg) {
  const t = document.querySelector('.toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
}

document.addEventListener('DOMContentLoaded', () => {
  const q = new URLSearchParams(location.search).get('theme');
  if (q === 'light' || q === 'dark') document.documentElement.dataset.scheme = q;
  else if (IN_TG) document.documentElement.dataset.scheme = TG.colorScheme === 'light' ? 'light' : 'dark';
  document.getElementById('app').insertAdjacentHTML('beforeend',
    `<nav class="tabbar" aria-label="Разделы">${TABS.map(([k, l, i]) => `<button class="tab" data-tab="${k}">${icon(i)}<span>${l}</span></button>`).join('')}</nav><div class="toast" role="status"></div>`);
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-go],[data-tab],[data-back],[data-toast],[data-jump]');
    if (!el) return;
    if (el.dataset.tab) go('tab:' + el.dataset.tab);
    else if (el.dataset.go) go(el.dataset.go);
    else if (el.hasAttribute('data-back')) back();
    else if (el.dataset.toast) toast(el.dataset.toast);
    else if (el.dataset.jump) { const s = document.getElementById(el.dataset.jump); if (s) s.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  });
  document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role=button]')) { ev.preventDefault(); ev.target.click(); } });
  if (IN_TG) {
    try {
      TG.ready(); TG.expand();
      if (TG.isVersionAtLeast('7.7')) TG.disableVerticalSwipes();
      if (TG.isVersionAtLeast('8.0') && /ios|android/.test(TG.platform)) TG.requestFullscreen();
      if (TG.isVersionAtLeast('6.1')) { const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); TG.setHeaderColor(bg); TG.setBackgroundColor(bg); }
      TG.BackButton.onClick(back);
    } catch (e) {}
  }
  render();
});

function HOME() {
  return `<header class="chead"><h1>Среда</h1>
    <button class="icon-btn" aria-label="Поиск" data-toast="Прототип: поиск появится в рабочей версии">${icon('search')}</button></header>
  <section class="door">${icon('door')}
    <h2>Впервые здесь?</h2>
    <p>Расскажите, что ищете, — в группе для новеньких подскажут, куда идти дальше.</p>
    <button class="btn" data-go="place:contact">Начать с группы для новеньких</button>
  </section>
  <nav class="chips" aria-label="Сферы">${SPHERES.map(s => `<button class="chip" data-jump="s-${s.id}">${icon(s.icon)}${s.short}</button>`).join('')}</nav>
  ${SPHERES.map(s => `<section class="sec" id="s-${s.id}">
    <div class="sec-h">${icon(s.icon)}<h2>${s.name}</h2><span>${countWord(s.id)}</span></div>
    ${s.id === 'land'
      ? `<div class="lands">${inSphere('land').map(p => `<button class="land" data-go="place:${p.id}">${p.name}</button>`).join('')}</div>`
      : `<div class="list">${inSphere(s.id).map(placeRow).join('')}</div>`}
  </section>`).join('')}
  <p class="sample">Прототип · описания — пример</p>`;
}

</script>
</body>
</html>
