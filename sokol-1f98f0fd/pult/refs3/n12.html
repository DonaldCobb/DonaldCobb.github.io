<!doctype html>

<body><main class="frag">
<header class="fh"><span class="ref">n12</span><span class="ref">refs3/r12</span><h1>Сетка камер: событие — красной шапкой</h1><button class="theme" type="button" aria-label="Сменить тему">Тема</button></header>
<figure class="stage "><style>.stage>.g4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px;background:var(--s-bg)}.tl{position:relative;border-radius:10px;overflow:hidden;background:var(--s-bg)}.tv{position:absolute;inset:0}.tv img,.tv svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.th{position:absolute;z-index:2;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:7px 10px;background:var(--s-glass);font-size:12px;color:var(--s-ink-2)}.th b{color:var(--s-ink);font-weight:600}.th .d{width:7px;height:7px;border-radius:50%;background:var(--s-ink)}.th .w{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--s-bg);color:var(--s-alert);font:700 12px/1 "Onest",sans-serif;font-style:normal}.al .th{background:var(--s-alert);color:var(--s-bg)}.al .th b{color:var(--s-bg)}</style><div class="layer g4"><div class="tl al"><div class="th"><i class="w">!</i><b>Камера 2, водосток</b><span>Неизвестная машина в зоне</span></div><div class="tv"><img src="img/forest.webp" alt=""><svg viewBox="0 0 960 540"><polygon points="40.0,520.0 330.0,520.0 300.0,330.0 60.0,330.0" class="fal2" /><polygon points="40.0,520.0 330.0,520.0 300.0,330.0 60.0,330.0" class="ka" style="stroke-width:3"/><path d="M82,142V116H108 M224,116H250V142 M250,270V296H224 M108,296H82V270" class="ka"/></svg></div></div><div class="tl"><div class="th"><span class="d"></span><b>Камера 1, въезд</b><span>норма</span></div><div class="tv"><img src="img/site.webp" alt=""><svg viewBox="0 0 960 540"><path d="M4,176V150H30 M232,150H258V176 M258,332V358H232 M30,358H4V332" class="kw"/></svg></div></div><div class="tl"><div class="th"><span class="d"></span><b>Камера 4, отвал</b><span>норма</span></div><div class="tv"><img src="img/field.webp" alt=""><svg viewBox="0 0 960 540"><path d="M600,245V219H626 M756,219H782V245 M782,352V378H756 M626,378H600V352" class="kw"/></svg></div></div><div class="tl"><div class="th"><span class="d"></span><b>Камера 3, дрон</b><span>норма</span></div><div class="tv"><img src="img/drone.webp" alt=""><svg viewBox="0 0 960 540"></svg></div></div></div><figcaption class="lic">Кадры: ŠJů CC BY 4.0; Sounds of Changes CC BY 3.0; KEmel49 CC BY-SA 4.0; bellergy CC0 — Wikimedia Commons</figcaption></figure>
<section class="note"><p><b>Приём.</b> В сетке камер кадр с событием получает красную шапку, остальные спокойные; зона на полу тонирована.</p><p><b>У нас.</b> Пульт на 4 камеры: взгляд сразу падает на ту, где неизвестная машина заехала в зону.</p></section>
</main>
<script>(()=>{const r=document.documentElement,q=new URLSearchParams(location.search).get('theme');if(q)r.dataset.theme=q;
document.querySelector('.theme').onclick=()=>{const d=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=d==='dark'?'light':'dark'};
if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('animateMotion,animate').forEach(a=>a.remove());})()</script>
