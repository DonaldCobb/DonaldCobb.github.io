<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Карта ИИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Карта знаний v3 — универсальный шаблон. Порядок: за 10 секунд (цифра + пять строк с иконками, подробность под раскрытием) → сводка «что есть и чего не хватает» → карта зон → что дальше и куда двигаемся (раскрываются) → карточки зон → «как читать» (раскрывается).
   Иконки — один линейный набор (стиль Lucide, ISC), инлайн, словарь IC в скрипте; у зоны поле icon. */
:root{
  --bg:#edf1ec; --surface:#f8faf7; --fg:#1b2620; --muted:#5d6b63; --line:#cfd8d1; --accent:#2c6a52; --warn:#9a5b12;
  --l0:#f6d5cf; --l0f:#7a2b1f; --l1:#f7e1a8; --l1f:#5e4204; --l2:#b5dd98; --l2f:#1d4510; --l3:#2f8a57; --l3f:#ffffff; --gap:#e0664f; --gapf:#b2402b;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#18211c; --fg:#e2eae4; --muted:#9aa8a0; --line:#2b3831; --accent:#6cc39b; --warn:#e0a54a;
  --l0:#462622; --l0f:#f3b9ae; --l1:#4d3c12; --l1f:#f5d98e; --l2:#2f5a24; --l2f:#d9f2c9; --l3:#5ccb8d; --l3f:#0d1f15; --gap:#f07c64; --gapf:#f39a86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#18211c; --fg:#e2eae4; --muted:#9aa8a0; --line:#2b3831; --accent:#6cc39b; --warn:#e0a54a;
  --l0:#462622; --l0f:#f3b9ae; --l1:#4d3c12; --l1f:#f5d98e; --l2:#2f5a24; --l2f:#d9f2c9; --l3:#5ccb8d; --l3f:#0d1f15; --gap:#f07c64; --gapf:#f39a86; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:22px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow,.lbl,h3{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:700 clamp(30px,8vw,52px)/1.05 var(--f-display);margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
h2{font:700 19px/1.2 var(--f-display);margin:0}
.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
/* иконки */
.ic{width:24px;height:24px;flex:none;display:block}
.fi{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.fi .ic{width:24px;height:24px}
.fi.gp{color:var(--gapf);background:color-mix(in srgb,var(--gap) 15%,transparent)}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s;flex:none}
details[open]>summary .chev{transform:rotate(180deg)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
/* за 10 секунд */
.ten{display:grid;gap:12px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.big{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:.5em;color:var(--muted);font-weight:500}
.hero .lbl{font-size:12px}
.hero-l{display:grid;gap:8px}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font:500 12px/1.3 var(--f-mono);padding:4px 8px;border-radius:6px;background:var(--l1);color:var(--l1f)}
.badge.gp{background:color-mix(in srgb,var(--gap) 16%,transparent);color:var(--gapf);cursor:help}
.badge .ic{width:15px;height:15px}
.five{margin:0;padding:4px 16px}
.f{border-bottom:1px solid var(--line)} .f:last-child{border-bottom:0}
.f>summary,.f>.fs{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;padding:9px 0;min-height:58px;position:relative}
.f>summary .chev{position:absolute;right:0;top:11px}
.fx{min-width:0;display:grid;gap:1px}
.fl{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ft{font-size:14.5px;line-height:1.35;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f.goal .ft{font-weight:600}
.fb{margin:0;padding:0 0 12px 52px;font-size:14.5px;line-height:1.45}
.trend{margin:2px 0 0}
.trend svg{display:block;width:100%;height:auto;overflow:visible}
.trend figcaption{font-size:11.5px;color:var(--muted)}
/* сводка */
.sum{display:grid;gap:10px}
.sum .rows{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.srow{display:grid;grid-template-columns:minmax(0,13em) 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:2px 0;text-align:left;cursor:pointer}
.srow .nm{display:flex;gap:9px;align-items:center;min-width:0;font:500 14px/1.25 var(--f-body)}
.srow .nm .ic{color:var(--accent);width:24px;height:24px}
.srow .nm small{display:block;font:500 10px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.sbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--line);gap:2px}
.sbar i{display:block;height:100%;min-width:3px}
.sbar .g{background:repeating-linear-gradient(135deg,var(--gap) 0 5px,color-mix(in srgb,var(--gap) 55%,var(--surface)) 5px 9px)}
.srow .cnt{font:500 12px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.srow .cnt b{color:var(--gapf);font-weight:600}
.key{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);line-height:1.3}
.key span{display:inline-flex;align-items:center;gap:4px}
.key i{width:10px;height:10px;border-radius:3px;display:inline-block}
.key .g{background:repeating-linear-gradient(135deg,var(--gap) 0 3px,color-mix(in srgb,var(--gap) 55%,var(--surface)) 3px 5px)}
@media (max-width:520px){.srow{grid-template-columns:1fr auto}.srow .sbar{grid-column:1/-1;order:3}}
/* карта зон */
.mapsec{display:grid;gap:10px}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.chip .ic{width:16px;height:16px}
.chip[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.band{display:grid;gap:6px}
.tiles{display:grid;gap:6px;grid-template-columns:repeat(6,1fr)}
.tile{border:0;border-radius:9px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0}
.tile .tt{display:flex;justify-content:space-between;align-items:start;gap:6px;font:500 12px/1 var(--f-mono);opacity:.95}
.tile .ic{width:28px;height:28px}
.tile b{font:600 14px/1.2 var(--f-body);overflow-wrap:break-word;hyphens:auto}
.w3 .tile{grid-column:span 3;min-height:108px}
.w3 .tile b{font-size:15.5px}
.w3 .tile .ic{width:32px;height:32px}
.w2 .tile{grid-column:span 2;min-height:96px}
.w1 .tile{grid-column:span 2;min-height:80px;padding:8px}
.w1 .tile b{font-size:13px}
.w1 .tile .ic{width:24px;height:24px}
.tile.dim{opacity:.35}
.L0{background:var(--l0);color:var(--l0f)} .L1{background:var(--l1);color:var(--l1f)} .L2{background:var(--l2);color:var(--l2f)} .L3{background:var(--l3);color:var(--l3f)}
/* что дальше и куда двигаемся */
.dec{display:grid;gap:14px}
.xl{margin:8px 0 0;padding:0;list-style:none;display:grid}
.xl>li{border-bottom:1px solid var(--line)} .xl>li:last-child{border-bottom:0}
.xd>summary{display:grid;grid-template-columns:40px minmax(0,1fr) 18px;gap:12px;align-items:center;padding:10px 0;min-height:60px}
.xh{min-width:0;display:grid;gap:5px;justify-items:start}
.xt{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xd[open] .xt{display:block;-webkit-line-clamp:unset}
.xb{display:grid;gap:6px;padding:0 0 12px 52px;font-size:14px}
.xb p{margin:0}
.xb .k{font:500 11px/1 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:5px}
.why{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.eff,.stat{font:500 11px/1.2 var(--f-mono);padding:4px 7px;border-radius:5px;white-space:nowrap}
.eff{border:1px solid var(--line);color:var(--muted)}
.stat{background:var(--l0);color:var(--l0f)}
.stat.s-выбрано{background:var(--l3);color:var(--l3f)} .stat.s-предлагаем{background:var(--l1);color:var(--l1f)} .stat.draft{background:transparent;border:1px dashed var(--warn);color:var(--warn)}
/* карточки зон */
.cards{display:grid;gap:10px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:12px;scroll-margin-top:12px}
.zone.flash{box-shadow:0 0 0 2px var(--accent)}
.zt{all:unset;box-sizing:border-box;width:100%;display:grid;gap:8px;padding:14px 16px;cursor:pointer}
.zt:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.zh{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.zh h2{font:600 18px/1.25 var(--f-body)}
.lvl{font:500 12px/1 var(--f-mono);padding:5px 8px;border-radius:5px;white-space:nowrap}
.zm{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.zm b{color:var(--gapf);font-weight:600}
.up{color:var(--accent)} .down{color:var(--warn)}
.segs{display:flex;gap:2px;height:8px}
.segs i{flex:1;border-radius:2px;min-width:3px}
.more{display:flex;align-items:center;gap:4px;font:500 12px/1 var(--f-mono);color:var(--accent)}
.more .chev{width:14px;height:14px;color:var(--accent)}
.zone.open .more{display:none}
.zb{display:none;padding:0 16px 16px;gap:14px}
.zone.open .zb{display:grid}
.zb ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.it{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px;line-height:1.4}
.it .ic{width:18px;height:18px;margin-top:2px;color:var(--accent)}
.it small{display:block;color:var(--muted);font-size:12.5px}
.it .lv{font:500 11px/1 var(--f-mono);color:var(--muted)}
.zb details>summary{font-size:14px;color:var(--muted);min-height:32px;display:flex;align-items:center;gap:4px}
.zb details>summary .chev{width:15px;height:15px}
.gap{border-left:3px solid var(--warn);padding:2px 0 2px 10px;display:grid;gap:3px;font-size:15px}
.gap .eff{margin-left:6px;padding:2px 5px}
.gap .nx{font-size:14px}
.gap .wh{font-size:12.5px;color:var(--muted)}
.src{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
footer{font-size:13px;color:var(--muted);max-width:72ch}
footer summary{display:inline-flex;align-items:center;gap:8px;min-height:40px;font-size:14px}
footer summary .ic{width:20px;height:20px}
footer p{margin:6px 0 0}
@media (min-width:720px){
  .wrap{padding-top:32px;gap:30px}
  .ten{grid-template-columns:minmax(260px,1fr) 2fr;align-items:start}
  .tiles{grid-template-columns:repeat(12,1fr)}
  .w3 .tile{grid-column:span 4;min-height:120px} .w2 .tile{grid-column:span 3} .w1 .tile{grid-column:span 2}
  .dec{grid-template-columns:1fr 1fr;align-items:start}
  .cards{grid-template-columns:1fr 1fr;align-items:start}
}
@media (max-width:719px){.w2 .tile{padding:8px}.w2 .tile b{font-size:13px}}
@media (max-width:380px){.big{font-size:38px}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
@media (prefers-reduced-motion:no-preference){.zone{transition:box-shadow .3s}}
@media (forced-colors:active){.tile,.segs i{border:1px solid CanvasText}}
</style>

<div class="wrap" lang="ru">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
  </header>

  <section class="ten" aria-label="Главное за 10 секунд">
    <div class="panel hero-l">
      <div class="hero"><div class="big n" id="big"></div><div class="lbl" id="biglbl"></div></div>
      <div class="deltas" id="delta"></div>
      <figure class="trend"><svg id="chart" role="img"></svg><figcaption id="chartcap"></figcaption></figure>
    </div>
    <div class="five panel" id="five"></div>
  </section>

  <section class="panel sum" aria-label="Сводка по зонам">
    <h2>Что есть и чего не хватает</h2>
    <div class="key" id="skey"></div>
    <ul class="rows" id="sumrows"></ul>
  </section>

  <section class="mapsec" aria-label="Карта зон">
    <div class="mhead"><h2>Карта зон</h2><div class="key" id="legend"></div></div>
    <div class="chips" id="kinds" role="group" aria-label="Фильтр по виду пункта"></div>
    <div id="bands" style="display:grid;gap:14px"></div>
  </section>

  <section class="dec">
    <div class="panel"><h2>Что дальше</h2><ol class="xl" id="top"></ol></div>
    <div class="panel"><h2>Куда двигаемся</h2><ul class="xl" id="dirs"></ul></div>
  </section>

  <section class="cards" id="cards" aria-label="Зоны подробно"></section>

  <footer id="foot"></footer>
</div>

  "flame":'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  "users":'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  "wallet":'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  "zap":'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  "sprout":'<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
  "house":'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  "wifi":'<path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/>',
  "heart-pulse":'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  "shield":'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  "graduation-cap":'<path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>'
};
const ico = (n, cls = "ic") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || IC.circle}</svg>`;
const CHEV = ico("chevron-down", "chev");
const W = ["пусто","начато","в работе","освоено"];
const KN = {"знание":"знания","человек":"люди","инструмент":"инструменты","ресурс":"ресурсы"};
const KI = {"знание":"book-open","человек":"user","инструмент":"wrench","ресурс":"package"};
const LVN = ["нет","слышали","пробовали / частично","освоено / есть"];
const EFF = {S:"S · часы", M:"M · дни", L:"L · недели"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const dt = s => (s||"").split("-").reverse().join(".");
const lvOf = m => m < .5 ? 0 : m < 1.5 ? 1 : m < 2.5 ? 2 : 3;
const icon = k => ico(KI[k]);
const zi = z => ico(z.icon);
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
const dots = w => "●".repeat(w) + "○".repeat(3 - w);

document.title = M.title;
$("eyebrow").textContent = `${M.eyebrow || "Карта знаний"} · ${dt(M.updated)}`;
$("title").textContent = M.title;

/* --- за 10 секунд --- */
const T = M.totals;
$("big").innerHTML = `${T.ok}<small> из ${T.total}</small>`;
$("biglbl").textContent = "освоено";
$("biglbl").title = "Пунктов на уровне «пробовали» и выше";
const P = M.prev, gapTip = "Новые пробелы — рост знания, а не провал";
let delta = "";
if (P) {
  const k = T.gaps - P.gaps, d = T.ok - P.ok;
  delta = `<span class="badge" title="Освоено с ${dt(P.date)}: было ${P.ok}, стало ${T.ok}">${d >= 0 ? "+" : "−"}${Math.abs(d)} с ${dt(P.date).slice(0,5)}</span>`;
  delta += `<span class="badge gp" title="${gapTip}${k ? `; было ${P.gaps}` : ""}">${ico("puzzle")}${T.gaps} ${plural(T.gaps,"пробел","пробела","пробелов")}${k > 0 ? ` · +${k} новых` : ""}</span>`;
} else delta = `<span class="badge gp" title="${gapTip}">${ico("puzzle")}${T.gaps} ${plural(T.gaps,"пробел","пробела","пробелов")}</span>`;
$("delta").innerHTML = delta;
const F = M.five, FS = M.fiveShort || {};
$("five").innerHTML = [["goal","Цель","target",F.goal],["where","Где мы","compass",F.where],["have","Что имеем","circle-check",F.have],["missing","Чего не хватает","puzzle",F.missing],["heading","Куда двигаемся","signpost",F.heading]]
  .map(([c,l,i,t]) => { const s = FS[c] || t, head = `<span class="fi${c === "missing" ? " gp" : ""}">${ico(i)}</span><span class="fx"><span class="fl">${l}</span><span class="ft">${esc(s)}</span></span>`;
    return s === t && s.length <= 34 ? `<div class="f ${c}"><div class="fs">${head}</div></div>`
      : `<details class="f ${c}"><summary>${head}${CHEV}</summary><p class="fb">${esc(t)}</p></details>`; }).join("");

/* --- график хода: освоено и всего пунктов, одна шкала --- */
(function chart(){
  const H = M.history || [], w = 320, h = 96, pl = 6, pr = 34, pt = 14, pb = 18;
  const max = Math.max(1, ...H.map(r => r.total));
  const x = i => H.length < 2 ? (pl + w - pr) / 2 : pl + i * (w - pl - pr) / (H.length - 1);
  const y = v => pt + (h - pt - pb) * (1 - v / max);
  const line = (k, st) => H.length > 1 ? `<polyline fill="none" ${st} points="${H.map((r,i)=>`${x(i)},${y(r[k])}`).join(" ")}"/>` : "";
  const last = H.length - 1, r = H[last] || {ok:0,total:0};
  let s = `<line x1="${pl}" x2="${w-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  s += line("total", `stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"`);
  s += line("ok", `stroke="var(--accent)" stroke-width="2"`);
  H.forEach((q,i) => { s += `<circle cx="${x(i)}" cy="${y(q.ok)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>${dt(q.date)}: освоено ${q.ok} из ${q.total}, пробелов ${q.gaps}</title></circle>`; });
  if (H.length) {
    s += `<text x="${x(last)+8}" y="${y(r.ok)+4}" font-size="11" fill="var(--fg)" font-family="var(--f-mono)">${r.ok}</text>`;
    s += `<text x="${x(last)+8}" y="${y(r.total)+4}" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${r.total}</text>`;
    if (H.length > 1) s += `<text x="${x(0)}" y="${h-3}" font-size="10" fill="var(--muted)">${dt(H[0].date).slice(0,5)}</text>`;
    s += `<text x="${x(last)}" y="${h-3}" font-size="10" fill="var(--muted)" text-anchor="${H.length>1?"end":"middle"}">${dt(r.date).slice(0,5)}</text>`;
  }
  const c = $("chart"); c.setAttribute("viewBox", `0 0 ${w} ${h}`);
  c.setAttribute("aria-label", "Ход по снимкам: " + H.map(q => `${dt(q.date)} — ${q.ok} из ${q.total}`).join("; "));
  c.innerHTML = s;
  if (H.length < 2) c.setAttribute("hidden", "");  /* одна точка — пустой график, только подпись */
  $("chartcap").textContent = H.length > 1 ? "Ход: сплошная — освоено, пунктир — всего" : "График хода — со второго снимка";
})();

/* --- тепловая сетка с фильтром по виду --- */
const kindsPresent = Object.keys(KN).filter(k => Z.some(z => z.items.some(i => i.kind === k)));
let kind = "";
try { const s = localStorage.getItem("kmap-kind:" + M.title); if (kindsPresent.includes(s)) kind = s; } catch (e) {}
$("legend").innerHTML = W.map((w,i) => `<span><i class="L${i}"></i>${w}</span>`).join("");
function stats(z) {
  const it = z.items.filter(i => !kind || i.kind === kind);
  const mean = it.length ? it.reduce((a,i) => a + i.level, 0) / it.length : 0;
  return {it, ok: it.filter(i => i.level >= 2).length, n: it.length, lv: it.length ? lvOf(mean) : 0, mean};
}
function trend(z) {
  if (!z.prev || kind) return "";
  const d = z.ok - z.prev.ok;
  return d > 0 ? `<span class="up">↑ ${z.prev.ok}→${z.ok}</span>` : d < 0 ? `<span class="down">↓ ${z.prev.ok}→${z.ok}</span>` : "";
}
function renderKinds() {
  const el = $("kinds");
  if (kindsPresent.length < 2) { el.innerHTML = `<span class="muted" style="font-size:13px">Все пункты — ${esc(KN[kindsPresent[0]] || "")}</span>`; return; }
  el.innerHTML = [["", "Все"], ...kindsPresent.map(k => [k, KN[k]])].map(([k,l]) =>
    `<button type="button" class="chip" data-k="${esc(k)}" aria-pressed="${k === kind}">${k ? icon(k) : ""}${esc(l)} <span class="n muted">${Z.reduce((a,z) => a + z.items.filter(i => !k || i.kind === k).length, 0)}</span></button>`).join("");
}
function renderSum() {
  const seg = [["L3","освоено"],["L2","пробовали"],["L1","слышали"],["L0","нет"]];
  $("skey").innerHTML = seg.map(([c,l]) => `<span><i class="${c}"></i>${l}</span>`).join("") + `<span><i class="g"></i>пробелы</span><span>●●● вес</span>`;
  const rows = Z.map(z => { const s = stats(z), g = kind ? 0 : z.gaps.length, c = [3,2,1,0].map(l => s.it.filter(i => i.level === l).length);
    return {z, s, g, c, tot: s.n + g}; }).filter(r => r.tot)
    .sort((a,b) => b.z.weight - a.z.weight || (b.g / b.tot) - (a.g / a.tot));
  $("sumrows").innerHTML = rows.map(r => `<li><button type="button" class="srow" data-id="${esc(r.z.id)}" aria-label="${esc(r.z.zone)}: есть ${r.s.ok} из ${r.s.n}, не хватает ${r.g}">
    <span class="nm">${zi(r.z)}<span>${esc(r.z.zone)}<small>${dots(r.z.weight)}</small></span></span>
    <span class="sbar">${r.c.map((n,i) => n ? `<i class="L${3-i}" style="flex:${n}" title="${seg[i][1]}: ${n}"></i>` : "").join("")}${r.g ? `<i class="g" style="flex:${r.g}" title="не хватает: ${r.g}"></i>` : ""}</span>
    <span class="cnt">${r.s.ok}/${r.s.n}${r.g ? ` · <b>−${r.g}</b>` : ""}</span></button></li>`).join("");
}
function renderBands() {
  const names = {3:"Главное для цели", 2:"Важно", 1:"Фон"};
  $("bands").innerHTML = [3,2,1].filter(w => Z.some(z => z.weight === w)).map(w => {
    const zs = Z.filter(z => z.weight === w).map(z => [z, stats(z)]).sort((a,b) => b[1].mean - a[1].mean);
    return `<div class="band w${w}"><div class="lbl">${names[w]} · ${dots(w)}</div><div class="tiles">${zs.map(([z,s]) =>
      `<button type="button" class="tile L${s.lv}${s.n ? "" : " dim"}" data-id="${esc(z.id)}" title="${W[s.lv]}" aria-label="${esc(z.zone)}: ${W[s.lv]}, ${s.ok} из ${s.n}"><span class="tt">${zi(z)}<span>${s.ok}/${s.n} ${trend(z)}</span></span><b>${esc(z.zone)}</b></button>`).join("")}</div></div>`;
  }).join("");
}

/* --- что дальше и куда двигаемся: на виду заголовок, иконка и одна метка; остальное — по нажатию --- */
const zById = Object.fromEntries(Z.map(z => [z.id, z]));
const dirIcon = d => { if (d.icon) return d.icon; const p = ((d.needs || [])[0] || "").split(":")[0].trim();
  const z = p && Z.find(z => z.zone.startsWith(p) || z.zone.includes(p)); return z ? z.icon : "signpost"; };
$("top").innerHTML = (M.top || []).map(t => `<li><details class="xd"><summary><span class="fi">${ico((zById[t.zid] || {}).icon)}</span><span class="xh"><span class="xt">${esc(t.text)}</span><span class="eff">${esc(EFF[t.effort] || t.effort)}</span></span>${CHEV}</summary>
  <div class="xb">${t.next && t.next !== t.text ? `<p>→ ${esc(t.next)}</p>` : ""}${t.who ? `<p><span class="k">поможет</span>${esc(t.who)}</p>` : ""}<p class="why">${esc(t.zone)} · ${esc(t.why)}</p></div></details></li>`).join("")
  || `<li class="muted" style="padding:10px 0">Пробелов не записано</li>`;
$("dirs").innerHTML = (M.directions || []).map(d => `<li><details class="xd"><summary><span class="fi">${ico(dirIcon(d))}</span><span class="xh"><span class="xt">${esc(d.name)}</span><span class="stat ${d.draft ? "draft" : "s-" + esc(d.status)}">${esc(d.draft ? "черновик" : d.status)}</span></span>${CHEV}</summary>
  <div class="xb">${d.draft ? `<p class="why">${esc(d.status)}</p>` : ""}${d.gives ? `<p><span class="k">даёт</span>${esc(d.gives)}</p>` : ""}${d.costs ? `<p><span class="k">цена</span>${esc(d.costs)}</p>` : ""}
  ${(d.needs||[]).length ? `<p><span class="k">закрывает</span>${d.needs.map(esc).join(" · ")}</p>` : ""}</div></details></li>`).join("");

/* --- карточки зон --- */
const desktop = matchMedia("(min-width:720px)");
const order = [...Z].sort((a,b) => b.weight - a.weight || a.mean - b.mean);
function renderCards() {
  const openIds = new Set([...document.querySelectorAll(".zone.open")].map(e => e.id.slice(2)));
  $("cards").innerHTML = order.map(z => {
    const s = stats(z), have = s.it.filter(i => i.level >= 2).sort((a,b) => b.level - a.level), low = s.it.filter(i => i.level < 2);
    const segs = [...s.it].sort((a,b) => b.level - a.level).map(i => `<i class="L${i.level}" title="${esc(i.name)}: ${LVN[i.level]}"></i>`).join("");
    const item = i => `<li class="it">${icon(i.kind)}<span>${esc(i.name)} <span class="lv">· ${LVN[i.level]}</span>${i.note || i.source ? `<small>${esc([i.note, i.source && "источник: " + i.source].filter(Boolean).join(" · "))}</small>` : ""}</span></li>`;
    const open = openIds.has(z.id) || (!openIds.size && desktop.matches);
    return `<article class="zone${open ? " open" : ""}" id="c-${esc(z.id)}">
    <button type="button" class="zt" aria-expanded="${open}">
      <span class="zh"><span class="fi">${zi(z)}</span><h2>${esc(z.zone)}</h2><span class="lvl L${s.lv}">${W[s.lv]}</span></span>
      <span class="segs" aria-hidden="true">${segs || '<i class="L0"></i>'}</span>
      <span class="zm"><span title="пробовали и выше">${s.ok}/${s.n} освоено</span>${z.gapsN ? `<span><b>−${z.gapsN}</b> ${plural(z.gapsN,"пробел","пробела","пробелов")}</span>` : ""}<span title="вес ${z.weight} из 3">${dots(z.weight)}</span>${z.prev && !kind ? `<span title="было ${z.prev.ok}/${z.prev.total} → стало ${z.ok}/${z.total}">было ${z.prev.ok}/${z.prev.total} ${trend(z)}</span>` : ""}</span>
      <span class="more">Подробнее ${CHEV}</span>
    </button>
    <div class="zb">
      <div><h3>Где мы</h3><div style="font-size:15px;margin-top:4px">${W[s.lv][0].toUpperCase() + W[s.lv].slice(1)}: ${s.ok} из ${s.n} ${plural(s.n,"пункта","пунктов","пунктов")} на уровне «пробовали» и выше${s.n ? `, средний уровень ${s.mean.toFixed(1).replace(".", ",")} из 3` : ""}.</div></div>
      <div><h3>Что имеем</h3>${have.length ? `<ul>${have.map(item).join("")}</ul>` : `<div class="muted" style="font-size:14px;margin-top:4px">Пока ничего на уровне «пробовали».</div>`}
        ${low.length ? `<details><summary>Слышали или нет — ${low.length} ${CHEV}</summary><ul>${low.map(item).join("")}</ul></details>` : ""}</div>
      ${(z.gaps||[]).length ? `<div><h3>Чего не хватает</h3><ul>${z.gaps.map(g => `<li class="gap"><span>${esc(g.text)}<span class="eff">${esc(g.effort)}</span></span>${g.next && g.next !== g.text ? `<span class="nx">→ ${esc(g.next)}</span>` : ""}${g.who ? `<span class="wh">Кто поможет: ${esc(g.who)}</span>` : ""}</li>`).join("")}</ul></div>` : ""}
      ${(z.sources||[]).length ? `<div class="src">Откуда: ${z.sources.map(esc).join(" · ")}</div>` : ""}
    </div></article>`;
  }).join("");
}
function renderAll() { renderKinds(); renderSum(); renderBands(); renderCards(); }
renderAll();

$("kinds").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; kind = b.dataset.k;
  try { localStorage.setItem("kmap-kind:" + M.title, kind); } catch (er) {} renderAll(); });
const openZone = e => { const b = e.target.closest(".tile,.srow"); if (!b) return;
  const el = $("c-" + b.dataset.id); el.classList.add("open"); el.querySelector(".zt").setAttribute("aria-expanded", "true");
  el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200); };
$("bands").addEventListener("click", openZone); $("sumrows").addEventListener("click", openZone);
$("cards").addEventListener("click", e => { const b = e.target.closest(".zt"); if (!b) return;
  const a = b.closest(".zone"); b.setAttribute("aria-expanded", a.classList.toggle("open")); });

$("foot").innerHTML = `<details><summary>${ico("info")}Как читать ${CHEV}</summary>
<p>Уровень пункта: 0 нет · 1 слышали · 2 пробовали или частично · 3 освоено или есть. Уровень зоны — средний по пунктам: «пусто» до 0,5 · «начато» до 1,5 · «в работе» до 2,5 · «освоено» выше. Главная цифра — сколько пунктов на уровне 2 и выше; процентов нет: новый пробел — это рост знания, а не провал. Размер плитки и точки ●●● — вес зоны для цели.</p>
<p><b>«Что дальше»</b> — по одному пробелу из зоны, порядок: вес зоны × (3 − уровень зоны), делённое на усилие (S — 1, M — 1,5, L — 2,5).</p>${M.footer ? `<p>${esc(M.footer)}</p>` : ""}</details>`;
</script>
</body></html>
