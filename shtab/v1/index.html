<!doctype html>
<html lang="ru"><head><meta charset="utf-8">

<title>Штаб</title>
<!-- Штаб v1 · просмотр: дела — зашифрованным снимком в payload, ключ — во фрагменте ссылки; запись невозможна (build-view.py). -->
<style>
/* Библиотека компонентов Штаба «как Things 3 и Telegram» · v2 · 2026-11-10 — один набор токенов на весь Штаб
   Источник правды: токены → компоненты (.ds-*) → экраны. Экраны не пишут своих цветов и размеров.
   Токены живут на [data-theme], поэтому любой контейнер можно перевести в светлую или тёмную тему (витрина показывает обе).
   Шкала: 6 ролей (title1 · title2 · body · sub · foot · tab), начертания 400 · 600 · 700, одна палитра. Источники — ux-dela/things-final/system.md.
   Правило: hex, rgba и кегли пишутся только в разделе 1 (токены); дальше — var(--ds-*). Проверяет bin/type-lint. */

/* ---------- 1. Токены ---------- */
:root, [data-theme="light"] {
  --ds-bg: #FFFFFF; --ds-surface: #F2F2F7; --ds-surface-2: #E9E9EE;
  --ds-ink: #1A1A1C; --ds-ink-2: #6C6C70; --ds-ink-3: #8E8E93;       /* ink-3 — только значки и неважное, не текст дела */
  --ds-line: #E3E3E6; --ds-cb: #BFBFC2; --ds-cbox: #8E8E93;
  --ds-accent: #2F6FE0; --ds-accent-text: #2560C8; --ds-ibtn-on: #2560C8; --ds-on-accent: #FFFFFF; --ds-accent-soft: rgba(47, 111, 224, .10);
  --ds-due: #B0174C; --ds-due-soft: rgba(176, 23, 76, .10);
  --ds-warn: #9A5B00; --ds-warn-soft: rgba(179, 107, 0, .12);
  --ds-ok: #1F7A34; --ds-ok-soft: rgba(39, 138, 60, .12);
  --ds-star: #FCD400;
  --ds-track: #E9E9EE; --ds-fill: #8E8E93;                              /* полоса прогресса: дорожка и нейтральная заливка */
  --ds-on-solid: #FFFFFF; --ds-switch-on: #34C759; --ds-knob: #FFFFFF; --ds-knob-shadow: 0 2px 4px rgba(0, 0, 0, .25);
  --ds-shine: rgba(255, 255, 255, .42); --ds-stripe: rgba(127, 127, 127, .18);
  --ds-ic-green: #34A853; --ds-ic-teal: #3AA89F; --ds-ic-purple: #8A6FE0; --ds-ic-orange: #E08A2F;   /* цвет значка заголовка экрана */
  --ds-s-biz: #6B4FE0; --ds-s-dukh: #A947C2; --ds-s-semya: #D24F77; --ds-s-lyudi: #D2743A;   /* сферы колеса — данные, только на колесе и точках сфер */
  --ds-s-zdorovye: #18978A; --ds-s-dengi: #A9851A; --ds-s-otdykh: #4C9439;
  --ds-bar: rgba(255, 255, 255, .92); --ds-scrim: rgba(20, 20, 24, .32);
  --ds-seg-on: #FFFFFF; --ds-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 .5px rgba(0, 0, 0, .04);
  --ds-sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .16);
  color-scheme: light;
}
[data-theme="dark"] {
  --ds-bg: #1B1B1D; --ds-surface: #2A2A2D; --ds-surface-2: #353539;
  --ds-ink: #F2F2F5; --ds-ink-2: #A0A0A6; --ds-ink-3: #8E8E93;
  --ds-line: #3A3A3D; --ds-cb: #5A5A5E; --ds-cbox: #6E6E73;
  --ds-accent: #4D93FF; --ds-accent-text: #4D93FF; --ds-on-accent: #0B1A33; --ds-accent-soft: rgba(77, 147, 255, .16);
  --ds-due: #FF5C86; --ds-due-soft: rgba(255, 92, 134, .15);
  --ds-warn: #FFB340; --ds-warn-soft: rgba(255, 179, 64, .15);
  --ds-ok: #5DD27A; --ds-ok-soft: rgba(93, 210, 122, .15);
  --ds-star: #FFD60A;
  --ds-track: #353539; --ds-fill: #8E8E93;
  --ds-shine: rgba(255, 255, 255, .30); --ds-stripe: rgba(127, 127, 127, .24);
  --ds-s-biz: #9580FF; --ds-s-dukh: #D58BEA; --ds-s-semya: #F27E9F; --ds-s-lyudi: #F4A26E;
  --ds-s-zdorovye: #45C4B2; --ds-s-dengi: #DDBB55; --ds-s-otdykh: #86C474;
  --ds-bar: rgba(27, 27, 29, .92); --ds-scrim: rgba(0, 0, 0, .55);
  --ds-seg-on: #4A4A4F; --ds-shadow: 0 0 0 .5px rgba(255, 255, 255, .06);
  --ds-sheet-shadow: 0 -8px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
:root {
  /* шрифт и шкала А (Юлай 14056): 34 · 17 · 13, два веса. Начертания: 400 текст, метки, плитки, подписи · 600 кнопки и выделенное в строке · 700 заголовки (экрана, раздела, карточки) и бейдж; 500 не используется */
  --ds-font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --ds-fs-title1: 34px; --ds-lh-title1: 40px; --ds-ls-title1: -.6px;   /* заголовок экрана, крупная сумма · 700 */
  --ds-fs-title2: 17px; --ds-lh-title2: 22px; --ds-ls-title2: 0px;    /* заголовок блока, листа, связки · 700 */
  --ds-fs-body: 17px;   --ds-lh-body: 22px;                            /* строка, кнопка, заголовок раздела */
  --ds-fs-sub: 13px;    --ds-lh-sub: 18px;                             /* серая строка под строкой, подзаголовок, пустое состояние */
  --ds-fs-foot: 13px;   --ds-lh-foot: 18px; --ds-ls-caps: .3px;        /* метки, сроки, счётчики, сноски, подписи полей (капсом — 600 и ls-caps) */
  --ds-fs-tab: 13px;    --ds-lh-tab: 16px;                             /* только подписи вкладок и бейдж */
  /* отступы 4-8-12-16-24-32; касание ≥ 44 */
  --ds-sp-1: 4px; --ds-sp-2: 8px; --ds-sp-3: 12px; --ds-sp-4: 16px; --ds-sp-5: 24px; --ds-sp-6: 32px;   /* шкала вертикальных отступов (Юлай 14122) */
  --ds-gutter: 16px; --ds-touch: 44px;
  --ds-r-box: 12px; --ds-r-card: 14px; --ds-r-sheet: 16px; --ds-r-ctl: 12px; --ds-r-pill: 999px;
  --ds-t: .18s;
}

/* ---------- 2. Основа ---------- */
.ds-scope { background: var(--ds-bg); color: var(--ds-ink); font-family: var(--ds-font); font-size: var(--ds-fs-body); line-height: var(--ds-lh-body);
  font-weight: 400; font-optical-sizing: auto; font-variant-numeric: normal; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
.ds-scope *, .ds-scope *::before, .ds-scope *::after { box-sizing: border-box; }
:where(.ds-scope) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:where(.ds-scope) :is(p, h1, h2, h3, ul) { margin: 0; padding: 0; }
:where(.ds-scope) ul { list-style: none; }
:where(.ds-scope) :focus-visible { outline: 2px solid var(--ds-accent); outline-offset: 2px; border-radius: 6px; }
.ds-svg { width: 24px; height: 24px; flex: none; display: block; }

/* ---------- 3. Большой заголовок экрана ---------- */
.ds-largetitle { padding: 4px 0 12px; }
.ds-largetitle-row { display: flex; align-items: center; gap: 12px; }
.ds-largetitle h1 { font-size: var(--ds-fs-title1); line-height: var(--ds-lh-title1); font-weight: 700; letter-spacing: var(--ds-ls-title1); text-wrap: balance; }
.ds-largetitle .ds-ti { width: 28px; height: 28px; flex: none; display: block; }
.ds-largetitle .ds-sub { margin: 2px 0 0 40px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); }
.ds-largetitle.ds-noicon .ds-sub { margin-left: 0; }
.ds-kicker { display: flex; align-items: center; gap: 8px; padding: 8px 0 10px; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); }
.ds-kicker .ds-ti { width: 16px; height: 16px; }
.ds-largetitle.ds-answer { position: relative; }
.ds-largetitle.ds-answer .ds-largetitle-tools { position: absolute; top: 0; right: 0; margin: 0; }
.ds-largetitle.ds-answer .ds-sub { margin: 4px 0 0; font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); }
.ds-largetitle-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.ds-ibtn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 36px; height: 36px; padding: 0 9px; border-radius: 18px; background: var(--ds-surface); color: var(--ds-ink-2); font-size: var(--ds-fs-foot); font-weight: 400; transition: background var(--ds-t), color var(--ds-t); }
.ds-ibtn svg { width: 19px; height: 19px; flex: none; }
.ds-ibtn::before { content: ''; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: 44px; transform: translate(-50%, -50%); }   /* зона нажатия не меньше 44×44 при круге 36 */
.ds-ibtn.has-label { padding: 0 11px 0 9px; }
.ds-ibtn[aria-pressed="true"] { background: var(--ds-accent-soft, var(--ds-surface)); color: var(--ds-ibtn-on, var(--ds-accent)); }
.ds-ibtn:active { opacity: .6; }

/* ---------- 4. Заголовок раздела и группа ---------- */
.ds-group { margin: 0 0 24px; }
.ds-section { margin-top: 32px; display: flex; align-items: center; gap: 8px; min-height: 34px; padding-bottom: 6px; border-bottom: 1px solid var(--ds-line); }
.ds-section .ds-gi { width: 18px; height: 18px; flex: none; display: block; }
.ds-section h2 { font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); font-weight: 700; }
.ds-section .ds-count { margin-left: auto; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); font-weight: 400; }
.ds-footnote { color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); margin: 0 0 20px; }
.ds-empty { padding: 14px 0; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); }

/* ---------- 5. Строка дела ---------- */
.ds-list { list-style: none; }
.ds-row { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: start; column-gap: 0; min-height: 44px; border-bottom: 1px solid transparent; }
.ds-row + .ds-row { }
.ds-check { grid-column: 1; width: var(--ds-touch); height: var(--ds-touch); margin-left: -13px; display: grid; place-items: center; }
.ds-check i { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--ds-cbox); display: block; background: transparent; transition: background var(--ds-t), border-color var(--ds-t); position: relative; }
.ds-check[aria-pressed="true"] i { background: var(--ds-accent); border-color: var(--ds-accent); }
.ds-check[aria-pressed="true"] i::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 5px; height: 9px; border: solid var(--ds-on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.ds-open { position: relative; z-index: 1; grid-column: 2 / 4; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: start; width: 100%; padding: 7px 0 9px; min-height: 44px; text-align: left; }
.ds-row-body { min-width: 0; }
.ds-row-title { display: block; font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); font-weight: 400; overflow-wrap: anywhere; }
.ds-row-sub { display: block; margin-top: 1px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); overflow-wrap: anywhere; }
.ds-row-meta { display: grid; gap: 2px; justify-items: end; padding-top: 2px; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); white-space: nowrap; }
.ds-row.is-ask .ds-row-title { font-weight: 600; }
.ds-row.is-done .ds-row-title { color: var(--ds-ink-2); text-decoration: line-through; text-decoration-color: var(--ds-cb); }
.ds-row.is-done .ds-row-sub, .ds-row.is-done .ds-row-meta { opacity: .55; }

/* ---------- 6. Метки: чип и срок ---------- */
.ds-pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: var(--ds-r-pill); background: var(--ds-surface); color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); font-weight: 400; white-space: nowrap; }
.ds-pill--accent { background: var(--ds-accent-soft); color: var(--ds-accent-text); }
.ds-pill--due { background: var(--ds-due-soft); color: var(--ds-due); }
.ds-pill--warn { background: var(--ds-warn-soft); color: var(--ds-warn); }
.ds-pill--ok { background: var(--ds-ok-soft); color: var(--ds-ok); }
.ds-due { display: inline-flex; align-items: center; gap: 4px; color: var(--ds-due); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); font-weight: 400; white-space: nowrap; }
.ds-due svg { width: 12px; height: 12px; }
.ds-when { color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); font-weight: 400; white-space: nowrap; }

/* ---------- 7. Блок «Главное» ---------- */
.ds-box { display: block; width: 100%; margin: 0 0 24px; padding: 14px 16px; border-radius: var(--ds-r-box); background: var(--ds-surface); text-align: left; }
.ds-box-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); font-weight: 400; }
.ds-box-title { margin-top: 4px; font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); font-weight: 600; overflow-wrap: anywhere; }
.ds-box-cap { margin-top: 6px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); overflow-wrap: anywhere; }
.ds-box-tail { margin-top: 2px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); }

/* ---------- 8. Раскрывашка «Ещё N» ---------- */
.ds-disc { border-bottom: 1px solid var(--ds-line); }
.ds-disc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: var(--ds-touch); font-size: var(--ds-fs-body); font-weight: 400; }
.ds-disc > summary::-webkit-details-marker { display: none; }
.ds-disc > summary .ds-count { color: var(--ds-ink-2); font-weight: 400; }
.ds-disc > summary .ds-chev { margin-left: auto; width: 16px; height: 16px; color: var(--ds-ink-3); transition: transform var(--ds-t); }
.ds-disc[open] > summary .ds-chev { transform: rotate(180deg); }
.ds-disc > .ds-list, .ds-disc > .ds-footnote { padding-bottom: 8px; }

/* ---------- 9. Сегментный переключатель, поле, кнопка, переключатель ---------- */
.ds-seg { max-width: 460px; display: flex; padding: 2px; margin: 0 0 12px; border-radius: 9px; background: var(--ds-surface); }
.ds-seg button { position: relative; flex: 1; height: 32px; border-radius: 7px; text-align: center; font-size: var(--ds-fs-foot); font-weight: 400; color: var(--ds-ink-2); transition: background var(--ds-t), color var(--ds-t); }
.ds-seg button::after { content: ""; position: absolute; inset: -6px 0; }
.ds-seg button[aria-pressed="true"], .ds-seg button[aria-selected="true"] { background: var(--ds-seg-on); color: var(--ds-ink); box-shadow: var(--ds-shadow); }
.ds-field { display: flex; align-items: center; gap: 8px; height: 40px; margin: 0 0 16px; padding: 0 12px; border-radius: 10px; background: var(--ds-surface); color: var(--ds-ink-2); }
.ds-field svg { width: 18px; height: 18px; flex: none; }
.ds-field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--ds-ink); font: inherit; font-size: var(--ds-fs-body); }
.ds-field input::placeholder { color: var(--ds-ink-2); opacity: 1; }
.ds-field input::-webkit-search-cancel-button { display: none; }   /* закрыть и очистить — кнопка ✕ в строке заголовка */
.ds-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 0 16px; border-radius: var(--ds-r-ctl); font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); font-weight: 600; text-align: center; text-decoration: none; background: var(--ds-surface); color: var(--ds-ink); transition: opacity var(--ds-t); }
.ds-btn:active { opacity: .7; }
.ds-btn--primary { background: var(--ds-accent); color: var(--ds-on-accent); }
.ds-btn--plain { background: transparent; color: var(--ds-accent-text); }
.ds-btn--danger { background: var(--ds-due-soft); color: var(--ds-due); }
.ds-actions { display: grid; gap: 8px; margin-top: 20px; }
.ds-cell { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; border-bottom: 1px solid var(--ds-line); }
.ds-cell-t { font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); }
.ds-cell-s { color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); }
.ds-switch { position: relative; flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--ds-cb); transition: background var(--ds-t); }
.ds-switch::before { content: ""; position: absolute; inset: -7px -3px; }
.ds-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: var(--ds-knob); box-shadow: var(--ds-knob-shadow); transition: transform var(--ds-t); }
.ds-switch[aria-checked="true"] { background: var(--ds-switch-on); }
.ds-switch[aria-checked="true"]::after { transform: translateX(20px); }

/* ---------- 10. Таб-бар ---------- */
.ds-tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 460px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);   /* поровну на любое число вкладок (Юлай 13691) */
  padding: 6px 4px calc(6px + var(--sa-b, env(safe-area-inset-bottom, 0px))); background: var(--ds-bg); border-top: .5px solid var(--ds-line); }   /* непрозрачный: под меню не просвечивает текст */
.ds-tabbar[hidden] { display: none; }
.ds-tab { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 49px; min-width: 0; color: var(--ds-ink-3); }
.ds-tab .ds-ic { position: relative; display: block; width: 26px; height: 26px; }
.ds-tab .ds-ic svg { width: 26px; height: 26px; display: block; }
.ds-tab .ds-lb { max-width: 100%; font-size: var(--ds-fs-tab); line-height: var(--ds-lh-tab); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-tab[aria-selected="true"] { color: var(--ds-accent-text); }
.ds-tab[aria-selected="true"] .ds-lb { color: var(--ds-accent-text); font-weight: 700; }
.ds-tab[aria-selected="false"] .ds-lb { color: var(--ds-ink-2); }
.ds-badge { font-variant-numeric: tabular-nums; position: absolute; top: -5px; left: 100%; margin-left: -11px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ds-due); color: var(--ds-on-solid); font-size: var(--ds-fs-tab); line-height: 18px; font-weight: 700; font-style: normal; text-align: center; box-shadow: 0 0 0 2px var(--ds-bg); }

/* ---------- 11. Лист снизу (карточка дела) ---------- */
.sheet.ds-sheet { background: var(--ds-bg); color: var(--ds-ink); border-radius: var(--ds-r-sheet) var(--ds-r-sheet) 0 0; box-shadow: var(--ds-sheet-shadow); font-family: var(--ds-font); }
.sheet.ds-sheet .grab { background: var(--ds-bg); }
.sheet.ds-sheet .grab::after { background: var(--ds-cb); opacity: 1; }
.sheet.ds-sheet .sheet-x { background: var(--ds-surface); box-shadow: none; color: var(--ds-ink-2); }
.ds-sheet-head { padding: 4px 48px 16px 0; }
.ds-eyebrow { color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); margin-bottom: 4px; }
.ds-sheet-title { font-size: var(--ds-fs-title2); line-height: var(--ds-lh-title2); font-weight: 700; letter-spacing: var(--ds-ls-title2); overflow-wrap: anywhere; text-wrap: balance; }
.ds-kv { margin: 0 0 16px; }
.ds-kv-k { display: block; margin-bottom: 2px; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); font-weight: 600; }
.ds-kv-v { display: block; font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); overflow-wrap: anywhere; }
.ds-kv.is-need { padding: 10px 14px; border-radius: var(--ds-r-box); background: var(--ds-surface); }
.ds-kv.is-need .ds-kv-k { color: var(--ds-ink); }
.ds-kv.is-need.is-none .ds-kv-v { color: var(--ds-ink-2); }

/* ---------- 12. Связка: кольцо, часть ---------- */
.ds-project { margin: 0 0 24px; }
.ds-project-head { display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 12px; align-items: start; }

/* ---------- 18. Правки критика r2 ---------- */

/* ---------- 19. «Сегодня»: одна шкала вертикальных отступов (Юлай 14122, 10.11) ----------
   Экран = заголовок + группы .ds-tg; отступы только отсюда, вписанных margin в разметке нет.
   Между группами — 32 (sp-6) · заголовок раздела → содержимое — 12 (sp-3) · блок → блок в группе — 8 (sp-2) · «Весь Штаб» — 16 (sp-4).
   Заголовки разделов здесь без линии: под ними плитки и карточки, линия над ссылками «прилипала». */
.ds-today > * { margin-top: 0; margin-bottom: 0; }
.ds-today > * + * { margin-top: var(--ds-sp-6); }
.ds-today > .ds-largetitle { padding-bottom: 0; }
.ds-today > .ds-whole { margin-top: var(--ds-sp-4); }
.ds-today .ds-tg > * { margin-top: 0; margin-bottom: 0; }
.ds-today .ds-tg > * + * { margin-top: var(--ds-sp-2); }
.ds-today .ds-tg > .ds-section + * { margin-top: var(--ds-sp-3); }
.ds-today .ds-section { min-height: 0; padding-bottom: 0; border-bottom: 0; }
.ds-today .ds-tg > .ds-empty { padding: 0; }   /* пустое состояние — тот же шаг 12 от заголовка */
.ds-today .ds-disc { border-bottom: 0; }   /* группы разделяет отступ, не линия: ни над ссылками, ни под «Ещё» */
.ds-today .ds-disc .ds-levs { gap: var(--ds-sp-2); margin: 0 0 var(--ds-sp-2); }
/* «Ещё» (критик 10.11, 18/21): строка 44 px ради касания, текст по центру — ~11 px воздуха сверху и снизу.
   Глазом шаг меряется по тексту: сверху 8 + 11 → 0 + 11, снизу 32 + 11 → 32 − 11 + 11; раскрытый список — без нижнего поля 8. */
.ds-today .ds-tg > .ds-disc { margin-top: 0; margin-bottom: calc(var(--ds-sp-3) * -1 + 1px); }
.ds-today .ds-disc[open] { margin-bottom: 0; }
.ds-today .ds-disc > .ds-list, .ds-today .ds-disc > .ds-footnote { padding-bottom: 0; }

/* Библиотека Штаба · дополнение «правка» · v1 · 2026-11-16 — компоненты, которых не было в ds.css, для прототипа v2 (v2-proto/).
   Только var(--ds-*) из ds.css; своих hex нет. Ничего из ds.css не переопределяет — новые классы .ds-*.
   Состав: оболочка экрана · лист снизу со стопкой · тост «Вернуть» · кнопка «+» · свойство-ячейка · поля ввода · список выбора ·
   плитка проекта · значки статуса и приоритета · аватар исполнителя · полоса группы (Linear) · блок-карточка (TickTick) ·
   быстрый ввод · счётчики · пилюли-свойства · панель инструментов листа · сетка значков · верхняя строка с «назад». */

/* ---------- E1. Оболочка экрана ---------- */
.ds-app { max-width: 460px; margin: 0 auto; min-height: 100vh; padding: calc(8px + var(--sa-t, 0px)) var(--ds-gutter) calc(152px + var(--sa-b, env(safe-area-inset-bottom, 0px))); background: var(--ds-bg); }

/* ---------- E2. Лист снизу со стопкой (карточка дела, выбор) ---------- */
.ds-bs-wrap { position: fixed; inset: 0; z-index: 50; pointer-events: none; }

  padding: 0 var(--ds-gutter) calc(24px + var(--sa-b, env(safe-area-inset-bottom, 0px))); border-radius: var(--ds-r-sheet) var(--ds-r-sheet) 0 0; background: var(--ds-bg); color: var(--ds-ink);
  box-shadow: var(--ds-sheet-shadow); transform: translateY(100%); transition: transform var(--ds-t) ease-out; pointer-events: auto; }

.ds-bs-h { padding: 6px 44px 12px 0; font-size: var(--ds-fs-title2); line-height: var(--ds-lh-title2); font-weight: 700; }
.ds-bs-foot { margin-top: 20px; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); }

/* ---------- E3. Тост «Готово · Вернуть» ---------- */
.ds-toast { position: fixed; z-index: 60; left: 50%; bottom: calc(76px + var(--sa-b, env(safe-area-inset-bottom, 0px))); transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 12px; width: calc(100% - 32px); max-width: 428px; min-height: 48px; padding: 4px 6px 4px 16px; border-radius: var(--ds-r-ctl);
  background: var(--ds-ink); color: var(--ds-bg); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); transition: opacity var(--ds-t), transform var(--ds-t); }

/* ---------- E4. Кнопка «+» (Things) ---------- */
.ds-fab { position: fixed; z-index: 31; right: max(16px, calc(50% - 214px)); bottom: calc(80px + var(--sa-b, env(safe-area-inset-bottom, 0px))); width: 56px; height: 56px; border-radius: 50%;
  display: grid; place-items: center; background: var(--ds-accent); color: var(--ds-on-accent); box-shadow: var(--ds-sheet-shadow); }

/* ---------- E5. Свойство-ячейка: значок · подпись · значение (раскрывается выбором) ---------- */
.ds-props { margin: 8px 0 16px; border-top: 1px solid var(--ds-line); }

.ds-prop-b { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 16px; align-items: center; column-gap: 12px; width: 100%; min-height: 48px; padding: 6px 0; text-align: left; }
.ds-prop-b > svg { width: 20px; height: 20px; color: var(--ds-ink-3); }

.ds-prop-v { max-width: 200px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-prop-v.is-set { color: var(--ds-ink); }

.ds-prop-b .ds-chev { width: 16px; height: 16px; color: var(--ds-ink-3); transform: rotate(-90deg); transition: transform var(--ds-t); }

/* ---------- E6. Поля ввода: заголовок дела, многострочное, подпись поля ---------- */
.ds-tin { display: block; width: 100%; padding: 0; border: 0; outline: 0; resize: none; overflow: hidden; background: transparent; color: var(--ds-ink); font: inherit;
  font-size: var(--ds-fs-title2); line-height: var(--ds-lh-title2); font-weight: 700; field-sizing: content; }

.ds-ta { display: block; width: 100%; min-height: 44px; padding: 10px 12px; border: 0; outline: 0; resize: none; border-radius: var(--ds-r-ctl); background: var(--ds-surface); color: var(--ds-ink);
  font: inherit; font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); field-sizing: content; }

/* ---------- E7. Список выбора (Linear: значок · слово · подсказка справа · галочка) ---------- */
.ds-opts { margin: 0 0 8px; }

.ds-datein { width: 100%; min-height: 48px; margin: 4px 0 0; padding: 0 12px; border: 0; border-radius: var(--ds-r-ctl); background: var(--ds-surface); color: var(--ds-ink); font: inherit; font-size: var(--ds-fs-body); }

/* ---------- E8. Плитка проекта (значок проекта) ---------- */

/* ---------- E11. Полоса группы и плотная строка (Linear) ---------- */
.ds-band { display: flex; align-items: center; gap: 8px; width: calc(100% + 2 * var(--ds-gutter)); min-height: 40px; margin: 0 calc(-1 * var(--ds-gutter)); padding: 0 var(--ds-gutter); background: var(--ds-surface); text-align: left; }
.ds-band b { font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); font-weight: 600; }

.ds-drow-s { display: block; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ds-inbox-t { display: block; font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); font-weight: 600; overflow-wrap: anywhere; }
.ds-inbox-s { display: block; margin-top: 2px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ds-inbox-s.is-none { font-style: normal; color: var(--ds-due); }

/* ---------- E12. Блок-карточка на сером фоне (TickTick) ---------- */
.ds-blk { margin: 0 0 12px; border-radius: var(--ds-r-card); background: var(--ds-bg); overflow: hidden; }

.ds-blk-h.is-due b { color: var(--ds-due); }

.ds-blk .ds-row { border-top: 1px solid var(--ds-line); }

.ds-tm { color: var(--ds-accent-text); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); white-space: nowrap; }

/* ---------- E13. Быстрый ввод над таб-баром (TickTick) ---------- */
.ds-qadd { position: fixed; z-index: 29; left: 0; right: 0; margin: 0 auto; max-width: 460px; bottom: calc(62px + var(--sa-b, env(safe-area-inset-bottom, 0px))); padding: 8px 12px; background: var(--ds-surface); }

/* ---------- E14. Счётчики в шапке (из каркаса Б) ---------- */

.ds-counts button { display: grid; gap: 0; min-height: 64px; padding: 10px 12px; border-radius: var(--ds-r-box); background: var(--ds-surface); text-align: left; }

.ds-counts .is-due b { color: var(--ds-due); }

/* ---------- E15. Пилюли-свойства (Linear: статус · приоритет · срок · …) ---------- */
.ds-pprops { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.ds-pprop { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px 0 10px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--ds-line); color: var(--ds-ink); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); white-space: nowrap; position: relative; }
.ds-pprop::before { content: ""; position: absolute; inset: -4px 0; }
.ds-pprop svg { width: 16px; height: 16px; color: var(--ds-ink-2); }
.ds-pprop .ds-ptile--sm { margin-left: -2px; }
.ds-pprop.is-empty { color: var(--ds-ink-2); }
.ds-pprop.is-due { color: var(--ds-due); }
.ds-pprop.is-due svg { color: var(--ds-due); }

/* ---------- E16. Панель инструментов листа (TickTick) ---------- */
.ds-tbar { position: sticky; bottom: calc(-24px - var(--sa-b, env(safe-area-inset-bottom, 0px))); z-index: 2; display: flex; align-items: center; gap: 4px; margin: 20px calc(-1 * var(--ds-gutter)) 0; padding: 6px 8px calc(6px + var(--sa-b, env(safe-area-inset-bottom, 0px))); border-top: 1px solid var(--ds-line); background: var(--ds-bg); }
.ds-tbar button { display: grid; justify-items: center; gap: 0; flex: 1; min-width: 0; min-height: 52px; padding: 4px 2px; border-radius: 10px; color: var(--ds-ink-2); font-size: var(--ds-fs-tab); line-height: var(--ds-lh-tab); }
.ds-tbar button svg { width: 22px; height: 22px; }
.ds-tbar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-tbar button.is-set { color: var(--ds-accent-text); }
.ds-ttop { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 0 40px 8px 0; }
.ds-ttop .ds-pprop { min-height: 32px; }
.ds-bigcheck { display: grid; place-items: center; width: 44px; height: 44px; margin: -10px -6px -10px -12px; flex: none; }
.ds-bigcheck i { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--ds-cbox); display: block; position: relative; }
.ds-bigcheck[aria-pressed="true"] i { background: var(--ds-accent); border-color: var(--ds-accent); }
.ds-bigcheck[aria-pressed="true"] i::after { content: ""; position: absolute; left: 6px; top: 2px; width: 6px; height: 11px; border: solid var(--ds-on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* ---------- E17. Сетка значков (выбор иконки проекта) ---------- */
.ds-igrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin: 0 0 16px; }
.ds-igrid button { display: grid; place-items: center; aspect-ratio: 1; min-height: 44px; border-radius: 12px; background: var(--ds-surface); font-size: var(--ds-fs-title2); }
.ds-igrid button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ds-accent); background: var(--ds-accent-soft); }

/* ---------- E18. Верхняя строка: «назад» слева, кнопки справа ---------- */
.ds-topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; margin: 0 0 4px; }
.ds-topbar .ds-back { margin: 0 0 0 -6px; }
.ds-smalltitle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; margin: 0 0 8px; }
.ds-smalltitle h1 { font-size: var(--ds-fs-title2); line-height: var(--ds-lh-title2); font-weight: 700; }
.ds-tabs-in { display: flex; gap: 6px; margin: 0 0 12px; overflow-x: auto; scrollbar-width: none; }
.ds-tabs-in::-webkit-scrollbar { display: none; }
.ds-tabs-in button { flex: none; min-height: 36px; padding: 0 12px; border-radius: 10px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); position: relative; }
.ds-tabs-in button::before { content: ""; position: absolute; inset: -4px 0; }
.ds-tabs-in button[aria-pressed="true"] { background: var(--ds-surface); color: var(--ds-ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--ds-line); }
.ds-tabs-in button small { margin-left: 4px; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); font-weight: 400; }

/* ---------- E18б. Строка с выключателем (в ds.css .ds-cell занят сеткой связок) ---------- */
.ds-swrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; padding: 6px 0; border-top: 1px solid var(--ds-line); border-bottom: 1px solid var(--ds-line); }
.ds-swrow-t { font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); }
.ds-swrow-s { color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); }

/* ---------- E19. Проекты: строка и плитка ---------- */
.ds-prow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; width: 100%; min-height: 52px; padding: 6px 0; border-bottom: 1px solid var(--ds-line); text-align: left; }
.ds-prow-t { display: block; font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); overflow-wrap: anywhere; }
.ds-prow-s { display: flex; flex-wrap: wrap; gap: 0 10px; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); }
.ds-prow-n { color: var(--ds-ink-2); font-size: var(--ds-fs-sub); font-variant-numeric: tabular-nums; }
.ds-pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
.ds-pcard { display: grid; align-content: start; gap: 6px; min-height: 112px; padding: 12px; border-radius: var(--ds-r-card); background: var(--ds-bg); text-align: left; }
.ds-pcard-t { font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); font-weight: 600; overflow-wrap: anywhere; }
.ds-pcard-s { color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); }
.ds-pcard .ds-bar { margin-top: 4px; }

@media (prefers-reduced-motion: reduce) { .ds-bs, .ds-bs-scrim, .ds-toast, .ds-fab { transition: none !important; } }
.ds-qadd-hint[hidden] { display: none; }
.has-toast .ds-fab { opacity: 0; pointer-events: none; }   /* тост «Вернуть» не перекрывает «+» */

/* неактивная вкладка: ink-2 вместо ink-3 — контраст ≥ 4,5:1 (правка критика 16.11); поправка в ds-edit.css, чтобы не менять значения ds.css (его читает живой index.html) */
.ds-tab { color: var(--ds-ink-2); }

html, body { margin: 0; background: var(--ds-bg); }
.a-ttl { padding-right: 36px; display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: start; column-gap: 6px; margin: 4px 0 4px; }
.a-ttl .ds-bigcheck { margin: -6px 0 0 -10px; }
.a-ttl .ds-tin { padding-top: 4px; }
.a-note { margin: 0 0 4px 32px; }
.a-subs { margin-left: 32px; }
.a-title-btn { display: flex; align-items: center; gap: 12px; text-align: left; }
.a-proj-sub { margin: 4px 0 16px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); }
.a-link { margin: 0 0 24px; padding: 12px 16px; border-radius: var(--ds-r-box); background: var(--ds-surface); }
.a-link-t { color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); }
.a-link .ds-lcs { margin-top: 6px; font-size: var(--ds-fs-sub); }
.a-link-g { margin-top: 6px; font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); }
.a-row-ring { display: flex; align-items: center; gap: 6px; }
.a-row-ring .ds-ring { width: 18px; height: 18px; margin: 0; }
.a-adds { display: block; margin: -16px 0 24px; }
.ds-row-meta .ds-av { justify-self: end; }
.a-lev { margin: 0 0 24px; padding: 4px 16px; border-radius: var(--ds-r-box); background: var(--ds-accent-soft); }
.a-lev-h { display: flex; align-items: center; gap: 6px; padding: 10px 0 2px; color: var(--ds-accent-text); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); font-weight: 600; }
.a-lev-h svg { width: 14px; height: 14px; }
.a-lev-i { display: block; width: 100%; padding: 10px 0; text-align: left; min-height: 44px; border-top: 1px solid var(--ds-line); }
.a-lev-i:first-of-type { border-top: 0; }
.a-lev-p { display: flex; justify-content: space-between; gap: 12px; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); }
.a-lev-t { display: block; margin-top: 2px; font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); font-weight: 600; overflow-wrap: anywhere; }
.a-lev-s { display: block; margin-top: 2px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); overflow-wrap: anywhere; }
.a-notebox { margin: 0 0 8px 32px; }
.a-notetxt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); }
.a-more { color: var(--ds-accent-text); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); min-height: 32px; }
.a-card-props { margin-top: 8px; }
/* ---------- вид «Доска» (канбан): колонки поверх .ds-kanban/.ds-kcol из ds.css ---------- */
.a-tools { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
.a-tools .ds-seg { flex: 1; margin: 0; }
.a-tools .ds-seg button { height: 44px; font-size: var(--ds-fs-sub); }
.a-tools .ds-seg button::after { inset: 0; }
.a-vsw { display: flex; gap: 4px; margin-left: auto; }
.a-vb { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: var(--ds-ink-2); background: var(--ds-surface); }
.a-vb svg { width: 22px; height: 22px; }
.a-vb[aria-pressed="true"] { background: var(--ds-seg-on); color: var(--ds-ink); box-shadow: var(--ds-shadow); }
.a-addbtn { display: none; min-height: 44px; padding: 0 16px; border-radius: 10px; background: var(--ds-accent); color: var(--ds-on-accent); font-size: var(--ds-fs-sub); font-weight: 600; }
.a-chips { display: flex; gap: 8px; margin: 0 0 12px; }
.a-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 22px; background: var(--ds-surface); color: var(--ds-ink-2); font-size: var(--ds-fs-sub); font-weight: 600; }
.a-chip .ds-stat { width: 16px; height: 16px; flex: none; }
.a-chip-n { font-variant-numeric: tabular-nums; }
.a-chip-t { display: none; color: var(--ds-accent-text); }
.a-some { display: block; width: 100%; margin: 4px 0 0; padding: 12px 0; text-align: left; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); }
.ds-badge { color: var(--ds-bg); }
.a-chip.is-on { background: var(--ds-accent-soft); box-shadow: none; }
.a-chip.is-on .a-chip-t { display: inline; }
.a-chip.is-ask .a-chip-n { color: var(--ds-due); }
.a-board { margin-top: 4px; }
.a-kl { max-height: max(320px, calc(var(--tg-viewport-stable-height, 100dvh) - var(--a-ktop, 360px) - 96px)); padding-bottom: 72px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.a-kl::-webkit-scrollbar { display: none; }
.a-kc { position: relative; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: pan-x pan-y; }
.a-kc .ds-kcard { padding-right: 44px; margin-bottom: 8px; }
.a-kc .ds-kcard-t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--ds-fs-body); line-height: var(--ds-lh-body); }
.a-kc.is-ask .ds-kcard-t { font-weight: 600; }
.a-kc.is-drag { opacity: .45; }
.a-kmore { position: absolute; top: 0; right: 0; width: 44px; height: 44px; display: grid; place-items: center; color: var(--ds-ink-2); border-radius: var(--ds-r-box); }
.a-kmore svg { width: 20px; height: 20px; }
.a-kmore:active { background: var(--ds-surface-2); }
.a-kneed { display: block; margin-right: -32px; box-sizing: border-box; margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--ds-due-soft); color: var(--ds-ink); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); overflow-wrap: anywhere; }
.a-kneed b { display: block; color: var(--ds-due); font-size: var(--ds-fs-foot); font-weight: 600; }
.a-kstep { display: block; margin-top: 6px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); overflow-wrap: anywhere; }
.a-board .ds-kcol { flex-basis: 78vw; }
.a-board .ds-kcol-h .ds-stat { width: 16px; height: 16px; align-self: center; }
.a-board .ds-kcard.is-done .ds-kcard-t { text-decoration: none; -webkit-line-clamp: 2; }
.a-kwho { display: inline-flex; align-items: center; gap: 4px; }
.a-kempty { padding: 12px 8px 16px; color: var(--ds-ink-2); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); }
.a-kmore-btn { width: 100%; min-height: 44px; color: var(--ds-accent-text); font-size: var(--ds-fs-sub); font-weight: 600; }
.ds-kcol.is-drop { outline: 2px solid var(--ds-accent); outline-offset: -2px; }
.a-hint { margin: 0 0 8px; color: var(--ds-ink-2); font-size: var(--ds-fs-foot); line-height: var(--ds-lh-foot); }
@media (min-width: 900px) {
  .ds-app:has(.a-board) { max-width: 1360px; }
  .a-board.ds-kanban { margin: 0 0 24px; padding: 0 0 8px; }
  .a-board .ds-kcol { flex: 1 1 0; min-width: 220px; max-width: none; }
  .a-kl { padding-bottom: 8px; }
  .a-chips { display: none; }
  body:has(.a-board) .ds-fab { display: none; }
  body:has(.a-board) .a-addbtn { display: inline-flex; align-items: center; }
  body:has(.a-board) .ds-tabbar { max-width: none; }
}

/* ---------- редактор v1: компоненты, которых в прототипе не было (design.md §3) ---------- */
.a-datein { width: auto; min-height: 44px; }   /* было style="…" в proto.js: под CSP — классом */
/* ошибка у поля: текст причины носителя (422), «Изменилось — обновил» (409) или «Не сохранилось — Повторить» (сеть) */
.ds-ferr { display: flex; align-items: baseline; gap: 12px; margin: 4px 0 8px; color: var(--ds-due); font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); overflow-wrap: anywhere; }
.ds-ferr span { flex: 1; min-width: 0; }
.ds-ferr button { flex: none; min-height: 44px; margin: -12px 0; color: var(--ds-accent-text); font-size: var(--ds-fs-sub); font-weight: 600; }
.ds-prop .ds-ferr { padding: 0 16px; }
/* новая задача похожа на открытое дело: «Открыть его» · «Всё равно создать» (приёмка 4) */
.ds-dup { margin: 8px 0 16px 32px; padding: 12px 16px; border-radius: var(--ds-r-box); background: var(--ds-due-soft); }
.ds-dup p { margin: 0 0 8px; font-size: var(--ds-fs-sub); line-height: var(--ds-lh-sub); overflow-wrap: anywhere; }
.ds-dup-a { display: flex; flex-wrap: wrap; gap: 8px; }
.ds-dup-a .ds-btn { flex: 1 1 auto; }
.ds-fab[hidden] { display: none; }

  function icon(name, cls) { return '<svg class="ds-svg ' + (cls || '') + '" aria-hidden="true"><use href="#ds-' + name + '"/></svg>'; }
  var FLAG = '<svg viewBox="0 0 12 12" aria-hidden="true"><use href="#ds-flag"/></svg>';

  /* ---- экран: большой заголовок, раздел, группа ---- */

  function group(o) { return '<section class="ds-group">' + section(o) + (o.html || '') + '</section>'; }
  function empty(t) { return '<p class="ds-empty">' + esc(t) + '</p>'; }
  function footnote(t) { return '<p class="ds-footnote">' + esc(t) + '</p>'; }
  function disclosure(label, count, inner, open) {
    return '<details class="ds-disc"' + (open ? ' open' : '') + '><summary><span>' + esc(label) + '</span><span class="ds-count">' + esc(count) + '</span><svg class="ds-chev" aria-hidden="true"><use href="#ds-chev"/></svg></summary>' + inner + '</details>';

  function row(o) {

      '<button type="button" class="ds-open" ' + (o.open || '') + '><span class="ds-row-body"><span class="ds-row-title">' + esc(o.title) + '</span>' +
      (o.sub ? '<span class="ds-row-sub">' + esc(o.sub) + '</span>' : '') + '</span><span class="ds-row-meta">' + (o.meta || '') + '</span></button></li>';
  }
  function box(o) {
    return '<div class="ds-box" role="button" tabindex="0" ' + (o.open || '') + '><div class="ds-box-top"><span>' + esc(o.eyebrow) + '</span><span>' + (o.right || '') + '</span></div>' +

  /* ---- управление ---- */
  function segmented(items, value, attr) {      // items: [[key, label]]; attr: имя data-атрибута

  }

  function ring(frac, bad) {                    // доля 0..1; обводка цветом срока, если рвётся
    var r = 11, a = Math.max(0, Math.min(1, frac)) * 2 * Math.PI, x = 14 + r * Math.sin(a), y = 14 - r * Math.cos(a), big = a > Math.PI ? 1 : 0, pie = '';

    return '<svg class="ds-ring" viewBox="0 0 28 28" aria-hidden="true">' + pie + '<circle cx="14" cy="14" r="11" fill="none" style="stroke:' + (bad ? 'var(--ds-due)' : 'var(--ds-ink-3)') + '" stroke-width="2.2"/></svg>';

    t.q = (t.q || Promise.resolve()).then(run, run);
    return t.q;
  }
  /* общий исход записи: ok — запись носителя на экран; 409 — свежая запись и «Изменилось — обновил»; иначе прежнее значение и причина */
  function settle(t, field, r, retry) {
    if (r.ok) { apply(r.data); clearErr(t.id, field); return true; }
    if (r.kind === 'stale') { apply(r.fresh); setErr(t.id, field, 'Изменилось — обновил. Показано то, что записано сейчас.'); toast('Изменилось — обновил'); return false; }
    if (r.kind === 'gone') { tasks.splice(tasks.indexOf(t), 1); toast('Этого дела больше нет'); while (st.stack.length && st.stack[st.stack.length - 1].arg === t.id) close(); return false; }
    if (t.saved) Object.keys(t.saved).forEach(function (k) { t[k] = t.saved[k]; });
    if (r.kind === 'view') { toast(VIEW_TEXT); }
    else if (r.kind === 'reason') { setErr(t.id, field, r.text); toast(r.text); }
    else if (r.kind === 'auth') { setErr(t.id, field, 'Вход не прошёл — открой Штаб заново кнопкой в чате'); toast('Вход не прошёл'); }
    else { setErr(t.id, field, 'Не сохранилось', retry); toast('Не сохранилось', retry, 'Повторить'); }
    return false;
  }
  function set(id, field, v, quiet) {
    var t = byId(id); if (!t || (t[field] || '') === (v || '')) return Promise.resolve(false);
    if (field === 'st' && isDone({ st: v }) && !isDone(t)) { t.prevSt = t.st; fresh[id] = 1; }
    var was = t[field]; t[field] = v; clearErr(id, field);
    if (t.draft) { render(); return Promise.resolve(true); }
    render();
    var retry = function () { set(id, field, v, quiet); };
    var body = {}; body[F_API[field]] = field === 'who' ? whoOut(v) : v;
    return queue(t, function (ver) { return API.patch(t.id, ver, body); }).then(function (r) {
      var ok = settle(t, field, r, retry);
      if (ok && field === 'proj' && !quiet) toast('Перенесено в «' + proj(v).name + '»', function () { set(id, 'proj', was, true); });
      render(); return ok;
    });
  }
  function saveNote(t, text) {
    if (t.draft) { t.note = text; return; }
    if (!t.full || text === t.saved.note) return;
    t.note = text; clearErr(t.id, 'note');
    var retry = function () { saveNote(t, text); };
    queue(t, function (ver) { return API.note(t.id, ver, text); }).then(function (r) { settle(t, 'note', r, retry); render(); });
  }
  function subToggle(t, i) {
    var s = t.subs[i]; if (!s) return;
    var on = !s.d; s.d = on; clearErr(t.id, 'subs'); render();
    var retry = function () { s.d = !on; subToggle(t, i); };
    queue(t, function (ver) { return API.subSet(t.id, ver, s.n || i + 1, on); }).then(function (r) { if (!settle(t, 'subs', r, retry) && r.kind !== 'stale') s.d = !on; render(); });
  }
  /* ключ повтора: «Повторить» после потерянного ответа шлёт тот же ключ — носитель не добавит вторую подзадачу */
  function subKey() { return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function subAdd(t, text, key) {
    if (t.draft) { t.subs.push({ d: false, t: text }); render(); return; }
    key = key || subKey();
    t.subs.push({ d: false, t: text, pend: true }); clearErr(t.id, 'subs'); render();
    var retry = function () { subAdd(t, text, key); };
    queue(t, function (ver) { return API.subAdd(t.id, ver, text, key); }).then(function (r) {
      if (!settle(t, 'subs', r, retry)) t.subs = t.subs.filter(function (s) { return !s.pend; });
      render();
    });
  }
  function done(id) {
    var t = byId(id); if (!t || t.draft) return;
    if (isDone(t)) { var back = t.prevSt || 'ждёт'; set(id, 'st', back, true).then(function (ok) { if (ok) toast('Вернул в работу'); }); return; }
    var prev = t.st; DS.sound.play('done');
    set(id, 'st', 'готово', true).then(function (ok) {
      if (ok) toast('Готово: ' + (TIDY.title(t.t) || t.t), function () { set(id, 'st', prev, true); });
    });
  }
  function byId(id) { for (var i = 0; i < tasks.length; i++) if (tasks[i].id === id) return tasks[i]; return null; }
  function newTask(projKey) {
    seq++;
    var t = { id: 'N-' + seq, t: '', st: 'ждёт', who: 'me', due: st.tab === 'today' && !projKey ? TODAY : '', proj: projKey || 'inbox', part: '', lev: '', prio: '', step: '', note: '', subs: [], made: TODAY, ver: '', draft: true, full: true };
    tasks.push(t); return t;
  }
  /* новая задача: дело заводится, как только у неё есть тема (уход из поля темы или закрытие листа); карточка остаётся открытой уже на новом деле */
  function createDraft(t, force) {
    if (!t || !t.draft || t.creating || !t.t.trim()) return;
    t.creating = true; clearErr(t.id, 't'); t.dup = null;
    API.create(t.t.trim(), t.proj, force).then(function (r) {
      t.creating = false;
      if (!r.ok) {
        if (r.kind === 'dup') { t.dup = r.dup; if (!sheetOf(t.id)) open('task', t.id); }
        else if (r.kind === 'reason') setErr(t.id, 't', r.text);
        else setErr(t.id, 't', 'Не сохранилось', function () { createDraft(t, force); });
        render(); return;
      }
      var oldId = t.id, extra = {}, dv = { due: t.due, lev: t.lev, prio: t.prio, part: t.part, step: t.step, who: t.who, st: t.st, note: t.note, subs: t.subs.slice() };
      fromApi(r.data, t); t.draft = false; t.note = dv.note; t.subs = dv.subs; fresh[t.id] = 1;
      st.stack.forEach(function (L) { if (L.arg === oldId) { L.arg = t.id; L.el.querySelector('.ds-bs').setAttribute('data-id', t.id); } });
      ['due', 'lev', 'prio', 'part', 'step'].forEach(function (k) { if (dv[k]) extra[F_API[k]] = dv[k]; });
      if (dv.who && dv.who !== 'me') extra['делает'] = whoOut(dv.who);
      if (dv.st && dv.st !== 'ждёт') extra['статус'] = dv.st;
      var after = Promise.resolve();
      if (Object.keys(extra).length) after = queue(t, function (ver) { return API.patch(t.id, ver, extra); }).then(function (x) { settle(t, 'st', x); });
      if (dv.note) after = after.then(function () { return queue(t, function (ver) { return API.note(t.id, ver, dv.note); }).then(function (x) { settle(t, 'note', x); }); });
      (dv.subs || []).forEach(function (s) { after = after.then(function () { return queue(t, function (ver) { return API.subAdd(t.id, ver, s.t); }).then(function (x) { settle(t, 'subs', x); }); }); });
      after.then(function () { return API.task(t.id); }).then(function (x) { if (x && x.ok) apply(x.data); render(); });
      toast('Задача создана · ' + proj(t.proj).name);
      render();
    });
  }
  function finishDraft(t) {
    if (!t || !t.draft) return;
    if (!t.t.trim()) { tasks.splice(tasks.indexOf(t), 1); return; }
    createDraft(t);
  }
  function sheetOf(id) { for (var i = 0; i < st.stack.length; i++) if (st.stack[i].arg === id) return st.stack[i]; return null; }

  /* ---------- проекты ---------- */
  function setProj(key, field, v) {
    var p = proj(key); if (p[field] === v) return;
    var was = p[field]; p[field] = v; st.perr = '';
    if (p.draft) { render(); return; }
    if (field === 'arch' && v) { st.proj = null; closeAll(); }
    render();
    var body = {}; body[P_API[field]] = v;
    API.projPatch(key, p.ver, body).then(function (r) {
      if (r.ok) {
        papply(r.data);
        if (field === 'arch' && v) toast('«' + p.name + '» в архиве', function () { setProj(key, 'arch', false); });
      } else if (r.kind === 'stale') { papply(r.fresh); st.perr = 'Изменилось — обновил. Показано то, что записано сейчас.'; toast('Изменилось — обновил'); }
      else {
        p[field] = was;
        if (r.kind === 'view') { toast(VIEW_TEXT); render(); return; }
        st.perr = r.kind === 'reason' ? r.text : 'Не сохранилось';
        toast(st.perr, r.kind === 'net' ? function () { setProj(key, field, v); } : null, 'Повторить');
      }
      render();
    });
  }
  function newProject() {
    st.pdraft = { key: '__new', name: '', icon: '📁', biz: false, arch: false, draft: true };
    open('psheet', '__new', { focus: 'name' });
  }
  function createProject(name) {
    var p = st.pdraft; if (!p || p.creating || !name.trim()) return;
    p.creating = true; p.name = name.trim(); st.perr = '';
    API.projNew({ 'название': p.name, 'иконка': p.icon, 'бизнес': p.biz }).then(function (r) {
      p.creating = false;
      if (!r.ok) { st.perr = r.kind === 'reason' ? r.text : 'Не сохранилось'; render(); return; }
      var np = papply(r.data); st.pdraft = null;
      st.stack.forEach(function (L) { if (L.arg === '__new') L.arg = np.key; });
      st.proj = np.key; st.tab = 'proj'; window.scrollTo(0, 0);
      toast('Проект создан · ' + np.name); render();
    });
  }

  /* ---------- тост ---------- */
  var tEl, tTimer;
  function toast(text, undo, label) {
    if (!tEl) { tEl = document.createElement('div'); tEl.className = 'ds-toast'; tEl.setAttribute('role', 'status'); document.body.appendChild(tEl); }
    tEl.innerHTML = '<span>' + esc(text) + '</span>' + (undo ? '<button type="button" data-undo>' + esc(label || 'Вернуть') + '</button>' : '');
    tEl._undo = undo; tEl.classList.add('is-on'); document.body.classList.add('has-toast'); clearTimeout(tTimer);
    tTimer = setTimeout(function () { tEl.classList.remove('is-on'); document.body.classList.remove('has-toast'); tEl._undo = null; }, st.shot ? 600000 : 5000);   /* «Вернуть» — 5 с (допущение 6) */
  }

  /* ---------- листы снизу: стопка ---------- */
  function sheetHtml(L) {
    var inner = '';
    if (L.kind === 'task') { var t = byId(L.arg); inner = t ? V.card(t) : ''; }
    else if (L.kind === 'pick') inner = pickHtml(L.arg, L.id);
    else if (L.kind === 'psheet') inner = projSheetHtml(L.arg);
    else if (V.sheet) inner = V.sheet(L) || '';
    return '<div class="ds-bs-grab" aria-hidden="true"></div><button type="button" class="ds-bs-x" data-close aria-label="Закрыть">' + DSE.ic('x') + '</button>' + inner;
  }
  function open(kind, arg, o) {
    o = o || {};
    if (VIEW && (kind === 'pick' || kind === 'move' || kind === 'psheet')) { toast(VIEW_TEXT); return; }
    var L = { kind: kind, arg: arg, id: o.id };
    var w = document.createElement('div'); w.className = 'ds-bs-wrap'; w.setAttribute('data-layer', st.stack.length);
    w.innerHTML = '<div class="ds-bs-scrim" data-close></div><div class="ds-bs' + (kind === 'pick' || kind === 'move' ? ' ds-bs--pick' : '') + '" role="dialog" aria-modal="true" data-id="' + esc(kind === 'task' ? arg : (o.id || '')) + '" data-kind="' + kind + '"></div>';
    L.el = w; st.stack.push(L); document.body.appendChild(w);
    w.querySelector('.ds-bs').innerHTML = sheetHtml(L);
    requestAnimationFrame(function () { w.classList.add('is-open'); });
    if (st.shot) w.classList.add('is-open');
    if (o.focus) setTimeout(function () { var f = w.querySelector('[data-field="' + o.focus + '"],[data-pfield="' + o.focus + '"]'); if (f && !st.shot) f.focus(); }, 60);
    if (kind === 'task') { var t = byId(arg); if (t && !t.draft && !t.full) loadFull(t); }
    DS.sound.play('open'); tgBack(); fit(w);
    if (kind === 'pick') pickScroll(w);
  }
  /* выбранный вариант — в середину листа (как scrollIntoView, но крутится только лист, не страница под ним) */
  function pickScroll(w) {
    var b = w.querySelector('.ds-bs'), on = b && b.querySelector('.ds-opt.is-on');
    if (!on || b.scrollHeight <= b.clientHeight) return;
    b.scrollTop = on.getBoundingClientRect().top - b.getBoundingClientRect().top + b.scrollTop - (b.clientHeight - on.offsetHeight) / 2;
  }
  function loadFull(t) {
    API.task(t.id).then(function (r) { if (r.ok) { apply(r.data); refreshSheets(); } else if (r.kind === 'gone') settle(t, 't', r); });
  }
  function refreshSheets() {
    st.stack.forEach(function (L) {
      var b = L.el.querySelector('.ds-bs'), y = b.scrollTop, a = document.activeElement, keep = null;
      if (L.kind === 'task' && !byId(L.arg)) return;
      if (a && b.contains(a) && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) {   /* не сбивать ввод: то же поле, тот же текст и курсор */
        keep = { sel: ['data-field', 'data-pfield', 'data-subin', 'data-pickwho'].filter(function (k) { return a.hasAttribute(k); }).map(function (k) { return '[' + k + (a.getAttribute(k) ? '="' + a.getAttribute(k) + '"' : '') + ']'; })[0], v: a.value, s: a.selectionStart, e: a.selectionEnd };
      }
      b.innerHTML = sheetHtml(L); b.scrollTop = y; fit(L.el);
      var f = keep && keep.sel && b.querySelector(keep.sel);

  }
  function close() {

    if (L.kind === 'psheet') st.perr = '';

  }
  function closeAll() { while (st.stack.length) close(); }
  function fit(w) { [].forEach.call(w.querySelectorAll('textarea'), function (a) { a.style.height = 'auto'; a.style.height = a.scrollHeight + 'px'; }); }

  function pickHtml(field, id) {

  }

  /* ---------- общие куски карточки ---------- */
  var ui = {
    title: function (t) { return '<textarea class="ds-tin" rows="1" data-field="t" placeholder="Новая задача" aria-label="Тема">' + esc(t.t) + '</textarea>'; },
    note: function (t, plain) { return '<textarea class="ds-ta' + (plain ? ' ds-ta--plain' : '') + '" rows="1" data-field="note" placeholder="Заметка" aria-label="Заметка">' + esc(t.note) + '</textarea>'; },

      return '<div class="ds-need"><label class="ds-flabel" for="need-' + esc(t.id) + '">' + DSE.ic('ask') + 'Что нужно от тебя</label><textarea id="need-' + esc(t.id) + '" class="ds-ta" rows="1" data-field="step" placeholder="Одно действие: ответ, выбор или «да» — пока не записано">' + esc(t.step) + '</textarea></div>' + errLine(t.id, 'step');
    },
    subs: function (t) {
      return '<ul class="ds-subs">' + t.subs.map(function (s, i) { return DS.sub({ key: t.id + ':' + i, text: s.t, done: s.d }); }).join('') +
        '<li class="ds-sub"><label class="ds-addline">' + DSE.ic('plus') + '<input class="ds-addin" data-subin placeholder="Подзадача" aria-label="Новая подзадача"></label></li></ul>' + errLine(t.id, 'subs');
    },
    chips: function (field, t) {
      return '<div class="ds-chips" role="group" aria-label="' + esc(FIELD_L[field]) + '">' + opts(field).map(function (o) {
        return '<button type="button" data-set="' + field + '" data-v="' + esc(o.v) + '" aria-pressed="' + ((t[field] || '') === o.v) + '">' + esc(o.t) + '</button>';
      }).join('') + (field === 'due' ? '<input class="ds-datein a-datein" type="date" lang="ru" data-setdate value="' + esc(t.due || '') + '" aria-label="Другая дата">' : '') + '</div>';
    },
    doneBtn: function (t) {
      if (t.draft) return '';
      return isDone(t) ? DS.button({ text: 'Вернуть в работу', attrs: 'data-check="' + esc(t.id) + '"' }) : DS.button({ text: 'Завершить', kind: '', attrs: 'data-check="' + esc(t.id) + '"' });
    },
    actions: function (t) { var b = ui.doneBtn(t); return b ? DS.actions(b) : ''; },
    dup: function (t) {
      if (!t.dup) return '';
      return '<div class="ds-dup" role="alert"><p>Похожее дело уже есть: «' + esc(t.dup['тема']) + '»</p><div class="ds-dup-a">' +
        DS.button({ text: 'Открыть его', attrs: 'data-dupopen="' + esc(t.dup.id) + '"' }) + DS.button({ text: 'Всё равно создать', kind: '', attrs: 'data-dupforce' }) + '</div></div>';
    },
    meta: function (t) {
      return '<p class="ds-bs-foot">' + (t.draft ? 'Новая задача · закроешь лист — сохранится, пустая — исчезнет' : esc(t.id) + (t.made ? ' · создано ' + dm(t.made) : '')) + '</p>';
    }
  };

  /* ---------- отрисовка ---------- */
  var main, bar, fab, renderTimer;
  function screenHtml() {
    if (st.load === 'gate') return V.gate(st.loadErr);
    if (st.load === 'wait') return V.loading(st.tab);
    if (st.load === 'err') return V.failed(st.loadErr);
    return st.tab === 'proj' && st.proj ? V.project(st.proj) : V.screen(st.tab);
  }
  function render() {
    if (!V) return;
    document.body.setAttribute('data-tab', st.tab);
    main.innerHTML = (VIEW && st.load === 'ok' ? DS.footnote('Только просмотр' + (st.snap ? ' · данные на ' + st.snap.slice(8, 10) + '.' + st.snap.slice(5, 7) + ' ' + st.snap.slice(11, 16) : '') + ' · ' + VIEW_TEXT) : '') + screenHtml();
    var c = counts();
    bar.hidden = st.load === 'gate';
    bar.innerHTML = DS.tabbar([['today', 'tab-today', 'Сегодня', ''], ['wait', 'tab-wait', 'Ждёт меня', c.wait || ''], ['proj', 'tab-proj', 'Проекты', ''], ['all', 'tab-all', 'Все', '']], st.tab)
      .replace(/<use href="#ds-tab-(\w+)"\/>/g, function (m, k) { return '<use href="#dse-' + { today: 'star', wait: 'bell', proj: 'stack', all: 'queue' }[k] + '"/>'; })
      .replace(/class="ds-svg "/g, 'class="ds-svg" fill="none"');
    if (fab) fab.hidden = VIEW || !V.fab || st.tab === 'wait' || st.load !== 'ok';
    refreshSheets(); tgBack();
    if (V.after) V.after();
  }

  function setTab(k) { if (st.tab === k && !st.proj) return; st.tab = k; st.proj = null; st.who = 'all'; fresh = {}; closeAll(); window.scrollTo(0, 0); DS.sound.play('tab'); render(); reload(); }

<script>/* Штаб v1 · вид A «как Things» — экраны. Перенесено из v2-proto/variant-a.html (одобрен Юлаем 2026-11-17 14:20) без перекомпоновки;

   строка ошибки носителя / «Не сохранилось — Повторить»; новая задача — блок «Похожее дело уже есть»; состояния загрузки и входа. */
(function () {
  'use strict';
  var esc = P.esc, MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var WDS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

  /* в списках — тема, очищенная как в нынешнем Штабе и прототипе (app/tidy.js ← build.py: эмодзи, ✅→«ок», пути, команды,
     номера сообщений, служебные скобки, ведущая ⚑); в карточке правится тема как есть. Пусто после чистки — сырая тема. */

  function tt(t) {

  var IC_COLS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="4.6" height="16" rx="1.4"/><rect x="9.7" y="4" width="4.6" height="10" rx="1.4"/><rect x="15.9" y="4" width="4.6" height="13" rx="1.4"/></svg>';
  function viewSw(who) {

    return '<div class="a-kc' + (ask ? ' is-ask' : '') + '" data-kid="' + esc(t.id) + '"' + (wide.matches ? ' draggable="true"' : '') + '>' +
      '<button type="button" class="ds-kcard' + (col === 'готово' ? ' is-done' : '') + '" data-task="' + esc(t.id) + '">' + body + '</button>' +

    }).join('');
    var cols = COLS.map(function (c) {
      var k = c[0], g = list.filter(function (t) { return k === 'готово' ? P.isDone(t) : t.st === k; });
      if (k === 'ждёт Юлая') g.sort(function (a, b) { return (a.made || '').localeCompare(b.made || ''); });

      var shown = k === 'готово' && !P.st.coll['done-more'] ? g.slice(0, DONE_N) : g;
      var h = shown.map(function (t) { return kcard(t, showProj, k); }).join('');

  }
  V.sheet = function (L) {
    if (L.kind !== 'move') return '';
    var t = P.byId(L.arg); if (!t) return '';
    var cur = P.isDone(t) ? 'готово' : t.st;
    return '<h2 class="ds-bs-h">Перенести в…</h2><p class="a-hint">' + esc(tt(t)) + '</p><div class="ds-opts">' + COLS.map(function (c) {
      return DSE.opt({ icon: DSE.stat(c[0]), t: c[1], hint: c[0] === cur ? 'сейчас' : '', on: c[0] === cur, attrs: 'data-moveto="' + esc(c[0]) + '"' });
    }).join('') + '</div>';
  };
  function moveTo(id, to) {
    var t = P.byId(id); if (!t) return;
    var was = t.st; if (was === to) return;
    P.st.moved = true;
    P.set(id, 'st', to, true);
    P.toast('Перенесено · ' + (P.ST_L[to] || to), function () { P.set(id, 'st', was, true); });
  }
  /* прокрутка доски переживает перерисовку */
  var scr = { x: 0, y: {} };
  V.after = function () {
    var b = document.querySelector('.a-board'); if (!b) return;
    var kl = b.querySelector('.a-kl');
    if (kl) document.documentElement.style.setProperty('--a-ktop', Math.round(kl.getBoundingClientRect().top + window.scrollY) + 'px');
    var dc = +new URLSearchParams(location.hash.slice(1)).get('col');
    if (dc && !scr.x && !scr.shown) { scr.shown = 1; var c0 = b.querySelectorAll('.ds-kcol')[dc]; if (c0) scr.x = c0.offsetLeft - b.offsetLeft - 16; }
    b.scrollLeft = scr.x;
    chipsOn();
    [].forEach.call(b.querySelectorAll('.a-kl'), function (l) { l.scrollTop = scr.y[l.getAttribute('data-col')] || 0; });
  };
  function chipsOn() {
    var b = document.querySelector('.a-board'); if (!b) return;
    var cs = b.querySelectorAll('.ds-kcol'), best = 0, bd = 1e9;
    [].forEach.call(cs, function (c, i) { var d = Math.abs(c.offsetLeft - b.offsetLeft - 16 - b.scrollLeft); if (d < bd) { bd = d; best = i; } });
    [].forEach.call(document.querySelectorAll('.a-chip'), function (x, i) { x.classList.toggle('is-on', i === best); });
  }
  document.addEventListener('scroll', function (e) {
    var el = e.target; if (!el || !el.classList) return;
    if (el.classList.contains('a-board')) { scr.x = el.scrollLeft; chipsOn(); }
    else if (el.classList.contains('a-kl')) scr.y[el.getAttribute('data-col')] = el.scrollTop;
  }, true);
  function setView(v) {
    P.st.view = v === 'board' ? 'board' : 'list';
    try { var h = new URLSearchParams(location.hash.slice(1)); if (v === 'board') h.set('view', 'board'); else h.delete('view'); history.replaceState(null, '', '#' + h.toString().replace(/%2C/g, ',')); } catch (e) {}
    scr.x = 0; scr.y = {}; P.render();
  }
  document.addEventListener('click', function (e) {
    var ch = e.target.closest('[data-chip]');
    if (ch) { var cc = document.querySelectorAll('.a-board .ds-kcol')[+ch.getAttribute('data-chip')]; if (cc) cc.scrollIntoView({ inline: 'start', block: 'nearest', behavior: 'smooth' }); return; }
    var el = e.target.closest('[data-view],[data-mv],[data-moveto]'); if (!el) return;
    if (el.hasAttribute('data-view')) return setView(el.getAttribute('data-view'));
    if (el.hasAttribute('data-mv')) return P.open('move', el.getAttribute('data-mv'), { id: el.getAttribute('data-mv') });
    var sh = el.closest('.ds-bs'), id = sh && sh.getAttribute('data-id'), to = el.getAttribute('data-moveto');
    P.close(); moveTo(id, to);
  });
  /* долгое нажатие ≥ 450 мс — лист «Перенести в…»; следующий за ним клик гасим */
  var lp = { timer: 0, x: 0, y: 0, at: 0 };
  function lpStop() { clearTimeout(lp.timer); lp.timer = 0; }
  document.addEventListener('pointerdown', function (e) {
    var c = e.target.closest('.a-kc'); if (!c || e.target.closest('.a-kmore') || (e.pointerType === 'mouse' && wide.matches)) return;
    lp.x = e.clientX; lp.y = e.clientY; lpStop();
    lp.timer = setTimeout(function () { lp.at = Date.now(); lp.timer = 0; P.open('move', c.getAttribute('data-kid'), { id: c.getAttribute('data-kid') }); }, 450);
  });
  document.addEventListener('pointermove', function (e) { if (lp.timer && (Math.abs(e.clientX - lp.x) > 8 || Math.abs(e.clientY - lp.y) > 8)) lpStop(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { document.addEventListener(n, lpStop, true); });
  document.addEventListener('contextmenu', function (e) { if (e.target.closest('.a-kc')) e.preventDefault(); });
  window.addEventListener('click', function (e) { if (Date.now() - lp.at < 700 && e.target.closest('.a-kc')) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  /* ПК: перетаскивание HTML5 */
  var drag = null;
  document.addEventListener('dragstart', function (e) { var c = e.target.closest && e.target.closest('.a-kc'); if (!c) return; drag = c.getAttribute('data-kid'); c.classList.add('is-drag'); try { e.dataTransfer.setData('text/plain', drag); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} });
  document.addEventListener('dragend', function (e) { drag = null; [].forEach.call(document.querySelectorAll('.is-drag,.is-drop'), function (x) { x.classList.remove('is-drag', 'is-drop'); }); });
  document.addEventListener('dragover', function (e) { var c = drag && e.target.closest && e.target.closest('.ds-kcol'); if (!c) return; e.preventDefault(); [].forEach.call(document.querySelectorAll('.is-drop'), function (x) { if (x !== c) x.classList.remove('is-drop'); }); c.classList.add('is-drop'); });
  document.addEventListener('drop', function (e) { var c = drag && e.target.closest && e.target.closest('.ds-kcol'); if (!c) return; e.preventDefault(); var id = drag; drag = null; moveTo(id, c.getAttribute('data-col')); });
  wide.addEventListener('change', function () { P.render(); });
  V.screen = function (tab) {
    var c = P.counts();
    if (tab === 'today') {
      var d = new Date(P.today() + 'T00:00:00Z');
      var levs = P.levers();
      var late = P.q(function (t) { return P.inToday(t) && t.lev !== 'день' && t.due && P.diff(t.due) < 0; });
      var today = P.q(function (t) { return P.inToday(t) && t.lev !== 'день' && !(t.due && P.diff(t.due) < 0); });
      var h = DS.largeTitle({ icon: 'star', title: 'Сегодня', sub: WDS[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' · ' + c.today + ' задач · ждёт тебя ' + c.wait });
      if (levs.length) h += '<section class="a-lev" aria-label="Рычаг дня"><div class="a-lev-h">' + DSE.ic('bolt') + 'Рычаг дня</div>' + levs.map(function (t) {
        return '<button type="button" class="a-lev-i" data-task="' + esc(t.id) + '"><span class="a-lev-p"><span>' + esc(P.proj(t.proj).name) + '</span><span>' + (t.due ? (P.overdue(t) ? '<span class="ds-due">' + esc(P.dueText(t.due)) + '</span>' : esc(P.dueText(t.due))) : '') + '</span></span><span class="a-lev-t">' + esc(tt(t)) + '</span>' + (t.step ? '<span class="a-lev-s">Шаг: ' + esc(TIDY.text(t.step)) + '</span>' : '') + '</button>';
      }).join('') + '</section>';
      h += today.length ? DS.group({ title: 'Сегодня', count: today.length, html: rows(today) }) : DS.group({ title: 'Сегодня', count: '0', html: DS.empty('На сегодня сроков нет. Новая задача — «+» внизу.') });
      if (late.length) h += DS.group({ title: 'Просрочено', count: late.length, html: rows(late, null, P.st.coll['late-open'] ? 999 : 6, 'late') });
      return h;
    }
    if (tab === 'wait') {
      var w = P.q(P.inWait).sort(function (a, b) { return (a.made || '').localeCompare(b.made || ''); });
      var h2 = DS.largeTitle({ icon: 'clock', title: 'Ждёт меня', sub: w.length ? w.length + ' дел ждут твоего ответа — старые сверху' : '' });
      if (!w.length) return h2 + DS.empty('Ничего не ждёт. Бот работает сам.');
      return h2 + DS.list(w.map(function (t) {
        return row(t, { sub: (t.step ? 'Нужно: ' + TIDY.text(t.step) : 'Что нужно от тебя — не записано') + ' · ' + P.proj(t.proj).name, meta: DS.when('ждёт ' + P.ago(t.made)) + (t.due ? (P.overdue(t) ? '<span class="ds-due">' + esc(P.dueText(t.due)) + '</span>' : DS.when(P.dueText(t.due))) : '') });
      }).join(''));
    }
    if (tab === 'proj') {
      var ps = P.projects(), act = ps.filter(function (p) { return !p.arch; }), arch = ps.filter(function (p) { return p.arch; });
      var prow = function (p) {
        var s = P.projStats(p.key), L = P.links()[p.key];
        var lc = L ? '<span class="ds-lcs">' + L.parts.map(function (x) { return '<span class="ds-lc ds-lc--' + x.st + '"><i></i>' + esc(x.n) + '</span>'; }).join('') + '</span>' : '';
        return '<button type="button" class="ds-prow" data-popen="' + esc(p.key) + '">' + DSE.ptile(p) + '<span><span class="ds-prow-t">' + esc(p.name) + (L && L.lever ? ' ' + DS.pill('Рычаг', 'lev') : '') + '</span>' +
          (lc || p.inbox ? '<span class="ds-prow-s">' + (p.inbox ? 'новое без проекта' : lc) + '</span>' : '') + '</span><span class="a-row-ring"><span class="ds-prow-n">' + s.open + '</span>' + (p.inbox ? '' : DS.ring(s.frac)) + '</span></button>';
      };
      var biz = act.filter(function (p) { return p.link; }).concat(act.filter(function (p) { return p.biz && !p.link; })), rest = act.filter(function (p) { return p.inbox; }).concat(act.filter(function (p) { return !p.biz && !p.link && !p.inbox; }));
      var h3 = DS.largeTitle({ icon: 'briefcase', title: 'Проекты', tools: DS.iconBtn({ icon: 'edit', label: 'Новый', aria: 'Новый проект', attrs: 'data-newproj' }).replace('#ds-edit', '#dse-plus') });
      h3 += DS.group({ title: 'Бизнес', count: biz.length, html: biz.map(prow).join('') });
      h3 += DS.group({ title: 'Остальное', count: rest.length, html: rest.map(prow).join('') });
      if (arch.length) h3 += DS.disclosure('Архив', String(arch.length), arch.map(prow).join(''), false);
      return h3;
    }
    /* all */
    var list = P.q(function (t) { return P.live(t) || (t.st === 'когда-нибудь' && !t.draft); }).filter(P.whoOk).filter(P.qOk);
    var bl = P.q(function (t) { return !t.draft && t.st !== 'когда-нибудь' && (P.isOpen(t) || P.isDone(t)); }).filter(P.whoOk).filter(P.qOk);
    var nOpen = bl.filter(P.isOpen).length, nSome = list.filter(function (t) { return t.st === 'когда-нибудь'; }).length;
    var h4 = DS.largeTitle({ icon: 'layers', title: 'Все', sub: P.st.view === 'board' ? nOpen + ' открыто · ' + (bl.length - nOpen) + ' готово' : list.length + ' задач' });
    h4 += '<label class="ds-field">' + DS.icon('search') + '<input type="search" data-q placeholder="Поиск по задачам" value="' + esc(P.st.q) + '" aria-label="Поиск по задачам" autocomplete="off"></label>';
    h4 += viewSw(DS.segmented([['all', 'Все'], ['me', 'Мои'], ['bot', 'Бот']], P.st.who, 'who'));
    if (P.st.view === 'board') return h4 + board(bl, true, nSome);
    P.HOR.forEach(function (g) {
      var gl = list.filter(function (t) { return P.horizon(t) === g[0]; });
      if (!gl.length) return;
      if (g[0] === 'some') h4 += DS.disclosure('Когда-нибудь', String(gl.length), rows(gl), P.st.coll.some);
      else h4 += DS.group({ title: g[1], count: gl.length, html: rows(gl, null, g[0] === 'late' && !P.st.coll['late-all'] ? 5 : 999, 'late-all') });
    });
    return h4;
  };

  V.project = function (key) {
    var p = P.proj(key), s = P.projStats(key), L = P.links()[key];
    var list = P.projOpen(key), some = P.q(function (t) { return t.proj === key && t.st === 'когда-нибудь'; }), done = P.q(function (t) { return t.proj === key && P.isDone(t) && !P.fresh()[t.id]; });
    var h = '<div class="ds-topbar">' + DS.backBtn('Проекты', 'data-back') + DS.iconBtn({ icon: 'edit', aria: 'Настройки проекта', label: 'Изменить', attrs: 'data-psheet="' + esc(key) + '"' }).replace('#ds-edit', '#dse-pencil') + '</div>';
    h += '<header class="ds-largetitle ds-noicon"><button type="button" class="a-title-btn" data-psheet="' + esc(key) + '" aria-label="Переименовать и значок">' + DSE.ptile(p, 'lg') + '<h1>' + esc(p.name) + '</h1></button></header>';
    h += '<p class="a-proj-sub">' + (p.biz ? 'Бизнес · ' : '') + 'открыто ' + s.open + ' · готово ' + s.done + (p.arch ? ' · в архиве' : '') + '</p>';
    if (L) h += '<div class="a-link"><div class="a-link-t">Связка · ' + esc(L.t) + (L.lever ? ' · рычаг' : '') + '</div><span class="ds-lcs">' + L.parts.map(function (x) { return '<span class="ds-lc ds-lc--' + x.st + '"><i></i>' + esc(x.n) + '</span>'; }).join('') + '</span>' + (L.gap ? '<div class="a-link-g">Рвётся: ' + esc(L.gap) + '</div>' : '') + '</div>';
    if (P.st.view === 'board') return h + viewSw() + board(P.q(function (t) { return t.proj === key && !t.draft && t.st !== 'когда-нибудь' && (P.isOpen(t) || P.isDone(t)); }), false);
    h += viewSw();
    var parts = ['покупатель', 'продукт', 'продажа', ''];
    var emptyParts = [];
    parts.forEach(function (pt) {
      var gl = list.filter(function (t) { return (t.part || '') === pt; });
      if (!gl.length) { if (pt) emptyParts.push(P.PART_L[pt]); return; }
      h += DS.group({ title: P.PART_L[pt], count: gl.length, html: rows(gl, { noProj: true }) });
    });
    if (!list.length) h += DS.empty('Открытых задач нет. «+» внизу — новая задача в этот проект.');
    if (emptyParts.length && list.length) h += DS.footnote('Без задач: ' + emptyParts.join(', ').toLowerCase() + '. Часть задаёшь в карточке задачи.');
    if (some.length) h += DS.disclosure('Когда-нибудь', String(some.length), rows(some, { noProj: true }), false);
    if (done.length) h += DS.disclosure('Готово', String(done.length), rows(done, { noProj: true }), false);
    return h;
  };

  function prop(field, t) {
    var on = P.st.openProp === field, v = P.valText(field, t), set = !!t[field] || field === 'st' || field === 'who' || field === 'proj';
    var vcls = 'ds-prop-v' + (set ? ' is-set' : '') + (field === 'due' && P.overdue(t) ? ' is-due' : '');
    var val = field === 'proj' ? DSE.ptile(P.proj(t.proj), 'sm') + ' ' + esc(v) : esc(v);
    var btn = field === 'proj' ? 'data-pick="proj"' : 'data-prop="' + field + '" aria-expanded="' + on + '"';
    return '<div class="ds-prop' + (on ? ' is-open' : '') + '"><button type="button" class="ds-prop-b" ' + btn + '>' + DSE.ic(P.FIELD_I[field]) + '<span class="ds-prop-k">' + P.FIELD_L[field] + '</span><span class="' + vcls + '">' + val + '</span>' +
      '<svg class="ds-chev" aria-hidden="true"><use href="#ds-chev"/></svg></button>' + (on ? '<div class="ds-prop-x">' + P.ui.chips(field, t) + '</div>' : '') + P.errLine(t.id, field) + '</div>';
  }
  V.card = function (t) {
    var note = t.note || '', long = note.length > 90 && !P.st.noteOpen[t.id];
    if (!t.full) return '<div class="a-ttl"><button type="button" class="ds-bigcheck" data-check="' + esc(t.id) + '" aria-pressed="' + P.isDone(t) + '" aria-label="Завершить"><i></i></button>' + P.ui.title(t) + '</div>' + DS.empty('Загружаю задачу…');
    var noteHtml = long ? '<div class="a-notebox"><div class="a-notetxt">' + esc(note) + '</div><button type="button" class="a-more" data-noteopen="' + esc(t.id) + '">ещё</button></div>' : '<div class="a-note">' + P.ui.note(t, true) + '</div>';
    return '<div class="a-ttl"><button type="button" class="ds-bigcheck" data-check="' + esc(t.id) + '" aria-pressed="' + P.isDone(t) + '" aria-label="Завершить"><i></i></button>' + P.ui.title(t) + '</div>' + P.errLine(t.id, 't') + P.ui.dup(t) +
      '<div class="ds-props">' + ['st', 'due', 'lev'].map(function (f) { return prop(f, t); }).join('') + '</div>' +
      noteHtml + P.errLine(t.id, 'note') +
      '<div class="a-subs">' + P.ui.subs(t) + '</div>' +
      P.ui.step(t) +
      '<div class="ds-props a-card-props">' + ['prio', 'proj', 'part', 'who'].map(function (f) { return prop(f, t); }).join('') + '</div>' +
      P.ui.actions(t) + P.ui.meta(t);
  };

  var TT = { today: ['star', 'Сегодня'], wait: ['clock', 'Ждёт меня'], proj: ['briefcase', 'Проекты'], all: ['layers', 'Все'] };
  V.loading = function (tab) { var x = TT[tab] || TT.today; return DS.largeTitle({ icon: x[0], title: x[1] }) + DS.empty('Загружаю дела…'); };
  V.failed = function (text) { return DS.largeTitle({ icon: 'star', title: 'Штаб' }) + DS.empty('Дела не загрузились: ' + (text || 'служба не ответила') + '.') + DS.actions(DS.button({ text: 'Повторить', attrs: 'data-reload' })); };
  V.gate = function (text) { return DS.largeTitle({ icon: 'star', title: 'Штаб' }) + DS.empty(text || 'Открой Штаб кнопкой в чате с ботом.'); };

  var hh = new URLSearchParams(location.hash.slice(1));
  if (hh.get('view') === 'board') P.st.view = 'board';
  P.init(V).then(function () { if (hh.get('move') && P.byId(hh.get('move'))) P.open('move', hh.get('move'), { id: hh.get('move') }); });
})();
</script>
</body></html>
