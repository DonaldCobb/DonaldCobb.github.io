<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EE">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Штаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --paper: #F6F4EE; --card: #FFFFFF; --ink: #1B1A17; --ink-2: #55524B; --ink-3: #8A867D;
    --line: #E7E3DA; --line-2: #F0EDE6;
    --pine: #1F5B45; --pine-2: #2B7259; --pine-soft: #E4EEE8;
    --rust: #A8431E; --rust-soft: #F7E7DF; --amber: #8A5A00; --amber-soft: #F6EDD6;
    --radius: 16px; --tabbar: 64px;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: #ECE9E1; color: var(--ink);
    font-family: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.42; font-variant-numeric: tabular-nums; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  p { margin: 0; }
  a { color: var(--pine); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; background: var(--line-2); border-radius: 5px; padding: 0 4px; overflow-wrap: anywhere; }
  .app { position: relative; max-width: 440px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: var(--paper); overflow-x: clip; }
  @media (min-width: 480px) { .app { box-shadow: 0 0 0 1px var(--line); } }

  /* Шапка */
  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: calc(10px + var(--safe-t)) 16px 10px;
    background: rgba(246, 244, 238, .92);
    -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid transparent; transition: border-color .2s;
  }
  .topbar.scrolled { border-bottom-color: var(--line); }
  .logo { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--pine); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .brand { min-width: 0; flex: 1; }
  .brand-name { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .brand-sub { font-size: 12.5px; color: var(--ink-3); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .online { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3BA272; margin-right: 5px; vertical-align: 1px; }
  .online.stale { background: var(--amber); }

  /* Экраны */
  main { padding: 6px 16px calc(var(--tabbar) + var(--safe-b) + 28px); }
  .screen { display: none; }
  .screen.active { display: block; }
  .screen.in-r { animation: inR .32s cubic-bezier(.2,.8,.2,1) both; }
  .screen.in-l { animation: inL .32s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes inR { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  @keyframes inL { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen.in-r, .screen.in-l { animation: none; } }

  .hello { padding: 14px 2px 12px; }
  .hello .date { font-size: 13px; color: var(--ink-3); font-weight: 500; }
  .hello h1 { font-size: 25px; line-height: 1.2; font-weight: 700; letter-spacing: -.015em; margin: 3px 0 0; text-wrap: balance; }
  .hello .sub { color: var(--ink-2); font-size: 14.5px; margin-top: 6px; }

  .sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 2px 9px; }
  .sec-title h2 { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
  .sec-title span { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow-wrap: anywhere; }
  .pad { padding: 14px 16px; }
  .stack { display: grid; gap: 10px; }
  .empty { padding: 14px 16px; color: var(--ink-3); font-size: 14px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; line-height: 1.5; }
  .p-ok { background: var(--pine-soft); color: var(--pine); }
  .p-bad { background: var(--rust-soft); color: var(--rust); }
  .p-wait { background: var(--amber-soft); color: var(--amber); }
  .p-mute { background: #EFEDE7; color: var(--ink-2); }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 11px 11px 10px; min-width: 0; }
  .kpi span { display: block; font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .kpi b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
  .kpi b small { font-size: 14px; color: var(--ink-3); font-weight: 600; }
  .kpi .bar { height: 5px; border-radius: 999px; background: var(--line-2); margin-top: 7px; overflow: hidden; }
  .kpi .bar i { display: block; height: 100%; background: var(--pine); border-radius: 999px; }
  .kpi.warn { background: var(--rust-soft); border-color: transparent; }
  .kpi.warn span, .kpi.warn b { color: var(--rust); }
  .kpi.warn .bar { background: rgba(168, 67, 30, .15); }
  .kpi.warn .bar i { background: var(--rust); }

  /* Приоритеты */
  .prio { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 13px 16px; }
  .prio + .prio { border-top: 1px solid var(--line-2); }
  .prio .mono { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: #EFEDE7; color: var(--ink-2); }
  .prio.p1 .mono { background: var(--pine); color: #fff; }
  .prio.p2 .mono { background: var(--pine-soft); color: var(--pine); }
  .prio b { display: block; font-weight: 600; font-size: 15px; line-height: 1.3; }
  .prio span { font-size: 13.5px; color: var(--ink-2); }
  .goal { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 11px 16px; font-size: 14.5px; }
  .goal + .goal { border-top: 1px solid var(--line-2); }
  .goal i { font-style: normal; color: var(--pine); font-weight: 700; }

  /* Расписание */
  .agenda { list-style: none; margin: 0; padding: 4px 0; }
  .agenda li { display: grid; grid-template-columns: 62px 14px 1fr; gap: 0 10px; padding: 10px 16px; position: relative; }
  .agenda .t { font-weight: 600; font-size: 14.5px; padding-top: 1px; white-space: nowrap; }
  .agenda .rail { position: relative; }
  .agenda .rail::before { content: ""; position: absolute; left: 6px; top: 0; bottom: -20px; width: 2px; background: var(--line-2); }
  .agenda li:first-child .rail::before { top: 8px; }
  .agenda li:last-child .rail::before { bottom: auto; height: 8px; }
  .agenda .rail i { position: absolute; left: 1px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink-3); }
  .agenda .what { font-size: 14.5px; line-height: 1.38; }
  .agenda .what small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
  .agenda li.past .t, .agenda li.past .what { color: var(--ink-3); }
  .agenda li.past .rail i { border-color: var(--line); background: var(--line); }
  .agenda li.next .rail i { border-color: var(--pine); background: var(--pine); box-shadow: 0 0 0 4px var(--pine-soft); }
  .agenda li.next .t { color: var(--pine); }

  /* Отметки и шаги */
  .tasks { list-style: none; margin: 0; padding: 0; }
  .tasks li + li { border-top: 1px solid var(--line-2); }
  .task { display: grid; grid-template-columns: 26px 1fr; gap: 12px; padding: 12px 16px; font-size: 14.5px; }
  .box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); margin-top: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); }
  .box svg { width: 14px; height: 14px; color: #fff; }
  .task.is-done .box { background: var(--pine); border-color: var(--pine); }
  .task.is-done .txt { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }

  .note-row { padding: 11px 16px; font-size: 14.5px; color: var(--ink-2); }
  .note-row + .note-row { border-top: 1px solid var(--line-2); }

  /* Списки людей и строки */
  .people { list-style: none; margin: 0; padding: 0; }
  .people li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; padding: 12px 16px; }
  .people li + li { border-top: 1px solid var(--line-2); }
  .ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #EFEDE7; color: var(--ink-2); font-weight: 600; font-size: 14px; }
  .ava.hot { background: var(--pine-soft); color: var(--pine); }
  .who { min-width: 0; }
  .who b { display: block; font-weight: 600; font-size: 15px; line-height: 1.3; }
  .who > span { display: block; font-size: 13.5px; color: var(--ink-2); line-height: 1.35; }
  .who .nx { margin-top: 6px; font-size: 14px; color: var(--ink); background: var(--paper); border-radius: 10px; padding: 7px 10px; }
  .who .nx small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .who .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; font-size: 12.5px; color: var(--ink-3); }

  /* Нити */
  .thread { padding: 13px 16px; }
  .thread + .thread { border-top: 1px solid var(--line-2); }
  .thread-h { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
  .thread-h b { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .thread-h em { font-style: normal; flex: none; font-size: 12.5px; color: var(--ink-3); }
  .kv { display: grid; grid-template-columns: 58px 1fr; gap: 2px 8px; margin-top: 6px; font-size: 13.5px; }
  .kv dt { color: var(--ink-3); font-weight: 500; }
  .kv dd { margin: 0; color: var(--ink-2); }

  /* Сегменты и фильтры */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: #E9E6DE; border-radius: 12px; padding: 3px; margin: 4px 0 2px; }
  .seg button { padding: 8px 4px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px; margin: 4px -16px 0; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; background: var(--card); border: 1px solid var(--line); color: var(--ink-2); }
  .chip[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: #fff; }
  .chip small { font-weight: 500; opacity: .75; margin-left: 3px; }

  /* Исследования */
  .rs summary { padding: 13px 16px; display: grid; grid-template-columns: 36px 1fr 18px; gap: 10px; align-items: start; }
  .rs .num { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--paper); font-weight: 700; font-size: 14px; color: var(--ink-2); }
  .rs .ttl { font-size: 14.5px; font-weight: 600; line-height: 1.33; }
  .rs .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .rs .more { padding: 0 16px 14px 62px; font-size: 13.5px; color: var(--ink-2); }
  .rs .more p + p { margin-top: 6px; }
  .rs .more a { font-weight: 600; text-decoration: none; }
  .chev { width: 18px; height: 18px; color: var(--ink-3); transition: transform .25s; margin-top: 8px; }
  details[open] > summary .chev { transform: rotate(180deg); }
  summary { list-style: none; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }

  /* Система */
  .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 11px 16px; align-items: start; }
  .row + .row { border-top: 1px solid var(--line-2); }
  .row b { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .row .sub { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); }
  .row .side { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; text-align: right; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: #3BA272; }
  .dot.off { background: var(--rust); }
  .sphere { padding: 12px 16px; }
  .sphere + .sphere { border-top: 1px solid var(--line-2); }
  .sphere-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .sphere-h b { font-weight: 600; font-size: 15px; }
  .sphere ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; }
  .sphere li { font-size: 13.5px; color: var(--ink-2); padding-left: 14px; position: relative; }
  .sphere li::before { content: ""; position: absolute; left: 1px; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); }
  .prog { height: 6px; border-radius: 999px; background: var(--line-2); overflow: hidden; margin-top: 7px; grid-column: 1 / -1; }
  .prog i { display: block; height: 100%; background: var(--pine); }
  .grp-h { padding: 10px 16px 0; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
  .collapse summary { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14.5px; }
  .collapse summary .chev { margin-top: 0; }
  .collapse .inner { border-top: 1px solid var(--line-2); }

  .fine { font-size: 12px; color: var(--ink-3); text-align: center; margin: 28px auto 0; max-width: 30em; }

  /* Замок */
  .lock { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 10px; padding: 40px 24px; }
  .lock .big { font-size: 46px; }
  .lock h1 { font-size: 22px; margin: 0; }
  .lock p { color: var(--ink-2); font-size: 14.5px; max-width: 24em; }

  /* Нижняя панель */
  .tabbar {
    position: fixed; z-index: 30; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 440px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
    padding: 6px 2px calc(6px + var(--safe-b));
    background: rgba(255, 255, 255, .94);
    -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
    border-top: 1px solid var(--line);
  }
  .tabbar[hidden] { display: none; }
  .tab { display: grid; justify-items: center; gap: 2px; padding: 4px 0 2px; min-width: 0; color: var(--ink-3); transition: color .2s; }
  .tab .ic { width: 46px; max-width: 100%; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .25s; }
  .tab svg { width: 21px; height: 21px; }
  .tab .lb { font-size: 10.5px; font-weight: 500; line-height: 1.2; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 1px; }
  .tab[aria-selected="true"] { color: var(--pine); }
  .tab[aria-selected="true"] .ic { background: var(--pine-soft); }
  .tab[aria-selected="true"] .lb { font-weight: 600; }
  @media (max-width: 374px) { .tab .lb { font-size: 9.5px; letter-spacing: -.01em; } .tab .ic { width: 38px; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="logo" aria-hidden="true">Ш</div>
    <div class="brand">
      <div class="brand-name">Штаб</div>
      <div class="brand-sub" id="built"><span class="online"></span>загрузка…</div>
    </div>
  </header>

  <main id="main">
    <div class="lock" id="lock">
      <div class="big" aria-hidden="true">🔒</div>
      <h1>Закрыто</h1>
      <p id="lock-msg">Открой Штаб кнопкой в боте — ссылка с ключом расшифрует данные прямо на телефоне.</p>
    </div>
    <section class="screen" id="s-focus" role="tabpanel"></section>
    <section class="screen" id="s-today" role="tabpanel"></section>
    <section class="screen" id="s-tasks" role="tabpanel"></section>
    <section class="screen" id="s-research" role="tabpanel"></section>
    <section class="screen" id="s-people" role="tabpanel"></section>
    <section class="screen" id="s-system" role="tabpanel"></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Разделы" id="tabbar" hidden>
    <button class="tab" role="tab" type="button" data-go="focus" aria-selected="true">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg></span>
      <span class="lb">Фокус</span>
    </button>
    <button class="tab" role="tab" type="button" data-go="today" aria-selected="false">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3"/></svg></span>
      <span class="lb">Сегодня</span>
    </button>
    <button class="tab" role="tab" type="button" data-go="tasks" aria-selected="false">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 2 2 4-4M4 17l2 2 4-4M13 7h7M13 17h7"/></svg></span>
      <span class="lb">Задачи</span>
    </button>
    <button class="tab" role="tab" type="button" data-go="research" aria-selected="false">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <span class="lb">Исследования</span>
    </button>
    <button class="tab" role="tab" type="button" data-go="people" aria-selected="false">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.2A6.5 6.5 0 0 1 21.5 20"/></svg></span>
      <span class="lb">Люди</span>
    </button>
    <button class="tab" role="tab" type="button" data-go="system" aria-selected="false">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="6" rx="2"/><rect x="3.5" y="14" width="17" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></span>
      <span class="lb">Система</span>
    </button>

<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#F6F4EE'); tg.setBackgroundColor && tg.setBackgroundColor('#F6F4EE'); } catch (e) {} }

  // ---------- ключ ----------
  function keyFromHash() {
    var m = (location.hash || '').match(/(?:^#|[#&?])k=([A-Za-z0-9_-]{40,})/);
    return m ? m[1] : null;
  }
  var k = keyFromHash();
  try {
    if (k) sessionStorage.setItem('shtab.k', k); else k = sessionStorage.getItem('shtab.k');
  } catch (e) {}
  if (keyFromHash()) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }

  function b64(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function locked(msg) {
    if (msg) document.getElementById('lock-msg').textContent = msg;
    document.getElementById('built').innerHTML = '<span class="online stale"></span>данные зашифрованы';
  }
  if (!k) { locked(); return; }
  if (!window.crypto || !crypto.subtle) { locked('Браузер не умеет расшифровывать (нет WebCrypto). Открой в Telegram или обычном браузере по https.'); return; }

  var blob = b64(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw', b64(k), { name: 'AES-GCM' }, false, ['decrypt'])
    .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(0, 12) }, key, blob.slice(12)); })
    .then(function (buf) { render(JSON.parse(new TextDecoder().decode(buf))); })
    .catch(function () { try { sessionStorage.removeItem('shtab.k'); } catch (e) {} locked('Ключ не подошёл. Открой Штаб заново кнопкой в боте.'); });

  // ---------- помощники ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(s) { return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>'); }
  function initials(name) { var p = String(name).replace(/[«»"(),.]/g, ' ').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] && /^[А-ЯЁA-Z]/.test(p[1]) ? p[1][0] : '')).toUpperCase(); }
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
  var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  function sec(title, side) { return '<div class="sec-title"><h2>' + esc(title) + '</h2>' + (side != null ? '<span>' + esc(side) + '</span>' : '') + '</div>'; }
  function card(inner) { return '<div class="card">' + inner + '</div>'; }
  var WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  var MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  function permNow() { var d = new Date(); return new Date(d.getTime() + (d.getTimezoneOffset() + 300) * 60000); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dayLabel(s, todayIso) {
    var d = new Date(s + 'T00:00:00'), t = new Date(todayIso + 'T00:00:00');
    var diff = Math.round((d - t) / 86400000);
    var base = WD[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()];
    return diff === 0 ? 'Сегодня · ' + base : diff === 1 ? 'Завтра · ' + base : base;
  }
  function toMin(t) { var m = String(t).match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; }

  // ---------- отрисовка ----------
  function render(D) {
    document.getElementById('lock').remove();
    document.getElementById('tabbar').hidden = false;
    var now = permNow(), todayIso = iso(now), mins = now.getHours() * 60 + now.getMinutes();
    var b = D.built.split(' ');
    var ageH = (now - new Date(b[0] + 'T' + b[1] + ':00')) / 3600000;
    document.getElementById('built').innerHTML = '<span class="online' + (ageH > 2 ? ' stale' : '') + '"></span>собрано ' +
      esc(b[0].slice(8, 10) + '.' + b[0].slice(5, 7)) + ' в ' + esc(b[1]) + ' · Пермь';

    // ===== Фокус =====
    var F = D.focus, h = '';
    var dleft = Math.max(0, Math.round((new Date(F.talks.until + 'T23:59:00') - now) / 86400000));
    var dateStr = WD[now.getDay()] + ', ' + now.getDate() + ' ' + MON[now.getMonth()];
    h += '<div class="hello"><div class="date">' + esc(dateStr.charAt(0).toUpperCase() + dateStr.slice(1)) + '</div><h1>Главное — клиенты и деньги</h1>' +
      '<div class="sub">До ' + esc(F.talks.until.slice(8, 10) + '.' + F.talks.until.slice(5, 7)) + ' осталось ' + dleft + ' дн.</div></div>';
    var tp = Math.min(100, Math.round(F.talks.n / F.talks.goal * 100));
    var need = F.talks.goal - F.talks.n, weeks = Math.max(1, dleft / 7);
    h += '<div class="kpis">';
    h += '<div class="kpi' + (need / weeks > 3 ? ' warn' : '') + '"><span>Разговоры</span><b>' + F.talks.n + '<small> / ' + F.talks.goal + '</small></b><div class="bar"><i style="width:' + tp + '%"></i></div></div>';
    if (F.touches) {
      var cp = Math.min(100, Math.round(F.touches.n / F.touches.goal * 100));
      h += '<div class="kpi"><span>Касания</span><b>' + F.touches.n + '<small> / ' + F.touches.goal + '</small></b><div class="bar"><i style="width:' + cp + '%"></i></div></div>';
    }
    h += '<div class="kpi"><span>В неделю нужно</span><b>' + (need > 0 ? Math.ceil(need / weeks) : 0) + '</b><small style="font-size:12px;color:var(--ink-3)">разговора</small></div>';
    h += '</div>';
    h += sec('Приоритеты') + card(F.priorities.map(function (p) {
      return '<div class="prio ' + esc(p.p.toLowerCase()) + '"><div class="mono">' + esc(p.p) + '</div><div><b>' + fmt(p.title) + '</b><span>' + fmt(p.text) + '</span></div></div>';
    }).join(''));
    h += sec('Воронка до оплаты', F.funnel.length) + card('<ul class="people">' + F.funnel.map(function (f) {
      var pill = f.date ? '<span class="pill ' + (f.date < todayIso ? 'p-bad' : f.date === todayIso ? 'p-wait' : 'p-mute') + '">' + esc(f.date.slice(8, 10) + '.' + f.date.slice(5, 7)) + '</span>' : '<span class="pill p-mute">без даты</span>';
      return '<li><div class="ava hot">' + esc(initials(f.who)) + '</div><div class="who"><b>' + fmt(f.who) + '</b><span>' + fmt(f.next) + '</span><div class="meta">' + pill + (f.paid ? '<span class="pill p-ok">оплата: ' + esc(f.paid) + '</span>' : '') + '</div></div></li>';
    }).join('') + '</ul>');
    h += sec('Цели квартала') + card(F.goals.map(function (g, i) { return '<div class="goal"><i>' + (i + 1) + '</i><span>' + fmt(g) + '</span></div>'; }).join(''));
    if (F.talks.list.length) {
      h += sec('Разговоры', F.talks.n + ' из ' + F.talks.goal) + card(F.talks.list.map(function (t) {
        return '<div class="row"><b>' + fmt(t.who) + '</b><span class="side">' + esc(t.date.slice(8, 10) + '.' + t.date.slice(5, 7)) + '</span><span class="sub">' + fmt(t.result) + '</span></div>';
      }).join(''));
    }
    put('focus', h);

    // ===== Сегодня =====
    var T = D.today; h = '';
    var boardToday = T.board_date === todayIso;
    h += '<div class="hello"><div class="date">' + esc(T.board_title || 'Доска дня') + '</div><h1>Сегодня</h1>' +
      (boardToday ? '' : '<div class="sub">Доска от ' + esc(T.board_date || '—') + ' — утренний план ещё не вышел.</div>') + '</div>';
    if (T.agenda.length) {
      var nextIdx = -1;
      if (boardToday) T.agenda.forEach(function (a, i) { var m = toMin(a.t); if (nextIdx < 0 && m != null && m >= mins && !/^до/.test(a.t)) nextIdx = i; });
      h += sec('Расписание', T.agenda.length) + card('<ul class="agenda">' + T.agenda.map(function (a, i) {
        var m = toMin(a.t), cls = '';
        if (boardToday && m != null) cls = i === nextIdx ? 'next' : (m < mins ? 'past' : '');
        return '<li class="' + cls + '"><div class="t">' + esc(a.t) + '</div><div class="rail"><i></i></div><div class="what">' + fmt(a.text) + '</div></li>';
      }).join('') + '</ul>');
    }
    if (T.checks.length) {
      var dn = T.checks.filter(function (c) { return c.done; }).length;
      h += sec('Отметки дня', dn + ' из ' + T.checks.length) + card('<ul class="tasks">' + T.checks.map(function (c) {
        return '<li><div class="task' + (c.done ? ' is-done' : '') + '"><span class="box">' + (c.done ? CHECK : esc(c.n)) + '</span><span class="txt">' + fmt(c.text) + '</span></div></li>';
      }).join('') + '</ul>');
    }
    if (T.notes.length) h += sec('С доски') + card(T.notes.map(function (n) { return '<div class="note-row">' + fmt(n) + '</div>'; }).join(''));
    var groups = {};
    T.upcoming.forEach(function (u) { (groups[u.date] = groups[u.date] || []).push(u); });
    h += sec('Неделя: встречи и напоминания', T.upcoming.length);
    if (!T.upcoming.length) h += card('<div class="empty">На 7 дней разовых строк нет.</div>');
    Object.keys(groups).sort().forEach(function (d) {
      h += '<div class="grp-h" style="padding:12px 2px 6px">' + esc(dayLabel(d, todayIso)) + '</div>';
      h += card('<ul class="agenda">' + groups[d].map(function (u) {
        var past = d < todayIso || (d === todayIso && toMin(u.t) < mins);
        var body = fmt(u.text) + (u.tag ? '<small>' + esc(u.tag) + '</small>' : '');
        if (u.full) body = '<details><summary>' + body + '</summary><small style="color:var(--ink-2);font-size:13.5px">' + fmt(u.full) + '</small></details>';
        return '<li class="' + (past ? 'past' : '') + '"><div class="t">' + esc(u.t) + '</div><div class="rail"><i></i></div><div class="what">' + body + '</div></li>';
      }).join('') + '</ul>');
    });
    put('today', h);

    // ===== Задачи =====
    var K = D.tasks; h = '';
    var stepsOpen = K.steps.filter(function (s) { return !s.done; }).length;
    h += '<div class="hello"><div class="date">Нити и шаги</div><h1>' + K.open.length + ' открытых нитей</h1><div class="sub">Шагов в STATE: ' + stepsOpen + ' открыто из ' + K.steps.length + '</div></div>';
    h += '<div class="seg" data-seg="tasks"><button type="button" data-v="open" aria-pressed="true">Нити · ' + K.open.length + '</button><button type="button" data-v="steps" aria-pressed="false">Шаги · ' + stepsOpen + '</button><button type="button" data-v="closed" aria-pressed="false">Закрыто · ' + K.closed.length + '</button></div>';
    var openSorted = K.open.slice().sort(function (a, b) { return (+a.id) - (+b.id); });
    h += '<div data-pane="open">' + sec('Открыто', 'старые сверху') + card(openSorted.map(function (t) {
      return '<div class="thread"><div class="thread-h"><b>' + fmt(t.text) + '</b><em>#' + esc(t.id) + ' · ' + esc(t.since) + '</em></div><dl class="kv"><dt>Ждём</dt><dd>' + fmt(t.wait) + '</dd><dt>Дальше</dt><dd>' + fmt(t.next) + '</dd></dl>' +
        (+t.nudge > 0 ? '<div style="margin-top:6px"><span class="pill p-wait">дожим ×' + esc(t.nudge) + '</span></div>' : '') + '</div>';
    }).join('') || '<div class="empty">Открытых нитей нет.</div>') + '</div>';
    h += '<div data-pane="steps" hidden>' + sec('Ближайшие шаги', stepsOpen + ' открыто') + card('<ul class="tasks">' + K.steps.map(function (s) {
      return '<li><div class="task' + (s.done ? ' is-done' : '') + '"><span class="box">' + (s.done ? CHECK : '') + '</span><span class="txt">' + fmt(s.text) + '</span></div></li>';
    }).join('') + '</ul>') + '</div>';
    h += '<div data-pane="closed" hidden>' + sec('Закрыто', K.closed.length) + card(K.closed.slice().reverse().map(function (t) {
      return '<div class="thread"><div class="thread-h"><b>' + fmt(t.text) + '</b><em>#' + esc(t.id) + ' · ' + esc(t.when) + '</em></div><dl class="kv"><dt>Исход</dt><dd>' + fmt(t.result) + '</dd></dl></div>';
    }).join('') || '<div class="empty">Закрытых пока нет.</div>') + '</div>';
    put('tasks', h);

    // ===== Исследования =====
    var R = D.research.items; h = '';
    var cnt = function (f) { return R.filter(f).length; };
    var flt = [
      ['all', 'Все', function () { return true; }],
      ['new', 'Не разобрано', function (r) { return r.apply === 'не разобрано'; }],
      ['work', 'В работе', function (r) { return r.apply === 'в работе' || r.status === 'в работе'; }],
      ['later', 'Отложено', function (r) { return r.apply === 'отложено'; }],
      ['done', 'Применено', function (r) { return r.apply === 'применено'; }],
      ['queue', 'В очереди', function (r) { return r.status === 'готов'; }]
    ];
    h += '<div class="hello"><div class="date">Очередь и применение</div><h1>' + R.length + ' исследований</h1><div class="sub">Не разобрано: ' + cnt(flt[1][2]) + ' · в работе: ' + cnt(flt[2][2]) + '</div></div>';
    h += '<div class="chips" data-chips="research">' + flt.map(function (f, i) {
      return '<button class="chip" type="button" data-f="' + f[0] + '" aria-pressed="' + (i === 0) + '">' + f[1] + '<small>' + cnt(f[2]) + '</small></button>';
    }).join('') + '</div><div class="stack" style="margin-top:10px">';
    R.forEach(function (r) {
      var tags = flt.slice(1).filter(function (f) { return f[2](r); }).map(function (f) { return f[0]; }).join(' ');
      var ap = r.apply === 'не разобрано' ? 'p-bad' : r.apply === 'в работе' ? 'p-wait' : r.apply === 'применено' ? 'p-ok' : 'p-mute';
      var st = r.status === 'сделано' ? 'p-ok' : r.status === 'в работе' ? 'p-wait' : 'p-mute';
      h += '<details class="card rs" data-tags="' + tags + '"><summary><div class="num">' + esc(r.n || '·') + '</div><div><div class="ttl">' + fmt(r.topic) + '</div><div class="pills">' +
        '<span class="pill ' + st + '">' + esc(r.status) + '</span>' + (r.apply && r.apply !== '—' ? '<span class="pill ' + ap + '">' + esc(r.apply) + '</span>' : (r.status === 'сделано' ? '<span class="pill p-mute">без отметки</span>' : '')) +
        '</div></div>' + CHEV + '</summary><div class="more">' +
        (r['for'] ? '<p><b>Для решения:</b> ' + fmt(r['for']) + '</p>' : '') +
        (r.apply_text ? '<p><b>Применение:</b> ' + fmt(r.apply_text) + '</p>' : '') +
        (r.link ? '<p><a href="' + esc(r.link) + '" target="_blank" rel="noopener">Открыть на GitHub →</a></p>' : '') + '</div></details>';
    });
    h += '</div>';
    put('research', h);

    // ===== Люди =====
    var P = D.people; h = '';
    h += '<div class="hello"><div class="date">Клиенты и круг</div><h1>Люди</h1><div class="sub">Клиентов: ' + P.clients.length + ' · людей вокруг дела: ' + P.people.length + '</div></div>';
    function personLi(p, hot) {
      var upd = p.updated ? '<span>обновлено ' + esc(p.updated.slice(8, 10) + '.' + p.updated.slice(5, 7)) + '</span>' : '';
      return '<li><div class="ava' + (hot ? ' hot' : '') + '">' + esc(initials(p.name)) + '</div><div class="who"><b>' + fmt(p.name) + '</b><span>' + fmt(p.who) + '</span>' +
        (p.next ? '<div class="nx"><small>Следующий шаг</small>' + fmt(p.next) + '</div>' : '') +
        '<div class="meta">' + upd + (p.link ? '<a href="' + esc(p.link) + '" target="_blank" rel="noopener">файл</a>' : '') + '</div></div></li>';
    }
    h += sec('Клиенты', P.clients.length) + card('<ul class="people">' + P.clients.map(function (p) { return personLi(p, true); }).join('') + '</ul>');
    h += sec('Люди', P.people.length) + card('<ul class="people">' + P.people.map(function (p) { return personLi(p, false); }).join('') + '</ul>');
    put('people', h);

    // ===== Система =====
    var S = D.system; h = '';
    var alive = S.procs.filter(function (p) { return p.alive; }).length;
    h += '<div class="hello"><div class="date">Проекты и машины</div><h1>Система</h1><div class="sub">Проектов: ' + S.projects.length + ' · процессов живо ' + alive + ' из ' + S.procs.length + ' · циклов: ' + S.cycles.length + '</div></div>';
    h += sec('Дело — проекты', S.projects.length) + card(S.projects.map(function (p) {
      var st = /работ|производ|тест/.test(p.status) ? 'p-ok' : /отлож/.test(p.status) ? 'p-mute' : 'p-wait';
      var due = p.due && /^\d{4}-/.test(p.due) ? esc(p.due.slice(8, 10) + '.' + p.due.slice(5, 7)) : esc(p.due);
      return '<div class="row"><b>' + fmt(p.name) + '</b><span class="side">' + due + '</span><span class="sub"><span class="pill ' + st + '" style="margin-right:6px">' + fmt(p.status.replace(/\s*\(.*\)$/, '')) + '</span>' + fmt(p.next) + '</span></div>';
    }).join(''));
    h += sec('Жизнь — сферы', S.spheres.length) + card(S.spheres.map(function (s) {
      return '<div class="sphere"><div class="sphere-h"><b>' + fmt(s.name) + '</b>' + (s.files.length ? '<span class="pill p-ok">' + s.files.length + ' ' + (s.files.length === 1 ? 'файл' : 'файла') + '</span>' : '<span class="pill p-mute">' + (s.empty ? 'пусто' : 'только README') + '</span>') + '</div>' +
        (s.files.length ? '<ul>' + s.files.map(function (f) { return '<li>' + fmt(f) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
    }).join(''));
    h += sec('Облако — сервер', alive + ' / ' + S.procs.length + ' живы') + card(S.procs.map(function (p) {
      return '<div class="row"><b><span class="dot' + (p.alive ? '' : ' off') + '"></span>' + esc(p.name) + '</b><span class="side">' + (p.alive ? 'работает' : 'остановлен') + '</span><span class="sub">' + esc(p.how) + '</span></div>';
    }).join('')) + '<div style="height:10px"></div>' +
      '<details class="card collapse"><summary>Cron · ' + S.cron.length + ' заданий' + CHEV + '</summary><div class="inner">' + S.cron.map(function (c) {
        return '<div class="row"><b>' + esc(c.label) + '</b><span class="side">' + esc(c.when) + '</span></div>';
      }).join('') + '</div></details>';
    h += sec('ПК и Mac — сборки', S.builds.length) + card(S.builds.map(function (x) {
      var pct = x.stages ? Math.round(x.done_n / x.stages * 100) : 0;
      var st = x.done ? '<span class="pill p-ok">готово</span>' : x.stall ? '<span class="pill p-bad">стоит</span>' : '<span class="pill p-wait">идёт</span>';
      return '<div class="row"><b>' + fmt(x.name) + '</b>' + st + '<span class="sub">' + esc(x.host) + ' · этапов ' + x.done_n + ' из ' + x.stages + (x.seen ? ' · отметка ' + esc(x.seen) : '') + '</span><div class="prog"><i style="width:' + pct + '%"></i></div></div>';
    }).join('') || '<div class="empty">Сборок нет.</div>');
    h += sec('Циклы', S.cycles.length) + '<details class="card collapse"><summary>Реестр циклов бота' + CHEV + '</summary><div class="inner">' + S.cycles.map(function (c) {
      return '<div class="row"><b>' + fmt(c.name) + '</b><span class="side">' + esc(c.id) + '</span><span class="sub">' + fmt(c.when) + (c.q && c.q !== '—' ? ' — <i>' + fmt(c.q) + '</i>' : '') + '</span></div>';
    }).join('') + '</div></details>';
    h += '<p class="fine">Данные из хранилищ Business и Life, только чтение. Суммы, телефоны, почта и ключи вычищены. Зашифровано AES-GCM, ключ только в ссылке.</p>';
    put('system', h);

    bind();
    var start = 'focus';
    try { start = sessionStorage.getItem('shtab.tab') || 'focus'; } catch (e) {}
    go(start, true);
  }

  function put(id, html) { document.getElementById('s-' + id).innerHTML = html; }

  // ---------- вкладки и переключатели ----------
  var order = ['focus', 'today', 'tasks', 'research', 'people', 'system'], current = null;
  function go(key, instant) {
    if (order.indexOf(key) < 0) key = 'focus';
    if (key === current) return;
    var dir = current && order.indexOf(key) < order.indexOf(current) ? 'in-l' : 'in-r';
    if (current) document.getElementById('s-' + current).classList.remove('active', 'in-r', 'in-l');
    var s = document.getElementById('s-' + key);
    s.classList.remove('in-r', 'in-l'); s.classList.add('active');
    if (!instant) { void s.offsetWidth; s.classList.add(dir); }
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.go === key ? 'true' : 'false'); });
    current = key; window.scrollTo(0, 0);
    try { sessionStorage.setItem('shtab.tab', key); } catch (e) {}
    if (!instant && tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
  }
  function bind() {
    document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { go(t.dataset.go); }); });
    document.querySelectorAll('[data-seg]').forEach(function (seg) {
      var root = seg.parentNode;
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        seg.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        root.querySelectorAll('[data-pane]').forEach(function (p) { p.hidden = p.dataset.pane !== b.dataset.v; });
      });
    });
    document.querySelectorAll('[data-chips]').forEach(function (ch) {
      var root = ch.parentNode;
      ch.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        ch.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        root.querySelectorAll('[data-tags]').forEach(function (it) {
          it.hidden = b.dataset.f !== 'all' && (' ' + it.dataset.tags + ' ').indexOf(' ' + b.dataset.f + ' ') < 0;
        });
      });
    });
    var topbar = document.getElementById('topbar');
    window.addEventListener('scroll', function () { topbar.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  }
})();
</script>
</body>
</html>
