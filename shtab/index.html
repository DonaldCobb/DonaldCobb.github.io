<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0F1012">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Штаб</title>
<script>
  // Тема до первой отрисовки: тёмная по умолчанию, выбор — в localStorage
  (function () { var t = 'dark'; try { t = localStorage.getItem('shtab.theme') || 'dark'; } catch (e) {}
    if (t !== 'light') t = 'dark'; document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Тёмная тема — по умолчанию. Серые нейтрали, один акцент — синий;
     статусы: оранжевый — внимание, зелёный — готово, красный — сбой системы. */
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F1012; --card: #1A1B1E; --card-2: #232428; --raise: #2A2B30;
    --ink: #F2F2F4; --ink-2: #AEAFB5; --ink-3: #8A8B92;
    --line: #2C2D32; --line-2: #222327; --track: #2E2F34; --fill: #8E8F96; --fill-2: #4A4B51;
    --acc: #3D8BFF; --acc-ink: #6AA6FF; --acc-soft: rgba(61, 139, 255, .16); --on-acc: #FFFFFF;
    --warn: #FF9F0A; --warn-ink: #FFB340; --warn-soft: rgba(255, 159, 10, .15);
    --ok: #30D158; --ok-ink: #4CDB72; --ok-soft: rgba(48, 209, 88, .14);
    --bad: #FF453A; --bad-ink: #FF6B61; --bad-soft: rgba(255, 69, 58, .15);
    --bar-bg: rgba(15, 16, 18, .78); --tab-bg: rgba(30, 31, 35, .88); --scrim: rgba(0, 0, 0, .5);
    --shadow: 0 0 0 1px rgba(255, 255, 255, .04);
    --shadow-lg: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 40px rgba(0, 0, 0, .45);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F2F2F4; --card: #FFFFFF; --card-2: #F2F2F4; --raise: #FFFFFF;
    --ink: #1C1C1E; --ink-2: #55565C; --ink-3: #727379;
    --line: #E2E2E6; --line-2: #ECECEF; --track: #E6E6EA; --fill: #6E6F75; --fill-2: #C7C7CC;
    --acc: #0A6CFF; --acc-ink: #0058D6; --acc-soft: rgba(10, 108, 255, .10); --on-acc: #FFFFFF;
    --warn: #F08A00; --warn-ink: #9C5200; --warn-soft: rgba(240, 138, 0, .13);
    --ok: #26A145; --ok-ink: #176E2F; --ok-soft: rgba(38, 161, 69, .12);
    --bad: #E5372C; --bad-ink: #C42B21; --bad-soft: rgba(229, 55, 44, .10);
    --bar-bg: rgba(242, 242, 244, .82); --tab-bg: rgba(255, 255, 255, .92); --scrim: rgba(20, 20, 24, .32);
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 18px rgba(0, 0, 0, .05);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .05), 0 18px 40px rgba(0, 0, 0, .12);
  }
  :root {
    --r: 22px; --r-lg: 28px; --r-sm: 14px;
    --tabbar: 70px;
    /* safe area: Telegram (полный экран: вырез + свои кнопки) или env() браузера */
    --safe-t: var(--sa-t, env(safe-area-inset-top, 0px));
    --safe-b: var(--sa-b, env(safe-area-inset-bottom, 0px));
    --safe-l: var(--sa-l, env(safe-area-inset-left, 0px));
    --safe-r: var(--sa-r, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; background: var(--bg); }
  body {
    margin: 0; color: var(--ink); background: var(--bg); touch-action: manipulation; overscroll-behavior-y: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
  p { margin: 0; }
  a { color: var(--acc-ink); text-decoration: none; font-weight: 600; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; background: var(--card-2); border-radius: 6px; padding: 1px 5px; overflow-wrap: anywhere; }
  svg.i { width: 18px; height: 18px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .chk .o svg.i, .box svg.i { stroke-width: 3.2; }
  .app { position: relative; max-width: 460px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; overflow-x: clip;
         padding-left: var(--safe-l); padding-right: var(--safe-r); }

  /* Шапка */
  .topbar {
    position: sticky; top: 0; z-index: 20; padding: calc(10px + var(--safe-t)) 20px 10px;
    background: var(--bar-bg);
    -webkit-backdrop-filter: saturate(1.4) blur(18px); backdrop-filter: saturate(1.4) blur(18px);
    transition: box-shadow .25s;
  }
  .topbar.scrolled { box-shadow: 0 1px 0 var(--line); }
  .top-row { display: flex; align-items: center; gap: 10px; }
  .brand { flex: 1; min-width: 0; }
  .brand-name { font-weight: 700; font-size: 17px; letter-spacing: -.01em; line-height: 1.2; }
  .brand-sub { font-size: 12.5px; color: var(--ink-3); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .online { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
  .online.stale { background: var(--warn); }
  .iconbtn { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: var(--card); box-shadow: var(--shadow); }
  .iconbtn svg.i { width: 19px; height: 19px; }
  .iconbtn .sun { display: none; }
  :root[data-theme="dark"] .iconbtn .sun { display: block; }
  :root[data-theme="dark"] .iconbtn .moon { display: none; }
  .me { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 15px; overflow: hidden;
        color: var(--ink-2); background: var(--card-2); box-shadow: var(--shadow); }
  .me img, .ava img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
  .filters { display: flex; gap: 8px; margin-top: 12px; }
  .filters[hidden] { display: none; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--card);
           box-shadow: inset 0 0 0 1px var(--line); transition: background .2s, color .2s, box-shadow .2s; }
  .fchip svg.i { width: 15px; height: 15px; }
  .fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }

  /* Экраны */
  main { padding: 4px 20px calc(var(--tabbar) + var(--safe-b) + 40px); }
  .screen { display: none; }
  .screen.active { display: block; }
  .screen.in { animation: fadeUp .35s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .screen.in { animation: none; } }

  .hello { padding: 14px 2px 18px; }
  .hello .date { font-size: 14px; color: var(--ink-3); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .hello .date svg.i { width: 15px; height: 15px; }
  .hello h1 { font-size: 30px; line-height: 1.12; font-weight: 700; letter-spacing: -.025em; margin: 4px 0 0; text-wrap: balance; }
  .hello .sub { color: var(--ink-2); font-size: 15px; margin-top: 8px; }

  .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 30px 4px 12px; }
  .sec h2 { font-size: 19px; font-weight: 700; letter-spacing: -.015em; margin: 0; }
  .sec span { font-size: 13.5px; color: var(--ink-3); white-space: nowrap; }
  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow-wrap: anywhere; }
  .stack { display: grid; gap: 12px; }
  .empty { padding: 18px 20px; color: var(--ink-3); font-size: 14.5px; }
  .quiet { color: var(--ink-3); }

  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; line-height: 1.45; }
  .pill svg.i { width: 13px; height: 13px; }
  .p-acc { background: var(--acc-soft); color: var(--acc-ink); }
  .p-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .p-ok { background: var(--ok-soft); color: var(--ok-ink); }
  .p-bad { background: var(--bad-soft); color: var(--bad-ink); }
  .p-mute { background: var(--card-2); color: var(--ink-2); }

  /* Фокус П1 — главная карточка */
  .hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px 20px 16px; background: var(--card); box-shadow: var(--shadow-lg); cursor: pointer; }
  .hero::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 0 3px 3px 0; background: var(--acc); }
  .hero-top { display: flex; gap: 14px; align-items: flex-start; }
  .hero-top .ttl { flex: 1; min-width: 0; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--acc-ink); background: var(--acc-soft); padding: 4px 10px; border-radius: 999px; letter-spacing: .01em; }
  .eyebrow svg.i { width: 14px; height: 14px; }
  .hero h2 { font-size: 24px; line-height: 1.15; letter-spacing: -.02em; margin: 12px 0 4px; font-weight: 700; }
  .hero .when { font-size: 14px; color: var(--ink-2); }
  .hero .when.warn { color: var(--warn-ink); }
  .ring-box { position: relative; flex: none; width: 92px; height: 92px; }
  .ring-box svg { display: block; }
  .ring-box .rc { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.05; }
  .ring-box .rc b { font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--acc-ink); }
  .ring-box .rc b small { font-size: 13px; color: var(--ink-3); font-weight: 600; }
  .ring-box .rc span { font-size: 11px; color: var(--ink-3); font-weight: 500; margin-top: 3px; }
  .checks { margin-top: 16px; display: grid; gap: 8px; }
  .chk { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; background: var(--card-2); border-radius: 16px; padding: 12px 14px; font-size: 15px; line-height: 1.38; }
  .chk .o { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--fill-2); display: grid; place-items: center; }
  .chk.done .o { background: var(--ok); border-color: var(--ok); }
  .chk .o svg { width: 12px; height: 12px; color: #fff; }
  .chk.done .t { color: var(--ink-3); text-decoration: line-through; }
  .hero-more { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; color: var(--ink-2); }
  .hero-more button { font-weight: 600; color: var(--acc-ink); display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
  .hero-more svg { width: 16px; height: 16px; }

  /* Плитки */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .tile { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 16px 14px; min-width: 0; display: flex; flex-direction: column; }
  .tile.tall { grid-row: span 2; }
  .tile[hidden] { display: none; }
  .tile[data-open-tab] { cursor: pointer; }
  .tile .lbl { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .tile .ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--card-2); color: var(--ink-2); flex: none; }
  .tile .ico svg.i { width: 17px; height: 17px; }
  .tile .big { font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin-top: 12px; }
  .tile .big.acc { color: var(--acc-ink); }
  .tile .big.warn { color: var(--warn-ink); }
  .tile .big small { font-size: 14px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
  .tile .cap { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .tile .grow { flex: 1; }
  .tile-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
  .bars { margin-top: 12px; }
  .bars svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* Лента дня */
  .tl { list-style: none; margin: 0; padding: 8px 0; }
  .tl li { display: grid; grid-template-columns: 50px 18px 1fr; gap: 0 12px; padding: 11px 20px; position: relative; }
  .tl li[hidden] { display: none; }
  .tl .t { font-weight: 600; font-size: 15px; padding-top: 1px; white-space: nowrap; }
  .tl .rail { color: var(--ink-3); padding-top: 2px; }
  .tl .rail svg.i { width: 17px; height: 17px; }
  .tl li.next .rail { color: var(--acc); }
  .tl li.next .t { color: var(--acc-ink); }
  .tl .what { font-size: 15px; line-height: 1.38; min-width: 0; }
  .tl .what small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
  .tl .what details summary { cursor: pointer; }
  .tl .what details p { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
  .tl li.past .t, .tl li.past .what { color: var(--ink-3); }
  .tl li.past .rail { opacity: .55; }
  .tl li.now-li { display: block; padding: 2px 0; }
  .tl .now { display: grid; grid-template-columns: 50px 1fr; gap: 0 12px; padding: 2px 20px; align-items: center; }
  .tl .now span { font-size: 12px; font-weight: 700; color: var(--acc-ink); }
  .tl .now hr { border: 0; height: 2px; background: linear-gradient(90deg, var(--acc), transparent); margin: 0; border-radius: 2px; }

  .day-h { font-size: 13.5px; font-weight: 600; color: var(--ink-2); margin: 18px 4px 8px; }
  .day-h em { font-style: normal; color: var(--ink-3); font-weight: 500; }
  .soft { list-style: none; margin: 0; padding: 4px 0; }
  .soft li { display: grid; grid-template-columns: 44px 16px 1fr; gap: 10px; padding: 9px 18px; font-size: 14px; color: var(--ink-2); align-items: start; }
  .soft li[hidden] { display: none; }
  .soft li + li { border-top: 1px solid var(--line-2); }
  .soft .t { color: var(--ink-3); font-weight: 600; font-size: 13px; padding-top: 1px; }
  .soft .k { color: var(--ink-3); padding-top: 2px; }
  .soft .k svg.i { width: 15px; height: 15px; }
  .soft .x { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .notes { padding: 6px 0; }
  .note { padding: 10px 20px; font-size: 14px; color: var(--ink-2); }
  .note + .note { border-top: 1px solid var(--line-2); }

  /* Колесо */
  .wheel-card { padding: 14px 10px 16px; }
  .wheel-card svg { display: block; width: 100%; height: auto; }
  .wheel-card .sector { cursor: pointer; transition: opacity .25s; }
  .wheel-card .sector.dim { opacity: .22; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-size: 12.5px; color: var(--ink-3); padding: 2px 12px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg.i { width: 14px; height: 14px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .spheres { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sph { text-align: left; background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .sph[hidden] { display: none; }
  .sph-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .sph-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--card-2); color: var(--ink-2); flex: none; }
  .sph-ic svg.i { width: 18px; height: 18px; }
  .sph b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .sph .st { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 500; margin-top: 3px; }
  .sph .st.warn { color: var(--warn-ink); }
  .sph .num { font-size: 13px; color: var(--ink-2); }
  .sph .num b { display: inline; font-size: 20px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); margin-right: 3px; }
  .sph .spark svg { display: block; width: 100%; height: 30px; }

  /* Списки */
  .rows { list-style: none; margin: 0; padding: 4px 0; }
  .r { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 20px; align-items: start; }
  .r + .r { border-top: 1px solid var(--line-2); }
  .r b { font-weight: 600; font-size: 15px; line-height: 1.32; }
  .r .side { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; text-align: right; padding-top: 2px; }
  .r .side.warn { color: var(--warn-ink); font-weight: 600; }
  .r .sub { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); line-height: 1.4; }
  .r .sub + .sub { margin-top: 2px; }
  .r .lbl { color: var(--ink-3); font-weight: 500; }
  .r .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
  .r.proj { grid-template-columns: 36px 1fr auto; }
  .r.proj .sub, .r.proj .meta { grid-column: 2 / -1; }
  .pic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--card-2); color: var(--ink-2); grid-row: span 2; }
  .pic svg.i { width: 19px; height: 19px; }
  .r .ttl-ic { display: inline-flex; align-items: center; gap: 8px; }
  .r .ttl-ic svg.i { width: 16px; height: 16px; color: var(--ink-3); }
  .person { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 14px 20px; align-items: start; }
  .person + .person { border-top: 1px solid var(--line-2); }
  .ava { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); color: var(--ink-2); font-weight: 600; font-size: 15px; overflow: hidden; }
  .ava.co svg.i { width: 20px; height: 20px; }
  .who { min-width: 0; }
  .who b { display: block; font-weight: 600; font-size: 15.5px; line-height: 1.3; }
  .who > span { display: block; font-size: 13.5px; color: var(--ink-3); line-height: 1.38; margin-top: 1px; }
  .who .nx { margin-top: 8px; font-size: 14px; color: var(--ink); background: var(--card-2); border-radius: 14px; padding: 9px 12px; }
  .who .nx small { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 600; margin-bottom: 1px; }
  .who .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
  .box { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--fill-2); display: grid; place-items: center; }
  .box svg { width: 12px; height: 12px; color: #fff; }
  .step { display: grid; grid-template-columns: 22px 1fr; gap: 14px; padding: 13px 20px; font-size: 14.5px; line-height: 1.4; }
  .step + .step { border-top: 1px solid var(--line-2); }
  .step.done .box { background: var(--ok); border-color: var(--ok); }
  .step.done .tx { color: var(--ink-3); text-decoration: line-through; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--card-2); border-radius: 14px; padding: 4px; }
  .seg button { padding: 9px 4px; border-radius: 11px; font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; background: var(--card); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
  .chip small { font-weight: 500; opacity: .6; margin-left: 4px; }

  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .kpi { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 14px 12px; min-width: 0; }
  .kpi b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
  .kpi b.warn { color: var(--warn-ink); }
  .kpi b.bad { color: var(--bad-ink); }
  .kpi span { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }

  details.rs summary { padding: 16px 20px; display: grid; grid-template-columns: 38px 1fr 18px; gap: 12px; align-items: start; }
  .rs .n { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--card-2); font-weight: 700; font-size: 14px; color: var(--ink-2); }
  .rs .ttl { font-size: 15px; font-weight: 600; line-height: 1.34; }
  .rs .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rs .more { padding: 0 20px 16px 70px; font-size: 14px; color: var(--ink-2); display: grid; gap: 6px; }
  .chev { width: 18px; height: 18px; color: var(--ink-3); transition: transform .25s; margin-top: 10px; }
  details[open] > summary .chev { transform: rotate(180deg); }
  summary { list-style: none; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  details[hidden] { display: none; }
  .collapse summary { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px; }
  .collapse summary .chev { margin-top: 0; }
  .collapse .inner { border-top: 1px solid var(--line-2); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--ok); }
  .dot.off { background: var(--bad); }
  .prog { grid-column: 1 / -1; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 6px; }
  .prog i { display: block; height: 100%; background: var(--fill); border-radius: 999px; }
  .prog.ok i { background: var(--ok); }
  .prog.warn i { background: var(--warn); }
  .prio { display: grid; grid-template-columns: 42px 1fr; gap: 14px; padding: 14px 20px; }
  .prio + .prio { border-top: 1px solid var(--line-2); }
  .prio .mono { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: var(--card-2); color: var(--ink-2); }
  .prio.p1 .mono { background: var(--acc); color: var(--on-acc); }
  .prio b { display: block; font-weight: 600; font-size: 15px; line-height: 1.3; }
  .prio span { font-size: 13.5px; color: var(--ink-2); }
  .goal-n { color: var(--ink-3); margin-right: 8px; font-weight: 700; }

  .fine { font-size: 12.5px; color: var(--ink-3); text-align: center; margin: 34px auto 0; max-width: 30em; line-height: 1.5; }

  /* Замок */
  .lock { min-height: 72vh; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; padding: 40px 24px; }
  .lock .orb { width: 84px; height: 84px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-lg); display: grid; place-items: center; color: var(--ink-2); }
  .lock .orb svg.i { width: 32px; height: 32px; }
  .lock h1 { font-size: 26px; margin: 8px 0 0; letter-spacing: -.02em; }
  .lock p { color: var(--ink-2); font-size: 15px; max-width: 24em; }

  /* Шторка */
  .sheet-wrap { position: fixed; inset: 0; z-index: 50; }
  .sheet-wrap[hidden] { display: none; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .25s; }
  .sheet { position: absolute; left: 50%; bottom: 0; width: 100%; max-width: 460px; max-height: calc(100% - var(--safe-t) - 24px); overflow-y: auto; overscroll-behavior: contain;
           transform: translate(-50%, 100%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
           background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 20px calc(28px + var(--safe-b)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .3); }
  .sheet-wrap.open .scrim { opacity: 1; }
  .sheet-wrap.open .sheet { transform: translate(-50%, 0); }
  .grab { width: 40px; height: 5px; border-radius: 999px; background: var(--fill-2); margin: 4px auto 6px; }
  .sheet-x { position: absolute; right: 16px; top: 14px; width: 32px; height: 32px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink-2); }
  .sheet-x svg.i { width: 16px; height: 16px; }
  .sheet .hello { padding-top: 10px; padding-right: 40px; }
  .sheet .hello h1 { font-size: 26px; }

  /* Нижняя панель — плавающая */
  .tabbar {
    position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
    bottom: calc(10px + var(--safe-b)); width: calc(100% - 24px - var(--safe-l) - var(--safe-r)); max-width: 436px;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 7px 6px;
    background: var(--tab-bg); border-radius: 26px; box-shadow: var(--shadow-lg);
    -webkit-backdrop-filter: saturate(1.4) blur(18px); backdrop-filter: saturate(1.4) blur(18px);
  }
  .tabbar[hidden] { display: none; }
  .tab { display: grid; justify-items: center; gap: 3px; padding: 6px 0 4px; min-width: 0; color: var(--ink-3); border-radius: 18px; transition: color .2s, background .2s; }
  .tab svg.i { width: 22px; height: 22px; }
  .tab .lb { font-size: 10.5px; font-weight: 600; line-height: 1.2; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 1px; }
  .tab[aria-selected="true"] { color: var(--acc-ink); background: var(--acc-soft); }
  @media (max-width: 360px) { .tab .lb { font-size: 9.5px; } main { padding-left: 16px; padding-right: 16px; } .topbar { padding-left: 16px; padding-right: 16px; } }
</style>
</head>

<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && !tg.initData && !(tg.platform && tg.platform !== 'unknown')) tg = null; // открыто не в Telegram
  var root = document.documentElement;
  function atLeast(v) { try { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v)); } catch (e) { return false; } }

  // ---------- тема: тёмная по умолчанию, светлая по кнопке ----------
  var THEME_BG = { dark: '#0F1012', light: '#F2F2F4' };
  function paintChrome() {
    var t = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark', c = THEME_BG[t];
    var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', c);
    if (!tg) return;
    try { if (atLeast('6.1')) { tg.setHeaderColor(c); tg.setBackgroundColor(c); } } catch (e) {}
    try { if (atLeast('7.10') && tg.setBottomBarColor) tg.setBottomBarColor(c); } catch (e) {}
  }
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('shtab.theme', t); } catch (e) {}
    paintChrome();
  }
  document.getElementById('theme-btn').addEventListener('click', function () {
    setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
  });

  // ---------- Telegram: полный экран, safe area, без свайпа-закрытия ----------
  function px(v) { return (Math.max(0, +v || 0)) + 'px'; }
  function applyInsets() {
    if (!tg) return;
    var sa = tg.safeAreaInset || {}, ca = tg.contentSafeAreaInset || {};
    // сверху: вырез + кнопки Telegram (в полноэкранном режиме они лежат поверх страницы)
    var top = (+sa.top || 0) + (+ca.top || 0), bot = (+sa.bottom || 0) + (+ca.bottom || 0);
    if (top || bot || tg.isFullscreen) {
      root.style.setProperty('--sa-t', px(top));
      root.style.setProperty('--sa-b', px(bot));
      root.style.setProperty('--sa-l', px((+sa.left || 0) + (+ca.left || 0)));
      root.style.setProperty('--sa-r', px((+sa.right || 0) + (+ca.right || 0)));
    }
  }
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    // полный экран — только на телефоне: на ПК он развернул бы окно Telegram целиком
    try { if (/^(ios|android)/.test(tg.platform || '') && atLeast('8.0') && tg.requestFullscreen && !tg.isFullscreen) tg.requestFullscreen(); } catch (e) {}
    try { if (atLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    try { ['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged', 'viewportChanged'].forEach(function (ev) { tg.onEvent(ev, applyInsets); }); } catch (e) {}
    applyInsets();
  }
  paintChrome();

  // ---------- без зума: щипок, двойной тап, жесты Safari ----------
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  var lastTouch = 0, lastTarget = null;
  document.addEventListener('touchend', function (e) {

      return '<li class="r"><b>' + fmt(c.name) + '</b><span class="side">' + esc(c.id) + '</span><span class="sub">' + fmt(c.when) + (c.q && c.q !== '—' ? ' — <i>' + fmt(c.q) + '</i>' : '') + '</span></li>';
    }).join('') + '</ul></div></details>';
    h += '<p class="fine">Данные из хранилищ Business и Life, только чтение. Суммы, телефоны, почта, здоровье и ключи не попадают в Штаб. Зашифровано AES-GCM, ключ только в ссылке.</p>';
    put('system', h);
  }

  function put(id, html) { document.getElementById('s-' + id).innerHTML = html; }

  // ---------- шторка ----------
  var sheet = document.getElementById('sheet');
  function openSheet(html) {
    document.getElementById('sheet-body').innerHTML = html;
    sheet.hidden = false; void sheet.offsetWidth; sheet.classList.add('open');
    sheet.querySelector('.sheet').scrollTop = 0;
    document.body.style.overflow = 'hidden';
    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.classList.remove('open'); document.body.style.overflow = '';
    setTimeout(function () { if (!sheet.classList.contains('open')) sheet.hidden = true; }, 320);
    if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
  }

  // ---------- фильтр Всё / Бизнес / Личное ----------
  function applyCat(cat) {
    CAT = cat;
    try { sessionStorage.setItem('shtab.cat', cat); } catch (e) {}
    document.querySelectorAll('.fchip').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.cat === cat ? 'true' : 'false'); });
    document.querySelectorAll('[data-show]').forEach(function (el) { el.hidden = (' ' + el.dataset.show + ' ').indexOf(' ' + cat + ' ') < 0; });
    document.querySelectorAll('[data-filterable] > li, .soft > li').forEach(function (li) {
      li.hidden = cat !== 'all' && li.dataset.cat !== 'all' && li.dataset.cat !== cat;
    });
    document.querySelectorAll('[data-daycats]').forEach(function (d) {
      d.hidden = cat !== 'all' && (' ' + d.dataset.daycats + ' ').indexOf(' ' + cat + ' ') < 0;
    });
    document.querySelectorAll('.sector').forEach(function (g) { g.classList.toggle('dim', cat !== 'all' && g.dataset.cat !== cat); });
    document.querySelectorAll('.sph').forEach(function (el) { el.hidden = cat !== 'all' && el.dataset.cat !== cat; });
  }

  // ---------- вкладки и переключатели ----------
  var order = ['today', 'wheel', 'tasks', 'research', 'people', 'system'], current = null;
  function go(key, instant) {
    if (order.indexOf(key) < 0) key = 'today';
    if (key === current) return;
    if (current) document.getElementById('s-' + current).classList.remove('active', 'in');
    var s = document.getElementById('s-' + key);
    s.classList.remove('in'); s.classList.add('active');
    if (!instant) { void s.offsetWidth; s.classList.add('in'); }
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.go === key ? 'true' : 'false'); });
    document.getElementById('filters').hidden = !(key === 'today' || key === 'wheel');
    current = key; window.scrollTo(0, 0);
    try { sessionStorage.setItem('shtab.tab', key); } catch (e) {}
    if (!instant && tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
  }
  function bind() {
    document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { go(t.dataset.go); }); });
    document.querySelectorAll('.fchip').forEach(function (b) { b.addEventListener('click', function () { applyCat(b.dataset.cat); }); });
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t.closest('[data-close]')) { closeSheet(); return; }
      if (t.closest('details, a')) return;
      var sp = t.closest('[data-sph]');
      if (sp) { sphereSheet(+sp.dataset.sph); return; }
      if (t.closest('[data-open="focus"]')) { focusSheet(); return; }
      var ot = t.closest('[data-open-tab]');
      if (ot) { go(ot.dataset.openTab); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSheet();
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-open="focus"][tabindex]')) { e.preventDefault(); focusSheet(); }
    });
    if (tg && tg.BackButton) { try { tg.BackButton.onClick(closeSheet); } catch (e) {} }
    document.querySelectorAll('[data-seg]').forEach(function (seg) {
      var root = seg.parentNode;
      seg.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        seg.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        root.querySelectorAll('[data-pane]').forEach(function (p) { p.hidden = p.dataset.pane !== b.dataset.v; });
      });
    });
    document.querySelectorAll('[data-chips]').forEach(function (ch) {
      var root = ch.parentNode;
      ch.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        ch.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        root.querySelectorAll('[data-tags]').forEach(function (it) {
          it.hidden = b.dataset.f !== 'all' && (' ' + it.dataset.tags + ' ').indexOf(' ' + b.dataset.f + ' ') < 0;
        });
      });
    });
    var topbar = document.getElementById('topbar');
    window.addEventListener('scroll', function () { topbar.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  }
})();
</script>
</body>
