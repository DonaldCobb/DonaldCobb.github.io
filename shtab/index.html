<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0F1012">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Штаб</title>
<script>
  // Тема до первой отрисовки: тёмная по умолчанию, выбор — в localStorage
  (function () { var t = 'dark'; try { t = localStorage.getItem('shtab.theme') || 'dark'; } catch (e) {}
    if (t !== 'light') t = 'dark'; document.documentElement.setAttribute('data-theme', t); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Штаб v4 (2026-10-09): иерархия по вопросу экрана.
     Цвет — сигнал: --acc (один акцент: П1 и «сейчас»), --bad горит/просрочено, --warn ждёт ответа, --ok сделано.
     Цвета сфер (--s-*) живут только на колесе. Шкала: кегли 13/15/20/30, веса 400/600,
     радиусы 12/20/круг, отступы 4-8-12-16-24-32. */
  :root, :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F1012; --card: #1A1B1E; --card-2: #24252A; --raise: #2C2D33;
    --ink: #F2F2F4; --ink-2: #B9BAC0; --ink-3: #9A9BA2;
    --line: #2C2D32; --track: #2E2F35; --fill: #8E8F96;
    --acc: #3D8BFF; --acc-ink: #79AEFF; --acc-soft: rgba(61, 139, 255, .16); --on-acc: #FFFFFF;
    --warn: #FF9F0A; --warn-ink: #FFB84D; --warn-soft: rgba(255, 159, 10, .15);
    --ok: #30D158; --ok-ink: #5CDD7E; --ok-soft: rgba(48, 209, 88, .14);
    --bad: #FF453A; --bad-ink: #FF7A71; --bad-soft: rgba(255, 69, 58, .16);
    --bar-bg: rgba(15, 16, 18, .80); --tab-bg: rgba(30, 31, 35, .90); --scrim: rgba(0, 0, 0, .5);
    --shadow: 0 0 0 1px rgba(255, 255, 255, .04);
    --shadow-lg: 0 0 0 1px rgba(255, 255, 255, .06), 0 18px 40px rgba(0, 0, 0, .45);
    /* сферы колеса — гармоничный ряд одной светлоты */
    --s-biz: #9580FF; --s-dukh: #D58BEA; --s-semya: #F27E9F; --s-lyudi: #F4A26E;
    --s-zdorovye: #45C4B2; --s-dengi: #DDBB55; --s-otdykh: #86C474;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F2F2F4; --card: #FFFFFF; --card-2: #F0F0F3; --raise: #FFFFFF;
    --ink: #1C1C1E; --ink-2: #4A4B51; --ink-3: #626369;
    --line: #E2E2E6; --track: #E4E4E9; --fill: #8A8B91;
    --acc: #0A6CFF; --acc-ink: #0057D1; --acc-soft: rgba(10, 108, 255, .10); --on-acc: #FFFFFF;
    --warn: #E88600; --warn-ink: #8F4B00; --warn-soft: rgba(240, 138, 0, .14);
    --ok: #26A145; --ok-ink: #166B2D; --ok-soft: rgba(38, 161, 69, .12);
    --bad: #E5372C; --bad-ink: #B8261C; --bad-soft: rgba(229, 55, 44, .10);
    --bar-bg: rgba(242, 242, 244, .84); --tab-bg: rgba(255, 255, 255, .94); --scrim: rgba(20, 20, 24, .32);
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 18px rgba(0, 0, 0, .05);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .05), 0 18px 40px rgba(0, 0, 0, .12);
    --s-biz: #6B4FE0; --s-dukh: #A947C2; --s-semya: #D24F77; --s-lyudi: #D2743A;
    --s-zdorovye: #18978A; --s-dengi: #A9851A; --s-otdykh: #4C9439;
  }
  :root {
    --r-s: 12px; --r: 20px; --r-f: 999px;
    --tabbar: 64px;
    --safe-t: var(--sa-t, env(safe-area-inset-top, 0px));
    --safe-b: var(--sa-b, env(safe-area-inset-bottom, 0px));
    --safe-l: var(--sa-l, env(safe-area-inset-left, 0px));
    --safe-r: var(--sa-r, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; background: var(--bg); }
  body {
    margin: 0; color: var(--ink); background: var(--bg); touch-action: manipulation; overscroll-behavior-y: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45; font-weight: 400; font-variant-numeric: tabular-nums; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  b, strong { font-weight: 600; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; text-align: inherit; }
  p { margin: 0; }
  a { color: var(--acc-ink); text-decoration: none; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: var(--r-s); }
  svg.i { width: 20px; height: 20px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .app { position: relative; max-width: 460px; margin: 0 auto; overflow-x: clip;
         min-height: 100vh; min-height: var(--tg-viewport-stable-height, 100dvh);
         padding-left: var(--safe-l); padding-right: var(--safe-r); }

  /* Шапка */
  .topbar { position: sticky; top: 0; z-index: 20; padding: calc(8px + var(--safe-t)) 16px 8px; background: var(--bar-bg);
    -webkit-backdrop-filter: saturate(1.4) blur(18px); backdrop-filter: saturate(1.4) blur(18px); transition: box-shadow .25s; }
  .topbar.scrolled { box-shadow: 0 1px 0 var(--line); }
  .top-row { display: flex; align-items: center; gap: 12px; }
  .brand { flex: 1; min-width: 0; line-height: 1.3; }
  .brand-name { font-weight: 600; font-size: 15px; }
  .brand-sub { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .online { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 2px; }
  .online.stale { background: var(--warn); }
  .iconbtn, .me { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: var(--card); box-shadow: var(--shadow); overflow: hidden; font-weight: 600; }
  .iconbtn .sun { display: none; }
  :root[data-theme="dark"] .iconbtn .sun { display: block; }
  :root[data-theme="dark"] .iconbtn .moon { display: none; }
  .me img, .ava img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
  .filters { display: flex; gap: 8px; margin-top: 8px; }
  .filters[hidden] { display: none; }
  .fchip { min-height: 44px; padding: 0 16px; border-radius: var(--r-f); font-size: 13px; font-weight: 600; color: var(--ink-2); background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .fchip[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc-ink); box-shadow: none; }

  /* Экраны */
  main { padding: 4px 16px calc(var(--tabbar) + var(--safe-b) + 32px); }
  .screen { display: none; }
  .screen.active { display: block; }
  .screen.in { animation: fadeIn .3s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .dateline { font-size: 13px; color: var(--ink-3); padding: 12px 4px 12px; display: flex; gap: 8px; align-items: center; }
  .dateline svg.i { width: 16px; height: 16px; }
  .head { padding: 0 4px 24px; }
  .head h1 { font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  .head h1.quiet { font-size: 20px; line-height: 1.3; letter-spacing: -.01em; }
  .head .sub { color: var(--ink-2); font-size: 15px; margin-top: 8px; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 32px 4px 12px; }
  .sec h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.3; }
  .sec span { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .sec .dot-bad { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 8px; vertical-align: 3px; }
  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); overflow-wrap: anywhere; }
  .stack { display: grid; gap: 12px; }
  .empty { padding: 16px; color: var(--ink-2); font-size: 15px; }
  .muted { color: var(--ink-3); }
  .fine { font-size: 13px; color: var(--ink-3); margin: 12px 4px 0; line-height: 1.5; }

  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-f); font-size: 13px; font-weight: 600; white-space: nowrap; line-height: 1.4; }
  .tag svg.i { width: 14px; height: 14px; }
  .t-acc { background: var(--acc-soft); color: var(--acc-ink); }
  .t-bad { background: var(--bad-soft); color: var(--bad-ink); }
  .t-warn { background: var(--warn-soft); color: var(--warn-ink); }
  .t-wl { color: var(--warn-ink); padding-right: 0; }
  .t-ok { background: var(--ok-soft); color: var(--ok-ink); }
  .t-mute { background: var(--card-2); color: var(--ink-2); }
  .t-line { box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-3); }

  /* Карточка фокуса П1 — главный элемент */
  .hero { border-radius: var(--r); padding: 20px 16px 16px; background: var(--card); box-shadow: var(--shadow-lg); cursor: pointer; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  .hero-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 13px; }
  .eyebrow { font-weight: 600; color: var(--acc-ink); }
  .hero .left { color: var(--ink-3); }
  .money { margin-top: 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .money b i { font-style: normal; }
  .money b { font-size: 30px; line-height: 1.1; letter-spacing: -.02em; }
  .money span { font-size: 20px; color: var(--ink-3); line-height: 1.2; }
  .mbar { position: relative; height: 12px; margin: 16px 0 8px; border-radius: var(--r-f); background: var(--track); }
  .mbar .pipe { position: absolute; top: 0; bottom: 0; left: 0; border-radius: var(--r-f); background: var(--acc-soft);
    background-image: repeating-linear-gradient(-45deg, transparent 0 4px, rgba(127,127,127,.18) 4px 6px); transform-origin: left; animation: grow-x .8s .15s cubic-bezier(.2,.8,.2,1) both; }
  .mbar .paid { position: absolute; top: 0; bottom: 0; left: 0; border-radius: var(--r-f); background: var(--acc); min-width: 0; transform-origin: left; animation: grow-x .8s .25s cubic-bezier(.2,.8,.2,1) both; }
  .mbar .goal { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 2px; background: var(--ink); }
  @keyframes grow-x { from { transform: scaleX(0); } to { transform: none; } }
  .hero .cap { font-size: 13px; color: var(--ink-2); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; border-top: 1px solid var(--line); }
  .stat { padding: 12px 8px 4px 0; min-width: 0; }
  .stat + .stat { padding-left: 12px; border-left: 1px solid var(--line); }
  .stat .k { font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .v { font-size: 20px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
  .stat .v small { font-size: 15px; color: var(--ink-3); font-weight: 400; }
  .stat .n { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .n.bad, .stat .v.bad { color: var(--bad-ink); }
  .next { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin-top: 16px; padding: 12px; min-height: 56px; border-radius: var(--r-s); background: var(--acc-soft); }
  .next .when { font-weight: 600; color: var(--acc-ink); }
  .next .what { min-width: 0; }
  .next .what b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next .what span { display: block; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next svg.i { color: var(--acc-ink); width: 18px; height: 18px; }

  .runway { margin-top: 12px; border-radius: var(--r); }
  /* Строки списков */
  .rows { list-style: none; margin: 0; padding: 4px 0; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 16px; min-height: 56px; align-items: start; width: 100%; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.timed { grid-template-columns: 48px 1fr auto; }
  .row .tm { font-weight: 600; padding-top: 0; white-space: nowrap; }
  .row .tm.now { color: var(--acc-ink); }
  .row .tm.past { color: var(--ink-3); font-weight: 400; }
  .row .body { min-width: 0; }
  .row .body b { display: block; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .body .s { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.4; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .body .s.wrap { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .side { font-size: 13px; color: var(--ink-3); white-space: nowrap; text-align: right; display: grid; gap: 4px; justify-items: end; }
  .row .side .price { font-size: 15px; font-weight: 600; color: var(--ink); }
  .row.quiet .body b { font-weight: 400; color: var(--ink-2); }
  .row.ava-row { grid-template-columns: 40px 1fr auto; }
  .row.p3 .body b { font-weight: 400; }
  .ava { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); color: var(--ink-2); font-weight: 600; font-size: 15px; overflow: hidden; }
  .ava svg.i { width: 20px; height: 20px; }
  .row .ic { color: var(--ink-3); padding-top: 2px; }
  .row .ic svg.i { width: 18px; height: 18px; }

  /* Аккордеон — один уровень */
  details.acc { margin-top: 12px; }
  details.acc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; }
  details.acc > summary::-webkit-details-marker { display: none; }
  details.acc > summary .l { flex: 1; font-weight: 600; color: var(--ink-2); }
  details.acc > summary .c { font-size: 13px; color: var(--ink-3); }
  details.acc > summary .chev { width: 18px; height: 18px; color: var(--ink-3); transition: transform .25s; }
  details.acc[open] > summary .chev { transform: rotate(180deg); }
  details.acc[open] > summary { border-bottom: 1px solid var(--line); }
  details.acc .rows { padding: 0; }
  details[hidden] { display: none; }
  .accs { margin-top: 24px; }

  /* Полоски категорий трат */
  .cat { padding: 12px 16px; }
  .cat + .cat { border-top: 1px solid var(--line); }
  .cat .top { display: flex; justify-content: space-between; gap: 12px; }
  .cat .top b { font-weight: 600; }
  .cat .top span { color: var(--ink-2); }
  .cat .bar { position: relative; height: 6px; margin-top: 8px; border-radius: var(--r-f); background: var(--track); }
  .cat .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: var(--r-f); background: var(--fill); transform-origin: left; animation: grow-x .6s cubic-bezier(.2,.8,.2,1) both; }
  .cat .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); border-radius: 2px; }
  .cat .note { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 16px; align-items: baseline; }
  .kv + .kv { border-top: 1px solid var(--line); }
  .kv .k { color: var(--ink-2); }
  .kv .v { font-weight: 600; text-align: right; }
  .kv .n { grid-column: 1 / -1; font-size: 13px; color: var(--ink-3); }

  /* Колесо — смелая вещь вкладки */
  .wheel-card { padding: 8px 8px 16px; }
  .wheel-card svg { display: block; width: 100%; height: auto; }
  .wheel-card .sector { cursor: pointer; transition: opacity .25s; }
  .wheel-card .sector.dim { opacity: .2; }
  .wheel-card .fillp { transform-box: view-box; transform-origin: 200px 172px; animation: sector .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms + 100ms); }
  @keyframes sector { from { transform: scale(.3) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .spheres { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .sph { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; min-height: 72px; }
  .sph[hidden] { display: none; }
  .sph b { display: block; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sph span { display: block; font-size: 13px; color: var(--ink-2); }
  .sph span.stall { color: var(--ink-3); }
  .arc { animation: draw .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms + 150ms); }
  @keyframes draw { from { stroke-dashoffset: var(--d); } to { stroke-dashoffset: 0; } }

  /* Шторка */
  .sheet-wrap { position: fixed; inset: 0; z-index: 50; }
  .sheet-wrap[hidden] { display: none; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .25s; }
  .sheet { position: absolute; left: 50%; bottom: 0; width: 100%; max-width: 460px; max-height: calc(100% - var(--safe-t) - 24px); overflow-y: auto; overscroll-behavior: contain;
           transform: translate(-50%, 100%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
           background: var(--bg); border-radius: var(--r) var(--r) 0 0; padding: 8px 16px calc(24px + var(--safe-b)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .3); }
  .sheet-wrap.open .scrim { opacity: 1; }
  .sheet-wrap.open .sheet { transform: translate(-50%, 0); }
  .grab { width: 40px; height: 5px; touch-action: none; border-radius: var(--r-f); background: var(--fill); opacity: .5; margin: 4px auto 8px; }
  .sheet-x { position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink-2); }
  .sheet .head { padding-top: 8px; padding-right: 48px; }
  .kb-frame { display: block; width: 100%; height: calc(100dvh - var(--safe-t) - 170px); min-height: 420px; border: 0; border-radius: var(--r); background: var(--bg); margin-top: 8px; }
  .prio { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 12px 16px; }
  .prio + .prio { border-top: 1px solid var(--line); }
  .prio .mono { width: 40px; height: 40px; border-radius: var(--r-s); display: grid; place-items: center; font-weight: 600; background: var(--card-2); color: var(--ink-2); }
  .prio.is-p1 .mono { background: var(--acc); color: var(--on-acc); }
  .prio b { display: block; line-height: 1.35; }
  .prio span { font-size: 13px; color: var(--ink-2); }
  .detail p { padding: 12px 16px; }
  .detail p + p { border-top: 1px solid var(--line); }
  .detail p small { display: block; font-size: 13px; color: var(--ink-3); }

  /* Замок */
  .lock { min-height: 72vh; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; padding: 32px 24px; }
  .lock .orb { width: 80px; height: 80px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-lg); display: grid; place-items: center; color: var(--ink-2); }
  .lock .orb svg.i { width: 32px; height: 32px; }
  .lock h1 { font-size: 20px; font-weight: 600; margin: 8px 0 0; }
  .lock p { color: var(--ink-2); font-size: 15px; max-width: 24em; }

  /* Нижняя панель */
  .tabbar { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
    bottom: calc(8px + var(--safe-b)); width: calc(100% - 16px - var(--safe-l) - var(--safe-r)); max-width: 444px;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 4px;
    background: var(--tab-bg); border-radius: var(--r); box-shadow: var(--shadow-lg);
    -webkit-backdrop-filter: saturate(1.4) blur(18px); backdrop-filter: saturate(1.4) blur(18px); }
  .tabbar[hidden] { display: none; }
  .tab { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 56px; min-width: 0; color: var(--ink-3); border-radius: var(--r-s); transition: color .2s, background .2s; }
  .tab svg.i { width: 22px; height: 22px; }
  .tab .lb { font-size: 13px; font-weight: 600; line-height: 1.2; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  .tab[aria-selected="true"] { color: var(--acc-ink); background: var(--acc-soft); }
  .tab.p3:not([aria-selected="true"]) { opacity: .85; }
  @media (max-width: 370px) { .tab .lb { letter-spacing: -.03em; } main { padding-left: 12px; padding-right: 12px; } }
  /* Фокус жизни (2026-10-13, msg 5274): первый блок «Сегодня» — четыре личных приоритета, кольцо на сегодня,
     серия дней. Цвет — сигнал: полное кольцо --ok, частичное (спорт вт/пт 1 из 2) --acc, сон не проверен — пунктир.
     Данные — блок habits (Business/bin/habits json), отметки — значками в чате с ботом. */
  .life { padding: 16px 12px 12px; margin-bottom: 24px; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .life-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px 12px; }
  .life-head h2 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
  .life-n { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .life-n b { color: var(--ink); font-size: 15px; }
  .life-n.all b { color: var(--ok-ink); }
  .life-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; list-style: none; margin: 0; padding: 0; }
  .hb { display: grid; justify-items: center; gap: 6px; min-width: 0; text-align: center; }
  .hb-ring { position: relative; width: 56px; height: 56px; }
  .hb-ring svg { display: block; }
  .hb-ring .hb-ic { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); }
  .hb-ring .hb-ic svg.i { width: 22px; height: 22px; }
  .hb.part .hb-ic { color: var(--acc-ink); }
  .hb.done .hb-ic { color: var(--ok-ink); }
  .hb.done .hb-ring::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--ok-soft); z-index: -1; }
  .hb-ring { isolation: isolate; }
  .hb b { display: block; font-size: 13px; line-height: 1.3; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hb-s { display: flex; align-items: center; justify-content: center; gap: 2px; max-width: 100%; overflow: hidden; font-size: 13px; line-height: 1.3; color: var(--ink-3); white-space: nowrap; }
  .hb-s svg.i { width: 13px; height: 13px; stroke-width: 2; }
  .hb-s.hot { color: var(--warn-ink); font-weight: 600; }
  .hb-s.part { color: var(--acc-ink); font-weight: 600; }
  .life-foot { margin: 12px 4px 0; padding-top: 12px; box-shadow: 0 -1px 0 var(--line); font-size: 13px; color: var(--ink-3); line-height: 1.4; }
  /* Табло «Сейчас в работе» (2026-10-13): первый блок «Сегодня», данные — tablo.json раз в минуту.
     Движение только у идущих: точка «идёт» дышит, по полосе бежит блик. Стоит — оранжевый, без движения. */
  .tablo { padding: 16px 16px 8px; box-shadow: var(--shadow-lg); margin-bottom: 24px; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  .tb-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 0 4px; }
  .tb-head h2 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
  .tb-at { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .tb-list { list-style: none; margin: 0; padding: 0; }
  .tb { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; }
  .tb + .tb { box-shadow: 0 -1px 0 var(--line); }
  .tb-ic { position: relative; flex: none; width: 40px; height: 40px; border-radius: var(--r-s); display: grid; place-items: center; background: var(--acc-soft); color: var(--acc-ink); }
  .tb-ic svg.i { width: 20px; height: 20px; }
  .tb-ic .beat { position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 2px var(--card); }
  .tb-ic .beat::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--acc); animation: tb-ping 1.8s cubic-bezier(0,0,.2,1) infinite; }
  .tb-body { flex: 1; min-width: 0; padding-top: 1px; }
  .tb-body b { display: block; font-size: 15px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-s { display: block; font-size: 13px; line-height: 1.4; color: var(--ink-2); margin-top: 2px; }
  .tb-s .w { color: var(--warn-ink); font-weight: 600; }
  .tb-side { flex: none; font-size: 13px; font-weight: 600; color: var(--ink-2); padding-top: 2px; min-width: 36px; text-align: right; }
  /* Полоса у идущей задачи (2026-10-13, msg 5225): настоящий счёт — «N%», по сроку bin/job — «≈N%» (≤ 95 %),

  .tb-bar { position: relative; display: block; height: 6px; margin-top: 8px; border-radius: var(--r-f); background: var(--track); overflow: hidden; }

  .tb-bar.approx i { opacity: .85; }
  .tb-bar.ind i { width: 36%; min-width: 0; box-shadow: none; background: linear-gradient(90deg, transparent, var(--acc) 30%, var(--acc) 70%, transparent); animation: tb-ind 1.9s cubic-bezier(.45,0,.55,1) infinite; }
  .tb-bar.ind i::after, .tb.run .tb-bar.ind i::after { display: none; }
  .tablo.calm .tb-bar i { animation: none; }
  .tablo.calm .tb-bar.ind i { animation: tb-ind 1.9s cubic-bezier(.45,0,.55,1) infinite; }
  .tb.warn .tb-bar.ind i, .tablo.calm .tb.warn .tb-bar.ind i { width: 100%; animation: none; opacity: .35; background: var(--warn); }
  .tb.warn .tb-ic { background: var(--warn-soft); color: var(--warn-ink); }
  .tb.warn .tb-bar i { background: var(--warn); box-shadow: 0 0 10px var(--warn-soft); }
  .tb.done .tb-ic { background: var(--ok-soft); color: var(--ok-ink); }
  .tb.done b { color: var(--ink-2); font-weight: 400; }
  .tb.stop .tb-ic { background: var(--card-2); color: var(--ink-3); }
  .tb-more, .tb-foot { font-size: 13px; color: var(--ink-3); padding: 4px 0 8px; }
  .tb-foot { box-shadow: 0 -1px 0 var(--line); padding-top: 12px; display: flex; gap: 8px; align-items: center; }
  .tb-foot svg.i { width: 16px; height: 16px; }
  .tb-empty { padding: 12px 0 12px; color: var(--ink-2); font-size: 15px; display: flex; gap: 12px; align-items: center; }
  .tb-skel { height: 40px; margin: 12px 0; border-radius: var(--r-s); background: var(--card-2); animation: tb-fade 1.2s ease-in-out infinite alternate; }
  /* Баланс AgentHello (2026-10-13, msg 5209): строка под табло, данные — блок bal в tablo.json.
     Цвет полосы — сигнал по дням запаса: > 7 спокойно (зелёный), 3–7 внимание (янтарь), < 3 тревога (красный).
     Полоса вырастает при открытии, по ней мягко переливается свет; reduced-motion — без анимации (общее правило). */
  .bal { --c: var(--ok); --c-ink: var(--ok-ink); --c-soft: var(--ok-soft); padding: 14px 16px 12px; margin: -12px 0 24px; animation: rise .45s .08s cubic-bezier(.2,.8,.2,1) both; }
  .bal[hidden] { display: none; }

  .bal.bad { --c: var(--bad); --c-ink: var(--bad-ink); --c-soft: var(--bad-soft); }
  .bal-top { display: flex; align-items: center; gap: 12px; }
  .bal-ic { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--c-soft); color: var(--c-ink); }
  .bal-ic svg.i { width: 18px; height: 18px; }
  .bal-t { flex: 1; min-width: 0; font-size: 15px; line-height: 1.35; color: var(--ink-2); }
  .bal-t b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bal-t .d { color: var(--c-ink); font-weight: 600; white-space: nowrap; }
  .bal-pct { flex: none; font-size: 13px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .bal-bar { position: relative; height: 8px; margin: 10px 0 8px; border-radius: var(--r-f); background: var(--track); overflow: hidden; }
  .bal-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--f) * 100%); min-width: 8px; border-radius: var(--r-f); overflow: hidden;
    background: var(--c); box-shadow: 0 0 12px var(--c-soft); animation: bal-fill 1.1s cubic-bezier(.2,.8,.2,1) .15s both; }
  .bal-bar i::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 60%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .42), transparent); transform: translateX(-100%); animation: bal-shine 3.8s ease-in-out 1.4s infinite; }
  .bal.calm .bal-bar i { animation: none; }
  .bal-s { font-size: 13px; line-height: 1.4; color: var(--ink-3); }
  @keyframes bal-fill { from { width: 0; min-width: 0; } }
  @keyframes bal-shine { 0% { transform: translateX(-100%); } 55%, 100% { transform: translateX(260%); } }
  @keyframes tb-ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes tb-fill { from { width: 0; min-width: 0; } }

  @keyframes tb-fade { from { opacity: .5; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
(function () {
  'use strict';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && !tg.initData && !(tg.platform && tg.platform !== 'unknown')) tg = null; // открыто не в Telegram
  var root = document.documentElement;
  function atLeast(v) { try { return !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v)); } catch (e) { return false; } }

  // ---------- тема: тёмная по умолчанию, светлая по кнопке ----------
  var THEME_BG = { dark: '#0F1012', light: '#F2F2F4' };
  function paintChrome() {
    var t = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark', c = THEME_BG[t];
    var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', c);
    if (!tg) return;
    try { if (atLeast('6.1')) { tg.setHeaderColor(c); tg.setBackgroundColor(c); } } catch (e) {}
    try { if (atLeast('7.10') && tg.setBottomBarColor) tg.setBottomBarColor(c); } catch (e) {}
  }
  function setTheme(t) {
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('shtab.theme', t); } catch (e) {}
    paintChrome();
  }
  document.getElementById('theme-btn').addEventListener('click', function () {
    setTheme(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
  });

  // ---------- Telegram: полный экран, safe area, без свайпа-закрытия ----------
  function px(v) { return (Math.max(0, +v || 0)) + 'px'; }
  function applyInsets() {
    if (!tg) return;
    var sa = tg.safeAreaInset || {}, ca = tg.contentSafeAreaInset || {};
    // сверху: вырез + кнопки Telegram (в полноэкранном режиме они лежат поверх страницы)
    var top = (+sa.top || 0) + (+ca.top || 0), bot = (+sa.bottom || 0) + (+ca.bottom || 0);
    if (top || bot || tg.isFullscreen) {
      root.style.setProperty('--sa-t', px(top));
      root.style.setProperty('--sa-b', px(bot));
      root.style.setProperty('--sa-l', px((+sa.left || 0) + (+ca.left || 0)));
      root.style.setProperty('--sa-r', px((+sa.right || 0) + (+ca.right || 0)));
    }
  }
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    // полный экран — только на телефоне: на ПК он развернул бы окно Telegram целиком
    try { if (/^(ios|android)/.test(tg.platform || '') && atLeast('8.0') && tg.requestFullscreen && !tg.isFullscreen) tg.requestFullscreen(); } catch (e) {}
    try { if (atLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    try { ['safeAreaChanged', 'contentSafeAreaChanged', 'fullscreenChanged', 'viewportChanged'].forEach(function (ev) { tg.onEvent(ev, applyInsets); }); } catch (e) {}
    applyInsets();
  }
  paintChrome();

  // ---------- без зума: щипок, двойной тап, жесты Safari ----------
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  var lastTouch = 0, lastTarget = null;
  document.addEventListener('touchend', function (e) {
    // второй быстрый тап по тому же месту — это двойной тап-зум, гасим его
    var t = Date.now();

  }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });

  // ---------- ключ ----------
  function keyFromHash() {
    var m = (location.hash || '').match(/(?:^#|[#&?])k=([A-Za-z0-9_-]{40,})/);
    return m ? m[1] : null;
  }
  var k = keyFromHash();
  try {
    if (k) sessionStorage.setItem('shtab.k', k); else k = sessionStorage.getItem('shtab.k');
  } catch (e) {}
  if (keyFromHash()) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }

  function b64(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function locked(msg) {
    if (msg) document.getElementById('lock-msg').textContent = msg;
    document.getElementById('built').innerHTML = '<span class="online stale"></span>данные зашифрованы';
  }
  if (!k) { locked(); return; }
  (function () { var h = document.querySelector('#lock h1'), m = document.getElementById('lock-msg'); if (h) h.textContent = 'Открываю…'; if (m) m.textContent = 'Расшифровываю данные на телефоне.'; })();
  if (!window.crypto || !crypto.subtle) { locked('Браузер не умеет расшифровывать (нет WebCrypto). Открой в Telegram или обычном браузере по https.'); return; }

  // Текст приходит очищенным из build.py (tidy); здесь — только экранирование и страховка от эмодзи
  var EMOJI = /(?:[⌀-⏿■-➿⬅-⬇⬛-⬜⭐⭕〰〽㊗㊙]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|\uD83E[\uDC00-\uDFFF])[︎️]?|[️‍⃣]/g;
  function clean(s) { return String(s == null ? '' : s).replace(EMOJI, '').replace(/\*\*/g, '').replace(/\s{2,}/g, ' ').trim(); }
  function esc(s) { return clean(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function ic(name, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
  var CHEV = ic('chev', 'chev');
  var ARROW = ic('arrow');
  var AVA = {};
  function avatar(id, name) {
    var src = id && AVA[id];
    if (src && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(src)) return '<div class="ava"><img src="' + src + '" alt="" loading="lazy" decoding="async"></div>';
    if (/,/.test(name || '')) return '<div class="ava">' + ic('building') + '</div>';
    return '<div class="ava">' + esc(initials(name)) + '</div>';
  }
  function sec(title, side, cls) { return '<div class="sec' + (cls ? ' ' + cls : '') + '"><h2>' + title + '</h2>' + (side != null && side !== '' ? '<span>' + esc(side) + '</span>' : '') + '</div>'; }
  function card(inner, cls) { return '<div class="card' + (cls ? ' ' + cls : '') + '">' + inner + '</div>'; }
  function acc(label, count, inner, attrs) {

  // ===== Колесо: какие сферы двигаются =====
  var SHORT = { biz: 'Бизнес', dukh: 'Дух', semya: 'Семья', lyudi: 'Круг', zdorovye: 'Здоровье', dengi: 'Деньги', otdykh: 'Отдых, дом' };

  function arcPath(cx, cy, r0, r1, a0, a1) {

    var large = a1 - a0 > 180 ? 1 : 0;
    return 'M' + p(r1, a0) + ' A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + p(r1, a1) + ' L' + p(r0, a1) + ' A' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + p(r0, a0) + ' Z';
  }

    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r0 + (R - r0) / 2) + '" fill="none" stroke="var(--line)" stroke-dasharray="2 5"/>';
    S.forEach(function (s, i) {
      var c = -90 + i * step, a0 = c - step / 2 + gap / 2, a1 = c + step / 2 - gap / 2, col = sphColor(s);

        '<path d="' + arcPath(cx, cy, r0, R, a0, a1) + '" fill="' + col + '" opacity=".07"/>' +
        (s.active ? '<path class="fillp" style="--i:' + i + '" d="' + arcPath(cx, cy, r0, rv, a0, a1) + '" fill="' + col + '"/>' : '');
      var rad = c * Math.PI / 180, lx = cx + LR * Math.cos(rad), ly = cy + LR * Math.sin(rad);
      var anchor = Math.abs(Math.cos(rad)) < 0.3 ? 'middle' : Math.cos(rad) > 0 ? 'start' : 'end';

      var st = x.done ? tag('t-ok', 'готово') : x.stall ? tag('t-warn', 'застой') : '<span>идёт</span>';
      return '<li class="row quiet"><span class="body"><b>' + esc(x.name) + '</b><span class="s">' + esc(x.host) + ' · этапов ' + x.done_n + ' из ' + x.stages + '</span></span><span class="side">' + st + '</span></li>';
    }).join('') + '</ul>');
    h += acc('Процессы', S.procs.length, '<ul class="rows">' + S.procs.map(function (p) {
      return '<li class="row quiet"><span class="body"><b>' + esc(p.name) + '</b></span><span class="side">' + (p.alive ? tag('t-ok', 'работает') : tag('t-bad', 'остановлен', 'alert')) + '</span></li>';
    }).join('') + '</ul>');
    h += acc('Cron', S.cron.length, '<ul class="rows">' + S.cron.map(function (c) {
      return '<li class="row quiet"><span class="body"><b>' + esc(c.label) + '</b></span><span class="side">' + esc(c.when) + '</span></li>';
    }).join('') + '</ul>');
    h += acc('Циклы бота', S.cycles.length, '<ul class="rows">' + S.cycles.map(function (c) {
      return '<li class="row quiet"><span class="body"><b>' + esc(c.name) + '</b><span class="s wrap">' + esc(c.when) + '</span></span><span class="side">' + esc(c.id) + '</span></li>';
    }).join('') + '</ul>');
    h += '</div>';
    h += '<p class="fine">Данные из хранилищ Business и Life и сводки Дзен-мани, только чтение. Чужие суммы, телефоны, почта и ключи в Штаб не попадают. Зашифровано AES-GCM, ключ только в ссылке.</p>';
    put('system', h);
  }

  // ===== шторка фокуса =====
  function kbWords(n) { return n >= 1e6 ? (Math.round(n / 1e4) / 100).toLocaleString('ru-RU') + ' млн' : Math.round((n || 0) / 1000).toLocaleString('ru-RU') + ' тыс.'; }
  function kbSheet() {
    var KB = DATA.kb || {};
    if (!KB.url) return;
    var th = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    var h = '<div class="head"><div class="dateline" style="padding:0 0 8px">' + ic('book') + 'База знаний</div><h1 class="quiet">Как мы умеем</h1>' +
      '<div class="sub">' + esc('сферы и темы против веса для цели · сборка ' + dmy(KB.updated || TODAY)) + ' · <a href="' + esc(KB.url) + '" target="_blank" rel="noopener">отдельно</a></div></div>';
    h += '<iframe class="kb-frame" title="Карта базы знаний" src="' + esc(KB.url + '?embed=1&theme=' + th) + '"></iframe>';
    openSheet(h);
  }
  function focusSheet() {
    var F = DATA.focus, M = F.money || {}, h = '';
    h += '<div class="head"><div class="dateline" style="padding:0 0 8px">' + ic('target') + 'Фокус</div><h1 class="quiet">Приоритеты и воронка</h1></div>';
    h += card(F.priorities.map(function (p) {
      return '<div class="prio' + (p.p === 'П1' ? ' is-p1' : '') + '"><div class="mono">' + esc(p.p || '·') + '</div><div><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div></div>';
    }).join(''));
    h += '<div style="height:12px"></div>' + card('<button type="button" class="row" data-go-tab="money"><span class="body"><b>Воронка и цены</b><span class="s">' + (M.pipe_hi ? esc(range(M.pipe_lo, M.pipe_hi)) + ' тыс. ₽, ' : '') + 'на вкладке «Деньги»</span></span><span class="side">' + ARROW + '</span></button>');
    if (F.talks.list.length) {
      h += sec('Разговоры', F.talks.n + ' из ' + F.talks.goal) + card('<ul class="rows">' + F.talks.list.map(function (t) {
        return '<li class="row"><span class="body"><b>' + esc(t.who) + '</b><span class="s">' + esc(t.result) + '</span></span><span class="side">' + esc(dmy(t.date)) + '</span></li>';
      }).join('') + '</ul>');
    }
    h += sec('Цели квартала') + card('<ul class="rows">' + F.goals.map(function (g) { return '<li class="row"><span class="body"><b style="font-weight:400">' + esc(g) + '</b></span></li>'; }).join('') + '</ul>');
    openSheet(h);
  }

  // ===== Табло «Сейчас в работе»: tablo.json рядом со страницей, тем же ключом; раз в минуту, пока открыто =====
  var TB = null, TB_ERR = false, TB_KEY = null, TB_TIMER = null;
  function tbDur(sec) {
    var m = Math.max(0, Math.floor(sec / 60));
    if (m < 60) return m + ' мин';
    return Math.floor(m / 60) + ' ч' + (m % 60 ? ' ' + String(m % 60).padStart(2, '0') + ' мин' : '');
  }
  function tbHM(ts) { var d = new Date(ts * 1000 + (new Date().getTimezoneOffset() + 300) * 60000); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function tbRow(r, nowS) {
    var cls = r.done ? (r.stopped ? 'stop' : 'done') : r.warn ? 'warn' : 'run';
    var icon = r.done ? (r.stopped ? 'pause' : 'check') : r.warn ? 'alert' : r.ic;
    var parts = r.done ? [(r.stopped ? 'остановлено в ' : 'готово в ') + tbHM(r.end)] : (r.parts || []).map(function (p) {
      if (p && typeof p === 'object') {
        var t = esc(p.l + ' ' + tbDur(nowS - p.s));
        return p.l === 'идёт' ? t : '<span class="w">' + t + '</span>';
      }
      return esc(p);
    }).filter(Boolean);
    // процент: настоящий счёт → «N%»; иначе срок задачи bin/job → «≈N%» (не больше 95 %, пока не закрыта); иначе без цифры
    var f = null, approx = false, ind = false;
    if (!r.done) {
      if (r.frac != null) f = Math.max(0, Math.min(1, r.frac));
      else if (r.eta && r.eta.e > r.eta.s) { f = Math.max(0, Math.min(0.95, (nowS - r.eta.s) / (r.eta.e - r.eta.s))); approx = true; }
      else ind = true;
    }
    var side = f != null ? (approx ? '≈' : '') + Math.round(f * 100) + '%' : '';
    return '<li class="tb ' + cls + '"><span class="tb-ic">' + ic(icon) + (cls === 'run' ? '<i class="beat" aria-hidden="true"></i>' : '') + '</span>' +
      '<span class="tb-body"><b>' + esc(r.title) + '</b>' + (parts.length ? '<span class="tb-s">' + parts.join(' · ') + '</span>' : '') +
      (f != null ? '<span class="tb-bar' + (approx ? ' approx' : '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(f * 100) + '"' + (approx ? ' aria-valuetext="примерно ' + Math.round(f * 100) + '% по сроку"' : '') + '><i style="--f:' + f.toFixed(3) + '"></i></span>' :
        ind ? '<span class="tb-bar ind" role="progressbar" aria-label="идёт, процента нет"><i></i></span>' : '') + '</span>' +
      (side ? '<span class="tb-side">' + side + '</span>' : '') + '</li>';
  }
  function tabloHTML() {
    var h = '<div class="tb-head"><h2 id="tb-h">Сейчас в работе</h2>';
    if (!TB) {
      h += '<span class="tb-at">' + (TB_ERR ? 'нет связи' : 'загружаю…') + '</span></div>';
      return h + (TB_ERR ? '<div class="tb-empty">Табло не загрузилось — попробую через минуту.</div>' : '<div class="tb-skel"></div><div class="tb-skel"></div>');
    }
    var nowS = Date.now() / 1000, old = nowS - TB.ts > 75 * 60;
    h += '<span class="tb-at"><span class="online' + (old || TB_ERR ? ' stale' : '') + '"></span>обновлено ' + esc(TB.at.slice(0, 10) === TODAY ? TB.at.slice(11) : dmy(TB.at.slice(0, 10)) + ' ' + TB.at.slice(11)) + '</span></div>';
    var items = TB.items || [];
    if (!items.length) h += '<div class="tb-empty"><span class="tb-ic">' + ic('check') + '</span>Сейчас ничего не идёт</div>';
    else h += '<ul class="tb-list">' + items.map(function (r) { return tbRow(r, nowS); }).join('') + '</ul>';
    if (TB.more) h += '<div class="tb-more">и ещё ' + TB.more + ' ' + plural(TB.more, 'дело', 'дела', 'дел') + ' — в теме «Штаб» в Telegram</div>';
    if (TB.queue) h += '<div class="tb-foot">' + ic('hourglass') + 'в очереди исследований ' + TB.queue + '</div>';
    return h;
  }
  // полоса «вырастает» только при первом показе; ежеминутная перерисовка — без повторного роста
  function tbPaint() { var el = document.getElementById('tablo'); if (!el) return; el.innerHTML = tabloHTML(); if (TB) setTimeout(function () { el.classList.add('calm'); }, 900); }
  // ===== Баланс AgentHello под табло: тот же tablo.json, блок bal (tablo.py) =====
  var BAL_SIG = '';
  function balMoney(x) { return '$' + Math.round(x).toLocaleString('ru-RU'); }
  function balPaint() {
    var el = document.getElementById('bal'), b = TB && TB.bal;
    if (!el) return;
    if (!b || typeof b.left !== 'number') { el.hidden = true; return; }
    var sig = JSON.stringify(b);
    if (sig === BAL_SIG) return;
    var first = !BAL_SIG; BAL_SIG = sig;
    var lvl = b.lvl === 'bad' || b.lvl === 'warn' ? b.lvl : 'ok';
    var f = Math.max(0, Math.min(1, +b.frac || 0)), pct = Math.round(f * 100);
    var days = b.days == null ? '' : (b.days < 1 ? 'хватит меньше чем на день' : 'хватит на ~' + (b.days < 10 ? num1(b.days) : Math.round(b.days)) + ' дн.');
    var at = b.at ? (b.at.slice(0, 10) === TODAY ? b.at.slice(11) : dmy(b.at.slice(0, 10)) + ' ' + b.at.slice(11)) : '';
    var old = b.stale || (Date.now() / 1000 - (b.ts || 0) > 3 * 3600);
    var base = b.base === 'topup' ? '100% = пополнение ' + dmy(b.topup_at) : '100% = остаток + траты 7 дн.';
    el.className = 'card bal ' + lvl + (first ? '' : ' calm');
    el.innerHTML = '<div class="bal-top"><span class="bal-ic">' + ic('wallet') + '</span>' +
      '<span class="bal-t">Баланс: <b>' + esc(balMoney(b.left)) + '</b>' + (days ? ' · <span class="d">' + esc(days) + '</span>' : '') + '</span>' +
      '<span class="bal-pct">' + pct + '%</span></div>' +
      '<div class="bal-bar" role="progressbar" aria-label="Остаток баланса" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="--f:' + f.toFixed(3) + '"></i></div>' +
      '<div class="bal-s">' + (b.avg > 0 ? '<span title="' + esc('средний расход за ' + b.avg_n + ' ' + plural(b.avg_n, 'полный день', 'полных дня', 'полных дней')) + '">' + esc('~' + balMoney(b.avg) + ' в день') + '</span>' + ' · ' : '') + esc(base) +
      (at ? ' · ' + (old ? '<span style="color:var(--warn-ink)">данные от ' + esc(at) + '</span>' : esc(at)) : '') + '</div>';
    el.hidden = false;
  }
  function tbFetch() {
    if (document.hidden || !TB_KEY) return;
    fetch('tablo.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { var b = b64(j.d); return TB_KEY.then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12)); }); })
      .then(function (buf) { TB = JSON.parse(new TextDecoder().decode(buf)); TB_ERR = false; tbPaint(); balPaint(); })
      .catch(function (e) { TB_ERR = true; tbPaint(); if (window.console) console.warn('табло:', e); });
  }
  function tabloStart() {
    TB_KEY = crypto.subtle.importKey('raw', b64(k), { name: 'AES-GCM' }, false, ['decrypt']);
    tbFetch();
    TB_TIMER = setInterval(tbFetch, 60000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) tbFetch(); });
  }

  function put(id, html) { document.getElementById('s-' + id).innerHTML = html; }

  // ---------- шторка ----------
  var sheet = document.getElementById('sheet');
  function openSheet(html) {
    document.getElementById('sheet-body').innerHTML = html;
    sheet.hidden = false; void sheet.offsetWidth; sheet.classList.add('open');
    sheet.querySelector('.sheet').scrollTop = 0;
    document.body.style.overflow = 'hidden';
    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.classList.remove('open'); document.body.style.overflow = '';
    setTimeout(function () { if (!sheet.classList.contains('open')) sheet.hidden = true; }, 320);
    if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
  }

  // Свайп вниз закрывает шторку, как на iPhone (Юлай 2026-10-09): тянем, когда шторка прокручена к началу.
  (function () {
    var el = sheet.querySelector('.sheet'), y0 = null, dy = 0, t0 = 0;
    el.addEventListener('touchstart', function (e) {
      if (el.scrollTop > 0 || e.touches.length !== 1) { y0 = null; return; }
      y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); el.style.transition = 'none';
    }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      if (y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if (dy <= 0) { el.style.transform = ''; return; }
      if (e.cancelable) e.preventDefault();
      el.style.transform = 'translate(-50%,' + dy + 'px)';
    }, { passive: false });
    function end() {
      if (y0 === null) return;
      el.style.transition = ''; el.style.transform = '';
      var fast = dy > 40 && (Date.now() - t0) < 250;
      if (dy > el.offsetHeight * 0.25 || dy > 120 || fast) closeSheet();
      y0 = null; dy = 0;
    }
    el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  })();

  // ---------- фильтр Всё / Бизнес / Личное ----------
  function applyCat(cat) {
    CAT = cat;
    try { sessionStorage.setItem('shtab.cat', cat); } catch (e) {}
    document.querySelectorAll('.fchip').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.cat === cat ? 'true' : 'false'); });
    document.querySelectorAll('[data-show]').forEach(function (el) { el.hidden = (' ' + el.dataset.show + ' ').indexOf(' ' + cat + ' ') < 0; });
    document.querySelectorAll('[data-filterable] > li').forEach(function (li) {
      li.hidden = cat !== 'all' && li.dataset.cat !== 'all' && li.dataset.cat !== cat;
    });
    document.querySelectorAll('.sector').forEach(function (g) { g.classList.toggle('dim', cat !== 'all' && g.dataset.cat !== cat); });
    document.querySelectorAll('.sph').forEach(function (el) { el.hidden = cat !== 'all' && el.dataset.cat !== cat; });
  }

  // ---------- вкладки ----------
  var order = ['today', 'money', 'tasks', 'wheel', 'research', 'system'], current = null;
  function go(key, instant) {
    if (order.indexOf(key) < 0) key = 'today';
    if (key === current) return;
    if (current) document.getElementById('s-' + current).classList.remove('active', 'in');
    var s = document.getElementById('s-' + key);
    s.classList.remove('in'); s.classList.add('active');
    if (!instant) {
      // анимации вкладки (колесо, полосы) — заново при каждом входе
      var html = s.innerHTML; s.innerHTML = html; void s.offsetWidth; s.classList.add('in');
      if (key === 'today' || key === 'money') countUp(s);
      applyCat(CAT);
    }
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.go === key ? 'true' : 'false'); });
    document.getElementById('filters').hidden = !(key === 'today' || key === 'wheel');
    current = key; window.scrollTo(0, 0);
    try { sessionStorage.setItem('shtab.tab', key); } catch (e) {}
    if (!instant && tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
  }
  function bind() {
    document.querySelectorAll('.tab').forEach(function (t) { t.addEventListener('click', function () { go(t.dataset.go); }); });
    document.querySelectorAll('.fchip').forEach(function (b) { b.addEventListener('click', function () { applyCat(b.dataset.cat); }); });
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (t.closest('[data-close]')) { closeSheet(); return; }
      if (t.closest('summary, a')) return;
      var gt = t.closest('[data-go-tab]');
      if (gt) { closeSheet(); go(gt.dataset.goTab); return; }
      var tk = t.closest('[data-task]');
      if (tk) { taskSheet(tk.dataset.task); return; }
      var sp = t.closest('[data-sph]');
      if (sp) { sphereSheet(+sp.dataset.sph); return; }
      if (t.closest('[data-open="focus"]')) { focusSheet(); return; }
      if (t.closest('[data-open="kb"]')) { kbSheet(); return; }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSheet();
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches) {
        if (e.target.matches('[data-go-tab][tabindex]')) { e.preventDefault(); e.stopPropagation(); go(e.target.dataset.goTab); }
        else if (e.target.matches('[data-open="focus"][tabindex]')) { e.preventDefault(); focusSheet(); }
        else if (e.target.matches('.sector[data-sph]')) { e.preventDefault(); sphereSheet(+e.target.dataset.sph); }
      }
    });
    if (tg && tg.BackButton) { try { tg.BackButton.onClick(closeSheet); } catch (e) {} }
    var topbar = document.getElementById('topbar');
    window.addEventListener('scroll', function () { topbar.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  }
})();
</script>
