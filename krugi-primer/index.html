<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>Круги людей</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b19;--mute:#6f6b64;--line:#e6e2da;--chip:#f0ede7;--acc:#2f6f4f;--acc-ink:#fff;--soft:#e4f0e8;--warn:#a5641c;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1d1b;--ink:#eeebe5;--mute:#9a958c;--line:#33312d;--chip:#2a2926;--acc:#5fae84;--acc-ink:#0e1a13;--soft:#203328;--warn:#e0a35a;--shadow:none}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1d1b;--ink:#eeebe5;--mute:#9a958c;--line:#33312d;--chip:#2a2926;--acc:#5fae84;--acc-ink:#0e1a13;--soft:#203328;--warn:#e0a35a;--shadow:none}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top h1 small{font-size:15px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1}
main{max-width:640px;margin:0 auto;padding:4px 16px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:22px 4px 8px;display:flex;justify-content:space-between}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px;box-shadow:var(--shadow)}
.p.done{opacity:.72}.p.done .ed{display:none}
.hd{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;color:#fff}
.nm{flex:1;min-width:0}.nm b{display:block;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.ln{color:var(--mute);font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chat{flex:none;min-width:44px;height:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);text-decoration:none;font-size:14px}
.sg{margin-top:10px;font-size:14px;color:var(--mute)}.sg em{font-style:normal;color:var(--warn)}
.res{margin-top:10px;font-size:15px;font-weight:600;color:var(--acc);display:none}.p.done .res{display:block}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--chip);padding:0 14px;font-size:15px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row .btn{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.c{min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);padding:0 13px;font-size:15px}
.c.g{border-style:dashed;border-color:var(--acc)}
.c.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);border-style:solid}
.c.x{color:var(--mute)}
.lb{font-size:13px;color:var(--mute);margin-top:12px}
.more{display:none}.p.open .more{display:block}
details{margin-top:10px;font-size:14px}summary{color:var(--mute);min-height:32px;display:flex;align-items:center;cursor:pointer}
dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}dt{color:var(--mute)}dd{margin:0;overflow-wrap:anywhere}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:center}
.foot .btn{min-width:180px}.st{font-size:13px;color:var(--mute);min-width:110px}
.hide-done .p.done{display:none}
.intro{font-size:14px;line-height:1.4;color:var(--mute);margin:8px 0 4px}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
</style></head><body>
<div class="top"><h1>Круги людей <small id="cnt"></small></h1><div class="bar"><i id="bar"></i></div>
<p class="intro">Пример: как размечаются контакты по кругам. У каждого две метки — роль (кто он для дела) и близость (насколько живая связь). Роль задаёт тон и что предлагать, близость — как часто касаться. Это демо: люди вымышленные, отметки остаются только в этом браузере.</p>
<div class="tools"><button class="btn" id="hide">Скрыть размеченных</button></div></div>
<main id="list"></main>
<div class="foot"><span class="st" id="st"></span><button class="btn pri" id="save">Сохранить</button></div>
<script type="application/json" id="data">{"roles": [["семья", "Семья"], ["наставники", "Наставник"], ["друзья и церковь", "Друзья, церковь"], ["партнёры и подрядчики", "Партнёр"], ["клиенты", "Клиент"], ["лиды", "Лид"], ["рычаги-связки", "Рычаг-связка"], ["коллеги по профессии", "Коллега"], ["спящие", "Спящий"], ["прочие", "Прочие"]], "special": [["не знаю", "Не знаю"], ["пропустить", "Пропустить"]], "layers": ["5", "15", "50", "150", "дальше"], "people": [{"id": "p1", "name": "Супруга", "line": "вместе каждый день", "group": "семья", "g": {"roles": ["семья"], "layer": "5", "sure": true}, "det": [["Повод", "день рождения — напомнить за 3 дня"]]}, {"id": "p2", "name": "Родители", "line": "созваниваемся по выходным", "group": "семья", "g": {"roles": ["семья"], "layer": "15", "sure": true}, "det": []}, {"id": "p3", "name": "Наставник", "line": "духовный, встречи раз в месяц", "group": "наставники", "g": {"roles": ["наставники"], "layer": "50", "sure": true}, "det": [["Отчёт", "что сделал по совету"]]}, {"id": "p4", "name": "Ментор по делу", "line": "помогал с первым запуском", "group": "наставники", "g": {"roles": ["наставники"], "layer": "150", "sure": false}, "det": []}, {"id": "p5", "name": "Друг общины", "line": "пишемся раз в 1–2 недели", "group": "друзья и церковь", "g": {"roles": ["друзья и церковь"], "layer": "15", "sure": true}, "det": []}, {"id": "p6", "name": "Лидер группы", "line": "зовёт на встречи", "group": "друзья и церковь", "g": {"roles": ["друзья и церковь"], "layer": "50", "sure": true}, "det": []}, {"id": "p7", "name": "Партнёр по продукту", "line": "делим задачи и доход", "group": "партнёры и подрядчики", "g": {"roles": ["партнёры и подрядчики"], "layer": "15", "sure": true}, "det": [["Условия", "оформить письменно"]]}, {"id": "p8", "name": "Монтажёр", "line": "делает ролики по заказу", "group": "партнёры и подрядчики", "g": {"roles": ["партнёры и подрядчики"], "layer": "50", "sure": false}, "det": []}, {"id": "p9", "name": "Клиент — мебельный цех", "line": "первый пилот, доволен", "group": "клиенты", "g": {"roles": ["клиенты"], "layer": "50", "sure": true}, "det": [["Итог", "было/стало в часах"]]}, {"id": "p10", "name": "Лид — завод", "line": "заявок больше мощностей", "group": "лиды", "g": {"roles": ["лиды"], "layer": "150", "sure": true}, "det": [["Повод", "автоматизация отчётов"]]}, {"id": "p11", "name": "Лид — лесопилка", "line": "считает вручную", "group": "лиды", "g": {"roles": ["лиды"], "layer": "150", "sure": false}, "det": []}, {"id": "p12", "name": "Организатор клуба", "line": "знает многих в городе", "group": "рычаги-связки", "g": {"roles": ["рычаги-связки"], "layer": "150", "sure": true}, "det": [["Сначала", "польза, потом просьба"]]}, {"id": "p13", "name": "Коллега-дизайнер", "line": "обмен подрядом", "group": "коллеги по профессии", "g": {"roles": ["коллеги по профессии"], "layer": "150", "sure": true}, "det": []}, {"id": "p14", "name": "Однокурсник", "line": "год не общались", "group": "спящие", "g": {"roles": ["спящие"], "layer": "дальше", "sure": false}, "det": [["Заход", "«давно не виделись, вот чем занят»"]]}, {"id": "p15", "name": "Новый контакт", "line": "познакомились на конференции", "group": "прочие", "g": {"roles": ["прочие"], "layer": "дальше", "sure": false}, "det": []}], "marks": {}, "saved": null}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const M=D.marks||{};const RL=Object.fromEntries(D.roles.concat(D.special));
let dirty=0,saving=false;
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ini=n=>{const w=n.replace(/[^\p{L}\s]/gu,' ').trim().split(/\s+/).filter(Boolean);return ((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase()};
const hue=id=>{let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))%360;return h};
const marked=id=>M[id]&&M[id].roles&&M[id].roles.length;
const label=r=>RL[r]||r;
function txt(p){const m=M[p.id];if(!m||!m.roles||!m.roles.length)return '';
  const sk=m.roles[0]==='не знаю'||m.roles[0]==='пропустить';
  return (sk?'':'✓ ')+m.roles.map(label).join(' + ')+(sk?'':' · '+(m.layer||p.g.layer||''))}
function progress(){const n=D.people.filter(p=>marked(p.id)).length,t=D.people.length;
  document.getElementById('cnt').textContent=`размечено ${n} из ${t}`;document.getElementById('bar').style.width=(t?100*n/t:0)+'%';
  document.querySelectorAll('h2[data-g]').forEach(h=>{const ps=D.people.filter(p=>p.group===h.dataset.g);
    h.lastChild.textContent=`${ps.filter(p=>marked(p.id)).length}/${ps.length}`})}
function setMark(p,m){if(m)M[p.id]=Object.assign(m,{t:new Date().toISOString().slice(0,16)});else delete M[p.id];
  dirty++;try{localStorage.setItem('circles-draft',JSON.stringify(M))}catch(e){}
  render1(p);progress();if(dirty>=10)save()}
function card(p){
  const el=$('div','p');el.id='p'+p.id;
  const hd=$('div','hd');const av=$('div','av',ini(p.name));av.style.background=`hsl(${hue(p.id)} 38% 46%)`;
  if(p.av){const im=new Image();im.alt='';im.loading='lazy';im.src=location.pathname+'/av?id='+encodeURIComponent(p.id)+'&'+location.search.slice(1);im.onload=()=>{av.textContent='';av.append(im)};}
  const nm=$('div','nm');nm.append($('b','',p.name),$('div','ln',p.line));
  hd.append(av,nm);el.append(hd);
  const res=$('div','res');el.append(res);
  const ed=$('div','ed');el.append(ed);
  const g=p.g;
  if(g.roles.length){const s=$('div','sg');s.append('Бот: '+g.roles.map(label).join(' + ')+' · '+(g.layer||'?')+' ');
    if(!g.sure)s.append($('em','','— не уверен'));ed.append(s)}
  const row=$('div','row');
  if(g.roles.length){const ok=$('button','btn pri','✅ Да, бот прав');ok.onclick=()=>setMark(p,{roles:g.roles.slice(),layer:g.layer||null});row.append(ok)}
  const ch=$('button','btn',g.roles.length?'✏️ Нет, другой круг':'✏️ Выбрать круг');ch.onclick=()=>el.classList.toggle('open');row.append(ch);
  const dz=$('button','btn',g.roles.length?'🤔 Сомневаюсь':'🤔 Не знаю, кто это');dz.onclick=()=>setMark(p,{roles:['не знаю'],layer:null});row.append(dz);
  ed.append(row);
  const more=$('div','more');
  more.append($('div','lb','Кто он для тебя (до двух)'));
  const rc=$('div','chips');
  for(const [r,l] of D.roles){const b=$('button','c',l);b.dataset.r=r;if(g.roles.includes(r))b.classList.add('g');
    b.onclick=()=>{const cur=(M[p.id]&&M[p.id].roles||[]).filter(x=>RL[x]&&!['не знаю','пропустить'].includes(x));
      let n=cur.includes(r)?cur.filter(x=>x!==r):cur.concat(r);if(n.length>2)n=n.slice(-2);
      el.classList.add('open');setMark(p,n.length?{roles:n,layer:(M[p.id]||{}).layer||null}:null)};rc.append(b)}
  for(const [r,l] of D.special){const b=$('button','c x',l);b.dataset.r=r;b.onclick=()=>{setMark(p,{roles:[r],layer:null});el.classList.remove('open')};rc.append(b)}
  more.append(rc,$('div','lb','Близость: 5 — самые близкие … дальше — разовые'));
  const lc=$('div','chips');
  for(const L of D.layers){const b=$('button','c',L);b.dataset.l=L;if(L===g.layer)b.classList.add('g');
    b.onclick=()=>{const m=M[p.id]||{roles:[]};const nl=m.layer===L?null:L;setMark(p,(m.roles.length||nl)?{roles:m.roles,layer:nl}:null)};lc.append(b)}
  more.append(lc);const dn=$('div','row');const db=$('button','btn','Готово');db.onclick=()=>el.classList.remove('open');dn.append(db);more.append(dn);
  ed.append(more);
  if(p.det.length){const d=$('details');d.append($('summary','','Подробнее'));const dl=$('dl');
    for(const [k,v] of p.det){dl.append($('dt','',k),$('dd','',v))}d.append(dl);el.append(d)}
  const chg=$('button','btn','✏️ Изменить');chg.style.marginTop='8px';chg.className='btn chg';chg.onclick=()=>{el.classList.remove('done');el.classList.add('open')};
  const und=$('button','btn','↩️ Отменить');und.style.marginTop='8px';und.style.marginLeft='8px';und.onclick=()=>{setMark(p,null);el.classList.remove('done')};
  res.after(chg);chg.after(und);el._chg=chg;el._und=und;
  return el}
function render1(p){const el=document.getElementById('p'+p.id);const m=M[p.id]||{roles:[]};
  el.classList.toggle('done',!!marked(p.id)&&!el.classList.contains('open'));
  el.querySelector('.res').textContent=txt(p);el._chg.style.display=el.classList.contains('done')?'':'none';el._und.style.display=el.classList.contains('done')?'':'none';
  el.querySelectorAll('.c[data-r]').forEach(b=>b.classList.toggle('on',m.roles.includes(b.dataset.r)));
  el.querySelectorAll('.c[data-l]').forEach(b=>b.classList.toggle('on',m.layer===b.dataset.l))}
const GN={'?':'Кто это? Бот не знает'};
function build(){const list=document.getElementById('list');let cur=null;
  for(const p of D.people){if(p.group!==cur){cur=p.group;const h=$('h2');h.dataset.g=cur;h.append($('span','',GN[cur]||cur[0].toUpperCase()+cur.slice(1)),$('span','',''));list.append(h)}
    list.append(card(p))}
  D.people.forEach(p=>{const el=document.getElementById('p'+p.id);
    el.addEventListener('click',e=>{if(e.target.closest('.c,.btn'))setTimeout(()=>render1(p),0)});render1(p)});
  progress()}
async function save(keep){dirty=0;const st=document.getElementById('st');st.textContent='сохранено в этом браузере · пример, наружу ничего не уходит';}
try{const dr=JSON.parse(localStorage.getItem('circles-draft')||'null');if(dr&&typeof dr==='object'){for(const k in dr){if(!M[k]||(dr[k].t||'')>(M[k].t||''))M[k]=dr[k]}
  if(Object.keys(dr).length)dirty=1}}catch(e){}
document.getElementById('save').onclick=()=>save();
document.getElementById('hide').onclick=e=>{const on=document.body.classList.toggle('hide-done');e.target.textContent=on?'Показать всех':'Скрыть размеченных'};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)save(true)});
document.getElementById('st').textContent=D.saved?'сохранено '+D.saved.slice(5):'';
build();
</script></body></html>
