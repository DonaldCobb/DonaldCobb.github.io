<style>
:root{--bg:#f4f4f2;--card:#fff;--text:#111;--muted:#666;--faint:#808080;--line:#e5e5e5;--accent:#2f6bff;--chip:#e9e9e6;--on:#fff;
--s-go:#2e9e5b;--s-imp:#e8590c;--s-maybe:#6b7bd6;--s-open:#c99a06;--s-no:#b5b5b5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222326;--text:#f2f2f2;--muted:#a3a3a3;--faint:#8c8c8c;--line:#333;--accent:#5b8cff;--chip:#2e2f33;--s-no:#5a5a5a}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222326;--text:#f2f2f2;--muted:#a3a3a3;--faint:#8c8c8c;--line:#333;--accent:#5b8cff;--chip:#2e2f33;--s-no:#5a5a5a}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--text);padding:14px 16px 32px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.bar{padding-bottom:96px}
h1{font-size:21px;line-height:1.25;margin:2px 0 2px}
.sub{font-size:13px;color:var(--muted);margin:0 0 12px}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px}
.chips{display:flex;gap:8px;margin:0 0 4px}
.chip{border:0;border-radius:999px;padding:7px 14px;font:500 14px system-ui,-apple-system,sans-serif;background:var(--chip);color:var(--text)}
.chip.on{background:var(--accent);color:#fff}
.hint{font-size:12px;line-height:1.4;color:var(--faint);margin:4px 0 0}
.top{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.big{background:var(--card);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;border-left:4px solid var(--sc)}
.cd{flex:none;width:54px;text-align:center}
.cd b{display:block;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--muted)}
.cd.now b{font-size:16px;color:var(--sc)}
.bt{min-width:0;flex:1}
.n{font-weight:600;font-size:15px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.m1{font-size:13px;line-height:1.35;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{background:var(--card);border-radius:12px;padding:8px 12px 8px 10px;margin:0 0 6px;display:flex;gap:10px;border-left:4px solid var(--sc);cursor:pointer}
.day{flex:none;width:40px;text-align:center;padding-top:1px}
.day b{display:block;font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.day b.r{font-size:14px;line-height:1.3}
.day span{font-size:11px;color:var(--muted);white-space:nowrap}
.body{min-width:0;flex:1}
.ev.no{opacity:.5;border-left-color:var(--s-no);padding-top:6px;padding-bottom:6px}
.ev.no .day b{font-size:15px}.ev.no .day span{display:none}.ev.no.open .day span{display:inline}
.ev.no .n{display:block;white-space:nowrap;text-overflow:ellipsis;font-weight:500;font-size:14px}
.ev.no .m1{display:none}
.ev.no .one{display:flex;gap:8px;align-items:baseline;min-width:0}
.ev.no .one .n{flex:1;min-width:0}
.ev .one .tm{display:none}
.ev.no .one .tm{display:block;flex:none;max-width:34%;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.no.open{opacity:1}
.ev.no.open .one .tm{display:none}
.ev.no.open .n{white-space:normal;display:-webkit-box}
.more{display:none}
.ev.open .more{display:block}
.ev.open .n{-webkit-line-clamp:unset}
.ev.open .m1{display:none}
.row{font-size:13px;line-height:1.4;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.why{font-size:13px;line-height:1.4;margin-top:6px;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;margin-top:6px;color:#fff;background:var(--sc)}
.pill.no{background:var(--chip);color:var(--muted)}
.links{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.links a{font-size:13px;color:var(--accent);text-decoration:none;background:var(--chip);border-radius:8px;padding:4px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk{display:flex;gap:6px;margin:10px 0 2px -50px}
.mk button{flex:1;min-width:0;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:10px;padding:8px 2px;font:500 13px system-ui,-apple-system,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk button:nth-child(2){flex:1.45}
.mk button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tag{font-size:11px;font-weight:600;color:var(--accent);margin-left:4px;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;background:var(--card);border-radius:12px;padding:12px}
.foot{font-size:12px;color:var(--faint);margin-top:20px;line-height:1.5}
#lock{background:var(--card);border-radius:12px;padding:16px;font-size:14px;color:var(--muted)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px}
#bar[hidden]{display:none}
#bar .go{flex:1;border:0;border-radius:12px;padding:13px 10px;font:600 15px system-ui,-apple-system,sans-serif;background:var(--accent);color:#fff}
#bar .undo{flex:none;border:0;border-radius:12px;padding:13px 14px;font:500 14px system-ui,-apple-system,sans-serif;background:var(--chip);color:var(--text)}
</style></head><body>

(function(){
var tg=window.Telegram&&Telegram.WebApp; if(tg&&!tg.initData&&!(tg.platform&&tg.platform!=='unknown'))tg=null;
function theme(){ if(!tg)return; var p=tg.themeParams||{}, r=document.documentElement;
 r.setAttribute('data-theme', tg.colorScheme==='dark'?'dark':'light');
 var map={bg_color:'--bg',secondary_bg_color:null,text_color:'--text',hint_color:'--muted',link_color:'--accent',button_color:'--accent'};
 if(p.secondary_bg_color){r.style.setProperty('--bg',p.secondary_bg_color); if(p.bg_color)r.style.setProperty('--card',p.bg_color);}
 else if(p.bg_color){r.style.setProperty('--bg',p.bg_color);}
 ['text_color','hint_color','link_color'].forEach(function(k){ if(p[k])r.style.setProperty(map[k],p[k]); });
 if(tg.setHeaderColor&&p.secondary_bg_color){try{tg.setHeaderColor(p.secondary_bg_color)}catch(e){}}
}

var EMB=window.top!==window, QT=(location.search.match(/[?&]theme=(dark|light)/)||[])[1];
if(!tg&&QT)document.documentElement.setAttribute('data-theme',QT);

var MK=[['иду','✅ Иду'],['может быть','🤔 Может'],['не иду','❌ Не иду']];
var WD=['вс','пн','вт','ср','чт','пт','сб'], MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function D(s){var a=s.split('-');return Date.UTC(+a[0],a[1]-1,+a[2])}
var today=(function(){var n=new Date(Date.now()+5*3600e3);return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())})();
var DAY=864e5;
function fmt(t){var d=new Date(t);return d.getUTCDate()+' '+MON[d.getUTCMonth()]}
function wd(t){return WD[new Date(t).getUTCDay()]}
function monday(t){var w=(new Date(t).getUTCDay()+6)%7;return t-w*DAY}
function plural(n,a,b,c){var m=n%10,h=n%100;return m==1&&h!=11?a:(m>=2&&m<=4&&(h<10||h>=20)?b:c)}
function short(p){return String(p||'').replace(/\s*\([^)]*\)/g,'').trim()}
function countdown(e){var s=D(e.d),f=e.e?D(e.e):s,one=f==s;
 if(s<=today&&today<=f)return{now:1,b:s==today&&one?'сегодня':'идёт',l:one?'':'до '+fmt(f)};
 var n=Math.round((s-today)/DAY); if(n==1)return{now:1,b:'завтра',l:''};
 return{b:n,l:plural(n,'день','дня','дней')}}

// отметки с телефона: наложение поверх опубликованных статусов (Юлай 2026-10-13 msg 5590)
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(x){return d}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(x){}}
var marks={}; try{marks=JSON.parse(lsGet('cal.marks','{}'))||{}}catch(x){marks={}}
function same(m,s){return m==s||(m=='иду'&&s=='важное')}
function saveMarks(){lsSet('cal.marks',Object.keys(marks).length?JSON.stringify(marks):null)}
function st(e){return marks[e.i]||e.s}
function going(s){return s=='иду'||s=='важное'}
function links(e){var h='';
 (e.m||[]).forEach(function(m){h+='<a href="'+esc(m[1])+'" data-u="'+esc(m[1])+'">📍 Карта'+(m[0]?' · '+esc(m[0]):'')+'</a>'});
 if(e.u){var u=/^https?:/.test(e.u)?e.u:'https://'+e.u; h+='<a href="'+esc(u)+'" data-u="'+esc(u)+'">🔗 '+esc(u.replace(/^https?:\/\//,'').replace(/\/$/,''))+'</a>'}
 return h?'<div class="links">'+h+'</div>':''}
var opened={};
function card(e){var s=D(e.d),f=e.e?D(e.e):s, S=st(e), no=S=='не иду';
 var dayLbl=e.e?fmt(s).split(' ')[0]+'–'+fmt(f):fmt(s);
 var dnum=e.e?new Date(s).getUTCDate()+'–'+new Date(f).getUTCDate():''+new Date(s).getUTCDate();
 var meta=[e.t,short(e.p)].filter(Boolean).join(' · ');
 var btn=MK.map(function(m){return '<button data-m="'+m[0]+'"'+(same(m[0],S)?' class="on"':'')+'>'+m[1]+'</button>'}).join('');
 return '<div class="ev'+(no?' no':'')+(opened[e.i]?' open':'')+'" data-i="'+esc(e.i)+'" style="--sc:'+SC[S]+'">'
  +'<div class="day"><b'+(e.e?' class="r"':'')+'>'+dnum+'</b><span>'+wd(s)+(e.e?'–'+wd(f):'')+'</span></div><div class="body">'
  +'<div class="one"><div class="n">'+esc(e.n)+(marks[e.i]?'<span class="tag">· отмечено</span>':'')+'</div><span class="tm">'+esc(e.t)+'</span></div>'
  +'<div class="m1">'+esc(meta)+'</div>'
  +'<div class="more"><div class="row">🕒 '+esc(dayLbl)+(e.t?' · '+esc(e.t):'')+'</div>'
  +'<div class="row">📍 '+esc(e.p)+'</div>'
  +(e.w?'<div class="why">'+esc(e.w)+'</div>':'')
  +'<span class="pill'+(no?' no':'')+'">'+esc(S)+(marks[e.i]?' · отмечено, не отправлено':'')+'</span>'+links(e)
  +'<div class="mk">'+btn+'</div></div></div></div>'}
function render(EV){
 var byId={}; EV.forEach(function(e){byId[e.i]=e});
 // уже опубликовано так же — отметку снимаем
 Object.keys(marks).forEach(function(i){ if(!byId[i]||same(marks[i],byId[i].s))delete marks[i] }); saveMarks();
 var f=lsGet('cal.f2','all'); if(f!='go')f='all';
 function pending(){return Object.keys(marks).filter(function(i){return byId[i]})}
 function msg(){return '[календарь] отметки\n'+pending().map(function(i){var e=byId[i];return marks[i]+' · '+e.d+' '+e.n+' #'+i}).join('\n')}
 function bar(){var n=pending().length, sent=lsGet('cal.sent',''), b=document.getElementById('bar');
  var show=n>0&&sent!==msg(); b.hidden=!show; document.body.classList.toggle('bar',show);
  document.getElementById('send').textContent='Отправить отметки ('+n+')'; return n&&!show}
 function draw(){
  document.querySelectorAll('.chip').forEach(function(c){c.classList.toggle('on',c.getAttribute('data-f')==f)});
  var live=EV.filter(function(e){return (e.e?D(e.e):D(e.d))>=today});
  var mine=live.filter(function(e){return going(st(e))});
  var shown=f=='go'?mine:live;
  var nNo=live.filter(function(e){return st(e)=='не иду'}).length, nOpen=live.filter(function(e){return st(e)=='не решено'}).length;
  var waiting=bar(), hint=[];
  if(f=='all'){ if(nNo)hint.push('«Не иду» — серым, '+nNo); if(nOpen)hint.push('не решено — жёлтым, '+nOpen); hint.push('тап по карточке — подробности и отметка'); }
  else { var rest=live.length-mine.length; hint.push('Иду и важное: '+mine.length+(rest?'; остальные '+rest+' — во «Все»':'')); }
  if(waiting)hint.push('отметки отправлены, ждут применения: '+pending().length);
  var ht=hint.join(' · '); document.getElementById('hint').textContent=ht.charAt(0).toUpperCase()+ht.slice(1);
  var th='';
  mine.slice(0,3).forEach(function(e){var c=countdown(e), meta=[wd(D(e.d))+', '+fmt(D(e.d))+(e.e?'–'+fmt(D(e.e)):''),e.t,short(e.p)].filter(Boolean).join(' · ');
   th+='<div class="big" style="--sc:'+SC[st(e)]+'"><div class="cd'+(c.now?' now':'')+'"><b>'+esc(c.b)+'</b><span>'+esc(c.l)+'</span></div><div class="bt"><div class="n">'+esc(e.n)+'</div><div class="m1">'+esc(meta)+'</div></div></div>'});
  document.getElementById('top').innerHTML=th||'<div class="empty">Впереди ничего не отмечено «иду»</div>';
  var wk={}, order=[];
  shown.forEach(function(e){var s=Math.max(D(e.d),today), m=monday(s); if(!wk[m]){wk[m]=[];order.push(m)} wk[m].push(e)});
  var tm=monday(today), h='';
  order.forEach(function(m){var name=m==tm?'Эта неделя':(m==tm+7*DAY?'Следующая неделя':'Неделя');
   var a=fmt(m),b=fmt(m+6*DAY); if(a.split(' ')[1]==b.split(' ')[1])a=a.split(' ')[0];
   h+='<h2>'+name+' · '+a+'–'+b+'</h2>'+wk[m].map(card).join('')});
  document.getElementById('weeks').innerHTML=h||'<div class="empty">Впереди ничего нет</div>';
 }
 document.addEventListener('click',function(ev){var t=ev.target;
  var a=t.closest&&t.closest('a[data-u]'); if(a){ev.preventDefault();open(a.getAttribute('data-u'));return}
  var b=t.closest&&t.closest('.mk button'), c=t.closest&&t.closest('.ev');
  if(b&&c){var i=c.getAttribute('data-i'), m=b.getAttribute('data-m'), e=byId[i]; if(!e)return;
   if(same(m,e.s))delete marks[i]; else marks[i]=m; saveMarks(); opened[i]=1;
   try{tg&&tg.HapticFeedback&&tg.HapticFeedback.selectionChanged()}catch(x){} draw(); return}
  if(c){var j=c.getAttribute('data-i'); if(opened[j])delete opened[j]; else opened[j]=1; c.classList.toggle('open',!!opened[j])}
 });
 document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){f=c.getAttribute('data-f');lsSet('cal.f2',f);draw()}});
 document.getElementById('undo').onclick=function(){marks={};saveMarks();lsSet('cal.sent',null);draw()};
 document.getElementById('send').onclick=function(){var t=msg(); lsSet('cal.sent',t);
  if(EMB){try{if(parent.calSend){parent.calSend(t);draw();return}}catch(e){}}
  if(tg&&tg.initData&&tg.sendData&&tg.initDataUnsafe&&!tg.initDataUnsafe.query_id){try{tg.sendData(t.slice(0,4000));try{tg.close()}catch(e){}return}catch(e){}}
  var u='https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+encodeURIComponent(t);
  if(tg&&tg.openTelegramLink){tg.openTelegramLink(u);setTimeout(function(){try{tg.close()}catch(e){}},300)}else{draw();location.href=u}};
 document.getElementById('lock').hidden=true; document.getElementById('app').hidden=false; draw();
}
function keyFromHash(){var m=(location.hash||'').match(/(?:^#|[#&?])k=([A-Za-z0-9_-]{40,})/);return m?m[1]:null}
var k=keyFromHash();
try{ if(k)sessionStorage.setItem('cal.k',k); else k=sessionStorage.getItem('cal.k'); }catch(e){}
if(keyFromHash()){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o}
function locked(m){document.getElementById('lock').textContent=m}
if(!k)return;
if(!window.crypto||!crypto.subtle){locked('Браузер не умеет расшифровывать. Открой кнопкой в Telegram.');return}
var blob=b64(document.getElementById('payload').textContent.trim());
crypto.subtle.importKey('raw',b64(k),{name:'AES-GCM'},false,['decrypt'])
 .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},key,blob.slice(12))})
 .then(function(buf){render(JSON.parse(new TextDecoder().decode(buf)).ev)},
       function(){try{sessionStorage.removeItem('cal.k')}catch(e){} locked('Ключ не подошёл. Открой календарь кнопкой в теме «Штаб».')})
 .catch(function(e){locked('Не получилось показать: '+(e&&e.message||e))});
})();
</script></body></html>
