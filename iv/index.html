<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Интервью</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#111214;--card:#1c1d21;--ink:#f2f2f3;--mut:#9a9ba1;--acc:#0a84ff;--line:#2a2b30}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;touch-action:manipulation}
.wrap{min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px)}
.top{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.bar{flex:1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.card{flex:1;display:flex;flex-direction:column;margin-top:18px}
.n{color:var(--mut);font-size:13px;margin-bottom:8px}.q{font-size:22px;line-height:1.3;font-weight:600;margin:0 0 6px}.hint{color:var(--mut);font-size:14px;margin:0 0 14px}
textarea{flex:1;min-height:180px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;font-size:17px;line-height:1.4;resize:none}
textarea:focus{outline:none;border-color:var(--acc)}
.nav{display:flex;gap:10px;margin-top:14px}.nav button{flex:1;border:0;border-radius:14px;padding:15px;font:600 16px -apple-system,system-ui;background:var(--card);color:var(--ink)}
.nav .go{background:var(--acc);color:#fff}.skip{color:var(--mut);font-size:13px;text-align:center;margin-top:10px}
.done h2{font-size:22px}.done pre{white-space:pre-wrap;background:var(--card);border-radius:14px;padding:12px;font:14px/1.4 -apple-system,system-ui;color:var(--mut);max-height:45vh;overflow:auto}
</style></head><body><div class="wrap"><div class="top"><span id="cnt"></span><div class="bar"><i id="pb"></i></div></div><div class="card" id="card"></div>
<div class="nav" id="nav"><button id="back">Назад</button><button class="go" id="next">Дальше</button></div><div class="skip">🎙 Удобно надиктовать — микрофон на клавиатуре. Ответы сохраняются, можно закрыть и вернуться.</div></div>
<script>
// Адрес: /iv/#d=<base64url JSON {"title","id","q":[{"t","h"}]}>
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
const h=new URLSearchParams(location.hash.slice(1));let D={title:'Интервью',id:'iv',q:[{t:'Вопрос не передан'}]};try{D=JSON.parse(b64d(h.get('d')||''))}catch(e){}
const KEY='iv-'+D.id;let A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};
let i=Math.min(+(A._i||0),D.q.length);const card=document.getElementById('card');
function text(){return '['+D.id+'] '+D.title+'\n\n'+D.q.map((q,k)=>(k+1)+'. '+q.t+'\n— '+((A[k]||'').trim()||'(пропущено)')).join('\n\n')}
function send(){const t=text();const tg=window.Telegram&&Telegram.WebApp;if(tg&&tg.initData&&tg.sendData&&tg.initDataUnsafe&&!tg.initDataUnsafe.query_id){try{tg.sendData(t.slice(0,4000));return}catch(e){}}
 const u='https://t.me/share/url?url='+encodeURIComponent(' ')+'&text='+encodeURIComponent(t);if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else location.href=u}
function show(){A._i=i;save();document.getElementById('cnt').textContent=Math.min(i+1,D.q.length)+' из '+D.q.length;document.getElementById('pb').style.width=(100*i/D.q.length)+'%';
 const nav=document.getElementById('nav');
 if(i>=D.q.length){card.innerHTML='<div class="done"><h2>Готово 🙏</h2><p class="hint">Отправь ответы боту — через «Поделиться» выбери чат с ботом.</p><pre></pre></div>';card.querySelector('pre').textContent=text();
  nav.innerHTML='<button id="back">Назад</button><button class="go" id="send">Отправить боту</button>';document.getElementById('send').onclick=send;document.getElementById('back').onclick=()=>{i--;show()};return}
 nav.innerHTML='<button id="back">Назад</button><button class="go" id="next">'+(i==D.q.length-1?'Закончить':'Дальше')+'</button>';
 const q=D.q[i];card.innerHTML='<div class="n">Вопрос '+(i+1)+'</div><p class="q"></p><p class="hint"></p><textarea placeholder="Твоими словами — как удобно"></textarea>';
 card.querySelector('.q').textContent=q.t;card.querySelector('.hint').textContent=q.h||'';const ta=card.querySelector('textarea');ta.value=A[i]||'';ta.oninput=()=>{A[i]=ta.value;save()};
 document.getElementById('back').onclick=()=>{if(i>0){i--;show()}};document.getElementById('next').onclick=()=>{i++;show()}}
document.title=D.title;show();if(window.Telegram&&Telegram.WebApp){const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.requestFullscreen&&tg.requestFullscreen()}catch(e){}try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
</script></body></html>
